<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Execução &middot; Painel de Indicadores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&family=Public+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- A biblioteca de leitura de Excel (xlsx) agora é carregada só quando for importar planilhas -->
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("tema")==="light"?"light":"dark");}catch(e){document.documentElement.setAttribute("data-theme","dark");}</script>
<style>
:root{
  color-scheme: light;

  /* --- Base surfaces --- */
  --surface-1:#ffffff;
  --surface-2:var(--surface-2);
  --page-plane:var(--page-plane);

  /* --- Brand (Vuexy purple) --- */
  --brand:#ff5a1f;
  --brand-2:#ff9b5e;
  --brand-grad:linear-gradient(72.47deg,#ff5a1f 18%,#ff8a3d 82%);
  --brand-soft:rgba(255,90,31,0.12);
  --brand-soft-2:rgba(255,90,31,0.06);

  /* --- Text --- */
  --text-primary:var(--text-primary);
  --text-secondary:rgba(var(--ink),0.72);
  --text-muted:rgba(var(--ink),0.48);

  /* --- Lines & elevation --- */
  --border:rgba(var(--ink),0.10);
  --border-strong:rgba(var(--ink),0.18);
  --shadow-xs:0 1px 3px rgba(var(--ink),0.08);
  --shadow-sm:0 2px 6px rgba(var(--ink),0.10);
  --shadow-md:0 4px 14px rgba(var(--ink),0.12);
  --shadow-lg:0 10px 32px rgba(var(--ink),0.16);
  --shadow-brand:0 2px 8px rgba(255,90,31,0.42);

  /* --- Series (bases) --- */
  --series-1:#00b4f0; /* Ipiranga  */
  --series-2:#ff9a1f; /* Pinheiros */
  --series-3:#12c97b; /* São Mateus */
  --series-4:#ff5a1f; /* Santo André */
  --series-violet:#ff5a1f;

  --good:#12c97b;
  --good-bg:rgba(18,201,123,0.14);
  --warning:#ff9a1f;
  --warning-bg:rgba(255,154,31,0.14);
  --serious:#ff9a1f;
  --serious-bg:rgba(255,154,31,0.14);
  --critical:#ff4d6d;
  --critical-bg:rgba(255,77,109,0.14);
  --info:#00b4f0;
  --info-bg:rgba(148,163,184,0.14);

  --gold:#ff9a1f;
  --silver:#a8aaae;
  --bronze:#c17a3f;

  --radius-sm:6px;
  --radius-md:8px;
  --radius-lg:12px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Plus Jakarta Sans","Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-feature-settings:"cv11","ss01";
  background:var(--page-plane);
  color:var(--text-secondary);
  font-size:14px;
  line-height:1.47;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:rgba(var(--ink),0.20);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:rgba(var(--ink),0.32);}
::-webkit-scrollbar-track{background:transparent;}

a{color:inherit;}
button{font-family:inherit;}

/* ---------- Ícones ---------- */
svg.i{
  width:20px;height:20px;flex:none;
  stroke:currentColor;fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
  display:block;
}
svg.i-sm{width:16px;height:16px;}
svg.i-lg{width:22px;height:22px;}
svg.i-xl{width:30px;height:30px;stroke-width:1.4;}

/* ---------- Layout shell ---------- */
.app{
  display:grid;
  grid-template-columns:260px 1fr;
  min-height:100vh;
}
@media (max-width:980px){
  .app{grid-template-columns:1fr;}
  .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .25s ease;width:260px;box-shadow:var(--shadow-lg);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(var(--ink),.45);z-index:55;}
  .sidebar-backdrop.show{display:block;}
}

/* ---------- Sidebar ---------- */
.sidebar{
  background:var(--surface-1);
  color:var(--text-secondary);
  padding:18px 14px 14px;
  display:flex;
  flex-direction:column;
  gap:2px;
  border-right:1px solid var(--border);
  overflow-y:auto;
}
.brand{
  display:flex;align-items:center;gap:11px;
  padding:6px 8px 24px;
  color:var(--text-primary);
}
.brand .logo{
  width:34px;height:34px;border-radius:9px;
  background:var(--brand-grad);
  color:#fff;
  box-shadow:var(--shadow-brand);
  display:flex;align-items:center;justify-content:center;
}
.brand .name{font-weight:700;font-size:16px;line-height:1.2;letter-spacing:-0.01em;color:var(--text-primary);}
.brand .sub{font-size:11.5px;color:var(--text-muted);font-weight:500;margin-top:1px;}

.nav-group-label{
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-muted);
  padding:18px 12px 7px;
  font-weight:600;
  display:flex;align-items:center;gap:8px;
}
.nav-group-label::before{
  content:"";width:10px;height:1px;background:var(--border-strong);flex:none;
}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:9px 12px;border-radius:var(--radius-sm);
  color:var(--text-secondary);
  text-decoration:none;font-size:14px;font-weight:500;
  cursor:pointer;
  transition:background .18s ease, color .18s ease, box-shadow .18s ease;
  border:none;background:transparent;width:100%;text-align:left;
  letter-spacing:-0.005em;
}
.nav-item .ic{display:flex;align-items:center;justify-content:center;width:22px;flex:none;color:var(--text-muted);transition:color .18s ease;}
.nav-item:hover{background:rgba(var(--ink),0.06);color:var(--text-primary);}
.nav-item:hover .ic{color:var(--text-secondary);}
.nav-item.active{
  background:var(--brand-grad);
  color:#fff;font-weight:600;
  box-shadow:var(--shadow-brand);
}
.nav-item.active .ic{color:#fff;}

.sidebar-foot{
  margin-top:auto;padding:14px 12px 4px;
  font-size:11.5px;color:var(--text-muted);
  border-top:1px solid var(--border);
  line-height:1.5;
}

/* ---------- Topbar ---------- */
.main{display:flex;flex-direction:column;min-width:0;}
.topbar{
  position:sticky;top:12px;z-index:40;
  margin:12px 24px 0;
  background:rgba(255,255,255,0.94);
  backdrop-filter:blur(8px);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm), 0 -12px 0 24px var(--page-plane);
  padding:11px 18px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
@media (max-width:640px){ .topbar{margin:12px 14px 0;} }
.menu-btn{
  display:none;border:none;background:var(--brand-soft);color:var(--brand);
  width:34px;height:34px;border-radius:var(--radius-sm);cursor:pointer;
  align-items:center;justify-content:center;
}
@media (max-width:980px){.menu-btn{display:flex;}}
.page-title{font-size:17px;font-weight:600;margin-right:auto;color:var(--text-primary);letter-spacing:-0.01em;}
.page-title .sub{display:block;font-size:12.5px;font-weight:400;color:var(--text-muted);margin-top:1px;}

.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;}
select, .btn, input[type="text"], input[type="search"], input[type="number"]{
  font-family:inherit;font-size:13.5px;
}
select{
  appearance:none;-webkit-appearance:none;
  background:var(--surface-1) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8"><path d="M1.5 2.5L6 6.5l4.5-4" fill="none" stroke="%232f2b3d" stroke-opacity="0.6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 10px center;
  border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);
  padding:7px 30px 7px 11px;
  min-width:132px;
  color:var(--text-primary);font-weight:500;
  cursor:pointer;
  transition:border-color .15s ease, box-shadow .15s ease;
}
select:hover{border-color:rgba(var(--ink),0.32);}
input[type="text"], input[type="search"], input[type="number"]{
  border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);padding:7px 11px;color:var(--text-primary);
  background:var(--surface-1);
  transition:border-color .15s ease, box-shadow .15s ease;
}
input::placeholder{color:var(--text-muted);}
select:focus, input:focus{
  outline:none;
  border-color:var(--brand);
  box-shadow:0 0 0 3px rgba(255,90,31,0.16);
}

.btn{
  border:1px solid var(--border-strong);
  background:var(--surface-1);color:var(--text-primary);
  padding:8px 15px;border-radius:var(--radius-sm);font-weight:600;font-size:13.5px;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  transition:background .15s ease, box-shadow .15s ease, transform .1s ease, border-color .15s ease;
  letter-spacing:.01em;
}
.btn:hover{background:var(--surface-2);border-color:rgba(var(--ink),0.28);}
.btn:active{transform:scale(0.985);}
.btn-primary{background:var(--brand);color:#fff;border-color:transparent;box-shadow:var(--shadow-brand);}
.btn-primary:hover{background:#e8551c;border-color:transparent;box-shadow:0 3px 10px rgba(255,90,31,0.5);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-muted);}
.btn-ghost:hover{background:rgba(var(--ink),0.06);border-color:transparent;color:var(--text-primary);}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.btn-danger{color:var(--critical);border-color:rgba(255,77,109,0.4);}
.btn-danger:hover{background:var(--critical-bg);border-color:rgba(255,77,109,0.5);}

.toggle-pill{
  display:flex;align-items:center;gap:9px;
  background:var(--surface-1);border:1px solid var(--border-strong);
  border-radius:99px;padding:6px 14px 6px 7px;cursor:pointer;user-select:none;
  font-size:13px;font-weight:600;color:var(--text-secondary);
  transition:all .15s ease;
}
.toggle-pill .dot{width:32px;height:18px;border-radius:99px;background:rgba(var(--ink),0.2);position:relative;transition:background .18s ease;flex:none;}
.toggle-pill .dot::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:left .18s ease;}
.toggle-pill.on .dot{background:var(--brand);}
.toggle-pill.on .dot::after{left:16px;}
.toggle-pill.on{color:var(--brand);border-color:var(--brand);background:var(--brand-soft-2);}

/* ---------- Content ---------- */
.content{padding:22px 24px 60px;display:flex;flex-direction:column;gap:20px;}
@media (max-width:640px){ .content{padding:18px 14px 50px;} }
.page{display:none;flex-direction:column;gap:20px;}
.page.active{display:flex;}

.grid{display:grid;gap:18px;}
.grid-kpi{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:1.3fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media (max-width:1180px){.grid-kpi{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;} .grid-3{grid-template-columns:1fr;}}
@media (max-width:560px){.grid-kpi{grid-template-columns:1fr;}}

.card{
  background:var(--surface-1);
  border:none;
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm);
  padding:20px;
}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px;}
.card-title{font-size:15px;font-weight:600;color:var(--text-primary);letter-spacing:-0.01em;}
.card-title .muted{display:block;font-size:12.5px;font-weight:400;color:var(--text-muted);margin-top:3px;letter-spacing:0;}

/* KPI cards */
.kpi{
  background:var(--surface-1);border:none;border-radius:var(--radius-md);
  padding:18px 20px;box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden;
}
.kpi .icon{
  width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  color:var(--brand);background:var(--brand-soft);
  margin-bottom:3px;
}
.kpi.tone-success .icon{color:var(--good);background:var(--good-bg);}
.kpi.tone-danger .icon{color:var(--critical);background:var(--critical-bg);}
.kpi.tone-warning .icon{color:var(--warning);background:var(--warning-bg);}
.kpi.tone-info .icon{color:var(--info);background:var(--info-bg);}
.kpi .label{font-size:13px;font-weight:500;color:var(--text-muted);letter-spacing:0;}
.kpi .value{font-size:26px;font-weight:600;letter-spacing:-0.02em;color:var(--text-primary);line-height:1.2;overflow-wrap:anywhere;}
.kpi .delta{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;width:fit-content;padding:2px 9px;border-radius:99px;}
.kpi .delta.up{color:var(--good);background:var(--good-bg);}
.kpi .delta.down{color:var(--critical);background:var(--critical-bg);}
.kpi .delta.flat{color:var(--text-muted);background:rgba(var(--ink),0.07);}

/* badges & status */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;line-height:1.5;white-space:nowrap;}
.kpi .badge{width:fit-content;}
.badge svg.i{width:13px;height:13px;stroke-width:2.2;}
.badge-good{color:var(--good);background:var(--good-bg);}
.badge-critical{color:var(--critical);background:var(--critical-bg);}
.badge-warning{color:var(--warning);background:var(--warning-bg);}
.badge-neutral{color:var(--text-secondary);background:rgba(var(--ink),0.07);}

.progress{height:8px;border-radius:99px;background:rgba(var(--ink),0.08);overflow:hidden;position:relative;}
.progress > span{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .35s ease;}
.progress.good > span{background:var(--good);}
.progress.bad > span{background:var(--critical);}
.progress-target{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text-primary);opacity:.45;border-radius:2px;}

/* Tables */
.table-wrap{overflow-x:auto;border-radius:var(--radius-sm);}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-muted);font-weight:600;padding:11px 12px;
  border-bottom:1px solid var(--border);
  white-space:nowrap;position:sticky;top:0;background:var(--surface-1);z-index:2;
}
tbody td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text-secondary);}
tbody tr:last-child td{border-bottom:none;}
tbody tr{transition:background .12s ease;}
tbody tr:hover{background:rgba(255,90,31,0.05);}
tbody tr.selected-row{background:var(--brand-soft);box-shadow:inset 2px 0 0 var(--brand);}
td.num, th.num{text-align:right;font-variant-numeric:tabular-nums;}

.name-cell{display:flex;align-items:center;gap:10px;cursor:pointer;}
.avatar{
  width:32px;height:32px;border-radius:50%;flex:none;
  background:var(--brand-soft);
  color:var(--brand);font-size:12px;font-weight:600;
  display:flex;align-items:center;justify-content:center;
}
.name-cell .nm{font-weight:600;color:var(--text-primary);}
.name-cell .base-tag{display:block;font-size:12px;color:var(--text-muted);font-weight:400;}

/* Blur / meeting mode */
[data-employee]{transition:filter .2s ease, opacity .2s ease;}
body.meeting-mode [data-employee].blurred{
  filter:blur(7px);
  opacity:.55;
  pointer-events:none;
  user-select:none;
}
body.meeting-mode [data-employee].spotlighted{position:relative;}
body.meeting-mode [data-employee].spotlighted::after{
  content:"";position:absolute;inset:-4px;border-radius:8px;
  box-shadow:0 0 0 2px var(--brand);pointer-events:none;
}

/* Rank badges */
.rank-pos{
  width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:12.5px;background:rgba(var(--ink),0.07);color:var(--text-secondary);
}
.rank-pos.g1{background:linear-gradient(135deg,#ffc978,var(--gold));color:#fff;box-shadow:0 2px 6px rgba(255,154,31,.4);}
.rank-pos.g2{background:linear-gradient(135deg,#dcdde0,var(--silver));color:#fff;}
.rank-pos.g3{background:linear-gradient(135deg,#e2ab7d,var(--bronze));color:#fff;}

/* Chart wrap */
.chart-box{position:relative;width:100%;}
.legend-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;}
.legend-item{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--text-secondary);}
.legend-swatch{width:10px;height:10px;border-radius:3px;flex:none;}

/* Gauge */
.gauge-wrap{position:relative;display:flex;align-items:center;justify-content:center;}
.gauge-center{position:absolute;text-align:center;}
.gauge-center .big{font-size:26px;font-weight:600;color:var(--text-primary);}
.gauge-center .small{font-size:11.5px;color:var(--text-muted);font-weight:500;}

/* Tabs */
.tabs{display:flex;gap:4px;background:rgba(var(--ink),0.06);padding:4px;border-radius:var(--radius-sm);width:fit-content;}
.tab-btn{
  border:none;background:transparent;padding:7px 16px;border-radius:var(--radius-sm);font-weight:600;font-size:13.5px;
  color:var(--text-secondary);cursor:pointer;transition:all .15s ease;
}
.tab-btn:hover{color:var(--text-primary);}
.tab-btn.active{background:var(--surface-1);color:var(--brand);box-shadow:var(--shadow-xs);}

/* Filter bar */
.filter-bar{
  display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;
  background:var(--surface-1);border:none;border-radius:var(--radius-md);
  padding:16px 18px;box-shadow:var(--shadow-sm);
}

/* Import page */
.dropzone{
  border:2px dashed var(--border-strong);border-radius:var(--radius-md);
  padding:34px 20px;text-align:center;cursor:pointer;
  background:var(--surface-2);
  transition:border-color .18s ease, background .18s ease;
}
.dropzone:hover, .dropzone.drag{border-color:var(--brand);background:var(--brand-soft-2);}
.dropzone .dz-ic{
  width:54px;height:54px;border-radius:12px;margin:0 auto 12px;
  background:var(--brand-soft);color:var(--brand);
  display:flex;align-items:center;justify-content:center;
}
.dropzone .dz-title{font-weight:600;font-size:15px;color:var(--text-primary);}
.dropzone .dz-sub{font-size:12.5px;color:var(--text-muted);margin-top:5px;}

.file-row{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--border);}
.file-row:last-child{border-bottom:none;}
.file-row .fic{width:36px;height:36px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex:none;}
.file-row .fmeta{flex:1;min-width:0;}
.file-row .fname{font-weight:600;font-size:13.5px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-row .fsub{font-size:12px;color:var(--text-muted);}

.empty-state{text-align:center;padding:44px 20px;color:var(--text-muted);}
.empty-state .ic{
  width:64px;height:64px;border-radius:16px;margin:0 auto 14px;
  background:var(--brand-soft);color:var(--brand);
  display:flex;align-items:center;justify-content:center;
}

.search-input-wrap{position:relative;display:inline-flex;align-items:center;}
.search-input-wrap input{padding-left:36px;width:220px;}
.search-input-wrap .sic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-muted);display:flex;pointer-events:none;}
.search-input-wrap .sic svg.i{width:16px;height:16px;}

.note{font-size:12.5px;color:var(--text-muted);line-height:1.5;}
.note svg.i{display:inline-block;vertical-align:-3px;margin-right:6px;}
.note.warn{color:var(--warning);font-weight:500;}

.toast-stack{position:fixed;bottom:22px;right:22px;z-index:100;display:flex;flex-direction:column;gap:9px;}
.toast{background:var(--text-primary);color:#fff;padding:12px 17px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);max-width:340px;animation:toast-in .22s ease;}
.toast.err{background:var(--critical);}
.toast.ok{background:var(--good);}
@keyframes toast-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.spotlight-bar{
  display:flex;align-items:center;gap:11px;flex-wrap:wrap;
  background:var(--brand-grad);
  color:#fff;padding:12px 18px;border-radius:var(--radius-md);
  font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow-brand);
}
.spotlight-bar select{background:rgba(255,255,255,0.18);color:#fff;border-color:rgba(255,255,255,0.34);}
.spotlight-bar select option{color:#000;}
.spotlight-bar .btn{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.34);}
.spotlight-bar .btn:hover{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.44);}

hr.sep{border:none;border-top:1px solid var(--border);margin:2px 0;}

/* gráficos SVG próprios */
.chart-box{min-height:40px;}
.chart-box svg{max-width:100%;}
.chart-box svg text{font-family:inherit;}
.chart-box svg rect, .chart-box svg path, .chart-box svg circle{transition:opacity .15s ease;}
.chart-box svg path[fill]:hover, .chart-box svg rect[fill]:hover{opacity:.82;}

input[type="date"]{
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  padding:6px 10px;color:var(--text-primary);background:var(--surface-1);font-family:inherit;font-size:13px;
  min-width:128px;
}
input[type="date"]:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,90,31,0.16);}

.toggle-pill.colab-off{padding:5px 12px 5px 6px;}
.toggle-pill.colab-off .dot{width:28px;height:16px;}
.toggle-pill.colab-off .dot::after{width:12px;height:12px;}
.toggle-pill.colab-off.on .dot::after{left:14px;}

.tabs .tab-btn.res-set{white-space:nowrap;}
.badge svg.i+*{margin-left:0;}

/* ---------- Carregamento ---------- */
.boot{display:flex;align-items:center;justify-content:center;gap:12px;padding:60px 20px;color:var(--text-muted);font-weight:500;}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--brand-soft);border-top-color:var(--brand);animation:spin .8s linear infinite;flex:none;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- Barra de ferramentas dentro de card ---------- */
.card-toolbar{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:12px;margin:0 0 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);}
.card-toolbar .search-input-wrap input{width:240px;}
.tab-btn .cnt{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;padding:0 7px;border-radius:99px;background:rgba(var(--ink),0.08);color:var(--text-secondary);}
.tab-btn.active .cnt{background:var(--brand-soft);color:var(--brand);}

/* ---------- Seletor segmentado compacto (classificação / base) ---------- */
.seg{display:inline-flex;gap:3px;background:rgba(var(--ink),0.06);padding:3px;border-radius:var(--radius-sm);flex-wrap:wrap;}
.seg button{border:none;background:transparent;padding:5px 10px;border-radius:5px;font-size:12px;font-weight:600;color:var(--text-secondary);cursor:pointer;white-space:nowrap;transition:background .12s ease,color .12s ease;font-family:inherit;}
.seg button:hover{background:rgba(255,255,255,.7);color:var(--text-primary);}
.seg button.on{background:var(--surface-1);box-shadow:var(--shadow-xs);color:var(--text-primary);}
.seg button.on.p{color:var(--good);}
.seg button.on.n{color:var(--critical);}
.seg button.on.x{color:var(--text-muted);}
.table-wrap .seg{flex-wrap:nowrap;}
#resOsBody td:first-child, #cfgResBody td:nth-child(2){min-width:200px;}
#colabBody td:nth-child(2){min-width:190px;}
.seg button .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0;}

/* ---------- Colaboradores ---------- */
tr.pending td:first-child{box-shadow:inset 3px 0 0 var(--warning);}
tr.pending{background:rgba(255,154,31,0.06);}
tr.is-off{opacity:.6;}
.chk{width:16px;height:16px;accent-color:var(--brand);cursor:pointer;}
.bulk-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;margin-bottom:12px;border-radius:var(--radius-md);background:var(--brand-soft-2);border:1px solid rgba(255,90,31,.25);font-size:13px;font-weight:600;color:var(--text-primary);}
.save-bar{position:sticky;bottom:14px;z-index:30;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:var(--radius-md);background:var(--text-primary);color:#fff;box-shadow:var(--shadow-lg);animation:toast-in .2s ease;}
.save-bar .msg{flex:1;min-width:200px;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;}
.save-bar .btn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3);}
.save-bar .btn:hover{background:rgba(255,255,255,.22);}
.save-bar .btn-primary{background:var(--brand);border-color:transparent;}
.save-bar .btn-primary:hover{background:#e8551c;}
.base-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text-secondary);}
.base-chip .sw{width:9px;height:9px;border-radius:50%;flex:none;}


/* ---------- utilitários ---------- */
.name-cell, .file-row[data-employee]{user-select:none;-webkit-user-select:none;}
.muted{color:var(--text-muted);font-weight:500;}
td.strong,.strong{font-weight:600;color:var(--text-primary);}
tr.clickable{cursor:pointer;}
tr.clickable:hover td{background:var(--brand-soft-2);}
.link{color:var(--brand);font-weight:600;font-size:12.5px;white-space:nowrap;}
.scroll-y{overflow:auto;}
.scroll-y thead th, .os-table thead th{position:sticky;top:0;z-index:2;background:var(--surface-1);box-shadow:inset 0 -1px 0 var(--border);}
.scroll-y, .os-scroll{scrollbar-width:thin;scrollbar-color:rgba(var(--ink),.28) transparent;}
.scroll-y::-webkit-scrollbar, .os-scroll::-webkit-scrollbar{width:10px;height:10px;}
.scroll-y::-webkit-scrollbar-thumb, .os-scroll::-webkit-scrollbar-thumb{background:rgba(var(--ink),.22);border-radius:99px;border:2px solid var(--surface-1);}
.scroll-y::-webkit-scrollbar-thumb:hover, .os-scroll::-webkit-scrollbar-thumb:hover{background:rgba(var(--ink),.4);}
.scroll-y::-webkit-scrollbar-track, .os-scroll::-webkit-scrollbar-track{background:transparent;}

/* chips de base */
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface-1);border-radius:99px;padding:6px 12px;font:600 12.5px/1 inherit;font-family:inherit;color:var(--text-secondary);cursor:pointer;transition:all .12s ease;}
.chip:hover{border-color:var(--brand);color:var(--text-primary);}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:var(--shadow-brand);}
.chip .sw{width:9px;height:9px;border-radius:50%;}
.chip .cnt{font-size:11px;padding:2px 7px;border-radius:99px;background:rgba(var(--ink),.08);}
.chip.on .cnt{background:rgba(255,255,255,.25);}

/* Horários */
.hor-filtros{display:flex;flex-direction:column;gap:12px;}
.hf-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
.hf-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);min-width:130px;}
.jbar{position:relative;height:12px;border-radius:99px;background:rgba(var(--ink),.06);min-width:140px;}
.jbar .jtick{position:absolute;top:-2px;bottom:-2px;width:1px;background:rgba(var(--ink),.14);}
.jbar .jfill{position:absolute;top:2px;bottom:2px;border-radius:99px;background:var(--brand-grad);}
.jbar .jfill.warn{background:linear-gradient(90deg,var(--brand),var(--warning));}
.jscale{position:relative;width:220px;height:16px;font-size:10.5px;color:var(--text-muted);font-weight:600;}
.jscale span{position:absolute;transform:translateX(-50%);}
.hor-pessoa-head{display:flex;flex-wrap:wrap;align-items:center;gap:14px;}
.hp-who{display:flex;align-items:center;gap:12px;flex:1;min-width:240px;}
.hp-n{font-weight:600;font-size:18px;color:var(--text-primary);}
.hp-s{font-size:12.5px;color:var(--text-muted);font-weight:600;margin-top:3px;display:flex;align-items:center;}
.hp-actions{display:flex;align-items:center;gap:8px;}
.hp-actions .btn[disabled]{opacity:.4;pointer-events:none;}
.jd-bar{cursor:pointer;}
.jd-bar:hover{opacity:.75;}
@media (max-width:760px){ .jscale{display:none;} }

/* Resultados — quem mais registrou */
.func-list{display:flex;flex-direction:column;gap:2px;max-height:330px;overflow:auto;}
.func-row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--radius-sm);cursor:pointer;}
.func-row:hover{background:var(--brand-soft-2);}
.func-row .fr-n{font-weight:600;font-size:13px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Comparação */
.base-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;}
.base-card .bc-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;}
.base-card .bc-n{font-weight:600;font-size:15px;color:var(--text-primary);display:flex;align-items:center;}
.bc-big{font-size:28px;font-weight:700;color:var(--text-primary);margin-top:10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.bc-d{font-size:12px;font-weight:600;}
.bc-d.up{color:var(--good);} .bc-d.down{color:var(--critical);}
.bc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.bc-grid div{background:rgba(var(--ink),.04);border-radius:6px;padding:8px 10px;}
.bc-grid span{display:block;font-size:10.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;}
.bc-grid b{font-size:14px;color:var(--text-primary);}
.compar-table td.best{color:var(--good);font-weight:700;background:var(--good-bg);}
.matriz td{white-space:nowrap;}
.matriz td.casa{font-weight:700;}

/* ---------- Painel de OS do colaborador ---------- */
.os-modal-back{position:fixed;inset:0;background:rgba(var(--ink),0.45);z-index:900;display:flex;align-items:center;justify-content:center;padding:3vh 16px;opacity:0;transition:opacity .15s ease;}
.os-modal-back.show{opacity:1;}
.os-modal{background:var(--surface-1);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:1180px;height:min(92vh,960px);display:flex;flex-direction:column;overflow:hidden;transform:translateY(8px);transition:transform .15s ease;}
.os-modal-back.show .os-modal{transform:none;}
.os-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);flex:none;}
.os-head .who{flex:1;min-width:0;}
.os-head .who .n{font-weight:600;font-size:17px;color:var(--text-primary);}
.os-head .who .s{font-size:12.5px;color:var(--text-muted);font-weight:600;margin-top:2px;}
.os-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;padding:12px 20px;flex:none;background:var(--surface-2);border-bottom:1px solid var(--border);}
.os-kpis .k{background:var(--surface-1);border-radius:8px;padding:8px 11px;box-shadow:var(--shadow-xs);}
.os-kpis .k span{display:block;font-size:10.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
.os-kpis .k b{font-size:17px;color:var(--text-primary);}
.os-kpis .k.good b{color:var(--good);} .os-kpis .k.bad b{color:var(--critical);}
.os-filters{padding:12px 20px 10px;display:flex;flex-direction:column;gap:10px;flex:none;border-bottom:1px solid var(--border);}
.os-frow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.os-frow select, .os-date input{font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface-1);color:var(--text-primary);}
.os-date{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text-muted);}
.os-scroll{flex:1;min-height:0;overflow:auto;padding:0 20px;}
.os-table{width:100%;}
.os-table td{white-space:nowrap;}
.os-table td.wrap{white-space:normal;min-width:150px;}
.os-table th.sortable{cursor:pointer;user-select:none;white-space:nowrap;}
.os-table th.sortable:hover{color:var(--text-primary);}
.os-table th.sortable.on{color:var(--brand);}
.os-table th .arr{margin-left:4px;font-size:10px;opacity:.7;}
.os-foot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 20px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-secondary);background:var(--surface-2);}
@media (max-width:700px){
  .os-modal-back{padding:0;}
  .os-modal{height:100%;max-height:none;border-radius:0;}
  .os-head{padding:12px 14px;} .os-kpis,.os-filters,.os-foot{padding-left:14px;padding-right:14px;} .os-scroll{padding:0 14px;}
  .os-kpis{grid-template-columns:repeat(3,1fr);}
  .hide-sm{display:none;}
  .os-frow select{flex:1;min-width:140px;}
}
#comparContent{display:flex;flex-direction:column;gap:20px;}
.base-card .bc-grid{grid-template-columns:repeat(2,1fr);}
.os-frow .search-input-wrap input{width:100%;}
.hor-table .name-cell .nm{white-space:nowrap;}
.bc-grid b{word-break:break-word;}
.compar-table td:first-child{white-space:nowrap;}
#comparContent .grid-2{grid-template-columns:1fr 1fr;}
@media (max-width:900px){ #comparContent .grid-2{grid-template-columns:1fr;} }

/* ================= efeitos visuais ================= */
.kpi, .card{transition:box-shadow .25s ease, transform .25s ease;}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md, 0 6px 18px rgba(0,0,0,.12));}
.btn, .chip, .tab-btn, .nav-item, .seg button{transition:all .18s ease;}
.btn:active{transform:scale(.97);}
.page.fx-enter > *{animation:fxRise .5s cubic-bezier(.2,.8,.2,1) both;}
.page.fx-enter > *:nth-child(2){animation-delay:.05s} .page.fx-enter > *:nth-child(3){animation-delay:.1s}
.page.fx-enter > *:nth-child(4){animation-delay:.15s} .page.fx-enter > *:nth-child(5){animation-delay:.2s}
.page.fx-enter > *:nth-child(n+6){animation-delay:.25s}
@keyframes fxRise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.fx-svg .fx-bar{transition:filter .15s ease, opacity .15s ease;}
.fx-svg .fx-bar.fx-hover, .fx-svg circle.fx-hover{filter:brightness(1.1) saturate(1.1) drop-shadow(0 3px 6px rgba(var(--ink),.22));}
.fx-y{transform-box:fill-box;transform-origin:50% 100%;animation:fxGrowY .75s cubic-bezier(.2,.8,.2,1) both;}
.fx-x{transform-box:fill-box;transform-origin:0 50%;animation:fxGrowX .75s cubic-bezier(.2,.8,.2,1) both;}
.fx-pop{transform-box:fill-box;transform-origin:50% 50%;animation:fxPop .5s cubic-bezier(.3,1.5,.5,1) both;}
.fx-area{animation:fxFade 1.2s ease both;}
@keyframes fxGrowY{from{transform:scaleY(0);}to{transform:scaleY(1);}}
@keyframes fxGrowX{from{transform:scaleX(0);}to{transform:scaleX(1);}}
@keyframes fxPop{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
@keyframes fxFade{from{opacity:0;}to{opacity:1;}}
.fx-tip{position:fixed;left:0;top:0;z-index:2000;pointer-events:none;background:rgba(0,0,0,.94);color:#fff;font-size:12px;font-weight:600;line-height:1.4;padding:7px 10px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:300px;opacity:0;transition:opacity .12s ease;backdrop-filter:blur(4px);}
.fx-tip.on{opacity:1;}
.progress span, .jbar .jfill{transition:width .7s cubic-bezier(.2,.8,.2,1);}
.os-modal-back, .os-modal{will-change:opacity,transform;}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important;} }
.badge-info{background:rgba(148,163,184,.14);color:#94a3b8;}

/* ================= Gestão / perfil ================= */
.gestao-card{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(120deg, rgba(255,90,31,.08), rgba(148,163,184,.06));}
.gc-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--brand);color:#fff;box-shadow:var(--shadow-brand);}
.gc-ic .i{stroke:#fff;}
#colabBody .name-cell{cursor:pointer;}
#colabBody .name-cell:hover .nm{color:var(--brand);text-decoration:underline;}
.pf-hero{position:relative;overflow:hidden;padding-top:22px;}
.pf-hero::before{content:"";position:absolute;inset:0 0 auto 0;height:96px;background:linear-gradient(120deg, var(--pf-cor), rgba(255,90,31,.85));opacity:.16;}
.pf-voltar{position:relative;margin-bottom:10px;}
.pf-top{position:relative;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.pf-top > .avatar, .pf-foto{border:4px solid var(--surface-1);box-shadow:0 6px 18px rgba(0,0,0,.16);flex:none;}
.pf-foto{border-radius:50%;object-fit:cover;}
.pf-id{flex:1;min-width:240px;}
.pf-nome{font-size:22px;font-weight:700;color:var(--text-primary);letter-spacing:-.01em;}
.pf-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.pf-contato{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;font-size:13px;color:var(--text-secondary);font-weight:500;}
.pf-contato a, .pf-contato span{display:inline-flex;align-items:center;gap:6px;color:inherit;text-decoration:none;}
.pf-contato a:hover{color:var(--brand);}
.pf-acoes{display:flex;gap:8px;flex-wrap:wrap;}
.pf-kpis{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px;}
.pf-kpi{background:rgba(var(--ink),.035);border-radius:10px;padding:12px 14px;}
.pf-kpi span{display:block;font-size:10.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;}
.pf-kpi b{display:block;font-size:22px;color:var(--text-primary);margin:4px 0 2px;}
.pf-kpi em{font-style:normal;font-size:12px;color:var(--text-muted);font-weight:500;}
.pf-donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.pf-donut .chart-box{flex:none;width:220px;}
.pf-leg{flex:1;min-width:180px;display:flex;flex-direction:column;gap:8px;}
.pf-leg-i{display:flex;align-items:center;gap:8px;font-size:13px;}
.pf-leg-i .t{flex:1;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pf-leg-i b{color:var(--text-primary);}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;}
.pf-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px;}
.pf-row:last-child{border-bottom:0;}
.pf-row span{color:var(--text-muted);font-weight:500;}
.pf-row b{color:var(--text-primary);font-weight:600;text-align:right;word-break:break-word;}
.pf-epi{display:flex;flex-wrap:wrap;gap:8px;}
.pf-epi-i{padding:7px 11px;border-radius:99px;font-size:12.5px;font-weight:600;}
.pf-epi-i.ok{background:var(--good-bg);color:var(--good);} .pf-epi-i.no{background:rgba(255,77,109,.1);color:var(--critical);}
.pf-timeline{display:flex;flex-direction:column;gap:0;max-height:280px;overflow:auto;}
.pf-tl-i{display:flex;gap:12px;padding:10px 0 10px 14px;border-left:2px solid rgba(255,90,31,.25);position:relative;font-size:13px;}
.pf-tl-i::before{content:"";position:absolute;left:-6px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px var(--surface-1);}
.pf-tl-i .d{font-weight:700;color:var(--text-primary);white-space:nowrap;}
.pf-tl-i .t{color:var(--text-secondary);}
.pf-sab{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;max-height:280px;overflow:auto;}
.pf-sab-i{background:rgba(255,90,31,.07);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;font-size:12.5px;}
.pf-sab-i b{color:var(--text-primary);} .pf-sab-i span{color:var(--text-muted);}
.pf-sab-i.pass{opacity:.5;}
.pf-link{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--text-secondary);padding:12px 18px;}
.pf-vazio{text-align:center;padding:28px;}
.pf-dupla-g{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.pf-dupla-p{flex:1;min-width:150px;background:rgba(var(--ink),.04);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;}
.pf-dupla-p b{color:var(--text-primary);font-size:14px;} .pf-dupla-p span{font-size:12.5px;color:var(--text-muted);}
.pf-dupla-p.tot{background:linear-gradient(120deg, rgba(255,90,31,.12), rgba(18,201,123,.1));}
.pf-dupla-p.tot b{font-size:22px;}
.pf-plus{font-size:20px;font-weight:700;color:var(--text-muted);}

/* ================= duplas ================= */
.dupla-form{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:14px;margin-bottom:14px;border-radius:10px;background:rgba(255,90,31,.06);}
.dupla-form input[type=month]{font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface-1);color:var(--text-primary);}
.dupla-cell{display:flex;align-items:center;gap:10px;}
.dupla-av{display:flex;}
.dupla-av .avatar{width:32px;height:32px;font-size:11px;border:2px solid var(--surface-1);}
.dupla-av .avatar + .avatar{margin-left:-10px;background:rgba(148,163,184,.16);color:#94a3b8;}
.dupla-n{cursor:pointer;} .dupla-n:hover{color:var(--brand);text-decoration:underline;}
tr.dupla-off td{opacity:.55;}
.dupla-tag{display:inline-flex;align-items:center;gap:5px;margin:4px 0 0 42px;font-size:11.5px;font-weight:600;color:#94a3b8;background:rgba(148,163,184,.1);padding:2px 8px;border-radius:99px;}
.pf-kpi em .badge{white-space:nowrap;}

/* ================= PERFIL (pv) ================= */
#page-ranking .name-cell[data-employee], #page-metas .name-cell[data-employee], #page-metas .dupla-n{cursor:pointer;}
#page-ranking .name-cell[data-employee]:hover .nm, #page-metas .name-cell[data-employee]:hover .nm, #page-metas .dupla-n:hover{color:var(--brand);text-decoration:underline;text-underline-offset:3px;}
.pv{display:flex;flex-direction:column;gap:20px;animation:pvIn .45s cubic-bezier(.2,.7,.2,1) both;}
@keyframes pvIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.pv-hero{position:relative;border-radius:var(--radius-lg);overflow:hidden;color:#fff;padding:18px 26px 22px;
  background:radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--pv-cor) 85%, #fff) 0%, var(--pv-cor) 35%, #e04e1a 100%);
  box-shadow:0 14px 34px -14px color-mix(in srgb, var(--pv-cor) 70%, #000);}
.pv-hero::after{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none;}
.pv-hero::before{content:"";position:absolute;right:120px;bottom:-140px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.06);pointer-events:none;}
.pv-bar{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;}
.pv-btn-ghost{white-space:nowrap;background:rgba(255,255,255,.14);border:0;color:inherit;font:600 12.5px/1 inherit;font-family:inherit;padding:8px 12px;border-radius:99px;cursor:pointer;transition:background .15s;}
.pv-btn-ghost:hover{background:rgba(255,255,255,.26);}
.pv-btn-ghost[disabled]{opacity:.35;pointer-events:none;}
.pv-link .pv-btn-ghost{background:var(--brand-soft-2);color:var(--brand);}
.pv-nav{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;opacity:.95;}
.pv-nav .pv-btn-ghost{width:32px;height:32px;padding:0;font-size:18px;}
.pv-id{position:relative;z-index:1;display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
.pv-foto{width:104px;height:104px;border-radius:50%;flex:none;padding:4px;background:rgba(255,255,255,.35);box-shadow:0 10px 26px rgba(0,0,0,.18);}
.pv-foto img, .pv-foto span{width:100%;height:100%;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--pv-cor);font-size:34px;font-weight:700;}
.pv-who{flex:1;min-width:240px;}
.pv-nome{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.12);}
.pv-sub{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.pv-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);backdrop-filter:blur(4px);padding:5px 11px;border-radius:99px;font-size:12px;font-weight:600;}
.pv-pill i{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.7);}
.pv-pill.dupla{background:rgba(255,255,255,.95);color:#e04e1a;}
.pv-pill svg{width:13px;height:13px;}
.pv-contato{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:13px;font-weight:500;}
.pv-contato a{color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;opacity:.92;}
.pv-contato a:hover{opacity:1;text-decoration:underline;}
.pv-acoes{display:flex;gap:8px;flex-wrap:wrap;align-self:flex-start;}
.pv-acoes .btn{background:rgba(255,255,255,.95);color:#d9480f;border:0;}
.pv-acoes .btn.btn-primary{background:#fff;color:var(--brand);box-shadow:0 6px 16px rgba(0,0,0,.14);}
.pv-acoes .btn:hover{transform:translateY(-1px);}
.pv-periodo{position:relative;z-index:1;margin-top:16px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:rgba(0,0,0,.12);padding:6px 12px;border-radius:99px;}
.pv-sec-t{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted);display:flex;align-items:center;gap:10px;margin:4px 0 -6px;}
.pv-sec-t::after{content:"";flex:1;height:1px;background:var(--border);}
.pv-res{display:grid;grid-template-columns:minmax(300px,1.1fr) 1.4fr;gap:18px;}
.pv-meta{display:flex;align-items:center;gap:22px;flex-wrap:wrap;position:relative;overflow:hidden;}
.pv-meta.ok{background:linear-gradient(135deg, rgba(18,201,123,.10), var(--surface-1) 60%);}
.pv-meta.no{background:linear-gradient(135deg, rgba(255,154,31,.10), var(--surface-1) 60%);}
.pv-ring-w{position:relative;width:168px;height:168px;flex:none;}
.pv-ring-val{transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1);}
.pv-ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.pv-ring-c b{font-size:28px;font-weight:700;color:var(--text-primary);letter-spacing:-.02em;}
.pv-ring-c span{font-size:11.5px;color:var(--text-muted);font-weight:600;}
.pv-meta-t{flex:1;min-width:160px;display:flex;flex-direction:column;gap:6px;}
.pv-status{font-size:18px;font-weight:700;}
.pv-meta.ok .pv-status{color:var(--good);} .pv-meta.no .pv-status{color:var(--warning);}
.pv-meta-d{font-size:13.5px;color:var(--text-secondary);}
.pv-meta-d b{color:var(--text-primary);}
.pv-kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
.pv-kpi{display:flex;flex-direction:column;gap:4px;padding:18px 20px;transition:transform .2s ease, box-shadow .2s ease;}
.pv-kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.pv-kpi span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);}
.pv-kpi b{font-size:30px;font-weight:700;color:var(--text-primary);letter-spacing:-.02em;line-height:1.1;}
.pv-kpi.good b{color:var(--good);} .pv-kpi.bad b{color:var(--critical);}
.pv-kpi em{font-style:normal;font-size:12.5px;color:var(--text-muted);font-weight:500;}
.pv-dupla{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(120deg, rgba(255,90,31,.08), rgba(148,163,184,.06));}
.pv-dp{flex:1;min-width:190px;display:flex;align-items:center;gap:10px;background:var(--surface-1);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow-xs);}
.pv-dp b{display:block;color:var(--text-primary);font-size:14px;} .pv-dp span{font-size:12px;color:var(--text-muted);}
.pv-dp.tot{flex:0 1 190px;background:var(--brand-grad);color:#fff;} .pv-dp.tot b{color:#fff;font-size:24px;} .pv-dp.tot span{color:rgba(255,255,255,.85);}
.pv-op{font-size:22px;font-weight:700;color:var(--text-muted);}
.pv-resl{display:flex;flex-direction:column;gap:12px;}
.pv-rl-t{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:5px;}
.pv-rl-t span{display:flex;align-items:center;gap:8px;color:var(--text-secondary);font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pv-rl-t i, .pv-resl-leg i{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;}
.pv-rl-t b{color:var(--text-primary);white-space:nowrap;} .pv-rl-t em{font-style:normal;color:var(--text-muted);font-weight:500;font-size:12px;margin-left:4px;}
.pv-rl-b{height:8px;border-radius:99px;background:rgba(var(--ink),.06);overflow:hidden;}
.pv-rl-b span{display:block;height:100%;width:0;border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1);opacity:.9;}
.pv-resl-leg{display:flex;gap:16px;font-size:12px;color:var(--text-muted);font-weight:600;margin-top:4px;}
.pv-resl-leg span{display:inline-flex;align-items:center;gap:6px;}
.pv-hk{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:26px;}
.pv-h{background:rgba(255,90,31,.06);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;}
.pv-h.alm{background:rgba(255,154,31,.09);}
.pv-h span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);}
.pv-h b{font-size:24px;font-weight:700;color:var(--text-primary);letter-spacing:-.02em;}
.pv-h em{font-style:normal;font-size:12px;color:var(--text-muted);font-weight:500;} .pv-h em.warn{color:var(--warning);}
.pv-day{position:relative;padding:34px 4px 22px;}
.pv-track{position:relative;height:16px;border-radius:99px;background:repeating-linear-gradient(90deg, rgba(var(--ink),.05) 0 1px, transparent 1px calc(100%/14)), rgba(var(--ink),.05);}
.pv-seg{position:absolute;top:0;bottom:0;border-radius:99px;animation:pvGrow .9s cubic-bezier(.2,.8,.2,1) both;transform-origin:left;}
.pv-seg.trab{background:var(--brand-grad);box-shadow:0 4px 12px rgba(255,90,31,.35);}
.pv-seg.alm{background:repeating-linear-gradient(45deg, #ffb46b 0 6px, #ff9a1f 6px 12px);border-radius:4px;animation-delay:.25s;}
@keyframes pvGrow{from{transform:scaleX(0);}to{transform:scaleX(1);}}
.pv-marks{position:absolute;left:4px;right:4px;top:0;height:30px;}
.pv-mark{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:11px;line-height:1.15;white-space:nowrap;}
.pv-mark b{color:var(--text-primary);font-size:12.5px;} .pv-mark i{font-style:normal;color:var(--text-muted);font-weight:600;}
.pv-mark.alt{top:auto;} .pv-mark.alt b{color:#d9771a;}
.pv-scale{position:absolute;left:4px;right:4px;bottom:0;height:16px;font-size:10.5px;color:var(--text-muted);font-weight:600;}
.pv-scale span{position:absolute;transform:translateX(-50%);}
.pv-mini{height:8px;border-radius:99px;background:rgba(var(--ink),.06);overflow:hidden;}
.pv-mini span{display:block;height:100%;border-radius:99px;}
.pv-link{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--text-muted);padding:0 4px;}
.pv-link b{color:var(--text-secondary);}
@media (max-width:1100px){ .pv-res{grid-template-columns:1fr;} .pv-hk{grid-template-columns:repeat(3,1fr);} }
@media (max-width:640px){
  .pv-hero{padding:16px;} .pv-nome{font-size:21px;} .pv-foto{width:78px;height:78px;} .pv-foto span{font-size:26px;}
  .pv-kpis{grid-template-columns:1fr 1fr;gap:12px;} .pv-kpi b{font-size:24px;} .pv-hk{grid-template-columns:1fr 1fr;}
  .pv-mark i{display:none;}
}
@media print{
  .sidebar, .topbar, .sidebar-backdrop, .pv-bar, .pv-acoes, .pv-link, #pfVinculo, .toast, .os-modal-back{display:none !important;}
  .main{margin:0 !important;padding:0 !important;} body{background:#fff !important;}
  .pv-hero{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .card{box-shadow:none !important;border:1px solid #e5e5ea;break-inside:avoid;}
  .scroll-y{max-height:none !important;overflow:visible !important;}
  *{animation:none !important;transition:none !important;}
}

/* ---- perfil: cor da foto + tipografia ---- */
@property --pv-cor{syntax:"<color>";inherits:true;initial-value:#ff5a1f;}
@property --pv-cor2{syntax:"<color>";inherits:true;initial-value:#ff6a2b;}
.pv{transition:--pv-cor 1s ease, --pv-cor2 1s ease;
  font-family:"Plus Jakarta Sans","Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;}
.pv .btn, .pv select, .pv input, .pv .chart-box svg text{font-family:inherit;}
.pv .card-title{font-weight:700;letter-spacing:-.01em;}
.pv-hero{background:
    radial-gradient(90% 120% at 100% 0%, color-mix(in srgb, var(--pv-cor2) 55%, transparent) 0%, transparent 60%),
    radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--pv-cor) 78%, #fff) 0%, var(--pv-cor) 38%, var(--pv-cor2) 100%) !important;
  box-shadow:0 18px 40px -16px color-mix(in srgb, var(--pv-cor) 75%, #000) !important;}
.pv-nome{font-weight:800;font-size:28px;letter-spacing:-.025em;}
.pv-kpi b, .pv-h b, .pv-ring-c b, .pv-dp.tot b{font-weight:800;letter-spacing:-.03em;}
.pv-sec-t{letter-spacing:.12em;color:color-mix(in srgb, var(--pv-cor) 55%, var(--text-muted));}
.pv-sec-t::after{background:linear-gradient(90deg, color-mix(in srgb, var(--pv-cor) 35%, transparent), transparent);}
.pv-foto span{color:var(--pv-cor);}
.pv-foto{background:rgba(255,255,255,.4);}
.pv-acoes .btn, .pv-acoes .btn.btn-primary{color:color-mix(in srgb, var(--pv-cor) 70%, #1d1b2e);}
.pv-meta.no{background:linear-gradient(135deg, color-mix(in srgb, var(--pv-cor) 12%, transparent), var(--surface-1) 60%);}
.pv-kpi{border-top:3px solid color-mix(in srgb, var(--pv-cor) 45%, transparent);}
.pv-h{background:color-mix(in srgb, var(--pv-cor) 8%, var(--surface-1));}
.pv-seg.trab{background:linear-gradient(90deg, var(--pv-cor), var(--pv-cor2));box-shadow:0 4px 12px color-mix(in srgb, var(--pv-cor) 40%, transparent);}
.pv-link .pv-btn-ghost{background:color-mix(in srgb, var(--pv-cor) 12%, transparent);color:color-mix(in srgb, var(--pv-cor) 80%, #1d1b2e);}
.pv-pill.dupla{color:color-mix(in srgb, var(--pv-cor) 75%, #1d1b2e);}

/* ---- tipo de OS ---- */
.tipo-sel{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface-1);color:var(--text-primary);max-width:260px;}
.tipo-chips{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin;}
.tipo-chip{flex:none;min-width:170px;text-align:left;border:1px solid var(--border);background:var(--surface-1);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;font-family:inherit;transition:all .15s ease;}
.tipo-chip:hover{border-color:var(--brand);transform:translateY(-1px);box-shadow:var(--shadow-sm);}
.tipo-chip.on{border-color:var(--brand);background:var(--brand-soft-2);box-shadow:0 0 0 2px var(--brand-soft-2);}
.tipo-chip.sem{border-style:dashed;opacity:.8;}
.tc-n{font-weight:700;font-size:13px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px;}
.tc-v{font-size:11.5px;color:var(--text-muted);font-weight:600;}
.tc-b{height:5px;border-radius:99px;background:rgba(255,77,109,.18);overflow:hidden;margin-top:4px;}
.tc-b i{display:block;height:100%;background:var(--good);border-radius:99px;}
.tipo-mini{display:flex;flex-wrap:wrap;gap:4px;}
.tipo-mini span{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;background:rgba(255,90,31,.09);color:var(--text-secondary);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;}
.tipo-mini span b{color:var(--brand);}
.tipo-mini span.sem{background:rgba(var(--ink),.05);color:var(--text-muted);}
.tipo-mini span.mais{background:transparent;color:var(--text-muted);cursor:help;}
.btn-excel{background:#1d7a46;border-color:#1d7a46;color:#fff;align-self:flex-end;}
.btn-excel:hover{background:#17663a;border-color:#17663a;color:#fff;}
.btn-excel svg{stroke:#fff;}
.btn-excel.loading{opacity:.6;cursor:wait;}

/* ================= ITINERÁRIO ================= */
#page-itinerario{--iv-ink:#1d1a33;--iv-o:#12c97b;--iv-d:#94a3b8;--iv-a:#7dd3e8;--iv-p:#ff9a1f;--iv-bad:#ff4d6d;}
#page-itinerario .card{border-radius:16px;}
#itCorpo{display:flex;flex-direction:column;gap:20px;}
/* topo */
.iv-hero{position:relative;border-radius:20px;padding:20px 22px 18px;color:#fff;overflow:visible;
  background:
    radial-gradient(70% 120% at 100% 0%, rgba(255,154,31,.28) 0%, transparent 55%),
    radial-gradient(60% 120% at 0% 100%, rgba(148,163,184,.25) 0%, transparent 60%),
    linear-gradient(135deg,#141416 0%,#ff5a1f 55%,#232326 100%);
  box-shadow:0 18px 40px -18px rgba(255,90,31,.7);
  display:grid;grid-template-columns:1fr auto;gap:16px 20px;align-items:start;}
.iv-hero::before{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;opacity:.22;
  background-image:linear-gradient(rgba(255,255,255,.18) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.18) 1px, transparent 1px);background-size:34px 34px;
  -webkit-mask-image:linear-gradient(110deg, transparent 10%, #000 70%);mask-image:linear-gradient(110deg, transparent 10%, #000 70%);}
.iv-hero > *{position:relative;}
.iv-hero-l{display:flex;flex-wrap:wrap;align-items:center;gap:18px;min-width:0;}
.iv-hero-r{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:10px;}
.iv-modo{display:inline-flex;background:rgba(255,255,255,.12);border-radius:12px;padding:4px;backdrop-filter:blur(6px);}
.iv-modo button{border:0;background:transparent;color:rgba(255,255,255,.78);font:600 13px/1 inherit;font-family:inherit;padding:9px 14px;border-radius:9px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;transition:all .18s;}
.iv-modo button svg{stroke:currentColor;}
.iv-modo button.on{background:#fff;color:#ff5a1f;box-shadow:0 6px 16px rgba(0,0,0,.18);}
.iv-modo button:not(.on):hover{color:#fff;background:rgba(255,255,255,.1);}
.iv-dia{display:flex;align-items:center;gap:10px;}
.iv-seta{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;font-size:22px;line-height:1;cursor:pointer;transition:all .15s;}
.iv-seta:hover{background:rgba(255,255,255,.2);}
.iv-seta[disabled]{opacity:.3;pointer-events:none;}
.iv-dia-t{position:relative;display:flex;flex-direction:column;gap:3px;cursor:pointer;padding:2px 4px;}
.iv-dia-t b{font-size:21px;font-weight:700;letter-spacing:-.02em;}
.iv-dia-t span{font-size:12px;color:rgba(255,255,255,.72);font-weight:600;}
.iv-dia-t input[type=date]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;}
.iv-dia-t input[type=date]::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;}
.iv-per{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.iv-pre{display:inline-flex;gap:4px;background:rgba(255,255,255,.1);padding:4px;border-radius:12px;}
.iv-pre button{border:0;background:transparent;color:rgba(255,255,255,.8);font:600 12.5px/1 inherit;font-family:inherit;padding:8px 12px;border-radius:9px;cursor:pointer;}
.iv-pre button.on{background:rgba(255,255,255,.95);color:#ff5a1f;}
.iv-pre button:not(.on):hover{background:rgba(255,255,255,.12);color:#fff;}
.iv-bases{display:flex;flex-wrap:wrap;gap:6px;}
.iv-chip{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:rgba(255,255,255,.88);font:600 12.5px/1 inherit;font-family:inherit;padding:8px 12px;border-radius:99px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .15s;}
.iv-chip i{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.5);}
.iv-chip:hover{background:rgba(255,255,255,.16);}
.iv-chip.on{background:#fff;color:#c2410c;border-color:#fff;}
.iv-cfg{position:relative;}
.iv-btn-g{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:#fff;font:600 12.5px/1 inherit;font-family:inherit;padding:8px 12px;border-radius:99px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.iv-btn-g svg{stroke:#fff;}
.iv-btn-g:hover{background:rgba(255,255,255,.18);}
.iv-cfg-p{position:absolute;right:0;top:calc(100% + 8px);z-index:40;width:320px;background:var(--surface-1);color:var(--text-primary);border-radius:14px;padding:16px;box-shadow:0 20px 50px -12px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:10px;font-size:13px;}

.iv-rk-r{display:grid;grid-template-columns:34px 40px minmax(170px,1.1fr) minmax(200px,2fr) 110px;gap:12px;align-items:center;text-align:left;width:100%;border:1px solid var(--border);background:var(--surface-1);border-radius:14px;padding:10px 14px;cursor:pointer;font-family:inherit;transition:all .16s;}
.iv-rk-r:hover{border-color:color-mix(in srgb, var(--brand) 40%, transparent);box-shadow:0 10px 24px -14px rgba(0,0,0,.4);transform:translateY(-1px);}
.iv-rk-p{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;color:var(--text-secondary);background:rgba(var(--ink),.06);}
.iv-rk-r.top .iv-rk-p{background:linear-gradient(135deg,#ffb36b,#ff8a2b);color:#fff;box-shadow:0 4px 10px rgba(255,138,43,.35);}
.iv-rk-n{display:flex;flex-direction:column;gap:3px;min-width:0;}
.iv-rk-n b{font-size:13.5px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.iv-rk-n em{font-style:normal;font-size:11.5px;color:var(--text-muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.iv-rk-n em i{width:7px;height:7px;border-radius:50%;flex:none;}
.iv-rk-b{display:flex;flex-direction:column;gap:6px;min-width:0;}
.iv-rk-bar{position:relative;height:10px;border-radius:99px;background:rgba(var(--ink),.06);}
.iv-rk-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#ffc58f,#ff8a2b);animation:ivGrow .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:left;}
.iv-rk-bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:#ff5a1f;border-radius:2px;opacity:.7;}
@keyframes ivGrow{from{transform:scaleX(0);}to{transform:scaleX(1);}}
.iv-rk-s{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--text-muted);font-weight:600;}
.iv-rk-v{display:flex;flex-direction:column;align-items:flex-end;}
.iv-rk-v b{font-size:19px;color:var(--text-primary);letter-spacing:-.02em;}
.iv-rk-v em{font-style:normal;font-size:11.5px;color:var(--text-muted);}
.iv-rk-r.top .iv-rk-v b{color:#e07b12;}
/* calendário de calor */
.iv-heat-w{overflow:auto;max-height:560px;scrollbar-width:thin;}
.iv-heat{display:grid;gap:4px;min-width:max-content;}
.iv-hd{position:sticky;top:0;z-index:1;background:var(--surface-1);display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--text-muted);padding-bottom:3px;}
.iv-hd b{font-size:12px;color:var(--text-secondary);}
.iv-hd.seg{box-shadow:inset 2px 0 0 rgba(0,0,0,.1);}
.iv-hn{position:sticky;left:0;z-index:1;background:var(--surface-1);font-size:12.5px;font-weight:600;color:var(--text-primary);display:flex;align-items:center;padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.iv-hc{height:30px;border-radius:7px;border:0;font:700 10.5px/1 inherit;font-family:inherit;cursor:pointer;transition:transform .12s, box-shadow .12s;}
.iv-hc:hover{transform:scale(1.14);box-shadow:0 4px 12px rgba(0,0,0,.3);position:relative;z-index:2;}
.iv-hc.vazio{background:rgba(var(--ink),.035) !important;cursor:default;}
.iv-heat-leg{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--text-muted);}
.iv-heat-leg i{display:inline-block;width:120px;height:10px;border-radius:99px;background:linear-gradient(90deg, rgb(255,244,229), rgb(255,184,119), rgb(235,74,59));}
/* blocos de baixo */
.iv-g2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start;}
.iv-g2v{display:flex;flex-direction:column;gap:18px;}
.iv-int{display:flex;flex-direction:column;gap:6px;max-height:760px;overflow:auto;scrollbar-width:thin;}
.iv-int-r{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:1px solid var(--border);background:var(--surface-1);border-radius:13px;padding:10px 12px;cursor:pointer;font-family:inherit;transition:all .15s;}
.iv-int-r:hover{border-color:color-mix(in srgb, var(--brand) 40%, transparent);transform:translateX(2px);}
.iv-int-r.longo{background:linear-gradient(90deg, rgba(255,154,31,.09), var(--surface-1) 45%);}
.iv-int-v{width:74px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:11px;padding:8px 4px;background:rgba(255,154,31,.14);}
.iv-int-v b{font-size:16px;color:#c2600e;letter-spacing:-.02em;}
.iv-int-v em{font-style:normal;font-size:10.5px;color:#a86a2c;font-weight:600;}
.iv-int-t{display:flex;flex-direction:column;gap:2px;min-width:0;}
.iv-int-t b{font-size:13.5px;color:var(--text-primary);}
.iv-int-t em{font-style:normal;font-size:12px;color:var(--text-secondary);}
.iv-int-t em.iv-int-os{font-size:11.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.iv-bs{display:flex;flex-direction:column;gap:10px;}
.iv-bs-r{display:grid;grid-template-columns:minmax(130px,1fr) 2fr 56px;gap:10px;align-items:center;font-size:13px;}
.iv-bs-r > span:first-child{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--text-primary);}
.iv-bs-r > span:first-child i{width:9px;height:9px;border-radius:50%;}
.iv-bs-r .bn{display:flex;flex-direction:column;line-height:1.2;}
.iv-bs-r .bn b{font-size:13px;white-space:nowrap;}
.iv-bs-r em{font-style:normal;font-size:11px;color:var(--text-muted);font-weight:500;}
.iv-bs-b{height:10px;border-radius:99px;background:rgba(var(--ink),.06);overflow:hidden;}
.iv-bs-b i{display:block;height:100%;border-radius:99px;}
.iv-bs-r b{text-align:right;}
@media (max-width:1200px){ .iv-kpis{grid-template-columns:repeat(3,minmax(0,1fr));} .iv-g2{grid-template-columns:1fr;} .iv-det-k{grid-template-columns:repeat(3,minmax(0,1fr));} }
@media (max-width:980px){
  .iv-hero{grid-template-columns:1fr;} .iv-hero-r{justify-content:flex-start;}
  .iv-mapa-w{grid-template-columns:1fr;} .iv-lista{border-right:0;border-bottom:1px solid var(--border);} .iv-lista-s{max-height:300px;}
  .iv-mapa-c{min-height:420px;}
  .iv-rk-r{grid-template-columns:30px 36px minmax(0,1fr) 90px;} .iv-rk-b{grid-column:3 / -1;grid-row:2;}
}
@media (max-width:640px){
  .iv-hero{padding:16px;} .iv-kpis{grid-template-columns:1fr 1fr;} .iv-k-t b{font-size:18px;}
  .iv-dia-t b{font-size:17px;}
  .iv-tl-r{grid-template-columns:120px minmax(0,1fr);gap:8px;} .iv-tl-n .iv-av{display:none;}
  .iv-det-k{grid-template-columns:1fr 1fr;}
  .st-os, .st-gap{grid-template-columns:50px 34px minmax(0,1fr);}
  .iv-cfg-p{right:auto;left:0;width:290px;}
}

.iv-gp-slot{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:8;width:min(440px, calc(100% - 120px));}
.iv-geo-ban .iv-gp-slot{position:static;transform:none;width:320px;max-width:100%;}
.iv-gp{background:var(--surface-1);border-radius:14px;padding:12px 14px;box-shadow:0 14px 34px -10px rgba(0,0,0,.4);display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;}
.iv-geo-ban .iv-gp{box-shadow:none;background:var(--surface-2);border:1px solid var(--border);}
.iv-gp-t{display:flex;flex-direction:column;gap:2px;}
.iv-gp-t b{font-size:13.5px;color:var(--text-primary);}
.iv-gp-t span{font-size:12px;color:var(--text-muted);}
.iv-gp-b{grid-column:1 / -1;height:8px;border-radius:99px;background:rgba(255,90,31,.14);overflow:hidden;}
.iv-gp-b i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffa36b,#ff6a2b);transition:width .3s ease;position:relative;overflow:hidden;}
.iv-gp-b i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:ivShine 1.2s linear infinite;}
@keyframes ivShine{from{transform:translateX(-100%);}to{transform:translateX(100%);}}
.iv-gp .iv-link{grid-row:1;grid-column:2;}
.iv-geo-ban{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(110deg, rgba(255,90,31,.08), var(--surface-1) 55%) !important;}
.iv-geo-ban-t{flex:1;min-width:240px;display:flex;flex-direction:column;gap:3px;}
.iv-geo-ban-t b{font-size:14.5px;color:var(--text-primary);}
.iv-geo-ban-t span{font-size:12.5px;color:var(--text-muted);}

/* seleção no mapa */
.iv-lista-h span{display:inline-flex;gap:12px;}
.iv-p{position:relative;}
.iv-chk{width:18px;height:18px;border-radius:6px;border:2px solid rgba(var(--ink),.22);flex:none;display:flex;align-items:center;justify-content:center;transition:all .15s;background:var(--surface-1);}
.iv-p.on .iv-chk{background:var(--c);border-color:var(--c);}
.iv-p.on .iv-chk::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px);}
.iv-p.on{border-color:color-mix(in srgb, var(--brand) 30%, transparent);background:color-mix(in srgb, var(--brand) 4%, var(--surface-1));}
.iv-p.foco{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft-2), 0 8px 20px -10px rgba(255,90,31,.55);}
.iv-p.off{opacity:1;}
.iv-tl-r.on .iv-tl-n{background:var(--brand-soft-2);color:var(--text-primary);}
.iv-tl-r.foco .iv-tl-n{background:var(--brand-soft);color:var(--brand);}
.iv-tl-r.foco .iv-tr{box-shadow:0 0 0 2px var(--brand-soft);}
.iv-tl-r.on .iv-tr{box-shadow:none;}
.iv-tl-r.foco.on .iv-tr{box-shadow:0 0 0 2px var(--brand-soft);}
.iv-hint{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;pointer-events:none;background:linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,.15));}
.iv-hint-c{pointer-events:auto;background:var(--surface-1);border-radius:18px;padding:22px 26px;max-width:360px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 20px 50px -14px rgba(0,0,0,.45);}
.iv-hint-c svg{width:30px;height:30px;stroke:var(--brand);background:var(--brand-soft);padding:9px;border-radius:14px;box-sizing:content-box;}
.iv-hint-c b{font-size:15px;color:var(--text-primary);}
.iv-hint-c span{font-size:12.5px;color:var(--text-muted);line-height:1.45;}
.iv-hint-c .btn{margin-top:4px;}
/* estilo do mapa */
.mm-estilo{position:absolute;left:12px;bottom:12px;z-index:5;display:inline-flex;background:var(--surface-1);border-radius:11px;padding:3px;box-shadow:0 6px 18px rgba(0,0,0,.2);}
.mm-estilo button{border:0;background:transparent;font:600 12px/1 "Public Sans",Arial,sans-serif;color:#5d596c;padding:7px 11px;border-radius:8px;cursor:pointer;}
.mm-estilo button.on{background:#ff5a1f;color:#fff;}
.mm-estilo button:not(.on):hover{background:var(--surface-2);}
.mm.sat .mm-attr{background:rgba(0,0,0,.55);color:#fff;}
.mm-m.off{opacity:.6;}
.iv-ruas{left:auto;right:60px;}
/* ================= LANÇAMENTO MANUAL ================= */
.lm-faixa{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 18px;border-radius:16px;background:linear-gradient(110deg, rgba(255,90,31,.10), var(--surface-1) 55%);border:1px solid color-mix(in srgb, var(--brand) 18%, transparent);box-shadow:var(--shadow-sm);}
.lm-fx-i{width:44px;height:44px;border-radius:13px;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--shadow-brand);}
.lm-fx-i svg{stroke:#fff;width:21px;height:21px;}
.lm-fx-t{display:flex;flex-direction:column;gap:2px;min-width:200px;}
.lm-fx-t > b{font-size:15px;color:var(--text-primary);}
.lm-fx-t span{font-size:12.5px;color:var(--text-muted);}
.lm-fx-t span b{color:var(--text-primary);}
.lm-fx-u{display:flex;gap:8px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;}
.lm-fx-c{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface-1);border-radius:12px;padding:6px 10px 6px 6px;cursor:pointer;font-family:inherit;flex:none;text-align:left;transition:all .15s;}
.lm-fx-c:hover{border-color:var(--brand);transform:translateY(-1px);}
.lm-fx-c i{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.lm-fx-c span{display:flex;flex-direction:column;}
.lm-fx-c b{font-size:12.5px;color:var(--text-primary);}
.lm-fx-c em{font-style:normal;font-size:11px;color:var(--text-muted);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lm-fx-a{display:flex;gap:8px;margin-left:auto;}
.lm-fx-a .btn-primary{padding:10px 16px;font-size:13.5px;}
/* janela */
.lm-back{position:fixed;inset:0;z-index:950;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:3vh 16px;opacity:0;transition:opacity .18s;}
.lm-back.show{opacity:1;}
.lm{width:100%;max-width:1040px;max-height:94vh;background:var(--surface-1);border-radius:22px;box-shadow:0 40px 90px -20px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden;transform:translateY(14px) scale(.985);transition:transform .22s cubic-bezier(.2,.8,.2,1);}
.lm-back.show .lm{transform:none;}
.lm-h{display:flex;align-items:center;gap:14px;padding:18px 22px;background:linear-gradient(120deg,#c2410c 0%,#232326 60%,#ff6a2b 100%);color:#fff;flex:none;}
.lm-h-i{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none;}
.lm-h-i svg{stroke:#fff;width:22px;height:22px;}
.lm-h-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.lm-h-t b{font-size:18px;letter-spacing:-.01em;}
.lm-h-t span{font-size:12.5px;color:rgba(255,255,255,.75);}
.lm-x{width:36px;height:36px;border-radius:11px;border:0;background:rgba(255,255,255,.12);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.lm-x svg{stroke:#fff;}
.lm-x:hover{background:rgba(255,255,255,.24);}
.lm-b{display:grid;grid-template-columns:minmax(260px,.85fr) minmax(0,1.25fr);gap:0;flex:1;min-height:0;overflow:hidden;}
.lm-col{overflow:auto;padding:4px 22px 18px;display:flex;flex-direction:column;gap:6px;}
.lm-s{padding:14px 0 6px;}
.lm-s + .lm-s{border-top:1px solid var(--border);}
.lm-s-quem{display:flex;flex-direction:column;min-height:0;padding:18px 18px 0;background:var(--surface-2);border-right:1px solid var(--border);}
.lm-st{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.lm-st i{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-style:normal;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;}
.lm-st b{font-size:14px;color:var(--text-primary);}
.lm-st span{font-size:11.5px;color:var(--brand);font-weight:600;margin-left:auto;}
.lm-link{margin-left:auto;border:0;background:none;color:var(--brand);font:600 12px inherit;font-family:inherit;cursor:pointer;padding:0;}
.lm-sel{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;margin-bottom:10px;}
.lm-sel-vazio{font-size:12.5px;color:var(--text-muted);align-self:center;}
.lm-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-1);border:1px solid color-mix(in srgb, var(--c) 45%, transparent);border-radius:99px;padding:3px 4px 3px 3px;font-size:12.5px;font-weight:600;color:var(--text-primary);animation:lmPop .2s ease;}
.lm-chip i{width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font-style:normal;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.lm-chip button{border:0;background:rgba(var(--ink),.07);width:20px;height:20px;border-radius:50%;cursor:pointer;color:var(--text-muted);font-size:14px;line-height:1;}
.lm-chip button:hover{background:var(--critical-bg);color:var(--critical);}
@keyframes lmPop{from{transform:scale(.85);opacity:0;}to{transform:none;opacity:1;}}
.lm-busca{display:flex;align-items:center;gap:8px;border:1px solid var(--border-strong);background:var(--surface-1);border-radius:11px;padding:0 11px;margin-bottom:8px;}
.lm-busca svg{stroke:var(--text-muted);flex:none;}

.lm-busca:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft-2);}
.lm-pes{flex:1;min-height:0;overflow:auto;padding-bottom:14px;scrollbar-width:thin;max-height:52vh;}
.lm-g{margin-bottom:8px;}
.lm-gt{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:8px 4px 4px;}
.lm-gt i{width:7px;height:7px;border-radius:50%;}
.lm-gt span{margin-left:auto;font-weight:600;}
.lm-p{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 8px;border-radius:10px;cursor:pointer;font-family:inherit;text-align:left;transition:background .12s;}
.lm-p:hover{background:var(--surface-1);}
.lm-p.on{background:var(--brand-soft-2);}
.lm-cb{width:18px;height:18px;border-radius:6px;border:2px solid rgba(var(--ink),.22);flex:none;display:flex;align-items:center;justify-content:center;background:var(--surface-1);transition:all .12s;}
.lm-p.on .lm-cb{background:var(--brand);border-color:var(--brand);}
.lm-p.on .lm-cb::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px);}
.lm-av{width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;}
.lm-pn{font-size:13px;font-weight:500;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lm-pes-ed{font-size:12.5px;color:var(--text-muted);padding:10px 4px;}
.lm-cat{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.lm-sv{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:132px;border:1px solid var(--border);border-left:4px solid var(--c);background:var(--surface-1);border-radius:12px;padding:9px 12px;cursor:pointer;font-family:inherit;text-align:left;transition:all .15s;}

.lm-sv.on{background:color-mix(in srgb, var(--c) 10%, var(--surface-1));border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 20%, transparent);}
.lm-sv b{font-size:13px;color:var(--text-primary);}
.lm-sv span{font-size:11.5px;color:var(--text-muted);}
.lm-sv.gerir{cursor:default;animation:lmShake .4s ease;}
@keyframes lmShake{25%{transform:rotate(-1deg);}75%{transform:rotate(1deg);}}
.lm-sv-x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:var(--critical);color:#fff;font-style:normal;font-size:15px;line-height:21px;text-align:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25);}
.lm-cat-vazio{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-muted);background:rgba(var(--ink),.035);border:1px dashed var(--border-strong);border-radius:12px;padding:12px;width:100%;line-height:1.4;}

/* ---- gráficos mais vivos ---- */
.fx-y{animation:fxGrowY .9s cubic-bezier(.34,1.45,.64,1) both !important;}
