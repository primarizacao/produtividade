  nomesBadge();
}

/* ---------- PDA ---------- */
function pdaOficiais(){
  var p = A.painelCfg(), l = (p.lista||[]).map(function(c){ return up(c.nome); });
  if (!l.length) l = A.distinctEmployees({}).filter(function(n){ return n.indexOf("PDA · ")!==0; });
  return l.sort(function(a,b){ return a.localeCompare(b, "pt-BR"); });
}
function renderPDA(){
  var box = document.getElementById("pdaCard"); if (!box) return;
  var pdas = A.pdaNomes(), atr = A.pdaAtrib();
  var nomes = A.nomesPlanilha(), idx = A.painelIdx(), temPainel = A.painelAtivo();
  var conf = {}; nomesConferencia().forEach(function(x){ conf[x.k] = x; });
  /* ---------- 1) quais nomes são PDA ---------- */
  var qN = A.normKey(UI.pdaBuscaNome||""), mostra = UI.pdaMostra || (temPainel ? "fora" : "todos");
  var lista = nomes.map(function(x){ var k = A.normKey(x.orig), c = conf[k]; return { orig:x.orig, k:k, os:x.os, pda: pdas.indexOf(k)!==-1, st: c ? c.st : "", noPainel: !!idx[k] }; })
    .filter(function(x){ if (qN && x.k.indexOf(qN)===-1) return false; if (mostra==="pda") return x.pda; if (mostra==="fora") return x.pda || !x.noPainel; return true; })
    .sort(function(a,b){ return (b.pda-a.pda) || b.os-a.os || a.orig.localeCompare(b.orig); });
  /* ---------- 2) todas as OS dos PDAs ---------- */
  var todas = STATE.records.filter(function(r){ return r._pda; });
  var meses = {}; todas.forEach(function(r){ if (r.dataInicio){ var k = r.dataInicio.getFullYear()+"-"+String(r.dataInicio.getMonth()+1).padStart(2,"0"); meses[k] = (meses[k]||0)+1; } });
  var mesK = Object.keys(meses).sort().reverse();
  var fP = UI.pdaFiltroNome || "todos", fM = UI.pdaMes || "todos", fS = UI.pdaFiltro || "pend", qOS = String(UI.pdaBuscaOS||"").trim();
  var porPda = {}; todas.forEach(function(r){ var k = A.normKey(r._orig); var e = porPda[k] || (porPda[k] = { orig:r._orig, n:0, pend:0 }); e.n++; if (r._pdaPend) e.pend++; });
  var filtradas = todas.filter(function(r){
    if (fP!=="todos" && A.normKey(r._orig)!==fP) return false;
    if (fM!=="todos" && (!r.dataInicio || (r.dataInicio.getFullYear()+"-"+String(r.dataInicio.getMonth()+1).padStart(2,"0"))!==fM)) return false;
    if (fS==="pend" && !r._pdaPend) return false; if (fS==="atr" && r._pdaPend) return false;
    if (qOS && String(r.numOS||"").indexOf(qOS)===-1) return false;
    return true;
  }).sort(function(a,b){ return b._t-a._t; });
  var nPend = todas.filter(function(r){ return r._pdaPend; }).length;
  var porDia = {}, ordemDias = [];
  filtradas.forEach(function(r){ var d = (r.dataInicio ? dateToISO(r.dataInicio) : "sem data")+"|"+A.normKey(r._orig); if (!porDia[d]){ porDia[d] = []; ordemDias.push(d); } porDia[d].push(r); });
  var limite = UI.pdaLimite || 40;
  var oficiais = pdaOficiais(), recentes = (UI.pdaRecentes||[]).filter(function(n){ return oficiais.indexOf(n)!==-1; });
  var MC = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

  box.innerHTML =
    '<div class="grid pda-g">'
    + '<div class="card pda-sel">'
      + cardHead("Quais nomes são PDA?", "marque os nomes genéricos ou de terceiros · as OS deles só contam depois de ligadas a um colaborador")
      + '<div class="pda-st"><div class="search-input-wrap"><span class="sic">'+IC('search')+'</span><input type="search" id="pdaBN" placeholder="Buscar nome da planilha..." value="'+esc(UI.pdaBuscaNome||"")+'"></div>'
        + '<div class="seg">'+[["fora", temPainel ? "Fora do Painel" : "Sugeridos"],["pda","Só PDA ("+pdas.length+")"],["todos","Todos"]].map(function(o){ return '<button type="button" data-mo="'+o[0]+'" class="'+(mostra===o[0]?"on":"")+'">'+o[1]+'</button>'; }).join("")+'</div></div>'
      + '<div class="pda-nl">'+(lista.length ? lista.slice(0, 300).map(function(x){
          return '<label class="pda-n'+(x.pda?" on":"")+'"><input type="checkbox" data-pk="'+esc(x.k)+'" data-po="'+esc(x.orig)+'"'+(x.pda?" checked":"")+'>'
            + '<span class="pda-sw"><i></i></span><div><b>'+esc(x.orig)+'</b><span>'+fmtInt(x.os)+' OS'+(x.pda ? (porPda[x.k] && porPda[x.k].pend ? ' · <em class="p">'+fmtInt(porPda[x.k].pend)+' sem dono</em>' : ' · <em class="ok">todas ligadas</em>') : (x.noPainel ? ' · no Painel' : (temPainel ? ' · fora do Painel' : '')))+'</span></div></label>';
        }).join("") : '<div class="empty-state">Nenhum nome neste filtro.</div>')+'</div>'
    + '</div>'

    + '<div class="card pda-os">'
      + cardHead("OS dos PDAs", fmtInt(todas.length)+" OS em "+fmtInt(Object.keys(porPda).length)+" PDA(s) · "+fmtInt(nPend)+" sem dono · todos os meses importados")
      + (todas.length ? (
        '<div class="pda-fl">'
          + '<div class="field"><select id="pdaFP"><option value="todos">Todos os PDAs</option>'+Object.keys(porPda).map(function(k){ return '<option value="'+esc(k)+'"'+(fP===k?" selected":"")+'>'+esc(porPda[k].orig)+' ('+fmtInt(porPda[k].pend)+' sem dono)</option>'; }).join("")+'</select></div>'
          + '<div class="field"><select id="pdaFM"><option value="todos">Todos os meses</option>'+mesK.map(function(k){ var p2 = k.split("-"); return '<option value="'+k+'"'+(fM===k?" selected":"")+'>'+MC[+p2[1]-1]+'/'+p2[0]+' ('+fmtInt(meses[k])+')</option>'; }).join("")+'</select></div>'
          + '<div class="seg">'+[["pend","Sem dono"],["atr","Ligadas"],["todas","Todas"]].map(function(o){ return '<button type="button" data-fs="'+o[0]+'" class="'+(fS===o[0]?"on":"")+'">'+o[1]+'</button>'; }).join("")+'</div>'
          + '<div class="search-input-wrap"><span class="sic">'+IC('search')+'</span><input type="search" id="pdaBO" placeholder="Nº da OS" value="'+esc(UI.pdaBuscaOS||"")+'"></div>'
        + '</div>'
        + '<div class="pda-bar2">'
          + '<label class="pda-all"><input type="checkbox" id="pdaTodasVis"> <span id="pdaSelN">0 selecionada(s)</span></label>'
          + '<div class="pda-to2"><input type="text" id="pdaPara" list="pdaOf" placeholder="Ligar ao colaborador…"><datalist id="pdaOf">'+oficiais.map(function(n){ return '<option value="'+esc(titleCase(n))+'">'; }).join("")+'</datalist>'
          + '<button type="button" class="btn btn-sm btn-primary" id="pdaAtribuir">'+IC('check','i-sm')+' Ligar</button><button type="button" class="btn btn-sm btn-ghost" id="pdaLimpar">Tirar dono</button></div>'
          + (recentes.length ? '<div class="pda-rec"><span>Usados agora há pouco:</span>'+recentes.map(function(n){ return '<button type="button" data-rec="'+esc(n)+'">'+esc(titleCase(n).split(" ").slice(0,2).join(" "))+'</button>'; }).join("")+'</div>' : '')
        + '</div>'
        + (filtradas.length ? '<div class="pda-l2">'+ordemDias.slice(0, limite).map(function(dk){
            var rs = porDia[dk].slice().sort(function(a,b){ return a._t-b._t; }), d = dk.split("|")[0], dt = d==="sem data" ? null : isoToDate(d);
            var donos = {}; rs.forEach(function(r){ var o = atr[A.osKey(r)]; if (o) donos[o] = 1; });
            return '<div class="pda-d2"><label class="pda-dh2"><input type="checkbox" data-dia="'+esc(dk)+'"><b>'+(dt ? fmtDateBR(dt)+' · '+DOW[dt.getDay()] : d)+'</b><span class="pn">'+IC('phone','i-sm')+esc(rs[0]._orig)+'</span><span>'+fmtInt(rs.length)+' OS · '+(rs[0].dataInicio ? rs[0].dataInicio.toTimeString().slice(0,5) : "")+' → '+(rs[rs.length-1].dataInicio ? rs[rs.length-1].dataInicio.toTimeString().slice(0,5) : "")+'</span>'
              + (Object.keys(donos).length ? '<em>'+Object.keys(donos).map(function(n){ return esc(titleCase(n).split(" ")[0]); }).join(", ")+'</em>' : '')+'</label>'
              + rs.map(function(r){ var key = A.osKey(r), dono = atr[key];
                  return '<label class="pda-r2'+(dono?" atr":"")+'"><input type="checkbox" data-os="'+esc(key)+'" data-d="'+esc(dk)+'"><span class="h">'+(r.dataInicio ? r.dataInicio.toTimeString().slice(0,5) : "—")+'</span><span class="n">OS '+esc(r.numOS||"—")+'</span><span class="t">'+esc(titleCase(r.tipo||""))+'</span><span class="res '+(r._cls==="P"?"p":"")+'">'+esc(titleCase(r.resultado||""))+'</span><span class="e">'+esc(r.endereco||r.bairro||"")+'</span><span class="w">'+(dono ? IC('check','i-sm')+esc(titleCase(dono)) : '<em>sem dono</em>')+'</span></label>';
                }).join("")
            + '</div>';
          }).join("")+'</div>'
          + (ordemDias.length > limite ? '<div style="text-align:center;margin-top:12px;"><button type="button" class="btn btn-sm" id="pdaMais">Mostrar mais ('+fmtInt(ordemDias.length - limite)+' dia(s))</button></div>' : '')
          : '<div class="empty-state">'+(fS==="pend" ? IC('checkCircle','i-xl')+'<div>Nenhuma OS sem dono neste filtro.</div>' : 'Nenhuma OS neste filtro.')+'</div>')
      ) : '<div class="empty-state">'+IC('phone','i-xl')+'<div>Marque à esquerda quais nomes são PDA para ver as OS deles aqui.</div></div>')
    + '</div>'
    + '</div>';

  /* eventos — nomes */
  var bn = document.getElementById("pdaBN");
  bn.addEventListener("input", debounce(function(){ UI.pdaBuscaNome = bn.value; renderPDA(); var b2 = document.getElementById("pdaBN"); b2.focus(); b2.setSelectionRange(b2.value.length, b2.value.length); }, 200));
  box.querySelectorAll("[data-mo]").forEach(function(b){ b.onclick = function(){ UI.pdaMostra = b.dataset.mo; renderPDA(); }; });
  box.querySelectorAll("[data-pk]").forEach(function(c){ c.onchange = function(){
    var k = c.dataset.pk, i = pdas.indexOf(k);
    if (c.checked){ if (i===-1) pdas.push(k); delete A.nomeMap()[k]; } else if (i!==-1) pdas.splice(i, 1);
    nomesAplicar(c.checked ? c.dataset.po+" agora é PDA" : c.dataset.po+" não é mais PDA");
  }; });
  if (!todas.length) return;
  /* eventos — OS */
  var marca = function(){ var n = box.querySelectorAll("[data-os]:checked").length; document.getElementById("pdaSelN").textContent = n+" selecionada(s)"; };
  box.querySelectorAll("[data-dia]").forEach(function(c){ c.onchange = function(){ box.querySelectorAll('[data-os][data-d="'+c.dataset.dia+'"]').forEach(function(x){ x.checked = c.checked; }); marca(); }; });
  box.querySelectorAll("[data-os]").forEach(function(c){ c.onchange = marca; });
  document.getElementById("pdaTodasVis").onchange = function(e){ box.querySelectorAll("[data-os],[data-dia]").forEach(function(x){ x.checked = e.target.checked; }); marca(); };
  document.getElementById("pdaFP").onchange = function(e){ UI.pdaFiltroNome = e.target.value; UI.pdaLimite = 40; renderPDA(); };
  document.getElementById("pdaFM").onchange = function(e){ UI.pdaMes = e.target.value; UI.pdaLimite = 40; renderPDA(); };
  box.querySelectorAll("[data-fs]").forEach(function(b){ b.onclick = function(){ UI.pdaFiltro = b.dataset.fs; UI.pdaLimite = 40; renderPDA(); }; });
  var bo = document.getElementById("pdaBO"); bo.addEventListener("input", debounce(function(){ UI.pdaBuscaOS = bo.value; renderPDA(); var b3 = document.getElementById("pdaBO"); b3.focus(); b3.setSelectionRange(b3.value.length, b3.value.length); }, 250));
  var mais = document.getElementById("pdaMais"); if (mais) mais.onclick = function(){ UI.pdaLimite = limite + 40; renderPDA(); };
  box.querySelectorAll("[data-rec]").forEach(function(b){ b.onclick = function(){ document.getElementById("pdaPara").value = titleCase(b.dataset.rec); }; });
  var resolvePara = function(){
    var v = A.normKey(document.getElementById("pdaPara").value);
    if (!v) return null;
    var achou = oficiais.filter(function(n){ return A.normKey(n)===v; })[0];
    if (!achou){ var cands = oficiais.filter(function(n){ return A.normKey(n).indexOf(v)!==-1; }); if (cands.length===1) achou = cands[0]; }
    return achou || null;
  };
  document.getElementById("pdaAtribuir").onclick = function(){
    var ks = Array.prototype.map.call(box.querySelectorAll("[data-os]:checked"), function(c){ return c.dataset.os; });
    if (!ks.length){ A.toast("Selecione as OS (ou marque o dia inteiro).", "err"); return; }
    var para = resolvePara(); if (!para){ A.toast("Escolha um colaborador da lista.", "err"); return; }
    ks.forEach(function(k){ atr[k] = para; });
    UI.pdaRecentes = [para].concat((UI.pdaRecentes||[]).filter(function(n){ return n!==para; })).slice(0, 6);
    nomesAplicar(fmtInt(ks.length)+" OS ligada(s) a "+titleCase(para));
  };
  document.getElementById("pdaLimpar").onclick = function(){
    var ks = Array.prototype.map.call(box.querySelectorAll("[data-os]:checked"), function(c){ return c.dataset.os; }); if (!ks.length) return;
    ks.forEach(function(k){ delete atr[k]; }); nomesAplicar(fmtInt(ks.length)+" OS sem dono novamente");
  };
}

function acessoHash(cod){
  var t = String(cod||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if (!(window.crypto && crypto.subtle)) return Promise.resolve("");
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)).then(function(b){ return Array.prototype.map.call(new Uint8Array(b), function(x){ return ("0"+x.toString(16)).slice(-2); }).join(""); });
}

/* =====================================================================
   NUVEM — os dados do painel ficam guardados no Supabase
   ===================================================================== */
var NUVEM = { estado:"off", sujo:{}, timer:null, ocupado:false, silencio:false, erro:"", ultimo:null };
var NUVEM_REC_POR_BLOCO = 2500;
function nuvemChave(){ try { return sessionStorage.getItem("acChave") || localStorage.getItem("nuvem_chave") || ""; } catch(e){ return ""; } }
function nuvemGuardaChave(ch, lembrar){
  try { sessionStorage.setItem("acChave", ch); if (lembrar) localStorage.setItem("nuvem_chave", ch); else localStorage.removeItem("nuvem_chave"); } catch(e){}
  UI.acChave = ch;
}
function nuvemVersaoLocal(){ try { return localStorage.getItem("nuvem_versao") || ""; } catch(e){ return ""; } }
function nuvemSetVersaoLocal(v){ try { localStorage.setItem("nuvem_versao", v || ""); } catch(e){} }
function nuvemAuto(){ var a = acessoCfg(); return a.autoPublicar!==false; }
function nuvemEstado(st, msg){
  NUVEM.estado = st; if (msg!=null) NUVEM.erro = msg;
  var b = document.getElementById("tbNuvem"); if (!b) return;
  var t = { off:"Conectar à nuvem", ok:"Salvo na nuvem", sync:"Salvando…", load:"Baixando…", pend:"Alterações para salvar", erro:"Erro na nuvem" }[st] || "";
  b.className = "tb-nuvem s-"+st; b.title = t + (NUVEM.erro && st==="erro" ? " · "+NUVEM.erro : "") + (NUVEM.ultimo ? " · última vez "+NUVEM.ultimo.toLocaleTimeString("pt-BR").slice(0,5) : "");
  b.querySelector("span").textContent = t;
}
/* chamado pelo motor sempre que algo é gravado */
function nuvemMarca(tipo){
  if (NUVEM.silencio || !nuvemChave()) return;
  NUVEM.sujo[tipo] = true; nuvemEstado("pend");
  clearTimeout(NUVEM.timer); NUVEM.timer = setTimeout(function(){ nuvemEnviar(false); }, 3500);
}
function nuvemBlocosDados(bk){
  var bl = [], ids = [];
  for (var i=0, k=0; i<bk.records.length; i+=NUVEM_REC_POR_BLOCO, k++){ var id = "rec-"+k; ids.push(id); bl.push({ id:id, tipo:"rec", ordem:k, conteudo: bk.records.slice(i, i+NUVEM_REC_POR_BLOCO) }); }
  var idsB = [];
  for (var j=0, m=0; j<bk.banco.length; j+=NUVEM_REC_POR_BLOCO*2, m++){ var idb = "ban-"+m; idsB.push(idb); bl.push({ id:idb, tipo:"ban", ordem:m, conteudo: bk.banco.slice(j, j+NUVEM_REC_POR_BLOCO*2) }); }
  return { blocos:bl, idsRec:ids, idsBan:idsB };
}
function nuvemEnviar(forcarTudo, semConflito){
  var ch = nuvemChave(); if (!ch) return Promise.resolve(false);
  if (NUVEM.ocupado){ clearTimeout(NUVEM.timer); NUVEM.timer = setTimeout(function(){ nuvemEnviar(forcarTudo); }, 2500); return Promise.resolve(false); }
  var dados = forcarTudo || NUVEM.sujo.dados, sujoAntes = NUVEM.sujo; NUVEM.sujo = {};
  NUVEM.ocupado = true; nuvemEstado("sync");
  var nova = { id: Date.now().toString(36)+Math.random().toString(36).slice(2,7), em: new Date().toISOString(), registros: STATE.records.length };
  return acessoRpc("nuvem_versao", { chave:ch }).then(function(v){
    var remota = v && v.versao ? v.versao.id : "", local = nuvemVersaoLocal();
    if (!semConflito && remota && local && remota!==local){
      var ok = confirm("Alguém salvou dados na nuvem depois que você abriu o painel.\n\nOK = enviar a SUA versão (substitui a da nuvem)\nCancelar = baixar a versão da nuvem (descarta suas últimas alterações)");
      if (!ok){ NUVEM.ocupado = false; return nuvemBaixar(true).then(function(){ return false; }); }
    }
    if (!remota) dados = true;
    var bk = A.montarBackup();
    var base = [{ id:"settings", tipo:"settings", conteudo: bk.settings }, { id:"files", tipo:"files", conteudo: bk.importedFiles }];
    var cadeia;
    if (dados){
      var d = nuvemBlocosDados(bk), lotes = [], atual = [], tam = 0;
      d.blocos.forEach(function(b){ var t = b.conteudo.length; if (atual.length && tam + t > NUVEM_REC_POR_BLOCO){ lotes.push(atual); atual = []; tam = 0; } atual.push(b); tam += t; });
      if (atual.length) lotes.push(atual);
      cadeia = lotes.reduce(function(pr, lote){ return pr.then(function(){ return acessoRpc("nuvem_salvar", { chave:ch, blocos:lote }); }); }, Promise.resolve())
        .then(function(){ return acessoRpc("nuvem_salvar", { chave:ch, blocos:[], tipo_limpar:"ban", ids_ativos:d.idsBan }); })
        .then(function(){ return acessoRpc("nuvem_salvar", { chave:ch, blocos:base, tipo_limpar:"rec", ids_ativos:d.idsRec, versao:nova }); });
    } else {
      cadeia = acessoRpc("nuvem_salvar", { chave:ch, blocos:base, versao:nova });
    }
    return cadeia.then(function(){
      nuvemSetVersaoLocal(nova.id); NUVEM.ocupado = false; NUVEM.ultimo = new Date(); nuvemEstado(Object.keys(NUVEM.sujo).length ? "pend" : "ok", "");
      if (dados && nuvemAuto() && acessoPessoas().some(function(n){ return acessoCfg().codigos[n]; })){
        acessoPublicar(ch).catch(function(e){ if (window.console) console.warn("publicação automática:", e); });
      }
      if (Object.keys(NUVEM.sujo).length){ clearTimeout(NUVEM.timer); NUVEM.timer = setTimeout(function(){ nuvemEnviar(false); }, 1500); }
      return true;
    });
  }).catch(function(err){
    NUVEM.ocupado = false; Object.keys(sujoAntes).forEach(function(k){ NUVEM.sujo[k] = true; });
    nuvemEstado("erro", err.message); return false;
  });
}
function nuvemBaixar(forcar){
  var ch = nuvemChave(); if (!ch) return Promise.resolve(false);
  NUVEM.ocupado = true; nuvemEstado("load");
  return acessoRpc("nuvem_versao", { chave:ch }).then(function(v){
    var remota = v && v.versao ? v.versao.id : "";
    if (!remota){ NUVEM.ocupado = false; nuvemEstado("ok", ""); return "vazia"; }
    if (!forcar && remota===nuvemVersaoLocal()){ NUVEM.ocupado = false; NUVEM.ultimo = new Date(); nuvemEstado("ok", ""); return "igual"; }
    var ids = (v.blocos||[]).map(function(b){ return b.id; }), grupos = [], g = [], tam = 0;
    (v.blocos||[]).forEach(function(b){ if (g.length && tam + b.tamanho > 3000000){ grupos.push(g); g = []; tam = 0; } g.push(b.id); tam += b.tamanho; });
    if (g.length) grupos.push(g);
    var todos = [];
    return grupos.reduce(function(pr, gr){ return pr.then(function(){ return acessoRpc("nuvem_ler", { chave:ch, ids:gr }).then(function(r){ todos = todos.concat(r||[]); }); }); }, Promise.resolve()).then(function(){
      var porTipo = function(t){ return todos.filter(function(b){ return b.tipo===t; }).sort(function(a,b){ return a.ordem-b.ordem; }); };
      var st = porTipo("settings")[0], fl = porTipo("files")[0];
      var bk = { tipo:"painel-execucao-backup", versao:1, settings: st ? st.conteudo : null, importedFiles: fl ? (fl.conteudo||[]) : [],
        records: porTipo("rec").reduce(function(a,b){ return a.concat(b.conteudo||[]); }, []),
        banco: porTipo("ban").reduce(function(a,b){ return a.concat(b.conteudo||[]); }, []) };
      NUVEM.silencio = true;
      return A.aplicarBackup(bk).then(function(){
        NUVEM.silencio = false; NUVEM.sujo = {}; nuvemSetVersaoLocal(remota); NUVEM.ocupado = false; NUVEM.ultimo = new Date(); nuvemEstado("ok", "");
        try { rebuildFilterOptions(); } catch(e){}
        renderAll();
        A.toast("Dados carregados da nuvem · "+fmtInt(bk.records.length)+" execuções", "ok");
        return "baixou";
      });
    });
  }).catch(function(err){ NUVEM.silencio = false; NUVEM.ocupado = false; nuvemEstado("erro", err.message); throw err; });
}

/* Gerador de QR Code (modo byte, correção M, versões 1–10) — sem bibliotecas externas */
var QR = (function(){
  var ECC_M = [-1,10,16,26,18,24,16,18,22,22,26], BLK_M = [-1,1,1,1,2,2,4,4,4,5,5];
  function rawModules(v){ var r = (16*v+128)*v+64; if (v>=2){ var na = Math.floor(v/7)+2; r -= (25*na-10)*na-55; if (v>=7) r -= 36; } return r; }
  function dataCw(v){ return Math.floor(rawModules(v)/8) - ECC_M[v]*BLK_M[v]; }
  function mul(x, y){ var z = 0; for (var i=7;i>=0;i--){ z = (z<<1) ^ ((z>>>7)*0x11D); z ^= ((y>>>i)&1)*x; } return z & 0xFF; }
  function rsDiv(deg){ var r = []; for (var i=0;i<deg-1;i++) r.push(0); r.push(1); var root = 1;
    for (var i2=0;i2<deg;i2++){ for (var j=0;j<r.length;j++){ r[j] = mul(r[j], root); if (j+1<r.length) r[j] ^= r[j+1]; } root = mul(root, 2); } return r; }
  function rsRem(data, div){ var r = div.map(function(){ return 0; });
    data.forEach(function(b){ var f = b ^ r.shift(); r.push(0); div.forEach(function(c, i){ r[i] ^= mul(c, f); }); }); return r; }
  function utf8(s){ return Array.prototype.slice.call(unescape(encodeURIComponent(s))).map(function(c){ return c.charCodeAt(0); }); }
  function alignPos(v){ if (v===1) return []; var na = Math.floor(v/7)+2, size = v*4+17, step = Math.ceil((v*4+4)/(na*2-2))*2, r = [6];
    for (var pos=size-7; r.length<na; pos-=step) r.splice(1, 0, pos); return r; }
  function gera(texto){
    var bytes = utf8(texto), v = 1;

var PAINEL_FOTOS = {};
function painelFotosCarregar(){ return A.idbGetMeta("painelFotos").then(function(m){ PAINEL_FOTOS = m || {}; }).catch(function(){}); }
function painelFoto(nome){ return PAINEL_FOTOS[up(nome)] || ""; }
/* foto do Painel (bucket privado "fotos") -> miniatura guardada só neste navegador */
function painelBaixarFotos(token, lista){
  var p = A.painelCfg(), url = (p.url || PAINEL_PADRAO.url).replace(/\/+$/,""), key = p.key || PAINEL_PADRAO.key;
  var com = lista.filter(function(c){ return c.fotoPath; });
  var novo = {};
  return com.reduce(function(pr, c){
    return pr.then(function(){
      return fetch(url+"/storage/v1/object/authenticated/fotos/"+c.fotoPath.split("/").map(encodeURIComponent).join("/"), { headers:{ apikey:key, Authorization:"Bearer "+token } })
        .then(function(r){ if (!r.ok) throw new Error("foto"); return r.blob(); })
        .then(function(bl){ return new Promise(function(res){
          var im = new Image(), u = URL.createObjectURL(bl);
          im.onload = function(){ var s = 160, cv = document.createElement("canvas"); cv.width = s; cv.height = s; var cx = cv.getContext("2d"), m = Math.min(im.width, im.height);
            cx.drawImage(im, (im.width-m)/2, (im.height-m)/2, m, m, 0, 0, s, s); URL.revokeObjectURL(u); res(cv.toDataURL("image/jpeg", 0.82)); };
          im.onerror = function(){ URL.revokeObjectURL(u); res(""); };
          im.src = u; }); })
        .then(function(d){ if (d) novo[up(c.nome)] = d; })
        .catch(function(){});
    });
  }, Promise.resolve()).then(function(){ PAINEL_FOTOS = novo; return A.idbSetMeta("painelFotos", novo); });
}

/* ========================================================================
   RESULTADOS DAS OS — análise completa por resultado
   ======================================================================== */
var RES_CORES = { P:"#ff5a1f", N:"var(--np)", X:"rgba(var(--ink),0.28)" };
var RES_NOMES = { P:"Produtivo", N:"Não produtivo", X:"Ignorado" };
var RES_BADGE = { P:"badge-good", N:"badge-critical", X:"badge-neutral" };

function estadoDoResultado(resultado, key){
  var rule = SETTINGS.resultRules[key];
  return rule || (A.classificacao(resultado)==="PRODUTIVO" ? "P" : "N");
}
/* TIPO DA OS (Restabelecimento, Religação, Corte...) */
var SEM_TIPO = "(sem tipo)";
function tipoDe(r){ return r.tipo ? titleCase(r.tipo) : SEM_TIPO; }
function tipoKey(r){ return r.tipo ? up(r.tipo) : SEM_TIPO; }
function tiposStats(f){
  return A.memo("tipos|"+A.fkey(f), function(){
    var m = {};
    A.filterRecords(Object.assign({}, f, { incluirIgnorados:true })).forEach(function(r){
      var k = tipoKey(r), e = m[k] || (m[k] = { key:k, nome:tipoDe(r), total:0, P:0, N:0, X:0 });
      e.total++; e[r._cls]++;
    });
    return Object.keys(m).map(function(k){ return m[k]; }).sort(function(a,b){ return b.total-a.total; });
  });
}
function resultadoStats(f, tipo){
  if (tipo===undefined) tipo = UI.resTipo || "";
  return A.memo("resStats|"+A.fkey(f)+"|"+tipo, function(){
    var recs = A.filterRecords(Object.assign({}, f, { incluirIgnorados:true }));
    if (tipo) recs = recs.filter(function(r){ return tipoKey(r)===tipo; });
    var map = new Map();
    recs.forEach(function(r){
      var k = r._rk;
      var e = map.get(k);
      if (!e){ e = { key:k, resultado:r.resultado||"(vazio)", total:0, porBase:{}, porDia:{}, porFunc:{}, porTipo:{} }; map.set(k, e); }
      e.total++;
      var b = r._area || "—";
      e.porBase[b] = (e.porBase[b]||0)+1;
      var tk = tipoDe(r), pt = e.porTipo[tk] || (e.porTipo[tk] = { n:0, porBase:{} });
      pt.n++; pt.porBase[b] = (pt.porBase[b]||0)+1;
      if (r.dataInicio){ var d = dateToISO(r.dataInicio); e.porDia[d] = (e.porDia[d]||0)+1; }
      if (r.equipe){ e.porFunc[r.equipe] = (e.porFunc[r.equipe]||0)+1; }
    });
    var out = Array.from(map.values());
    out.forEach(function(e){ e.estado = estadoDoResultado(e.resultado, e.key); });
    out.sort(function(a,b){ return b.total - a.total; });
    return out;
  });
}
function resFiltradas(lista){
  var res = lista;
  if (UI.resClasse !== "todos") res = res.filter(function(r){ return r.estado===UI.resClasse; });
  if (UI.resBusca){
    var s = up(UI.resBusca);
    res = res.filter(function(r){ return up(r.resultado).indexOf(s)!==-1; });
  }
  return res;
}
function atalhoDias(dias){
  var hoje = new Date();
  var fim = hoje, ini;
  if (STATE.filters.ano!=null && !(STATE.filters.ano===hoje.getFullYear() && STATE.filters.mes===hoje.getMonth())){
    fim = new Date(STATE.filters.ano, STATE.filters.mes+1, 0);
  }
  ini = new Date(fim.getFullYear(), fim.getMonth(), fim.getDate()-(dias-1));
  STATE.filters.from = dateToISO(ini);
  STATE.filters.to = dateToISO(fim);
  syncRangeInputs();
  renderCurrentPage();
}
function limparDias(){
  STATE.filters.from = ""; STATE.filters.to = "";
  syncRangeInputs();
  renderCurrentPage();
}

function tiposCard(f){
  var ts = tiposStats(f);
  var semTipo = ts.filter(function(t){ return t.key===SEM_TIPO; })[0];
  var total = ts.reduce(function(a,t){ return a+t.total; }, 0);
  var tudoSem = semTipo && semTipo.total===total;
  var aviso = (semTipo && total) ? '<div class="note" style="margin-top:10px;">'+IC('alert','i-sm')+' '
      + (tudoSem ? 'As OS salvas não têm o tipo. ' : fmtInt(semTipo.total)+' OS sem tipo. ')
      + 'Reimporte as planilhas de Execução em <b>Importar Planilhas</b>: o painel não duplica nada, só completa o tipo. '
      + 'Se a coluna tiver outro nome, informe em <b>Configurações › Geral</b>.</div>' : '';
  if (!ts.length) return '';
  var ativo = UI.resTipo || "";
  return '<div class="card tipos-card">'
    + cardHead("Tipo de OS", ativo ? 'filtrando: <b>'+esc(ativo===SEM_TIPO?SEM_TIPO:titleCase(ativo))+'</b> · clique de novo para limpar' : 'clique num tipo para ver só os resultados dele',
        '<select id="resTipoSel" class="tipo-sel"><option value="">Todos os tipos</option>'
        + ts.map(function(t){ return '<option value="'+esc(t.key)+'"'+(ativo===t.key?" selected":"")+'>'+esc(t.nome)+' ('+fmtInt(t.total)+')</option>'; }).join("") + '</select>')
    + (tudoSem ? '' : '<div class="tipo-chips">' + ts.map(function(t){
        var val = t.P + t.N, pc = val ? t.P/val : 0;
        return '<button class="tipo-chip'+(ativo===t.key?" on":"")+(t.key===SEM_TIPO?" sem":"")+'" data-tipo="'+esc(t.key)+'">'
          + '<span class="tc-n">'+esc(t.nome)+'</span>'
          + '<span class="tc-v">'+fmtInt(t.total)+' OS · '+fmtPct(pc)+' prod.</span>'
          + '<span class="tc-b"><i style="width:'+(pc*100)+'%"></i></span></button>';
      }).join("") + '</div>')
    + aviso
  + '</div>';

function tiposMini(r){
  var tk = Object.keys(r.porTipo||{}).sort(function(a,b){ return r.porTipo[b].n-r.porTipo[a].n; });

  + '</div>';

function exportarResultadosOSCSV(f){
  var busca = UI.resBusca ? up(UI.resBusca) : "";
  var recs = A.filterRecords(Object.assign({}, f, { incluirIgnorados:true })).filter(function(r){
    if (UI.resTipo && tipoKey(r)!==UI.resTipo) return false;
    if (UI.resClasse && UI.resClasse!=="todos" && r._cls!==UI.resClasse) return false;
    if (busca && up(r.resultado).indexOf(busca)===-1) return false;
    return true;
  }).sort(function(a,b){ return (a._t||0)-(b._t||0); });
  var q = function(v){ return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'; };
  var NOME = { P:"Produtiva", N:"Nao produtiva", X:"Ignorada" };
  var linhas = [["Numero OS","Tipo de OS","Resultado","Classificacao","Colaborador","Base do colaborador","Regiao da OS","Unidade","Inicio","Fim"].join(";")];
  recs.forEach(function(r){
    linhas.push([q(r.numOS), q(r.tipo?titleCase(r.tipo):""), q(r.resultado), NOME[r._cls]||"", q(titleCase(r.equipe)), q(r._area), q(r._areaExec), q(r.unidade),
      r.dataInicio?fmtDateTimeBR(r.dataInicio):"", r.dataFim?fmtDateTimeBR(r.dataFim):""].join(";"));
  });
  var blob = new Blob(["\ufeff"+linhas.join("\r\n")], { type:"text/csv;charset=utf-8;" });
  var url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = "os-detalhadas" + (UI.resTipo ? "-"+UI.resTipo.toLowerCase().replace(/[^a-z0-9]+/gi,"-") : "") + "-" + dateToISO(new Date()) + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1200);
  A.toast("CSV gerado com "+fmtInt(recs.length)+" OS.", "ok");
}

function diffHHMM(a, b){

function horarioRows(f){
  var g = Object.assign({}, f, { base:"GERAL" });
  return A.memo("hor|"+A.fkey(g), function(){
    var by = {};
    A.filterDaily(g).forEach(function(d){
      var e = by[d.equipe] || (by[d.equipe] = { equipe:d.equipe, dias:0, sp:0, np:0, su:0, nu:0, sj:0, nj:0, minPrim:null, maxUlt:null, semSync:0, exatos:0 });
      e.dias++;
      if (d.prim>0){ e.sp+=d.prim; e.np++; if (e.minPrim==null || d.prim<e.minPrim) e.minPrim=d.prim; }
      if (d.ult>=0.999) e.semSync++;
      else if (d.ult>0){
        e.su+=d.ult; e.nu++; if (e.maxUlt==null || d.ult>e.maxUlt) e.maxUlt=d.ult;
        if (d.prim>0 && d.ult>d.prim){ e.sj+=d.ult-d.prim; e.nj++; }
      }
      if (d.exact) e.exatos++;
    });
    return Object.keys(by).map(function(k){
      var e = by[k];
      e.area = employeeArea(e.equipe) || "Sem base";
      e.mediaPrim = e.np ? e.sp/e.np : null;
      e.mediaUlt  = e.nu ? e.su/e.nu : null;
      e.mediaJornada = e.nj ? e.sj/e.nj : null;
      e.os = employeeSummary(e.equipe, g).totalOS;
      return e;
    });

var HOR_ST = {

};
function hhmmToFrac(s){ var m = /^(\d{1,2}):(\d{2})/.exec(s||""); return m ? ((+m[1])*60 + (+m[2]))/1440 : null; }
function horLim(){
  var l = (SETTINGS && SETTINGS.horLim) || {};
  return { ini: hhmmToFrac(l.ini) || 9/24, fim: hhmmToFrac(l.fim) || 15/24, iniTxt: l.ini || "09:00", fimTxt: l.fim || "15:00" };
}
function horSetLim(k, v){

  SETTINGS.horLim = SETTINGS.horLim || {}; SETTINGS.horLim[k] = v; saveSettings(); renderCurrentPage();
}
function horStatus(d, L){
  if (!(d.prim>0)) return null;
  var sem = d.ult>=0.999, t = d.prim > L.ini + 1e-9, c = !sem && d.ult>0 && d.ult < L.fim - 1e-9;
  return t && c ? "ambos" : t ? "tarde" : c ? "cedo" : sem ? "sync" : "ok";
}
/* alertas por pessoa (base = base do colaborador; dias em qualquer região) */
function horAlertas(f){
  var g = Object.assign({}, f, { base:"GERAL" }), L = horLim();
  return A.memo("horAl|"+A.fkey(g)+"|"+L.ini+"|"+L.fim, function(){
    var by = {};
    A.filterDaily(g).forEach(function(d){
      var st = horStatus(d, L); if (!st) return;
      var e = by[d.equipe] || (by[d.equipe] = { equipe:d.equipe, dias:{}, n:0, ambos:0, tarde:0, cedo:0, ok:0, sync:0, foraMin:0, pior:null });
      var iso = dateToISO(dayKeyToDate(d.day));
      var fora = Math.max(0, d.prim - L.ini) + ((d.ult>0 && d.ult<0.999) ? Math.max(0, L.fim - d.ult) : 0);
      e.dias[iso] = { prim:d.prim, ult:d.ult, st:st, fora:fora };
      e.n++; e[st]++; e.foraMin += Math.round(fora*1440);
      if (st!=="ok" && st!=="sync" && (!e.pior || fora > e.pior.fora)) e.pior = { iso:iso, prim:d.prim, ult:d.ult, st:st, fora:fora };
    });
    Object.keys(by).forEach(function(k){ var e = by[k]; e.alertas = e.ambos + e.tarde + e.cedo; e.pctAlerta = e.n ? e.alertas/e.n : 0; });
    return by;
  });
}
function horMin(m){ m = Math.round(m||0); var h = Math.floor(m/60); return h ? h+"h"+String(m%60).padStart(2,"0") : m+" min"; }

/* dispersão: média da 1ª (x) × média da última (y) */
function chartHorScatter(w, rows, L){
  var h = 330, padL = 46, padR = 18, padT = 18, padB = 34;
  var pts = rows.filter(function(r){ return r.mediaPrim!=null && r.mediaUlt!=null; });
  if (!pts.length) return '<div class="empty-state" style="padding:20px;">Sem dados.</div>';

  var x0 = Math.floor(Math.min.apply(null, xs)*2)/2 - 0.5, x1 = Math.ceil(Math.max.apply(null, xs)*2)/2 + 0.5;
  var y0 = Math.floor(Math.min.apply(null, ys)) - 1, y1 = Math.ceil(Math.max.apply(null, ys)) + 1;
  var iw = Math.max(80, w-padL-padR), ih = h-padT-padB;
  var X = function(v){ return padL + iw*(v-x0)/(x1-x0); }, Y = function(v){ return padT + ih - ih*(v-y0)/(y1-y0); };
  var hh = function(v){ var m = Math.round(v*60); return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); };
  var out = svgOpen(w, h), lx = X(L.ini*24), ly = Y(L.fim*24);
  out += '<rect x="'+lx+'" y="'+padT+'" width="'+(padL+iw-lx)+'" height="'+ih+'" fill="#ff5a1f" fill-opacity=".06"/>';
  out += '<rect x="'+padL+'" y="'+ly+'" width="'+iw+'" height="'+(padT+ih-ly)+'" fill="#ffb224" fill-opacity=".06"/>';
  out += '<rect x="'+lx+'" y="'+ly+'" width="'+(padL+iw-lx)+'" height="'+(padT+ih-ly)+'" fill="#ef4444" fill-opacity=".12" rx="8"/>';
  out += txt(padL+iw-8, padT+ih-10, "COMEÇA TARDE E TERMINA CEDO", {anchor:"end", size:9.5, weight:700, fill:"#ef4444", extra:' letter-spacing=".6"'});
  out += txt(padL+iw-8, padT+14, "começa tarde", {anchor:"end", size:9.5, weight:600, fill:"#ff5a1f"});
  out += txt(padL+8, padT+ih-10, "termina cedo", {size:9.5, weight:600, fill:"#d9930f"});
  var passoX = (x1-x0) > 4 ? 1 : 0.5;
  for (var v = Math.ceil(x0/passoX)*passoX; v<=x1+1e-9; v+=passoX){ out += '<line x1="'+X(v)+'" y1="'+padT+'" x2="'+X(v)+'" y2="'+(padT+ih)+'" stroke="rgba(var(--ink),.07)" stroke-dasharray="1 5" stroke-linecap="round"/>' + txt(X(v), h-12, hh(v), {anchor:"middle", size:10, extra:' class="ct"'}); }
  for (var u = Math.ceil(y0); u<=y1; u++){ out += gridLine(padL, Y(u), padL+iw) + txt(padL-8, Y(u)+3.5, hh(u), {anchor:"end", size:10, extra:' class="ct"'}); }
  out += '<line x1="'+lx+'" y1="'+padT+'" x2="'+lx+'" y2="'+(padT+ih)+'" stroke="#ff5a1f" stroke-width="1.4" stroke-dasharray="4 4"/>';
  out += '<line x1="'+padL+'" y1="'+ly+'" x2="'+(padL+iw)+'" y2="'+ly+'" stroke="#ffb224" stroke-width="1.4" stroke-dasharray="4 4"/>';
  out += pill(lx, padT+2, "1ª até "+L.iniTxt, "#ff5a1f", "middle") + pill(padL+2, ly-4, "última a partir de "+L.fimTxt, "#ffb224", "start");
  out += txt(padL+iw/2, h, "média da 1ª execução →", {anchor:"middle", size:10, weight:600, extra:' class="ct"'});
  var mxA = Math.max.apply(null, pts.map(function(r){ return r.al.alertas; }).concat([1]));
  pts.sort(function(a,b){ return a.al.alertas-b.al.alertas; }).forEach(function(r){
    var t = r.mediaPrim > L.ini, c = r.mediaUlt < L.fim, st = t&&c ? "ambos" : t ? "tarde" : c ? "cedo" : "ok";
    var cor = st==="ok" ? "var(--np)" : HOR_ST[st].cor, rr = 5 + 6*Math.sqrt(r.al.alertas/mxA);
    var cxp = X(r.mediaPrim*24), cyp = Y(r.mediaUlt*24);

      + '<title>'+esc(titleCase(r.equipe)+" — 1ª "+fracToHHMM(r.mediaPrim)+" · última "+fracToHHMM(r.mediaUlt)+" · "+r.al.alertas+" dia(s) com alerta de "+r.al.n+" · clique para abrir")+'</title></circle>';

  });
  return out + '</svg>';
}
/* histograma de horários em faixas de 30 min, destacando o que passou do limite */
function chartHorHist(w, vals, lim, tipo){
  var h = 210, padL = 30, padR = 8, padT = 22, padB = 28;
  if (!vals.length) return '<div class="empty-state" style="padding:20px;">Sem dados.</div>';
  var bins = {}, mn = 99, mx = 0;
  vals.forEach(function(v){ var b = Math.floor(v*48); bins[b] = (bins[b]||0)+1; mn = Math.min(mn, b); mx = Math.max(mx, b); });
  var lb = Math.floor(lim*48); mn = Math.min(mn, lb-1); mx = Math.max(mx, lb+1);
  var n = mx-mn+1, iw = Math.max(60, w-padL-padR), ih = h-padT-padB, step = iw/n, bw = Math.max(4, Math.min(18, step*0.55));
  var top = niceMax(Math.max.apply(null, Object.keys(bins).map(function(k){ return bins[k]; }).concat([1]))*1.15);
  var out = svgOpen(w, h);
  for (var g=0; g<=3; g++){ var yy = padT+ih-ih*g/3; out += gridLine(padL, yy, padL+iw) + txt(padL-6, yy+3.5, fmtInt(Math.round(top*g/3)), {anchor:"end", size:10, extra:' class="ct"'}); }
  var cada = Math.ceil(n/Math.max(1, Math.floor(iw/44)));
  for (var i=0;i<n;i++){
    var b = mn+i, v = bins[b]||0, x = padL + step*i + (step-bw)/2, bh = ih*v/top;
    var fora = tipo==="ini" ? (b >= lb && (b+0.0001)/48 >= lim) : (b < lb || (b===lb && lim*48 > b+0.999));
    if (tipo==="ini") fora = (b/48) >= lim; else fora = ((b+1)/48) <= lim;
    var hr = String(Math.floor(b/2)).padStart(2,"0")+":"+(b%2?"30":"00");
    out += '<rect class="trk" x="'+x+'" y="'+padT+'" width="'+bw+'" height="'+ih+'" rx="'+(bw/2)+'" fill="rgba(var(--ink),0.035)"/>';
    if (v) out += '<rect x="'+x+'" y="'+(padT+ih-bh).toFixed(1)+'" width="'+bw+'" height="'+Math.max(bw, bh).toFixed(1)+'" rx="'+(bw/2)+'" fill="'+(fora ? (tipo==="ini" ? "#ff5a1f" : "#ffb224") : "var(--np)")+'"><title>'+esc(hr+"–"+(b%2 ? String(Math.floor(b/2)+1).padStart(2,"0")+":00" : String(Math.floor(b/2)).padStart(2,"0")+":30")+": "+v+" dia(s)"+(fora?" · fora da janela":""))+'</title></rect>';
    if (i%cada===0) out += txt(padL+step*i+step/2, h-9, hr, {anchor:"middle", size:9.5, extra:' class="ct"'});
  }
  var lx = padL + step*(lim*48 - mn);
  out += '<line x1="'+lx.toFixed(1)+'" y1="'+(padT-6)+'" x2="'+lx.toFixed(1)+'" y2="'+(padT+ih)+'" stroke="'+(tipo==="ini"?"#ff5a1f":"#ffb224")+'" stroke-width="1.4" stroke-dasharray="4 4"/>';
  out += pill(lx, padT-6, (tipo==="ini"?"limite ":"limite ")+fracToHHMM(lim), tipo==="ini"?"#ff5a1f":"#ffb224", "middle");
  return out + '</svg>';
}

function chartJornadaDias(w, dias, name, media){
  var n = dias.length;
  if (!n) return '<div class="empty-state" style="padding:20px;">Sem dias registrados.</div>';
  var h = 260, padL = 44, padR = 8, padT = 12, padB = 30;
  var lo = 24, hi = 0;
  dias.forEach(function(d){
    if (d.prim>0) lo = Math.min(lo, d.prim*24);
    hi = Math.max(hi, (d.ult>=0.999 ? 24 : d.ult*24));
  });
  lo = Math.max(0, Math.floor(lo)-1); hi = Math.min(24, Math.ceil(hi)+1);
  if (hi-lo<4) hi = Math.min(24, lo+4);
  var iw = Math.max(40, w-padL-padR), ih = h-padT-padB;
  var Y = function(hr){ return padT + ih*(hr-lo)/(hi-lo); };
  var out = svgOpen(w, h);
  var passo = (hi-lo)>10 ? 2 : 1;
  for (var t=Math.ceil(lo); t<=hi; t+=passo){
    out += '<line x1="'+padL+'" y1="'+Y(t)+'" x2="'+(padL+iw)+'" y2="'+Y(t)+'" stroke="'+PAL.grid+'"/>';
    out += txt(padL-8, Y(t)+4, String(t).padStart(2,"0")+"h", {anchor:"end", size:10.5});
  }
  var step = iw/n, bw = Math.max(3, Math.min(22, step*0.62));
  var cada = Math.ceil(n/Math.max(1, Math.floor(iw/34)));
  dias.forEach(function(d, i){
    var x = padL + step*i + (step-bw)/2;
    var dt = dayKeyToDate(d.day), iso = dateToISO(dt);
    var sem = d.ult>=0.999;
    if (d.prim>0 && d.ult>0){
      var y0 = Y(d.prim*24), y1 = Y(sem ? 24 : d.ult*24);
      var stD = horStatus(d, horLim());
      out += '<rect class="jd-bar" x="'+x+'" y="'+y0+'" width="'+bw+'" height="'+Math.max(3, y1-y0)+'" rx="'+Math.min(5,bw/2)+'" fill="'+((stD==="ok"||stD==="sync") ? "var(--np)" : HOR_ST[stD].cor)+'"'
        + ' onclick="__APP_UI__.openEmployeeOS(\''+jsStr(name)+'\',{dia:\''+iso+'\'})">'
        + '<title>'+fmtDateBR(dt)+' ('+DOW[dt.getDay()]+'): '+fracToHHMM(d.prim)+' → '+fracToHHMM(d.ult)+(sem?' · sem sincronizar':'')+' — clique para ver as OS</title></rect>';
    }
    if (i%cada===0) out += txt(padL+step*i+step/2, h-10, String(dt.getDate()).padStart(2,"0")+"/"+String(dt.getMonth()+1).padStart(2,"0"), {anchor:"middle", size:10});
  });
  var LJ = horLim();
  [[LJ.ini, "#ff5a1f", "limite 1ª "+LJ.iniTxt],[LJ.fim, "#ffb224", "limite última "+LJ.fimTxt]].forEach(function(m){
    if (m[0]*24 < lo || m[0]*24 > hi) return;
    var yy = Y(m[0]*24);
    out += '<line x1="'+padL+'" y1="'+yy+'" x2="'+(padL+iw)+'" y2="'+yy+'" stroke="'+m[1]+'" stroke-width="1.5" stroke-dasharray="4 4"><title>'+m[2]+'</title></line>' + pill(padL+iw, yy-4, m[2], m[1], "end");
  });
  [[media.prim, "rgba(var(--ink),.5)", "média 1ª"],[media.ult, "rgba(var(--ink),.5)", "média última"]].forEach(function(m){
    if (m[0]==null) return;
    var yy = Y(m[0]*24);
    out += '<line x1="'+padL+'" y1="'+yy+'" x2="'+(padL+iw)+'" y2="'+yy+'" stroke="'+m[1]+'" stroke-width="1.4" stroke-dasharray="5 4"><title>'+m[2]+': '+fracToHHMM(m[0])+'</title></line>';
  });
  return out + '</svg>';
}

/* ========================================================================
   COMPARAÇÃO
   Base = base do colaborador. Cada base reúne as OS feitas pelas pessoas
   dela, em qualquer região. Grupos são comparados por MÉDIA POR PESSOA,
   para que uma pessoa possa ser posta lado a lado com a base.
   ======================================================================== */
function grupoStats(f, base){
  var g = Object.assign({}, f, { base: base||"GERAL" });
  var rows = rankingList(g, "pct");
  var n = rows.length;
  var s = scopeSummary(g);
  var soma = function(k){ return rows.reduce(function(a,r){ return a+(r[k]||0); }, 0); };
  var med = function(k){ var v = rows.filter(function(r){ return r[k]!=null; }); return v.length ? v.reduce(function(a,r){ return a+r[k]; },0)/v.length : null; };
  var fora = 0, totRec = 0;
  if (base && base!=="GERAL"){
    A.filterRecords(g).forEach(function(r){ totRec++; if (r._areaExec && up(r._areaExec)!==up(base)) fora++; });
  }
  var bateram = rows.filter(function(r){ return r.pct >= metaPct()/100; }).length;
  return {
    nome: base||"GERAL", n:n, rows:rows,
    totalOS: s.totalOS, totalProdutivo: s.totalProdutivo, pct: s.pct,
    osPessoa: n ? soma("totalOS")/n : 0, prodPessoa: n ? soma("totalProdutivo")/n : 0,
    prodDia: med("mediaProdDiaria"), execDia: med("mediaExecDiaria"),
    mediaPrim: s.mediaPrim, mediaUlt: s.mediaUlt, semSyncPessoa: n ? s.semSync/n : 0,
    bateram: bateram, pctBateram: n ? bateram/n : 0,
    fora: fora, pctFora: totRec ? fora/totRec : 0
  };
}
function pessoaComoGrupo(name, f){
  var s = employeeSummary(name, Object.assign({}, f, { base:"GERAL" }));
  return { nome: titleCase(name), n:1, totalOS:s.totalOS, totalProdutivo:s.totalProdutivo, pct:s.pct,
    osPessoa:s.totalOS, prodPessoa:s.totalProdutivo, prodDia:s.mediaProdDiaria, execDia:s.mediaExecDiaria,
    mediaPrim:s.mediaPrim, mediaUlt:s.mediaUlt, semSyncPessoa:s.semSync, area:s.area, dias:s.dias };
}
var fN1 = function(v){ return v==null ? "—" : Number(v).toFixed(1).replace(".",","); };
var fP  = function(v){ return v==null ? "—" : fmtPct(v); };
var fI  = function(v){ return v==null ? "—" : fmtInt(Math.round(v)); };
/* indicadores: [rótulo, campo, formato, maior é melhor?] */
var COMP_IND = [
  ["% Produtiva", "pct", fP, true],
  ["OS por colaborador", "osPessoa", fI, true],
  ["Produtivas por colaborador", "prodPessoa", fI, true],
  ["Produtivas por dia", "prodDia", fN1, true],
  ["OS por dia", "execDia", fN1, true],
  ["Média 1ª execução", "mediaPrim", fracToHHMM, false],
  ["Média última execução", "mediaUlt", fracToHHMM, null],
  ["Sem sincronizar por colaborador", "semSyncPessoa", fN1, false]
];
function comparPessoaOpts(sel, f, id){
  var rows = rankingList(Object.assign({}, f, { base:"GERAL" }), "pct").slice().sort(function(a,b){ return a.equipe.localeCompare(b.equipe,"pt-BR"); });
  var grupos = {};
  rows.forEach(function(r){ var b = r.area||"Sem base"; (grupos[b] = grupos[b]||[]).push(r); });
  var ordem = BASE_ORDER.filter(function(b){ return grupos[b]; });
  Object.keys(grupos).forEach(function(b){ if (ordem.indexOf(b)===-1) ordem.push(b); });
  return '<select id="'+id+'">' + ordem.map(function(b){
    return '<optgroup label="'+esc(b)+'">'+grupos[b].map(function(r){
      return '<option value="'+esc(r.equipe)+'"'+(r.equipe===sel?" selected":"")+'>'+esc(titleCase(r.equipe))+'</option>'; }).join("")+'</optgroup>';
  }).join("") + '</select>';
}
function renderComparacao(){
  var el = document.getElementById("page-comparacao");
  var f = currentFilter();
  var g = Object.assign({}, f, { base:"GERAL" });
  var pessoas = rankingList(g, "pct").map(function(r){ return r.equipe; });
  if ((!UI.comparEmployee || pessoas.indexOf(UI.comparEmployee)===-1) && pessoas.length) UI.comparEmployee = pessoas[0];
  if ((!UI.comparEmployeeB || pessoas.indexOf(UI.comparEmployeeB)===-1) && pessoas.length) UI.comparEmployeeB = pessoas[Math.min(1, pessoas.length-1)];
  if (["bases","individual","duelo"].indexOf(UI.comparTab)===-1) UI.comparTab = "bases";
  var bases = basesComDados();
  var sub = "";
  if (UI.comparTab==="individual"){
    sub = '<div class="field"><label>Colaborador</label>'+comparPessoaOpts(UI.comparEmployee, f, "comparEmployeeSel")+'</div>'
      + '<div class="field"><label>Comparar com</label><select id="comparAgainstSel">'
        + '<option value="__BASE__"'+(UI.comparAgainst==="__BASE__"?" selected":"")+'>A base dele (média por pessoa)</option>'
        + '<option value="GERAL"'+(UI.comparAgainst==="GERAL"?" selected":"")+'>GERAL (média por pessoa)</option>'
        + bases.map(function(b){ return '<option value="'+esc(b)+'"'+(b===UI.comparAgainst?" selected":"")+'>'+esc(b)+' (média por pessoa)</option>'; }).join("")
      + '</select></div>';
  } else if (UI.comparTab==="duelo"){
    sub = '<div class="field"><label>Colaborador A</label>'+comparPessoaOpts(UI.comparEmployee, f, "comparEmployeeSel")+'</div>'
      + '<div class="field"><label>Colaborador B</label>'+comparPessoaOpts(UI.comparEmployeeB, f, "comparEmployeeSelB")+'</div>';
  }
  el.innerHTML =
    '<div class="filter-bar">'
      + '<div class="tabs" id="comparTabs">'
        + '<button class="tab-btn '+(UI.comparTab==="bases"?"active":"")+'" data-tab="bases">Entre bases</button>'
        + '<button class="tab-btn '+(UI.comparTab==="individual"?"active":"")+'" data-tab="individual">Colaborador × base</button>'
        + '<button class="tab-btn '+(UI.comparTab==="duelo"?"active":"")+'" data-tab="duelo">Colaborador × colaborador</button>'
      + '</div>' + sub
      + '<div class="note" style="align-self:center;margin-left:auto;">'+IC('users','i-sm')+' Base = base do colaborador, não a região da OS</div>'
    + '</div>'
    + '<div id="comparContent"></div>';

  document.querySelectorAll("#comparTabs .tab-btn").forEach(function(btn){
    btn.addEventListener("click", function(){ UI.comparTab = btn.dataset.tab; renderComparacao(); });
  });
  var sA = document.getElementById("comparEmployeeSel"), sB = document.getElementById("comparEmployeeSelB"), sG = document.getElementById("comparAgainstSel");
  if (sA) sA.addEventListener("change", function(e){ UI.comparEmployee = e.target.value; renderComparContent(f); });
  if (sB) sB.addEventListener("change", function(e){ UI.comparEmployeeB = e.target.value; renderComparContent(f); });
  if (sG) sG.addEventListener("change", function(e){ UI.comparAgainst = e.target.value; renderComparContent(f); });
  renderComparContent(f);
}
function comparTabela(cols, titulo){
  // cols: [{nome, cor, dados}] — destaca o melhor valor de cada linha
  return '<div class="table-wrap"><table class="compar-table"><thead><tr><th>'+(titulo||"Indicador")+'</th>'
    + cols.map(function(c){ return '<th class="num"><span class="legend-swatch" style="background:'+c.cor+';display:inline-block;margin-right:6px;"></span>'+esc(c.nome)+'</th>'; }).join("")
    + '</tr></thead><tbody>'
    + COMP_IND.map(function(ind){
        var vals = cols.map(function(c){ return c.dados[ind[1]]; });
        var ok = vals.filter(function(v){ return v!=null; });
        var best = null;
        if (ind[3]!==null && ok.length>1){ best = ind[3] ? Math.max.apply(null, ok) : Math.min.apply(null, ok); if (Math.max.apply(null,ok)===Math.min.apply(null,ok)) best = null; }
        return '<tr><td class="strong">'+ind[0]+'</td>' + cols.map(function(c){
          var v = c.dados[ind[1]];
          return '<td class="num'+(best!=null && v===best ? " best" : "")+'">'+ind[2](v)+'</td>';
        }).join("") + '</tr>';
      }).join("")
    + '</tbody></table></div>';
}
function difChip(a, b, maiorMelhor, fmt){
  if (a==null || b==null || maiorMelhor===null) return "";
  var d = a-b; if (Math.abs(d)<1e-9) return '<span class="badge badge-neutral">igual</span>';
  var bom = maiorMelhor ? d>0 : d<0;
  return '<span class="badge '+(bom?"badge-good":"badge-critical")+'">'+(d>0?"+":"−")+fmt(Math.abs(d))+'</span>';
}

/* pontos por colaborador, uma faixa por base */
function chartDistribuicao(w, gs, mp){
  var rowH = 46, padL = 110, padR = 16, padT = 10, padB = 26;
  var h = padT + padB + rowH*gs.length, iw = Math.max(60, w-padL-padR);
  var X = function(p){ return padL + iw*Math.max(0, Math.min(1, p)); };
  var out = svgOpen(w, h);
  for (var i=0;i<=4;i++){
    var x = padL + iw*i/4;
    out += '<line x1="'+x+'" y1="'+padT+'" x2="'+x+'" y2="'+(h-padB)+'" stroke="'+PAL.grid+'"/>' + txt(x, h-8, (i*25)+"%", {anchor:"middle", size:10.5});
  }
  var mx = X(mp/100);
  out += '<line x1="'+mx+'" y1="'+padT+'" x2="'+mx+'" y2="'+(h-padB)+'" stroke="rgba(var(--ink),.55)" stroke-dasharray="5 4"><title>Meta '+mp+'%</title></line>';
  gs.forEach(function(g, k){
    var y = padT + rowH*k + rowH/2, cor = BASE_COLORS_HEX[g.nome] || PAL.brand;
    out += txt(padL-12, y+4, g.nome, {anchor:"end", size:12, weight:600, fill:"var(--text-primary)"});
    g.rows.forEach(function(r, j){
      var jit = ((j*37)%11 - 5) * 1.6;
      out += '<circle data-emp="'+esc(r.equipe)+'" cx="'+X(r.pct)+'" cy="'+(y+jit)+'" r="5.5" fill="'+cor+'" fill-opacity=".75" stroke="var(--surface-1)" stroke-width="1.2" style="cursor:pointer"><title>'+esc(titleCase(r.equipe))+': '+fmtPct(r.pct)+' ('+fmtInt(r.totalOS)+' OS) — duplo clique para ver as OS</title></circle>';
    });
    var mpx = X(g.pct);
    out += '<line x1="'+mpx+'" y1="'+(y-14)+'" x2="'+mpx+'" y2="'+(y+14)+'" stroke="'+cor+'" stroke-width="3" stroke-linecap="round"><title>% da base: '+fmtPct(g.pct)+'</title></line>';
  });
  return out + '</svg>';
}

/* Alterações ficam pendentes até clicar em "Salvar alterações".
   COLAB.pBase[NOME] = "Base" | "" (""= usar a da planilha); COLAB.pOff[NOME] = true|false */
var COLAB = { pBase:{}, pOff:{}, sel:new Set(), filtro:"todos", busca:"" };
function colabPendingCount(){
  var n = 0;
  Object.keys(COLAB.pBase).forEach(function(k){ if ((SETTINGS.colabBase[k]||"") !== COLAB.pBase[k]) n++; });
  Object.keys(COLAB.pOff).forEach(function(k){ if (!!SETTINGS.colabOff[k] !== COLAB.pOff[k]) n++; });
  return n;
}
function colabDiscard(silent){
  COLAB.pBase = {}; COLAB.pOff = {}; COLAB.sel = new Set();
  if (!silent && STATE.currentPage==="colaboradores") renderColabDynamic();
}
function colabDefBase(n){ return (n in COLAB.pBase) ? COLAB.pBase[n] : (SETTINGS.colabBase[n] || ""); }
function colabOffEff(n){ return (n in COLAB.pOff) ? COLAB.pOff[n] : !!SETTINGS.colabOff[n]; }
function colabEffBase(n){ return colabDefBase(n) || A.employeeBaseFromData(n) || ""; }
function colabIsPending(n){
  return ((n in COLAB.pBase) && (SETTINGS.colabBase[n]||"") !== COLAB.pBase[n])
      || ((n in COLAB.pOff) && !!SETTINGS.colabOff[n] !== COLAB.pOff[n]);
}
function colabSetBase(n, b){ COLAB.pBase[n] = b; }
function colabSetOff(n, v){ COLAB.pOff[n] = v; }

      + cardHead("Cadastro de colaboradores", "clique no nome para abrir o perfil · clique na base para trocar · marque vários para mover de uma vez · nada muda no painel até você clicar em <b>Salvar</b>")
      + '<div class="card-toolbar">'
        + '<div class="field" style="flex:1;min-width:220px;"><label>Buscar</label><div class="search-input-wrap" style="width:100%;"><span class="sic">'+IC('search')+'</span><input type="search" id="colabSearch" placeholder="Nome do funcionário..." value="'+esc(COLAB.busca)+'" style="width:100%;"></div></div>'
        + '<div class="field"><label>Mostrar</label><div class="tabs" id="colabFiltro" style="flex-wrap:wrap;"></div></div>'
      + '</div>'
      + '<div id="colabBulk"></div>'
      + '<div class="table-wrap" id="colabWrap" style="max-height:620px;overflow-y:auto;"><table><thead><tr>'
        + '<th style="width:34px;"><input type="checkbox" class="chk" id="colabAll" title="Selecionar todos os visíveis"></th>'

  renderColabDynamic();

  document.getElementById("colabFiltro").addEventListener("click", function(e){

    COLAB.filtro = b.dataset.f; renderColabDynamic();
  });
  document.getElementById("colabAll").addEventListener("change", function(e){
    colabVisiveis().forEach(function(n){ if (e.target.checked) COLAB.sel.add(n); else COLAB.sel.delete(n); });

  });
  document.getElementById("colabBody").addEventListener("click", function(e){

    if (t.closest(".name-cell")){ abrirPerfil(n); return; }
    var bb = t.closest("[data-base]");
    if (bb){ colabSetBase(n, bb.dataset.base); renderColabDynamic(); return; }
    if (t.closest(".colab-off")){ colabSetOff(n, !colabOffEff(n)); renderColabDynamic(); return; }
    if (t.classList.contains("chk")){ if (t.checked) COLAB.sel.add(n); else COLAB.sel.delete(n); renderColabDynamic(); return; }
  });
  document.getElementById("colabBulk").addEventListener("click", function(e){
    var b = e.target.closest("[data-bulk]"); if (!b) return;
    var act = b.dataset.bulk;
    COLAB.sel.forEach(function(n){
      if (act==="base") colabSetBase(n, b.dataset.val);
      else if (act==="on") colabSetOff(n, false);
      else if (act==="off") colabSetOff(n, true);
    });
    if (act==="clear") COLAB.sel = new Set();
    renderColabDynamic();
  });

    var b = e.target.closest("[data-save]"); if (!b) return;
    if (b.dataset.save==="ok") colabSave(); else colabDiscard();
  });
  document.getElementById("colabReset").addEventListener("click", function(){
    A.allEmployees().forEach(function(n){ colabSetBase(n, ""); });
    renderColabDynamic();
    A.toast("Todas as bases voltaram para a da planilha — clique em Salvar para confirmar.", "ok");
  });

function colabVisiveis(){
  var nomes = A.allEmployees();
  var s = COLAB.busca ? up(COLAB.busca) : "";
  return nomes.filter(function(n){
    if (s && up(n).indexOf(s)===-1) return false;
    var f = COLAB.filtro;
    if (f==="todos") return true;
    if (f==="inativos") return colabOffEff(n);
    if (f==="alterados") return colabIsPending(n);
    if (f==="sem") return !colabEffBase(n);
    return colabEffBase(n)===f;
  });
}
function renderColabDynamic(){
  var todos = A.allEmployees();
  var cont = { todos: todos.length, sem:0, inativos:0, alterados:0 };
  BASE_ORDER.forEach(function(b){ cont[b]=0; });
  var comDef = 0;
  todos.forEach(function(n){
    var b = colabEffBase(n);
    if (!b) cont.sem++; else if (cont[b]!=null) cont[b]++;
    if (colabOffEff(n)) cont.inativos++;
    if (colabIsPending(n)) cont.alterados++;
    if (colabDefBase(n)) comDef++;
  });

  var k = document.getElementById("colabKpis");
  if (k) k.innerHTML =
      kpiCard(IC("users"),"Colaboradores", fmtInt(todos.length), '', "encontrados nas planilhas")
    + kpiCard(IC("layers"),"Com base definida", fmtInt(comDef), '', "sobrepõem a planilha", "info")
    + kpiCard(IC("x"),"Inativos", fmtInt(cont.inativos), '', "fora dos rankings e médias", cont.inativos?"warning":"")
    + kpiCard(IC("target"),"Por base", BASE_ORDER.map(function(b){ return '<span class="base-chip" style="margin-right:10px;"><span class="sw" style="background:'+BASE_COLORS_HEX[b]+';"></span>'+fmtInt(cont[b])+'</span>'; }).join(""), '', BASE_ORDER.join(" · "), "success");

  var filtros = [["todos","Todos"]].concat(BASE_ORDER.map(function(b){ return [b,b]; }), [["sem","Sem base"],["inativos","Inativos"]]);
  if (cont.alterados) filtros.push(["alterados","Alterados"]);
  if (COLAB.filtro==="alterados" && !cont.alterados) COLAB.filtro = "todos";
  var fe = document.getElementById("colabFiltro");
  if (fe) fe.innerHTML = filtros.map(function(x){
    var sw = BASE_COLORS_HEX[x[0]] ? '<span class="legend-swatch" style="background:'+BASE_COLORS_HEX[x[0]]+';display:inline-block;margin-right:6px;"></span>' : '';
    return '<button class="tab-btn '+(COLAB.filtro===x[0]?"active":"")+'" data-f="'+esc(x[0])+'">'+sw+esc(x[1])+'<span class="cnt">'+fmtInt(cont[x[0]]||0)+'</span></button>';
  }).join("");

  /* barra de ações em massa */
  var bulk = document.getElementById("colabBulk");
  if (bulk){
    bulk.innerHTML = COLAB.sel.size ? '<div class="bulk-bar">'
      + '<span>'+fmtInt(COLAB.sel.size)+' selecionado(s) — mover para:</span>'
      + '<div class="seg">'
        + BASE_ORDER.map(function(b){ return '<button type="button" data-bulk="base" data-val="'+esc(b)+'"><span class="sw" style="background:'+BASE_COLORS_HEX[b]+';"></span>'+esc(b)+'</button>'; }).join("")
        + '<button type="button" data-bulk="base" data-val="">Planilha</button>'
      + '</div>'
      + '<button class="btn btn-sm" data-bulk="on">Ativar</button>'
      + '<button class="btn btn-sm" data-bulk="off">Inativar</button>'
      + '<button class="btn btn-sm btn-ghost" data-bulk="clear">Limpar seleção</button>'
    + '</div>' : '';
  }

  /* tabela */
  var nomes = colabVisiveis();
  var contagem = A.recordsPerEmployee();
  var tb = document.getElementById("colabBody");
  if (tb) tb.innerHTML = nomes.length ? nomes.map(function(n){
    var planilha = A.employeeBaseFromData(n);
    var def = colabDefBase(n);
    var off = colabOffEff(n);
    var pend = colabIsPending(n);
    return '<tr data-nome="'+esc(n)+'" class="'+(pend?"pending ":"")+(off?"is-off":"")+'">'
      + '<td><input type="checkbox" class="chk" '+(COLAB.sel.has(n)?"checked":"")+'></td>'
      + '<td>'+avatarNameCell(n, false)+(pend?' <span class="badge badge-warning" style="margin-left:42px;font-size:10.5px;">alterado</span>':'')+'</td>'
      + '<td>'+(planilha? '<span class="base-chip"><span class="sw" style="background:'+(BASE_COLORS_HEX[planilha]||"#aaa")+';"></span>'+esc(planilha)+'</span>' : '<span class="note">—</span>')+'</td>'
      + '<td><div class="seg">'
        + '<button type="button" data-base="" class="'+(def===""?"on":"")+'" title="Usar a base que vem da planilha">Planilha</button>'
        + BASE_ORDER.map(function(b){
            return '<button type="button" data-base="'+esc(b)+'" class="'+(def===b?"on":"")+'"><span class="sw" style="background:'+BASE_COLORS_HEX[b]+';"></span>'+esc(b)+'</button>';
          }).join("")
      + '</div></td>'
      + '<td class="num">'+fmtInt(contagem[n]||0)+'</td>'
      + '<td><div class="toggle-pill colab-off '+(off?"":"on")+'" style="font-size:12px;"><span class="dot"></span> '+(off?"Inativo":"Ativo")+'</div></td>'
    + '</tr>';
  }).join("") : '<tr><td colspan="6"><div class="empty-state">Nenhum colaborador neste filtro.</div></td></tr>';

  var all = document.getElementById("colabAll");
  if (all){
    var marcados = nomes.filter(function(n){ return COLAB.sel.has(n); }).length;
    all.checked = nomes.length>0 && marcados===nomes.length;
    all.indeterminate = marcados>0 && marcados<nomes.length;
  }

  /* barra de salvar */
  var pend = colabPendingCount();
  var sb = document.getElementById("colabSaveBar");
  if (sb) sb.innerHTML = pend ? '<div class="save-bar">'
    + '<div class="msg">'+IC('alert','i-sm')+' '+fmtInt(pend)+' alteração(ões) não salva(s)</div>'
    + '<button class="btn btn-sm" data-save="no">Descartar</button>'
    + '<button class="btn btn-sm btn-primary" data-save="ok">'+IC('check','i-sm')+' Salvar alterações</button>'
  + '</div>' : '';
  applyBlur();
}
function colabSave(){
  var n = colabPendingCount();
  Object.keys(COLAB.pBase).forEach(function(k){
    if (COLAB.pBase[k]) SETTINGS.colabBase[k] = COLAB.pBase[k]; else delete SETTINGS.colabBase[k];
  });
  Object.keys(COLAB.pOff).forEach(function(k){
    if (COLAB.pOff[k]) SETTINGS.colabOff[k] = true; else delete SETTINGS.colabOff[k];
  });
  COLAB.pBase = {}; COLAB.pOff = {}; COLAB.sel = new Set();
  saveSettings().then(function(){
    A.toast(fmtInt(n)+" alteração(ões) salva(s) — o painel já usa as novas bases.", "ok");
    rebuildFilterOptions();
    populateSpotlightEmployeeOptions();
    renderColabDynamic();
  });
}

function cfgSetRule(key, val, silent){
  var padrao = A.classificacao(key)==="PRODUTIVO" ? "P" : "N";
  var temDados = A.distinctResultados().some(function(r){ return r.key===key && r.total>0; });
  if (val===padrao && temDados && key!=="(vazio)") delete SETTINGS.resultRules[key]; else SETTINGS.resultRules[key] = val;
  if (!silent){ saveSettings(); A.toast('"'+titleCase(key)+'" → '+RES_NOMES[val]+'. Indicadores atualizados.', "ok"); }
}
function cfgResVisiveis(){
  var lista = A.distinctResultados();
  var s = CFGRES.busca ? up(CFGRES.busca) : "";
  return lista.filter(function(r){
    if (s && up(r.resultado).indexOf(s)===-1) return false;
    var c = CFGRES.classe;
    if (c==="todos") return true;
    if (c==="manual") return r.explicito || r.cadastrado;
    return r.estado===c;
  });
}
function renderResTable(){
  var lista = A.distinctResultados();
  var cont = { todos: lista.length, P:0, N:0, X:0, manual:0 };
  lista.forEach(function(r){ cont[r.estado]++; if (r.explicito || r.cadastrado) cont.manual++; });

function wireDropzone(dzId, inputId, type){
  var dz = document.getElementById(dzId), input = document.getElementById(inputId);

  ["dragleave","drop"].forEach(function(ev){ dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.remove("drag"); }); });

var OSP = {};
var OSP_PASSO = 300;
function durMin(r){ return (r.dataInicio && r.dataFim) ? Math.round((r.dataFim-r.dataInicio)/60000) : null; }
function durTxt(min){
  if (min==null || !isFinite(min) || min<0) return "—";
  var h = Math.floor(min/60), m = min%60;
  return h ? (h+"h"+String(m).padStart(2,"0")) : (m+" min");
}
function openEmployeeOS(name, opts){
  if (!name) return;
  opts = opts || {};
  OSP = { name: up(name), aba:"lista", classe:"todas", busca:"", regiao:"", tipo: opts.tipo||"", resultado: opts.resultado||"",
          de: opts.dia||"", ate: opts.dia||"", sort:"t", dir:-1, limite:OSP_PASSO };
  closeEmployeeOS(true);
  var back = document.createElement("div");
  back.className = "os-modal-back"; back.id = "osModal";
  back.innerHTML = '<div class="os-modal" role="dialog" aria-modal="true" id="osModalBox"></div>';
  back.addEventListener("mousedown", function(e){ if (e.target===back) closeEmployeeOS(); });
  document.body.appendChild(back);
  document.body.style.overflow = "hidden";
  osMontar();
  requestAnimationFrame(function(){ back.classList.add("show"); });
}
function closeEmployeeOS(instant){
  var el = document.getElementById("osModal");
  if (!el) return;
