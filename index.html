          + '<div class="lm-busca grande">'+IC('search','i-sm')+'<input type="search" id="lmBuscaCfg" placeholder="Buscar funcionário, serviço ou observação..." value="'+esc(T.busca)+'"></div>'
          + '<div class="seg" id="lmPer"><button type="button" class="'+(T.periodo?"on":"")+'" data-p="1">'+esc(periodLabel())+'</button><button type="button" class="'+(!T.periodo?"on":"")+'" data-p="0">Todos</button></div>'
          + '<select id="lmServF" class="lm-sf"><option value="">Todos os serviços</option>'+servK.map(function(k){ return '<option value="'+esc(k)+'"'+(T.serv===k?" selected":"")+'>'+esc(titleCase(k))+' ('+fmtInt(porServ[k])+' OS)</option>'; }).join("")+'</select>'
          + '<button type="button" class="btn btn-sm" id="lmCSV" '+(lista.length?"":"disabled")+'>'+IC('download','i-sm')+' CSV</button>'
        + '</div>'
        + '<div class="lm-dias">' + (grupos.length ? grupos.map(function(g){
            var d = isoToDate(g.d), so = 0; g.itens.forEach(function(a){ so += A.adjOS(a); });
            return '<div class="lm-dia"><div class="lm-dia-h"><b>'+fmtDateBR(d)+'</b><span>'+DIAS[d.getDay()]+'</span><em>+'+fmtInt(so)+' OS</em></div>'
              + g.itens.map(function(a){
                  var cor = BASE_COLORS_HEX[employeeArea(a.equipe)] || "#ff5a1f", o = A.adjOS(a), p = A.adjProd(a);
                  return '<div class="lm-it">'
                    + '<span class="lm-av" style="--c:'+cor+'">'+esc(initials(a.equipe))+'</span>'
                    + '<div class="lm-it-t"><b>'+esc(titleCase(a.equipe))+'</b><span>'+esc(titleCase(a.servico||"Serviço"))+(a.motivo ? ' · <em>'+esc(a.motivo)+'</em>' : '')+'</span></div>'
                    + '<div class="lm-it-n"><b>+'+fmtInt(o)+' OS</b><span class="'+(p===o?"g":"")+'">'+fmtInt(p)+' produtiva'+(p===1?"":"s")+'</span></div>'
                    + '<div class="lm-it-a"><button type="button" class="lm-ib" data-ed="'+a.id+'" title="Editar">'+IC('pencil','i-sm')+'</button><button type="button" class="lm-ib del" data-del="'+a.id+'" title="Excluir">'+IC('trash','i-sm')+'</button></div>'
                  + '</div>';
                }).join("")
            + '</div>';
          }).join("") : '<div class="empty-state" style="padding:40px 20px;">'+IC('inbox','i-xl')+'<div class="strong" style="margin:8px 0 4px;">Nenhum lançamento '+(T.periodo?"neste período":"ainda")+'</div><div class="muted">Clique em <b>Novo lançamento</b> para registrar OS feitas fora da planilha.</div></div>')
        + '</div>'
      + '</div>'
      + '<div class="card lm-cat-card">'
        + '<div class="iv-sec-h" style="margin-bottom:10px;"><div><b>Serviços salvos</b><span>atalhos com nome e quantidades padrão</span></div></div>'
        + '<div class="lm-svl" id="lmSvl"></div>'
        + '<div class="lm-svn"><input type="text" id="lmSvNome" placeholder="Novo serviço — ex.: Religação"><input type="number" id="lmSvOS" min="1" value="1" title="OS"><input type="number" id="lmSvProd" min="0" value="1" title="Produtivas"><button type="button" class="btn btn-sm btn-primary" id="lmSvAdd">'+IC('plus','i-sm')+'</button></div>'
        + '<div class="lm-svn-l"><span>nome</span><span>OS</span><span>prod.</span><span></span></div>'
      + '</div>'
    + '</div>'
    + '</div>';

  lmListaSalvos();
  var $ = function(id){ return document.getElementById(id); };
  if ($("lmNovoCfg")) $("lmNovoCfg").onclick = function(){ abrirLancamento(); };
  $("lmBuscaCfg").addEventListener("input", debounce(function(e){ T.busca = e.target.value; renderCfgManual(host); var i = $("lmBuscaCfg"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 200));
  host.querySelectorAll("#lmPer [data-p]").forEach(function(b){ b.onclick = function(){ T.periodo = b.dataset.p==="1"; renderCfgManual(host); }; });
  $("lmServF").onchange = function(e){ T.serv = e.target.value; renderCfgManual(host); };
  $("lmCSV").onclick = function(){ lmCSV(lista); };
  host.querySelectorAll("[data-ed]").forEach(function(b){ b.onclick = function(){ abrirLancamento({ editId: +b.dataset.ed }); }; });
  host.querySelectorAll("[data-del]").forEach(function(b){ b.onclick = function(){
    if (!confirm("Excluir este lançamento?")) return;
    SETTINGS.manualAdj = SETTINGS.manualAdj.filter(function(x){ return x.id!==+b.dataset.del; });
    saveSettings().then(function(){ A.toast("Lançamento excluído.", "ok"); renderCurrentPage(); });
  }; });
  $("lmSvAdd").onclick = function(){
    var nome = $("lmSvNome").value.trim(), os = Math.max(1, Math.round(+$("lmSvOS").value||1)), pr = Math.min(os, Math.max(0, Math.round(+$("lmSvProd").value||0)));
    if (!nome){ A.toast("Digite o nome do serviço.", "err"); return; }
    if (lmServicos().some(function(s){ return up(s.nome)===up(nome); })){ A.toast("Esse serviço já está salvo.", "err"); return; }
    SETTINGS.nextServId = SETTINGS.nextServId || (lmServicos().reduce(function(m,s){ return Math.max(m, s.id+1); }, 1));
    lmServicos().push({ id: SETTINGS.nextServId++, nome: nome, os: os, prod: pr });
    saveSettings().then(function(){ A.toast("Serviço salvo.", "ok"); renderCfgManual(host); });
  };
  $("lmSvNome").addEventListener("keydown", function(e){ if (e.key==="Enter") $("lmSvAdd").click(); });
}
function lmListaSalvos(){
  var host = document.getElementById("lmSvl"); if (!host) return;
  var lista = lmServicos();
  host.innerHTML = lista.length ? lista.map(function(s, i){
      var cor = s.cor || LM_CORES[i % LM_CORES.length], u = lmUsos(s.nome);
      return '<div class="lm-svi" data-id="'+s.id+'" style="--c:'+cor+'">'
        + '<i></i><input type="text" class="n" value="'+esc(titleCase(s.nome))+'" title="Nome">'
        + '<input type="number" class="o" min="1" value="'+(s.os||1)+'" title="OS"><input type="number" class="p" min="0" value="'+(s.prod!=null?s.prod:(s.os||1))+'" title="Produtivas">'
        + '<span class="u" title="Lançamentos com este serviço">'+u+'×</span>'
        + '<button type="button" class="lm-ib" data-usa="'+s.id+'" title="Lançar com este serviço">'+IC('plus','i-sm')+'</button>'
        + '<button type="button" class="lm-ib del" data-rm="'+s.id+'" title="Excluir dos salvos">'+IC('trash','i-sm')+'</button>'
      + '</div>';
    }).join("") : '<div class="lm-cat-vazio"><span>Nenhum serviço salvo. Adicione abaixo ou marque <b>Salvar</b> ao lançar.</span></div>';
  host.querySelectorAll(".lm-svi").forEach(function(row){
    var id = +row.dataset.id, s = lmServicos().filter(function(x){ return x.id===id; })[0];
    var salva = function(){
      var n = row.querySelector(".n").value.trim(); if (!n){ row.querySelector(".n").value = titleCase(s.nome); return; }
      s.nome = n; s.os = Math.max(1, Math.round(+row.querySelector(".o").value||1)); s.prod = Math.min(s.os, Math.max(0, Math.round(+row.querySelector(".p").value||0)));
      row.querySelector(".o").value = s.os; row.querySelector(".p").value = s.prod;
      saveSettings(); A.toast("Serviço salvo.", "ok");
    };
    row.querySelectorAll("input").forEach(function(i){ i.addEventListener("change", salva); });
    row.querySelector("[data-usa]").onclick = function(){ abrirLancamento(); LM.servico = s.nome; LM.os = s.os||1; LM.prod = s.prod!=null?s.prod:LM.os; LM.prodTocado = true; lmMontar(); };
    row.querySelector("[data-rm]").onclick = function(){
      if (!confirm('Excluir "'+titleCase(s.nome)+'" dos serviços salvos? Os lançamentos já feitos continuam.')) return;
      SETTINGS.servicosSalvos = lmServicos().filter(function(x){ return x.id!==id; });
      saveSettings().then(function(){ lmListaSalvos(); });
    };
  });
}
function lmCSV(lista){
  var q = function(v){ return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'; };
  var L = [["Data","Funcionario","Base","Servico","OS","Produtivas","Nao produtivas","Observacao","Lancado em"].join(";")];
  lista.forEach(function(a){ var o = A.adjOS(a), p = A.adjProd(a); L.push([fmtDateBR(isoToDate(a.date)), q(titleCase(a.equipe)), q(employeeArea(a.equipe)), q(titleCase(a.servico||"")), o, p, o-p, q(a.motivo||""), a.criado ? fmtDateTimeBR(new Date(a.criado)) : ""].join(";")); });
  var blob = new Blob(["﻿"+L.join("\r\n")], { type:"text/csv;charset=utf-8;" });
  var url = URL.createObjectURL(blob), el = document.createElement("a");
  el.href = url; el.download = "lancamentos-manuais-"+dateToISO(new Date())+".csv"; document.body.appendChild(el); el.click(); el.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1200);
  A.toast("CSV gerado com "+fmtInt(lista.length)+" lançamento(s).", "ok");
}

/* ========================================================================
   MENU SERVIÇOS MANUAIS — lançar, acompanhar em gráficos e gerenciar
   Usa o período e a base do topo da tela.
   ======================================================================== */
function renderServicos(){
  var el = document.getElementById("page-servicos");
  var f = currentFilter();
  var lista = A.filterAdjust(f);
  var tOS = 0, tP = 0, pes = {}, porServ = {}, porPes = {}, porBase = {};
  lista.forEach(function(a){
    var o = A.adjOS(a), p = A.adjProd(a), sv = titleCase(a.servico || "Sem nome"), b = employeeArea(a.equipe) || "Sem base";
    tOS += o; tP += p; pes[a.equipe] = 1;
    var e = porServ[sv] || (porServ[sv] = { os:0, p:0, n:0 }); e.os += o; e.p += p; e.n++;
    var q = porPes[a.equipe] || (porPes[a.equipe] = { os:0, p:0, n:0 }); q.os += o; q.p += p; q.n++;
    var x = porBase[b] || (porBase[b] = { os:0, p:0 }); x.os += o; x.p += p;
  });
  var ss = scopeSummary(f);
  var peso = ss.totalOS ? tOS/ss.totalOS : 0;
  var salvos = lmServicos().slice().sort(function(a,b){ return lmUsos(b.nome) - lmUsos(a.nome); });

  el.innerHTML =
    '<div class="sv-hero">'
      + '<div class="sv-hero-t"><span class="sv-tag">'+IC('clipboard','i-sm')+' Serviços manuais</span>'
        + '<b>OS feitas fora da planilha</b><span>Somam no Total OS e no Total Produtivo de todo o painel · '+esc(periodLabel())+' · '+esc(STATE.filters.base==="GERAL"?"todas as bases":STATE.filters.base)+'</span></div>'
      + '<button type="button" class="sv-btn" id="svNovo">'+IC('plus')+'<span><b>Lançar serviço</b><em>Ctrl+Enter confirma</em></span></button>'
      + '<div class="sv-k">'
        + '<div><span>Lançamentos</span><b data-count>'+fmtInt(lista.length)+'</b><em>no período</em></div>'
        + '<div><span>OS somadas</span><b>+'+fmtInt(tOS)+'</b><em>'+fmtPct(peso)+' do Total OS</em></div>'
        + '<div class="g"><span>Produtivas</span><b>+'+fmtInt(tP)+'</b><em>'+fmtPct(tOS ? tP/tOS : 0)+' produtivas</em></div>'
        + '<div><span>Funcionários</span><b data-count>'+fmtInt(Object.keys(pes).length)+'</b><em>com lançamento</em></div>'
      + '</div>'
      + (salvos.length ? '<div class="sv-rap"><span>Lançar rápido:</span>'+salvos.slice(0, 8).map(function(s, i){
          return '<button type="button" class="sv-rap-b" data-sv="'+s.id+'" style="--c:'+(s.cor || LM_CORES[i % LM_CORES.length])+'"><i></i>'+esc(titleCase(s.nome))+' <em>'+fmtInt(s.os||1)+' OS</em></button>';
        }).join("")+'</div>' : '')
    + '</div>'

    + (lista.length ?
      '<div class="grid grid-2">'
        + '<div class="card">'+cardHead("Lançamentos por dia", esc(periodLabel())+" · OS somadas")+'<div class="chart-box" id="svChDia"></div>'
          + chartLegend([{label:"Produtivas", color:PAL.good},{label:"Não produtivas", color:PAL.bad}])+'</div>'
        + '<div class="card">'+cardHead("Por serviço", fmtInt(Object.keys(porServ).length)+" serviço(s)")
          + '<div class="sv-donut"><div class="chart-box" id="svChServ"></div><div class="sv-leg" id="svLegServ"></div></div></div>'
      + '</div>'
      + '<div class="grid grid-2">'
        + '<div class="card">'+cardHead("Por funcionário", "OS lançadas · clique numa barra para filtrar a lista")+'<div class="chart-box" id="svChPes"></div></div>'
        + '<div class="iv-g2v" style="gap:20px;">'
          + '<div class="card">'+cardHead("Por base", "OS lançadas pela base do funcionário")+'<div class="chart-box" id="svChBase"></div></div>'
          + '<div class="card">'+cardHead("Peso no total", "manuais × importadas da planilha")+'<div class="sv-donut sm"><div class="chart-box" id="svChPeso"></div><div class="sv-leg">'
            + '<div class="sv-li"><i style="background:#ff8a3d"></i><span>Lançamentos manuais</span><b>'+fmtInt(tOS)+'</b></div>'
            + '<div class="sv-li"><i style="background:#94a3b8"></i><span>Importadas da planilha</span><b>'+fmtInt(Math.max(0, ss.totalOS - tOS))+'</b></div>'
          + '</div></div></div>'
        + '</div>'
      + '</div>'
      : '<div class="card sv-vazio">'+IC('inbox','i-xl')+'<b>Nenhum serviço manual em '+esc(periodLabel())+'</b><span>Os gráficos aparecem aqui assim que houver lançamentos no período.</span>'
        + '<button type="button" class="btn btn-primary" id="svNovo2">'+IC('plus','i-sm')+' Lançar o primeiro</button></div>')

    + '<div id="svGestao"></div>';

  /* gráficos */
  if (lista.length){
    var dias = diasDoEscopo(f), idx = {}, prod = [], nao = [], labels = [];
    var mesmoMes = dias.length && dias[0].getMonth()===dias[dias.length-1].getMonth();
    dias.forEach(function(d, i){ idx[dateToISO(d)] = i; labels.push(mesmoMes ? String(d.getDate()) : d.getDate()+"/"+(d.getMonth()+1)); prod.push(0); nao.push(0); });
    lista.forEach(function(a){ var i = idx[a.date]; if (i==null) return; var o = A.adjOS(a), p = A.adjProd(a); prod[i] += p; nao[i] += Math.max(0, o-p); });
    drawChart("svChDia", function(w){ return chartStacked(w, { height:250, labels:labels, series:[{ name:"Produtivas", color:PAL.good, data:prod },{ name:"Não produtivas", color:PAL.bad, data:nao }] }); });

    var servK = Object.keys(porServ).sort(function(a,b){ return porServ[b].os - porServ[a].os; });
    var corSv = function(nome, i){ var s = lmServicos().filter(function(x){ return up(x.nome)===up(nome); })[0]; return (s && s.cor) || LM_CORES[i % LM_CORES.length]; };
    var itensSv = servK.slice(0, 7).map(function(k, i){ return { label:k, value:porServ[k].os, color:corSv(k, i) }; });
    if (servK.length > 7) itensSv.push({ label:"Outros", value: servK.slice(7).reduce(function(a,k){ return a+porServ[k].os; },0), color:"#8b8b94" });
    drawChart("svChServ", function(w){ return chartDonut(Math.min(w, 230), { height:220, items:itensSv, centerBig:"+"+fmtInt(tOS), centerSub:"OS lançadas" }); });
    document.getElementById("svLegServ").innerHTML = itensSv.map(function(it){
      return '<div class="sv-li"><i style="background:'+it.color+'"></i><span>'+esc(it.label)+'</span><b>'+fmtInt(it.value)+'</b><em>'+fmtPct(tOS ? it.value/tOS : 0)+'</em></div>';
    }).join("");

    var pesK = Object.keys(porPes).sort(function(a,b){ return porPes[b].os - porPes[a].os; }).slice(0, 12);
    drawChart("svChPes", function(w){ return chartHBars(w, { rowH:32, items: pesK.map(function(n){
      return { label:titleCase(n), value:porPes[n].os, text:"+"+fmtInt(porPes[n].os)+" OS · "+fmtInt(porPes[n].p)+" prod.", color: BASE_COLORS_HEX[employeeArea(n)] || PAL.brand, emp:n };
    }) }); });
    var bK = BASE_ORDER.filter(function(b){ return porBase[b]; }).concat(Object.keys(porBase).filter(function(b){ return BASE_ORDER.indexOf(b)===-1; }));
    drawChart("svChBase", function(w){ return chartBarsTarget(w, { height:200, items: bK.map(function(b){ return { label:b, value:porBase[b].os, color: BASE_COLORS_HEX[b] || "#8b8b94" }; }), fmt:function(v){ return "+"+fmtInt(v); } }); });
    drawChart("svChPeso", function(w){ return chartDonut(Math.min(w, 170), { height:160, items:[{ label:"Lançamentos manuais", value:tOS, color:"#ff8a3d" },{ label:"Importadas da planilha", value:Math.max(0, ss.totalOS - tOS), color:"#94a3b8" }], centerBig:fmtPct(peso), centerSub:"manuais" }); });
    /* clicar no nome do funcionário no gráfico filtra a lista */
    var ch = document.getElementById("svChPes");
    ch.addEventListener("click", function(e){
      var t = e.target.closest("[data-tip]"); if (!t) return;
      var nome = String(t.getAttribute("data-tip")).split(":")[0].trim();
      UI.lmTela = UI.lmTela || { busca:"", periodo:true, serv:"" }; UI.lmTela.busca = nome;
      renderCfgManual(document.getElementById("svGestao"));
      document.getElementById("svGestao").scrollIntoView({ behavior:"smooth", block:"start" });
    });
  }

  renderCfgManual(document.getElementById("svGestao"), true);
  ["svNovo","svNovo2"].forEach(function(id){ var b = document.getElementById(id); if (b) b.onclick = function(){ abrirLancamento(); }; });
  el.querySelectorAll("[data-sv]").forEach(function(b){
    b.onclick = function(){
      var s = lmServicos().filter(function(x){ return x.id===+b.dataset.sv; })[0]; if (!s) return;
      abrirLancamento(); LM.servico = s.nome; LM.os = s.os||1; LM.prod = s.prod!=null ? s.prod : LM.os; LM.prodTocado = true; lmMontar();
    };
  });
}

function init(){
  wireGlobalEvents();
  A.loadPersisted().then(function(){ return gestaoCarregar(); }).then(function(){
    SETTINGS = STATE.settings;
    rebuildFilterOptions();
    renderAll();
    if (STATE.records.length) A.requestPersist();   // pede ao navegador para não apagar o banco interno
    try { nomesBadge(); } catch(e){}
    try { nuvemIniciar(); } catch(e){ if (window.console) console.warn(e); }
  }).catch(function(e){
    if (window.console) console.error(e);
    rebuildFilterOptions();
    renderAll();
  });
}

window.__APP_UI__ = {
  switchPage: switchPage,
  selectDashboardEmployee: selectDashboardEmployee,
  selectHorarioEmployee: selectHorarioEmployee,
  selectResultado: selectResultado,
  openEmployeeOS: openEmployeeOS,
  abrirLancamento: function(o){ return abrirLancamento(o); },
  gerarRelatorioExcel: function(){ return gerarRelatorioExcel(); },
  abrirPerfil: abrirPerfil,
  nomesPosImport: function(){ nomesBadge(); var c = nomesConferencia(), s2 = c.filter(function(x){ return x.st==="sug"; }).length, pe = STATE.records.filter(function(r){ return r._pdaPend; }).length; if (s2 || pe) A.toast((s2 ? s2+" nome(s) parecido(s) para confirmar" : "")+(s2 && pe ? " · " : "")+(pe ? pe+" OS de PDA sem dono" : "")+" — veja em Nomes & PDA", "ok"); },
  closeEmployeeOS: closeEmployeeOS,
  removeImportedFileUI: function(id){ A.removeImportedFile(id); },
  rebuildFilterOptions: rebuildFilterOptions, renderAll: renderAll, renderCurrentPage: renderCurrentPage
};
window.__APP__.rebuildFilterOptions = rebuildFilterOptions;
window.__APP__.renderAll = renderAll;

document.addEventListener("DOMContentLoaded", init);
})();

</script>

  <button type="button" data-bn="horarios"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Horários</button>
  <button type="button" data-bn="colaboradores"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19c.7-3 2.9-4.6 5.5-4.6s4.8 1.6 5.5 4.6"/><circle cx="16.5" cy="9.5" r="2.5"/><path d="M15.5 14.6c2.3-.2 4.3 1.2 5 4.4"/></svg>Equipe</button>
