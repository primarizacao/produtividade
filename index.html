/* =====================================================================
   NOVO VISUAL · grafite/laranja · modo escuro e claro
   ===================================================================== */
:root, :root[data-theme="dark"]{
  color-scheme:dark;
  --ink:255,255,255;
  --page-plane:#09090b; --sidebar:#0d0d0f; --surface-1:#111113; --surface-2:#18181b; --surface-3:#202024;
  --text-primary:#f4f4f5; --text-secondary:rgba(255,255,255,.66); --text-muted:rgba(255,255,255,.42);
  --border:rgba(255,255,255,.065); --border-strong:rgba(255,255,255,.12);
  --pill-bg:#2a2a2f; --tip-bg:#000;
  --shadow-xs:0 1px 2px rgba(0,0,0,.5); --shadow-sm:0 2px 8px rgba(0,0,0,.4); --shadow-md:0 10px 30px rgba(0,0,0,.5); --shadow-lg:0 24px 60px rgba(0,0,0,.65);
  --glow:radial-gradient(60% 80% at 100% 0%, rgba(255,90,31,.10), transparent 70%);
}
:root[data-theme="light"]{
  color-scheme:light;
  --ink:24,24,27;
  --page-plane:#f2f2f0; --sidebar:#fafaf9; --surface-1:#ffffff; --surface-2:#f6f6f4; --surface-3:#ececea;
  --text-primary:#18181b; --text-secondary:rgba(24,24,27,.68); --text-muted:rgba(24,24,27,.46);
  --border:rgba(24,24,27,.08); --border-strong:rgba(24,24,27,.15);
  --pill-bg:#18181b; --tip-bg:#18181b;
  --shadow-xs:0 1px 2px rgba(24,24,27,.06); --shadow-sm:0 2px 8px rgba(24,24,27,.06); --shadow-md:0 10px 30px rgba(24,24,27,.10); --shadow-lg:0 24px 60px rgba(24,24,27,.16);
  --glow:radial-gradient(60% 80% at 100% 0%, rgba(255,90,31,.07), transparent 70%);
}
:root{
  --brand:#ff5a1f; --brand-2:#ff8a3d; --brand-grad:linear-gradient(180deg,#ff6a2b 0%,#f2460f 100%);
  --brand-soft:rgba(255,90,31,.13); --brand-soft-2:rgba(255,90,31,.06);
  --shadow-brand:0 1px 0 rgba(255,255,255,.25) inset, 0 8px 22px -8px rgba(255,90,31,.75);
  --series-1:#ff5a1f; --series-2:#ffb224; --series-3:#e5484d; --series-4:#94a3b8; --series-violet:#ff8a3d;
  --good:#22c55e; --good-bg:rgba(34,197,94,.13); --critical:#ef4444; --critical-bg:rgba(239,68,68,.13);
  --warning:#f59e0b; --warning-bg:rgba(245,158,11,.14); --serious:#ff8a3d; --serious-bg:rgba(255,138,61,.14);
  --info:#94a3b8; --info-bg:rgba(148,163,184,.14);
  --radius-sm:9px; --radius-md:12px; --radius-lg:18px;
}
html{background:var(--page-plane);}
body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--page-plane);color:var(--text-secondary);font-size:13.5px;letter-spacing:-.003em;transition:background .25s ease,color .25s ease;}
::-webkit-scrollbar-thumb{background:rgba(var(--ink),.14) !important;border-radius:99px;border:2px solid transparent;background-clip:padding-box !important;}
::-webkit-scrollbar-track{background:transparent !important;}
.app{background:var(--page-plane);}

/* ---------------- barra lateral ---------------- */
.sidebar{background:var(--sidebar);border-right:1px solid var(--border);padding:14px 12px 12px;gap:1px;}
.brand{display:none !important;}
.sb-ws{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 6px;border-radius:12px;border:1px solid var(--border);background:var(--surface-1);margin-bottom:12px;}
.sb-ws .lg{width:32px;height:32px;border-radius:9px;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:var(--shadow-brand);}
.sb-ws .lg svg{width:18px;height:18px;stroke:#fff;}
.sb-ws b{display:block;color:var(--text-primary);font-size:13.5px;font-weight:650;letter-spacing:-.01em;line-height:1.2;}
.sb-ws span{display:block;font-size:11.5px;color:var(--text-muted);line-height:1.3;}
.sb-ws .ch{margin-left:auto;color:var(--text-muted);display:flex;}
.sb-new{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:11px;padding:10px 12px;font:600 13.5px/1 inherit;font-family:inherit;color:#fff;cursor:pointer;background:var(--brand-grad);box-shadow:var(--shadow-brand);transition:filter .15s ease, transform .15s ease;}
.sb-new:hover{filter:brightness(1.07);} .sb-new:active{transform:scale(.98);}
.sb-new svg{width:16px;height:16px;stroke:#fff;stroke-width:2.4;}
.sb-new kbd{margin-left:auto;font:600 10.5px/1 inherit;font-family:inherit;background:rgba(0,0,0,.18);padding:4px 6px;border-radius:6px;color:rgba(255,255,255,.85);}
.sb-search{position:relative;margin:10px 0 4px;}
.sb-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--text-muted);}
.sb-search input{width:100%;height:34px;border-radius:10px;border:1px solid var(--border);background:transparent !important;padding:0 10px 0 32px !important;font-size:13px;color:var(--text-primary);}
.sb-search input:focus{outline:none;border-color:rgba(255,90,31,.5);box-shadow:0 0 0 3px rgba(255,90,31,.12);}
.nav-group-label{font-size:10.5px;letter-spacing:.08em;padding:16px 10px 6px;color:var(--text-muted);font-weight:600;}
.nav-group-label::before{display:none;}
.nav-item{padding:8px 10px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--text-secondary);gap:10px;position:relative;}
.nav-item .ic{width:18px;color:var(--text-muted);}
.nav-item .ic svg{width:17px;height:17px;}
.nav-item:hover{background:rgba(var(--ink),.045);color:var(--text-primary);}
.nav-item.active{background:var(--surface-1);color:var(--text-primary);font-weight:600;box-shadow:0 0 0 1px var(--border), var(--shadow-xs);}
.nav-item.active .ic{color:var(--brand);}
.nav-item.active::after{content:"";position:absolute;right:10px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px rgba(255,90,31,.18);}
.nav-item.oculto{display:none;}
.sidebar-foot{border-top:0;padding:10px 4px 2px;display:flex;flex-direction:column;gap:10px;}
.sb-theme{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;border-radius:11px;background:rgba(var(--ink),.05);border:1px solid var(--border);}
.sb-theme button{border:0;background:transparent;border-radius:8px;padding:7px 8px;display:flex;align-items:center;justify-content:center;gap:6px;font:600 12px/1 inherit;font-family:inherit;color:var(--text-muted);cursor:pointer;}
.sb-theme button svg{width:14px;height:14px;}
.sb-theme button.on{background:var(--surface-1);color:var(--text-primary);box-shadow:0 0 0 1px var(--border), var(--shadow-xs);}
.sb-note{font-size:11px;color:var(--text-muted);line-height:1.45;padding:0 6px;display:flex;gap:7px;align-items:flex-start;}
.sb-note i{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none;margin-top:4px;box-shadow:0 0 0 3px var(--good-bg);}

/* ---------------- topo ---------------- */
.topbar{position:sticky;top:0;margin:0;border-radius:0;background:color-mix(in srgb, var(--page-plane) 82%, transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);box-shadow:none;border-bottom:1px solid var(--border);padding:12px 28px;gap:10px;align-items:center;}
@media (max-width:640px){ .topbar{margin:0;padding:10px 14px;} }
.page-title{font-size:20px;font-weight:700;color:var(--text-primary);letter-spacing:-.025em;line-height:1.15;}
.page-title .crumb{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--text-muted);letter-spacing:0;margin-bottom:3px;}
.page-title .crumb i{font-style:normal;opacity:.5;}
.page-title .sub{font-size:12.5px;color:var(--text-muted);font-weight:400;letter-spacing:0;margin-top:2px;}
.topbar .field{flex-direction:row;align-items:center;gap:0;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface-1);padding-left:10px;height:36px;transition:border-color .15s ease;}
.topbar .field:hover{border-color:rgba(var(--ink),.22);}
.topbar .field:focus-within{border-color:rgba(255,90,31,.55);box-shadow:0 0 0 3px rgba(255,90,31,.12);}
.topbar .field label{font-size:10px;letter-spacing:.07em;color:var(--text-muted);white-space:nowrap;margin:0;}
.topbar .field select, .topbar .field input{border:0 !important;background-color:transparent !important;box-shadow:none !important;height:34px;font-weight:600;font-size:13px;padding-left:8px;}
.topbar .field input[type="date"]{width:128px;}
.topbar .btn, .topbar .toggle-pill{height:36px;border-radius:10px;}
.tb-theme{width:36px;height:36px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:all .15s ease;}
.tb-theme:hover{color:var(--brand);border-color:rgba(255,90,31,.45);}
.tb-theme svg{width:17px;height:17px;}
.content{padding:24px 28px 64px;gap:18px;}
@media (max-width:640px){ .content{padding:16px 14px 50px;} }

/* ---------------- controles ---------------- */
select, .btn, input[type="text"], input[type="search"], input[type="number"], input[type="date"], input[type="time"], input[type="email"], input[type="tel"], textarea{
  background-color:var(--surface-1);color:var(--text-primary);border:1px solid var(--border-strong);border-radius:10px;}
select{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8"><path d="M1.5 2.5L6 6.5l4.5-4" fill="none" stroke="%23888" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>') !important;background-repeat:no-repeat !important;background-position:right 10px center !important;padding-right:30px !important;}
select option, select optgroup{background:var(--surface-2);color:var(--text-primary);}
input::placeholder, textarea::placeholder{color:var(--text-muted);}
:root:not([data-theme="light"]) input[type="date"]::-webkit-calendar-picker-indicator, :root:not([data-theme="light"]) input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.55);}
.btn{font-weight:600;box-shadow:none;}
.btn:hover{background-color:var(--surface-2);border-color:rgba(var(--ink),.24);}
.btn-primary, .btn.btn-primary{background:var(--brand-grad) !important;border-color:transparent !important;color:#fff !important;box-shadow:var(--shadow-brand);}
.btn-primary:hover, .btn.btn-primary:hover{filter:brightness(1.07);}
.btn-excel{background:var(--surface-1) !important;color:var(--text-primary) !important;border:1px solid var(--border-strong) !important;}
.btn-excel svg{stroke:#22c55e !important;}
.toggle-pill{background:var(--surface-1);border:1px solid var(--border-strong);}
.toggle-pill .dot{background:rgba(var(--ink),.18);}
.toggle-pill.on{color:var(--text-primary);border-color:rgba(255,90,31,.5);background:var(--brand-soft-2);}
.tabs, .seg{background:rgba(var(--ink),.05);border:1px solid var(--border);border-radius:11px;padding:3px;}
.tab-btn{border-radius:8px;}
.tab-btn.active, .seg button.on{background:var(--surface-1) !important;color:var(--text-primary) !important;box-shadow:0 0 0 1px var(--border-strong), var(--shadow-xs) !important;}
.tab-btn.active .cnt{background:var(--brand);color:#fff;}
.seg button:hover{background:rgba(var(--ink),.05);}
.chip{background:var(--surface-1);}
.chip.on{background:var(--text-primary);border-color:var(--text-primary);color:var(--surface-1);box-shadow:none;}
.chip.on .cnt{background:rgba(127,127,127,.3);}

/* ---------------- cards e KPIs ---------------- */
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-xs);padding:20px 22px;}
.card-head{margin-bottom:18px;align-items:center;}
.card-title{font-size:14.5px;font-weight:650;letter-spacing:-.015em;display:block;}
.card-title .muted{font-size:12px;margin-top:3px;}
.card-head::after{content:"";width:28px;height:28px;flex:none;border-radius:8px;border:1px solid var(--border);margin-left:auto;align-self:flex-start;
  background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%23888" stroke-width="2" stroke-linecap="round"><path d="M7 17 17 7M8 7h9v9"/></svg>') center/14px no-repeat;opacity:.7;}
.card-head:has(> :nth-child(2))::after{display:none;}
.grid{gap:18px;}
.kpi{background:var(--surface-1);border:1px solid var(--border);border-radius:18px;padding:18px 20px 16px;display:grid;grid-template-columns:1fr auto;grid-template-areas:"label icon" "value value" "delta delta" "note note" "ticks ticks";align-items:center;gap:4px 10px;box-shadow:var(--shadow-xs);position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;inset:0;background:var(--glow);pointer-events:none;opacity:0;transition:opacity .25s ease;}
.kpi:hover::before{opacity:1;}
.kpi:hover{transform:translateY(-2px);border-color:rgba(255,90,31,.28);box-shadow:var(--shadow-md);}
.kpi .icon{grid-area:icon;width:30px;height:30px;border-radius:9px;background:transparent !important;border:1px solid var(--border);color:var(--text-muted) !important;box-shadow:none !important;}
.kpi .icon svg{width:15px;height:15px;}
.kpi .label{grid-area:label;font-size:12.5px;font-weight:500;color:var(--text-muted);display:flex;align-items:center;gap:7px;}
.kpi .label::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--brand);flex:none;}
.kpi.tone-success .label::before{background:var(--good);} .kpi.tone-danger .label::before{background:var(--critical);} .kpi.tone-warning .label::before{background:var(--warning);} .kpi.tone-info .label::before{background:var(--info);}
.kpi .value{grid-area:value;font-size:32px !important;font-weight:650 !important;letter-spacing:-.04em;color:var(--text-primary);margin:6px 0 2px;}
.kpi .delta{grid-area:delta;font-size:11.5px;border-radius:7px;padding:3px 8px;}
.kpi .delta.flat{background:rgba(var(--ink),.06);}
.kpi .note{grid-area:note;font-size:12px;color:var(--text-muted);}
.kticks{grid-area:ticks;display:flex;align-items:flex-end;gap:2px;height:30px;margin-top:10px;}
.kticks span{flex:1;min-width:2px;border-radius:2px;background:rgba(var(--ink),.10);height:var(--h);transform-origin:bottom;animation:ktick .7s cubic-bezier(.2,.8,.2,1) both;}
.kticks span.on{background:linear-gradient(180deg,#ff8a3d,#ff5a1f);}
.kticks span.hi{background:#ffb224;}
@keyframes ktick{from{transform:scaleY(0);}to{transform:scaleY(1);}}
.kseg{grid-area:ticks;display:flex;gap:3px;margin-top:12px;}
.kseg span{flex:1;height:8px;border-radius:3px;background:rgba(var(--ink),.08);}
.kseg span.on{background:var(--brand);}

/* ---------------- tabelas, selos, listas ---------------- */
table th{background:transparent;color:var(--text-muted);font-size:11px;letter-spacing:.06em;border-bottom:1px solid var(--border) !important;}
table td{border-bottom:1px solid var(--border) !important;}
table tbody tr:hover td{background:rgba(var(--ink),.025);}
tr.selected-row td{background:var(--brand-soft-2) !important;}
.badge{border-radius:7px;font-size:11.5px;padding:3px 8px;}
.badge-info{background:var(--info-bg);color:var(--info);}
.avatar{background:var(--brand-soft) !important;color:var(--brand) !important;font-weight:700;}
.progress{background:rgba(var(--ink),.08);height:6px;}
.progress.good > span{background:var(--good);} .progress.bad > span{background:linear-gradient(90deg,#ff8a3d,#ff5a1f);}
.rank-pos{border-radius:8px !important;}
.file-row{border-radius:12px;}
.file-row:hover{background:rgba(var(--ink),.03);}
.empty-state{color:var(--text-muted);}
.legend-item{font-size:12px;color:var(--text-secondary);}
.legend-swatch{border-radius:3px !important;}

/* ---------------- destaques (heros) ---------------- */
.iv-hero, .sv-hero{background:
  radial-gradient(50% 110% at 100% 0%, rgba(255,90,31,.34) 0%, transparent 62%),
  radial-gradient(40% 90% at 0% 100%, rgba(255,178,36,.10) 0%, transparent 60%),
  linear-gradient(160deg,#1a1a1d 0%,#0f0f11 100%) !important;border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow-md) !important;border-radius:20px !important;}
.iv-hero::before{opacity:.25;}
.sv-hero::after, .sv-hero::before{background:rgba(255,90,31,.06) !important;}
.lm-h{background:radial-gradient(70% 160% at 100% 0%, rgba(255,90,31,.38), transparent 60%), linear-gradient(120deg,#1a1a1d,#0f0f11) !important;}
.sv-btn{background:var(--brand-grad) !important;color:#fff !important;box-shadow:var(--shadow-brand) !important;}
.sv-btn em{color:rgba(255,255,255,.82) !important;}
.sv-btn > svg{background:rgba(0,0,0,.2) !important;}
.sv-k > div.g{background:rgba(255,90,31,.16) !important;border-color:rgba(255,90,31,.32) !important;}
.iv-modo button.on, .iv-pre button.on, .iv-chip.on{background:var(--brand) !important;color:#fff !important;border-color:var(--brand) !important;}
.sv-rap-b:hover{background:rgba(255,90,31,.22) !important;color:#fff !important;}
.pv-acoes .btn{color:#c2410c;}
.gestao-card, .pv-dupla, .lm-faixa, .iv-geo-ban{background:linear-gradient(110deg, var(--brand-soft-2), var(--surface-1) 60%) !important;}

/* ---------------- janelas, popups, mapa ---------------- */
.mm-pop, .iv-gp, .iv-hint-c, .mm-ctl, .mm-estilo, .iv-ruas{background:var(--surface-1) !important;color:var(--text-primary);border:1px solid var(--border-strong);}
.mm-ctl button{background:var(--surface-1);color:var(--text-primary);}
.mm-ctl button:hover{background:var(--surface-2);}
.mm-attr{background:rgba(0,0,0,.5);color:rgba(255,255,255,.75);}
.iv-hint{background:linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,.1));}
.os-modal, .os-modal-card, .lm-dlg, .lm-box{border:1px solid var(--border-strong);}
.os-modal-back, .lm-back{backdrop-filter:blur(6px);}
.fx-tip{background:var(--tip-bg) !important;color:#fff !important;border:1px solid rgba(255,255,255,.1);border-radius:10px !important;box-shadow:var(--shadow-lg) !important;}
.toast{background:var(--surface-1) !important;color:var(--text-primary) !important;border:1px solid var(--border-strong);border-left:3px solid var(--brand);box-shadow:var(--shadow-lg) !important;}
.toast.ok{border-left-color:var(--good);} .toast.err{border-left-color:var(--critical);}
.topbar, .sidebar, .card, .kpi, .btn, select, input{transition:background-color .25s ease, border-color .25s ease, color .25s ease;}

/* ---------------- gráficos novos do Dashboard ---------------- */
.dk-radar{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;}
@media (max-width:980px){ .dk-radar{grid-template-columns:1fr;} }
.dk-leg{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:6px;font-size:12px;}
.dk-leg span{display:inline-flex;align-items:center;gap:7px;color:var(--text-secondary);}
.dk-leg i{width:10px;height:10px;border-radius:3px;}
.dk-pol{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;}
@media (max-width:640px){ .dk-pol{grid-template-columns:1fr;} }
.dk-pol-l{display:flex;flex-direction:column;gap:2px;font-size:12.5px;}
.dk-pol-l div{display:grid;grid-template-columns:10px 1fr auto auto;gap:9px;align-items:center;padding:6px 8px;border-radius:8px;}
.dk-pol-l div:hover{background:rgba(var(--ink),.04);}
.dk-pol-l i{width:9px;height:9px;border-radius:3px;}
.dk-pol-l b{color:var(--text-primary);font-variant-numeric:tabular-nums;}
.dk-pol-l em{font-style:normal;color:var(--text-muted);font-size:11.5px;min-width:40px;text-align:right;}
@media print{ :root{--surface-1:#fff;--surface-2:#fafafa;--page-plane:#fff;--text-primary:#111;--text-secondary:#333;--text-muted:#666;--border:#ddd;--ink:24,24,27;} body{background:#fff;} }
/* topo em duas linhas: título + ações / filtros */
.topbar{row-gap:12px;}
.topbar .page-title{flex:1 1 auto;margin-right:auto;}
.topbar .btn-excel, .topbar .tb-theme, .topbar .toggle-pill{order:1;}
.topbar::before{content:"";order:2;flex-basis:100%;height:0;}
.topbar .field, .topbar #rangeChip{order:3;}
.topbar #rangeChip{align-self:center !important;}
/* ===== cores produtivo × não produtivo, gráficos e dashboard ===== */
:root, :root[data-theme="dark"]{ --np:#f2f2f3; }
:root[data-theme="light"]{ --np:#1c1c1f; }
.sb-search{display:none !important;}
.sb-ws .ch{display:none !important;}
.topbar .btn-excel{order:3 !important;margin-left:auto;}
.grid-21{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);gap:18px;}
@media (max-width:1100px){ .grid-21{grid-template-columns:1fr;} }
#dashCmp:empty{display:none;}
/* barra de comparação */
.cmp-bar{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding:10px 12px 10px 16px;border:1px solid var(--border);border-radius:16px;background:var(--surface-1);}
.cmp-t{display:flex;align-items:center;gap:8px;color:var(--text-primary);font-size:13px;}
.cmp-t svg{stroke:var(--brand);}
.cmp-seg{display:flex;flex-wrap:wrap;}
.cmp-seg button{white-space:nowrap;font-size:12.5px !important;padding:7px 11px !important;}
.cmp-faixa{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-muted);font-variant-numeric:tabular-nums;}
.cmp-faixa span{padding:5px 10px;border-radius:8px;background:rgba(var(--ink),.05);color:var(--text-secondary);font-weight:600;}
.cmp-faixa span.a{background:var(--brand-soft);color:var(--brand);}
.cmp-faixa i{font-style:normal;opacity:.6;}
.cmp-faixa em{font-style:normal;color:var(--warning);font-weight:600;}
.kpi .delta em{font-style:normal;opacity:.75;font-weight:500;}
/* tabela de comparação */
.cmp-tab .cmp-h, .cmp-tab .cmp-r{display:grid;grid-template-columns:1.4fr .9fr .9fr .9fr;gap:8px;align-items:center;}
.cmp-tab .cmp-h{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);font-weight:600;padding:0 4px 8px;border-bottom:1px solid var(--border);}
.cmp-tab .cmp-h span:not(:first-child), .cmp-tab .cmp-r > :not(:first-child){text-align:right;}
.cmp-tab .cmp-r{padding:12px 4px;border-bottom:1px solid var(--border);font-size:13px;}
.cmp-tab .cmp-r:last-child{border-bottom:0;}
.cmp-tab .cmp-r span{color:var(--text-secondary);}
.cmp-tab .cmp-r b{color:var(--text-primary);font-weight:700;font-variant-numeric:tabular-nums;}
.cmp-tab .cmp-r em{font-style:normal;color:var(--text-muted);font-variant-numeric:tabular-nums;}
.cmp-tab .cmp-r i{font-style:normal;font-weight:700;font-size:12px;justify-self:end;padding:3px 8px;border-radius:7px;font-variant-numeric:tabular-nums;}
.cmp-tab .cmp-r i.up{color:var(--good);background:var(--good-bg);}
.cmp-tab .cmp-r i.down{color:var(--critical);background:var(--critical-bg);}
.cmp-tab .cmp-r i.flat{color:var(--text-muted);background:rgba(var(--ink),.06);}
/* legenda do medidor */
.pn-leg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.pn-leg div{display:grid;grid-template-columns:10px 1fr;grid-template-rows:auto auto;column-gap:8px;padding:10px 12px;border-radius:12px;background:rgba(var(--ink),.035);border:1px solid var(--border);}
.pn-leg i{width:10px;height:10px;border-radius:3px;margin-top:3px;grid-row:1;}
.pn-leg span{font-size:12px;color:var(--text-muted);}
.pn-leg b{grid-column:2;font-size:20px;font-weight:700;color:var(--text-primary);letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
#dashEmployeePanel:empty{display:none;}
#dashEmployeePanel{padding:16px;margin-bottom:16px;border-radius:14px;background:rgba(var(--ink),.03);border:1px solid var(--border);}
/* estilo geral dos gráficos */
.fx-svg text, .chart-box svg text{font-family:"Inter",system-ui,sans-serif !important;}
.fx-svg .cline, .chart-box .cline{filter:drop-shadow(0 0 6px rgba(255,120,40,.55));}
:root[data-theme="light"] .fx-svg .cline, :root[data-theme="light"] .chart-box .cline{filter:drop-shadow(0 2px 5px rgba(255,90,31,.35));}
.chart-box .dtk{animation:dtkIn .5s ease both;}
@keyframes dtkIn{from{opacity:0;}to{opacity:1;}}
.chart-box .cseg:hover .dtk{filter:brightness(1.15);}
.fx-svg .cseg:hover{filter:none;}
.fx-svg .fx-bar.fx-hover{filter:brightness(1.15) !important;}
.fx-svg .col-hit:hover{fill:rgba(var(--ink),.04) !important;}
.legend-swatch{width:9px !important;height:9px !important;border-radius:3px !important;}
/* ===== Horários reformulado ===== */
.hz-top{display:flex;flex-direction:column;gap:14px;padding:18px 20px;border:1px solid var(--border);border-radius:18px;background:var(--surface-1);}
.hz-jan{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--border);}
.hz-jt{display:flex;align-items:center;gap:12px;flex:1;min-width:240px;}
.hz-jt > svg{width:38px;height:38px;padding:9px;border-radius:11px;background:var(--brand-soft);stroke:var(--brand);box-sizing:border-box;flex:none;}
.hz-jt b{display:block;color:var(--text-primary);font-size:14.5px;}
.hz-jt span{font-size:12px;color:var(--text-muted);}
.hz-in{display:flex;flex-direction:column;gap:4px;padding:8px 12px;border-radius:12px;border:1px solid var(--border-strong);background:var(--surface-2);}
.hz-in span{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.hz-in.t span{color:#ff5a1f;} .hz-in.c span{color:#d9930f;}
.hz-in input{border:0 !important;background:transparent !important;padding:0 !important;font-size:20px;font-weight:700;color:var(--text-primary);height:auto;width:132px;font-variant-numeric:tabular-nums;}
.hz-in.t{box-shadow:inset 3px 0 0 #ff5a1f;} .hz-in.c{box-shadow:inset 3px 0 0 #ffb224;}
.hz-arrow{color:var(--text-muted);font-size:18px;}
.hz-f{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;}
.hz-f .search-input-wrap{flex:1;min-width:200px;}
.hz-f .search-input-wrap input{width:100%;}
.kpi .value small{font-size:16px;color:var(--text-muted);font-weight:600;letter-spacing:0;}
/* situação */
.hz-stack{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:3px;margin:4px 0 18px;}
.hz-stack i{min-width:4px;border-radius:99px;}
.hz-sit{display:flex;flex-direction:column;gap:4px;}
.hz-sit div{display:grid;grid-template-columns:12px 1fr auto 52px;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;font-size:13px;}
.hz-sit div:hover{background:rgba(var(--ink),.04);}
.hz-sit i{width:12px;height:12px;border-radius:4px;}
.hz-sit span{color:var(--text-secondary);}
.hz-sit b{color:var(--text-primary);font-variant-numeric:tabular-nums;}
.hz-sit em{font-style:normal;color:var(--text-muted);font-size:12px;text-align:right;}
.hz-sit .s-ambos{background:rgba(239,68,68,.08);} .hz-sit .s-ambos b{color:#ef4444;}
.hz-dica{display:flex;gap:8px;align-items:flex-start;margin-top:14px;padding:10px 12px;border-radius:10px;background:rgba(var(--ink),.035);font-size:11.5px;color:var(--text-muted);line-height:1.45;}
.hz-dica svg{flex:none;margin-top:1px;}
/* cartões para verificar */
.hz-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.hz-card{border:1px solid var(--border);border-radius:16px;padding:14px;background:var(--surface-2);cursor:pointer;display:flex;flex-direction:column;gap:11px;transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;position:relative;overflow:hidden;}
.hz-card:hover{transform:translateY(-2px);border-color:rgba(255,90,31,.4);box-shadow:var(--shadow-md);}
.hz-card.grave{border-color:rgba(239,68,68,.35);background:linear-gradient(160deg, rgba(239,68,68,.08), var(--surface-2) 55%);}
.hz-ch{display:flex;align-items:center;gap:10px;}
.hz-pos{font-size:11px;font-weight:800;color:var(--text-muted);width:16px;}
.hz-ch .avatar{width:36px;height:36px;font-size:12.5px;flex:none;}
.hz-nm{flex:1;min-width:0;}
.hz-nm b{display:block;color:var(--text-primary);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hz-nm span{font-size:11.5px;color:var(--text-muted);}
.hz-big{text-align:right;line-height:1;}
.hz-big b{display:block;font-size:26px;font-weight:800;letter-spacing:-.04em;color:var(--text-primary);}
.hz-card.grave .hz-big b{color:#ef4444;}
.hz-big span{font-size:10.5px;color:var(--text-muted);}
.hz-tags{display:flex;flex-wrap:wrap;gap:6px;}
.hz-tags span{font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;}
.t-ambos{background:rgba(239,68,68,.14);color:#ef4444;} .t-tarde{background:rgba(255,90,31,.14);color:#ff5a1f;} .t-cedo{background:rgba(255,178,36,.16);color:#d9930f;}
.hstrip{display:flex;gap:3px;}
.hstrip i, .hz-cal i{flex:1;height:16px;border-radius:4px;min-width:5px;background:rgba(var(--ink),.12);}
.hstrip i.vz, .hz-cal i.vz{background:transparent;box-shadow:inset 0 0 0 1px rgba(var(--ink),.06);}
i.ambos{background:#ef4444 !important;} i.tarde{background:#ff5a1f !important;} i.cedo{background:#ffb224 !important;} i.ok{background:rgba(var(--ink),.16) !important;}
i.sync{background:repeating-linear-gradient(45deg, rgba(var(--ink),.4) 0 2px, rgba(var(--ink),.12) 2px 4px) !important;}
.hstrip i[data-dia], .hz-cal i[data-dia]{cursor:pointer;transition:transform .12s ease;}
.hstrip i[data-dia]:hover, .hz-cal i[data-dia]:hover{transform:scaleY(1.25);}
.hz-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.hz-meta div{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:10px;background:rgba(var(--ink),.04);}
.hz-meta span{font-size:10.5px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
.hz-meta b{font-size:15px;color:var(--text-primary);font-variant-numeric:tabular-nums;}
.hz-meta b.bad{color:#ff5a1f;}
.hz-pior{display:flex;align-items:center;gap:8px;border:1px dashed var(--border-strong);background:transparent;border-radius:10px;padding:8px 10px;color:var(--text-secondary);font:500 12px/1.3 inherit;font-family:inherit;cursor:pointer;text-align:left;}
.hz-pior:hover{border-color:var(--brand);color:var(--text-primary);}
.hz-pior span{flex:1;} .hz-pior b{color:var(--text-primary);}
.hz-pior em{font-style:normal;color:var(--brand);font-weight:700;}
/* calendário */
.hz-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--text-muted);}
.hz-leg span{display:inline-flex;align-items:center;gap:6px;}
.hz-leg i{width:10px;height:10px;border-radius:3px;display:inline-block;}
.hz-cal-wrap{overflow-x:auto;padding-bottom:4px;}
.hz-cal{display:flex;flex-direction:column;gap:4px;min-width:calc(170px + var(--n) * 18px + 60px);}
.hz-cal-h, .hz-cal-r{display:grid;grid-template-columns:170px repeat(var(--n), minmax(12px,1fr)) 56px;gap:3px;align-items:center;}
.hz-cal-h em{font-style:normal;font-size:10px;color:var(--text-muted);text-align:center;font-variant-numeric:tabular-nums;}
.hz-cal-h em.fds{opacity:.45;}
.hz-cal-h span:last-child{font-size:10px;color:var(--text-muted);text-align:right;text-transform:uppercase;letter-spacing:.05em;}
.hz-cal-r{padding:2px 0;border-radius:8px;}
.hz-cal-r:hover{background:rgba(var(--ink),.03);}
.hz-cal i{height:20px;}
.hz-cal-n{font-size:12.5px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;padding-left:4px;}
.hz-cal-n:hover{color:var(--brand);}
.hz-cal-t{text-align:right;font-size:12px;font-weight:700;color:var(--text-muted);font-variant-numeric:tabular-nums;padding-right:4px;}
.hz-cal-t.on{color:#ff5a1f;}
/* tabela */
.jbar .jzone{position:absolute;top:0;bottom:0;background:rgba(var(--ink),.06);border-radius:3px;}
.jbar .jfill.st-ok, .jbar .jfill.st-sync{background:var(--np) !important;opacity:.8;}
.jbar .jfill.st-tarde{background:#ff5a1f !important;} .jbar .jfill.st-cedo{background:#ffb224 !important;} .jbar .jfill.st-ambos{background:#ef4444 !important;}
.jscale-in{display:block;margin-top:4px;} .jscale-in .jscale{width:100%;}
.hz-bad{color:#ff5a1f !important;} .hz-bad2{color:#d9930f !important;}
.hz-n{display:inline-block;min-width:24px;padding:2px 7px;border-radius:7px;font-weight:700;font-size:12px;}
.hz-n.tarde{background:rgba(255,90,31,.14);color:#ff5a1f;} .hz-n.cedo{background:rgba(255,178,36,.16);color:#d9930f;} .hz-n.ambos{background:rgba(239,68,68,.14);color:#ef4444;}
.hp-strip .hstrip i{height:30px;border-radius:6px;}
.hp-strip-d{display:flex;gap:3px;margin-top:4px;}
.hp-strip-d em{flex:1;min-width:5px;text-align:center;font-style:normal;font-size:9.5px;color:var(--text-muted);font-variant-numeric:tabular-nums;}
/* ===== Carro × Moto ===== */
.fr-top{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;padding:18px 20px;border:1px solid var(--border);border-radius:18px;background:var(--surface-1);}
.fr-t{display:flex;align-items:center;gap:12px;flex:1;min-width:260px;}
.fr-ic svg{width:40px;height:40px;padding:9px;border-radius:12px;background:var(--brand-soft);stroke:var(--brand);box-sizing:border-box;display:block;}
.fr-t b{display:block;font-size:16px;color:var(--text-primary);letter-spacing:-.01em;}
.fr-t span{font-size:12px;color:var(--text-muted);}
.fr-cnt{display:flex;gap:8px;}
.fr-cnt div{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);}
.fr-cnt b{font-size:17px;color:var(--text-primary);font-variant-numeric:tabular-nums;}
.fr-cnt span{font-size:11.5px;color:var(--text-muted);}
.fr-cnt .c-carro svg{stroke:#ff5a1f;} .fr-cnt .c-moto svg{stroke:var(--np);}
.fr-cnt .c-sem.warn{border-color:rgba(245,158,11,.4);background:var(--warning-bg);} .fr-cnt .c-sem.warn b{color:var(--warning);}
.fr-abas button{display:inline-flex;align-items:center;gap:6px;}
.fr-tool{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.fr-tool .search-input-wrap{flex:1;min-width:220px;} .fr-tool .search-input-wrap input{width:100%;}
.fr-lote{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:rgba(var(--ink),.035);margin-bottom:14px;font-size:12.5px;color:var(--text-muted);}
.fr-lote span{margin-right:4px;}
.fr-lote .btn{display:inline-flex;align-items:center;gap:6px;}
.fr-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px;}
.fr-p{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:14px;border:1px solid var(--border);background:var(--surface-2);transition:border-color .15s ease;}
.fr-p.v-carro{border-color:rgba(255,90,31,.35);box-shadow:inset 3px 0 0 #ff5a1f;}
.fr-p.v-moto{border-color:rgba(var(--ink),.22);box-shadow:inset 3px 0 0 var(--np);}
.fr-p .avatar{width:34px;height:34px;font-size:12px;flex:none;}
.fr-pn{flex:1;min-width:0;}
.fr-pn b{display:block;font-size:13px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fr-pn span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted);}
.fr-pn span i{width:7px;height:7px;border-radius:2px;flex:none;}
.fr-sw{display:flex;gap:3px;padding:3px;border-radius:10px;background:rgba(var(--ink),.05);border:1px solid var(--border);flex:none;}
.fr-sw button{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;border-radius:7px;padding:6px 9px;font:600 12px/1 inherit;font-family:inherit;color:var(--text-muted);cursor:pointer;}
.fr-sw button:hover{color:var(--text-primary);}
.fr-sw button[data-v="carro"].on{background:#ff5a1f;color:#fff;} .fr-sw button[data-v="carro"].on svg{stroke:#fff;}
.fr-sw button[data-v="moto"].on{background:var(--np);color:var(--surface-1);} .fr-sw button[data-v="moto"].on svg{stroke:var(--surface-1);}
.vbadge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:7px;}
.vbadge.v-carro{background:rgba(255,90,31,.14);color:#ff5a1f;} .vbadge.v-carro svg{stroke:#ff5a1f;}
.vbadge.v-moto{background:rgba(var(--ink),.08);color:var(--text-primary);}
/* cartões dos dois grupos */
.fr-duo{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media (max-width:900px){ .fr-duo{grid-template-columns:1fr;} }
.fr-g{border-radius:20px;padding:20px;border:1px solid var(--border);background:var(--surface-1);display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden;}
.fr-g.g-carro{background:radial-gradient(70% 120% at 100% 0%, rgba(255,90,31,.16), transparent 60%), var(--surface-1);border-color:rgba(255,90,31,.3);}
.fr-g.g-moto{background:radial-gradient(70% 120% at 100% 0%, rgba(var(--ink),.07), transparent 60%), var(--surface-1);}
.fr-gh{display:flex;align-items:center;gap:12px;}
.fr-gi svg{width:44px;height:44px;padding:10px;border-radius:13px;box-sizing:border-box;display:block;}
.g-carro .fr-gi svg{background:#ff5a1f;stroke:#fff;} .g-moto .fr-gi svg{background:var(--np);stroke:var(--surface-1);}
.fr-gh b{display:block;font-size:18px;color:var(--text-primary);}
.fr-gh span{font-size:12px;color:var(--text-muted);}
.fr-gp{margin-left:auto;text-align:right;line-height:1;}
.fr-gp b{font-size:32px;font-weight:700;letter-spacing:-.04em;}
.g-carro .fr-gp b{color:#ff5a1f;}
.fr-gp span{display:block;font-size:11px;color:var(--text-muted);margin-top:4px;}
.fr-gk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.fr-gk div{padding:10px 12px;border-radius:12px;background:rgba(var(--ink),.04);}
.fr-gk span{display:block;font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
.fr-gk b{font-size:18px;color:var(--text-primary);font-variant-numeric:tabular-nums;}
.fr-gbar{position:relative;height:8px;border-radius:99px;background:rgba(var(--ink),.08);}
.fr-gbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;}
.g-carro .fr-gbar i{background:linear-gradient(90deg,#ff8a3d,#ff5a1f);} .g-moto .fr-gbar i{background:var(--np);}
.fr-gbar em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--warning);border-radius:2px;}
.fr-aviso{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;border:1px solid rgba(245,158,11,.35);background:var(--warning-bg);font-size:12.5px;color:var(--text-secondary);}
.fr-aviso svg{stroke:var(--warning);flex:none;} .fr-aviso span{flex:1;} .fr-aviso b{color:var(--text-primary);}
.cmp-tab .cmp-r b.win{color:#ff5a1f;}
/* todos os meses */
.mes-bar .mes-chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;}
.mes-chips span{font-size:12px;padding:5px 10px;border-radius:8px;background:rgba(var(--ink),.05);color:var(--text-muted);}
.mes-chips b{color:var(--text-primary);margin-left:4px;}
.mes-tab .cmp-r span{position:relative;padding-bottom:6px;}
.mes-tab .cmp-r span u{position:absolute;left:0;bottom:0;height:3px;border-radius:3px;background:rgba(255,90,31,.55);text-decoration:none;}
.mes-tab .cmp-r.best{background:rgba(255,90,31,.06);border-radius:10px;}
.mes-best{font-style:normal;font-size:10px;font-weight:700;color:#ff5a1f;background:rgba(255,90,31,.14);padding:2px 6px;border-radius:6px;margin-left:4px;}
.mes-tab{max-height:420px;overflow:auto;}
.fr-lista{grid-template-columns:repeat(auto-fill,minmax(360px,1fr));}
.fr-pn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.fr-pn span i{display:inline-block;margin-right:6px;vertical-align:middle;}
.fr-sel{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;padding:10px 12px 10px 18px;border:1px solid var(--border);border-radius:18px;background:var(--surface-1);}
.fr-sel-t{font-size:13px;font-weight:600;color:var(--text-primary);}
.fr-sel-b{display:flex;gap:8px;flex-wrap:wrap;flex:1;}
.fr-sel-b button{display:flex;align-items:center;gap:10px;padding:9px 16px 9px 10px;border-radius:13px;border:1px solid var(--border-strong);background:var(--surface-2);cursor:pointer;font-family:inherit;text-align:left;color:var(--text-secondary);transition:all .15s ease;flex:1;min-width:170px;max-width:260px;}
.fr-sel-b button > svg{width:34px;height:34px;padding:8px;border-radius:10px;background:rgba(var(--ink),.06);stroke:var(--text-muted);box-sizing:border-box;flex:none;}
.fr-sel-b b{display:block;font-size:14px;color:var(--text-primary);} .fr-sel-b em{font-style:normal;font-size:11.5px;color:var(--text-muted);}
.fr-sel-b button:hover{border-color:rgba(var(--ink),.25);}
.fr-sel-b button.v-carro.on{border-color:#ff5a1f;background:linear-gradient(120deg, rgba(255,90,31,.14), var(--surface-2) 70%);box-shadow:0 0 0 3px rgba(255,90,31,.14);}
.fr-sel-b button.v-carro.on > svg{background:#ff5a1f;stroke:#fff;}
.fr-sel-b button.v-moto.on{border-color:var(--np);background:linear-gradient(120deg, rgba(var(--ink),.08), var(--surface-2) 70%);box-shadow:0 0 0 3px rgba(var(--ink),.08);}
.fr-sel-b button.v-moto.on > svg{background:var(--np);stroke:var(--surface-1);}
.fr-sel-b button.v-cmp.on{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,90,31,.12);}
.fr-sel-b button.v-cmp.on > svg{background:var(--brand-grad);stroke:#fff;}
.fr-view{display:flex;flex-direction:column;gap:18px;animation:frIn .35s ease both;}
@keyframes frIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
#frotaCorpo{display:flex;flex-direction:column;gap:18px;}
.frp-t{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.frp-t div{padding:12px 14px;border-radius:12px;background:rgba(var(--ink),.04);}
.frp-t span{display:block;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);}
.frp-t b{font-size:22px;color:var(--text-primary);font-variant-numeric:tabular-nums;}
/* ===================== MODO APRESENTAÇÃO ===================== */
body.pres-on{overflow:hidden;}
.pres{position:fixed;inset:0;z-index:9000;background:var(--page-plane);color:var(--text-secondary);cursor:default;}
.pres-vp{position:absolute;inset:0;overflow:hidden;
  background:radial-gradient(60% 70% at 100% 0%, rgba(255,90,31,.12), transparent 60%), radial-gradient(50% 60% at 0% 100%, rgba(255,178,36,.06), transparent 60%), var(--page-plane);}
.pres-stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:50% 50%;}
.ps-slide{position:absolute;inset:0;padding:56px 72px 0;display:flex;flex-direction:column;}
.ps-slide.in-r{animation:psR .55s cubic-bezier(.2,.8,.2,1) both;} .ps-slide.in-l{animation:psL .55s cubic-bezier(.2,.8,.2,1) both;} .ps-slide.in-f{animation:psF .5s ease both;}
@keyframes psR{from{opacity:0;transform:translateX(60px);}to{opacity:1;transform:none;}}
@keyframes psL{from{opacity:0;transform:translateX(-60px);}to{opacity:1;transform:none;}}
@keyframes psF{from{opacity:0;transform:scale(.98);}to{opacity:1;transform:none;}}
.ps-h{margin-bottom:34px;}
.ps-k{font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin-bottom:10px;}
.ps-h h2{font-size:52px;font-weight:700;letter-spacing:-.035em;color:var(--text-primary);margin:0;line-height:1.05;}
.ps-b{flex:1;min-height:0;position:relative;}
.ps-b > *{animation:psUp .6s .08s cubic-bezier(.2,.8,.2,1) both;}
@keyframes psUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
.ps-f{height:64px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid var(--border);font-size:14px;color:var(--text-muted);}
.ps-f span{display:inline-flex;align-items:center;gap:8px;}
.ps-f svg{width:16px;height:16px;}
.ps-anon{color:var(--text-muted);}
.ps-f span:last-child{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text-secondary);}
/* textos dos gráficos maiores na apresentação */
.pres .chart-box svg text.ct{font-size:14px !important;}
.pres .chart-box svg g.cv text{font-size:13px !important;}
.pres .chart-box{overflow:visible;}
.pl{display:flex;flex-wrap:wrap;gap:10px 26px;justify-content:center;margin-top:14px;font-size:16px;color:var(--text-secondary);}
.pl span{display:inline-flex;align-items:center;gap:9px;}
.pl i{width:13px;height:13px;border-radius:4px;}
.ps{font-size:17px;font-weight:600;color:var(--text-primary);margin-bottom:14px;}
.pv{font-size:24px;color:var(--text-muted);padding:80px 0;text-align:center;}
/* capa */
.ps-slide.capa{justify-content:center;padding-bottom:0;}
.capa .ps-b{display:flex;flex-direction:column;justify-content:center;}
.cp-k{display:inline-flex;align-items:center;gap:12px;font-size:18px;font-weight:600;color:var(--brand);letter-spacing:.04em;text-transform:uppercase;}
.cp-k svg{width:30px;height:30px;padding:6px;border-radius:9px;background:var(--brand-grad);stroke:#fff;box-sizing:content-box;}
.capa h1{font-size:96px;font-weight:800;letter-spacing:-.05em;line-height:1;color:var(--text-primary);margin:26px 0 18px;max-width:1150px;}
.capa p{font-size:28px;color:var(--text-muted);margin:0 0 40px;}
.cp-tags{display:flex;gap:12px;flex-wrap:wrap;}
.cp-tags span{display:inline-flex;align-items:center;gap:9px;font-size:19px;font-weight:600;color:var(--text-primary);padding:12px 18px;border-radius:14px;border:1px solid var(--border-strong);background:var(--surface-1);}
.cp-tags svg{width:18px;height:18px;stroke:var(--brand);}
.cp-big{position:absolute;right:0;top:50%;transform:translateY(-50%);text-align:right;}
.cp-big b{display:block;font-size:170px;font-weight:800;letter-spacing:-.06em;line-height:.9;background:linear-gradient(180deg,#ff8a3d,#ff4d1a);-webkit-background-clip:text;background-clip:text;color:transparent;}
.cp-big span{font-size:22px;color:var(--text-muted);}
.secao h1{font-size:120px;}
/* KPIs */
.pk-row{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}
.pk{padding:28px 30px;border-radius:24px;border:1px solid var(--border);background:var(--surface-1);display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;}
.pk span{font-size:17px;color:var(--text-muted);font-weight:500;display:flex;align-items:center;gap:9px;}
.pk span::before{content:"";width:9px;height:9px;border-radius:3px;background:rgba(var(--ink),.3);}
.pk b{font-size:64px;font-weight:700;letter-spacing:-.045em;color:var(--text-primary);line-height:1.05;}
.pk b small{font-size:28px;color:var(--text-muted);font-weight:600;letter-spacing:0;}
.pk em{font-style:normal;font-size:16px;color:var(--text-muted);}
.pk.pbrand span::before{background:var(--brand);} .pk.pbrand b{color:var(--brand);}
.pk.good span::before{background:var(--good);} .pk.good b{color:var(--good);}
.pk.bad span::before{background:var(--critical);} .pk.bad b{color:var(--critical);}
.pk-row.k5{grid-template-columns:repeat(4,1fr);margin-bottom:22px;}
.pk-row.k5 .pk{padding:22px 26px;} .pk-row.k5 .pk b{font-size:50px;}
.pr-meta{margin-top:56px;padding:34px 36px;border-radius:24px;border:1px solid var(--border);background:var(--surface-1);}
.pr-mt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px;font-size:20px;color:var(--text-muted);}
.pr-mt b{font-size:26px;color:var(--text-primary);}
.pr-bar{position:relative;height:26px;border-radius:99px;background:rgba(var(--ink),.08);}
.pr-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#ff8a3d,#ff4d1a);box-shadow:0 0 30px rgba(255,90,31,.5);animation:prW 1.2s .2s cubic-bezier(.2,.8,.2,1) both;transform-origin:left;}
@keyframes prW{from{transform:scaleX(0);}to{transform:scaleX(1);}}
.pr-bar em{position:absolute;top:-12px;bottom:-12px;width:3px;background:var(--text-primary);border-radius:3px;}
.pr-bar em u{position:absolute;top:-30px;left:50%;transform:translateX(-50%);text-decoration:none;font-style:normal;font-size:15px;font-weight:700;color:var(--text-primary);}
/* layouts */
.pside{display:grid;grid-template-columns:330px 1fr;gap:28px;height:100%;}
.pside-k{display:flex;flex-direction:column;gap:16px;}
.pside-k .pk{padding:22px 24px;} .pside-k .pk b{font-size:46px;}
.pside-c{min-width:0;}
.pc-grid{display:grid;grid-template-columns:480px 1fr;gap:34px;height:100%;}
.pc-grid.wide{grid-template-columns:1fr 420px;}
.pc-grid .pc-r{min-width:0;order:2;} .pc-grid.wide .pc-r{order:0;}
.pc-l{display:flex;flex-direction:column;gap:12px;}
.pcr{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:2px 14px;padding:18px 22px;border-radius:18px;border:1px solid var(--border);background:var(--surface-1);}
.pcr span{font-size:16px;color:var(--text-muted);grid-column:1;}
.pcr b{font-size:36px;font-weight:700;letter-spacing:-.03em;color:var(--text-primary);grid-column:1;}
.pcr em{font-style:normal;font-size:14px;color:var(--text-muted);grid-column:1;}
.pcr i{grid-column:2;grid-row:1 / span 3;align-self:center;font-style:normal;font-size:18px;font-weight:700;padding:8px 12px;border-radius:12px;}
.pcr i.up{color:var(--good);background:var(--good-bg);} .pcr i.down{color:var(--critical);background:var(--critical-bg);} .pcr i.flat{color:var(--text-muted);background:rgba(var(--ink),.06);}
.p2{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
.p3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;align-items:center;}
.pbox{padding:24px 26px;border-radius:24px;border:1px solid var(--border);background:var(--surface-1);min-width:0;}
.p3 .pbox .chart-box{display:flex;justify-content:center;}
.plist{display:flex;flex-direction:column;gap:6px;}
.plist div{display:grid;grid-template-columns:14px 1fr auto 70px;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;font-size:17px;}
.plist div:nth-child(odd){background:rgba(var(--ink),.035);}
.plist i{width:14px;height:14px;border-radius:4px;}
.plist span{color:var(--text-secondary);} .plist b{color:var(--text-primary);font-size:19px;} .plist em{font-style:normal;color:var(--text-muted);text-align:right;}
.peq{display:grid;grid-template-columns:30px 14px 1fr auto;gap:14px;align-items:center;padding:18px 22px;border-radius:18px;border:1px solid var(--border);background:var(--surface-1);}
.peq-p{font-size:18px;font-weight:800;color:var(--text-muted);}
.peq i{width:14px;height:14px;border-radius:4px;}
.peq b{display:block;font-size:22px;color:var(--text-primary);} .peq em{font-style:normal;font-size:14px;color:var(--text-muted);}
.peq strong{font-size:34px;font-weight:700;letter-spacing:-.03em;color:var(--text-primary);}
.peq:first-child{border-color:rgba(255,90,31,.4);background:linear-gradient(120deg, rgba(255,90,31,.1), var(--surface-1) 60%);} .peq:first-child strong{color:var(--brand);}
.pnote p{font-size:20px;line-height:1.55;color:var(--text-secondary);margin:0 0 18px;}
.pnote b{color:var(--text-primary);}
.pfr{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
.pfr-g{padding:34px;border-radius:28px;border:1px solid var(--border);background:var(--surface-1);}
.pfr-g.g-carro{border-color:rgba(255,90,31,.35);background:radial-gradient(70% 90% at 100% 0%, rgba(255,90,31,.16), transparent 60%), var(--surface-1);}
.pfr-h{display:flex;align-items:center;gap:14px;}
.pfr-h svg{width:54px;height:54px;padding:12px;border-radius:16px;box-sizing:border-box;}
.g-carro .pfr-h svg{background:#ff5a1f;stroke:#fff;} .g-moto .pfr-h svg{background:var(--np);stroke:var(--surface-1);}
.pfr-h b{font-size:32px;color:var(--text-primary);} .pfr-h span{margin-left:auto;font-size:17px;color:var(--text-muted);}
.pfr-big{font-size:110px;font-weight:800;letter-spacing:-.05em;color:var(--text-primary);margin:20px 0;line-height:1;}
.g-carro .pfr-big{color:var(--brand);}
.pfr-big span{font-size:22px;font-weight:500;color:var(--text-muted);letter-spacing:0;margin-left:12px;}
.pfr-k{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.pfr-k div{padding:14px 16px;border-radius:14px;background:rgba(var(--ink),.04);}
.pfr-k span{display:block;font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
.pfr-k b{font-size:28px;color:var(--text-primary);}
.pdest{display:grid;grid-template-columns:1fr 1fr;gap:18px 30px;}
.pdest div{display:flex;gap:18px;align-items:flex-start;padding:22px 24px;border-radius:20px;border:1px solid var(--border);background:var(--surface-1);animation:psUp .6s cubic-bezier(.2,.8,.2,1) both;}
.ps-b > .pdest{animation:none;}
.pdest span{font-size:22px;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums;}
.pdest p{margin:0;font-size:21px;line-height:1.45;color:var(--text-secondary);}
.pdest p b{color:var(--text-primary);} .pdest p b.ok{color:var(--good);} .pdest p b.bad{color:var(--critical);}
/* barra de controle, progresso e grade */
.pres-prog{position:absolute;left:0;right:0;top:0;height:3px;background:rgba(var(--ink),.06);z-index:3;}
.pres-prog i{display:block;height:100%;background:var(--brand-grad);transition:width .4s ease;box-shadow:0 0 12px rgba(255,90,31,.7);}
.pres-bar{position:absolute;left:50%;bottom:22px;transform:translate(-50%, 20px);display:flex;align-items:center;gap:6px;padding:8px;border-radius:16px;background:color-mix(in srgb, var(--surface-1) 88%, transparent);backdrop-filter:blur(14px);border:1px solid var(--border-strong);box-shadow:var(--shadow-lg);opacity:0;transition:opacity .25s ease, transform .25s ease;z-index:4;}
.pres.ativo .pres-bar, .pres.grade .pres-bar{opacity:1;transform:translate(-50%,0);}
.pres-bar button{width:38px;height:38px;border-radius:11px;border:0;background:transparent;color:var(--text-secondary);display:inline-flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;}
.pres-bar button:hover{background:rgba(var(--ink),.08);color:var(--text-primary);}
.pres-bar button svg{width:18px;height:18px;}
.pres-bar button[data-a="auto"]{width:auto;padding:0 10px;} .pres-bar button em{font-style:normal;font-size:12px;font-weight:700;}
.pres-bar button.on{background:var(--brand);color:#fff;}
.pres-bar select{height:38px;border-radius:11px;font-size:13px;max-width:190px;}
.pres-n{min-width:62px;text-align:center;font-weight:700;font-size:13px;color:var(--text-primary);font-variant-numeric:tabular-nums;}
.pres-bar .sep{width:1px;height:24px;background:var(--border-strong);margin:0 4px;}
.pres-grid{position:absolute;inset:0;z-index:5;background:color-mix(in srgb, var(--page-plane) 92%, transparent);backdrop-filter:blur(10px);padding:50px 60px 120px;overflow:auto;display:none;}
.pres.grade .pres-grid{display:block;}
.pg-h{display:flex;align-items:baseline;gap:14px;margin-bottom:24px;} .pg-h b{font-size:28px;color:var(--text-primary);} .pg-h span{color:var(--text-muted);}
.pg-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
.pg-l button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:20px;border-radius:18px;border:1px solid var(--border);background:var(--surface-1);cursor:pointer;text-align:left;aspect-ratio:16/9;font-family:inherit;color:var(--text-secondary);transition:transform .15s ease,border-color .15s ease;}
.pg-l button:hover{transform:translateY(-3px);border-color:rgba(255,90,31,.5);}
.pg-l button.on{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,90,31,.2);}
.pg-l button svg{width:22px;height:22px;stroke:var(--brand);}
.pg-l button span{font-size:12px;font-weight:800;color:var(--text-muted);margin-top:auto;}
.pg-l button b{font-size:16px;color:var(--text-primary);}
/* página de configuração */
.pa-hero{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding:28px 30px;border-radius:22px;color:#fff;
  background:radial-gradient(55% 120% at 100% 0%, rgba(255,90,31,.42), transparent 62%), radial-gradient(40% 90% at 0% 100%, rgba(255,178,36,.12), transparent 60%), linear-gradient(160deg,#1a1a1d,#0f0f11);border:1px solid rgba(255,255,255,.08);}
.pa-ht{flex:1;min-width:280px;}

.pa-anon{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.07);font-size:12.5px;color:rgba(255,255,255,.8);}

.pa-go{display:flex;align-items:center;gap:14px;padding:16px 22px;border-radius:16px;border:0;background:var(--brand-grad);color:#fff;cursor:pointer;text-align:left;box-shadow:var(--shadow-brand);font-family:inherit;transition:transform .15s ease, filter .15s ease;}

.pa-c:hover{border-color:rgba(var(--ink),.22);}

.pa-c div span{font-size:11.5px;color:var(--text-muted);}

.pa-c.on .pa-ck{background:var(--brand);border-color:var(--brand);} .pa-c.on .pa-ck svg{opacity:1;}
.pa-ver{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .15s ease;}

.pa-f{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}

.pa-info{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:rgba(var(--ink),.04);font-size:13px;color:var(--text-secondary);}

.tb-pres:hover{background:var(--brand);color:#fff;} .tb-pres svg{width:15px;height:15px;}

/* ===== Colaboradores ===== */
.co-top{display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap;}
.co-k{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;flex:1;min-width:280px;}
.co-k div{padding:14px 16px;border-radius:16px;border:1px solid var(--border);background:var(--surface-1);}
.co-k b{display:block;font-size:26px;font-weight:700;letter-spacing:-.03em;color:var(--text-primary);}
.co-k .g b{color:var(--good);}
.co-k span{font-size:11.5px;color:var(--text-muted);}
.co-bar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;}
.co-bar .search-input-wrap{flex:1;min-width:220px;} .co-bar .search-input-wrap input{width:100%;height:38px;}
.co-chips{display:flex;gap:6px;flex-wrap:wrap;}
.co-chips button{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-secondary);font:600 12.5px/1 inherit;font-family:inherit;cursor:pointer;}
.co-chips button i{width:8px;height:8px;border-radius:3px;} .co-chips button em{font-style:normal;color:var(--text-muted);font-weight:500;}
.co-chips button.on{background:var(--text-primary);color:var(--surface-1);border-color:var(--text-primary);} .co-chips button.on em{color:inherit;opacity:.7;}
.co-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
.co-c{position:relative;display:flex;flex-direction:column;gap:12px;text-align:left;padding:16px;border-radius:18px;border:1px solid var(--border);background:var(--surface-1);cursor:pointer;font-family:inherit;color:var(--text-secondary);transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;animation:psUp .45s cubic-bezier(.2,.8,.2,1) both;overflow:hidden;}
.co-c::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cb);}
.co-c:hover{transform:translateY(-3px);border-color:rgba(255,90,31,.4);box-shadow:var(--shadow-md);}
.co-c.vazio{opacity:.72;} .co-c.off{opacity:.5;}
.co-h{display:flex;align-items:center;gap:11px;}
.co-av{width:44px;height:44px;border-radius:13px;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:14px;}
.co-n{flex:1;min-width:0;}
.co-n b{display:block;font-size:14px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.co-n span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.co-n span i{width:7px;height:7px;border-radius:2px;background:var(--cb);flex:none;}
.co-v{width:30px;height:30px;border-radius:9px;background:rgba(var(--ink),.06);display:flex;align-items:center;justify-content:center;flex:none;}
.co-m{display:flex;align-items:baseline;gap:8px;}
.co-m b{font-size:30px;font-weight:700;letter-spacing:-.04em;color:var(--text-primary);} .co-m b.ok{color:var(--good);}

.co-bar2 i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff8a3d,#ff5a1f);}
.co-f{display:flex;gap:12px;font-size:12px;color:var(--text-muted);} .co-f b{color:var(--text-primary);}
.co-sem{font-size:12.5px;color:var(--text-muted);padding:10px 0 4px;}
.co-tag{position:absolute;top:12px;right:12px;font-style:normal;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--warning-bg);color:var(--warning);}
#page-colaboradores{display:flex;flex-direction:column;gap:16px;}
/* perfil: voltar sempre visível */
.pv-volta{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 0;background:linear-gradient(var(--page-plane) 70%, transparent);}

    for (var i=0;i<src.length;i++){
      var r = src[i];
      if (hasWindow && !(r._t>=m.t0 && r._t<=m.t1)) continue;
      if (emp && r.equipe!==emp) continue;
      if (!emp && !inat && r._off) continue;
      if (base && r._areaU!==base) continue;
      out.push(r);
    }
    return out;
  });
}
/* ajustes manuais de produtivas (lançados em Configurações) */
function filterAdjust(f){
  f = f || {};
  var rg = scopeRange(f);
  var hasWindow = !!(rg.from || rg.to);
  var emp = f.employee ? upc(f.employee) : "";
  return SET().manualAdj.filter(function(a){
    if (emp && a.equipe!==emp) return false;
    if (!emp && !f.incluirInativos && isInactive(a.equipe)) return false;
    if (f.base && !matchScope(employeeArea(a.equipe), f.base)) return false;
    if (hasWindow && !inRange(isoToDate(a.date), rg)) return false;
    return true;
  });
}
/* quantidade de OS e de produtivas de um lançamento (aceita o formato antigo qtd/contaOS) */
function adjOS(a){ return a.os!=null ? (+a.os||0) : (a.contaOS ? (+a.qtd||0) : 0); }
function adjProd(a){ return a.prod!=null ? (+a.prod||0) : (+a.qtd||0); }
function adjustTotals(f){
  var prod = 0, os = 0;
  filterAdjust(f).forEach(function(a){ prod += adjProd(a); os += adjOS(a); });
  return { prod: prod, os: os };
}
function countProd(recs){ var n=0; for (var i=0;i<recs.length;i++){ if (recs[i]._cls==="P") n++; } return n; }

function totalOS(f){ return filterRecords(f).length + adjustTotals(f).os; }
function totalProdutivo(f){ return countProd(filterRecords(f)) + adjustTotals(f).prod; }
function pctProdutiva(f){ var t=totalOS(f); return t? totalProdutivo(f)/t : 0; }
function dailyStats(rows){
  var sp=0, np=0, su=0, nu=0, ss=0;
  for (var i=0;i<rows.length;i++){
    var r = rows[i];
    if (r.prim>0){ sp+=r.prim; np++; }
    if (r.ult>0){ su+=r.ult; nu++; }
    if (r.ult>=0.999) ss++;
  }
  return { prim: np? sp/np : null, ult: nu? su/nu : null, semSync: ss, dias: rows.length };
}
function avgPrim(f){ return dailyStats(filterDaily(f)).prim; }
function avgUlt(f){ return dailyStats(filterDaily(f)).ult; }
function countSemSincronizar(f){ return dailyStats(filterDaily(f)).semSync; }
function countWorkdaysRegistrados(f){ return filterDaily(f).length; }
function headcount(f){ return distinctEmployees(f).length; }
function distinctEmployees(f){
  return memo("de|"+fkey(f), function(){
    var set = new Set();
    filterRecords(f).forEach(function(r){ if(r.equipe) set.add(r.equipe); });
    return Array.from(set).sort();
  });
}
/* base mais frequente de cada funcionário em todo o histórico (calculada uma vez) */
function dataAreas(){
  ensurePrepared();
  if (STATE._home) return STATE._home;
  return memo("dataAreas", function(){
    var counts = new Map();
    STATE.records.forEach(function(r){
      if (!r.area) return;
      var c = counts.get(r.equipe); if (!c){ c = {}; counts.set(r.equipe, c); }
      c[r.area] = (c[r.area]||0)+1;
    });
    var out = new Map();
    counts.forEach(function(c, eq){
      var best="", bestC=-1;
      Object.keys(c).forEach(function(a){ if (c[a]>bestC){ bestC=c[a]; best=a; } });
      out.set(eq, best);
    });
    return out;
  });
}
function employeeArea(name){
  var k = upc(name);
  var pi = painelAtivo() ? painelInfo(k) : null;
  return SET().colabBase[k] || (pi && painelBaseNome(pi.base)) || dataAreas().get(k) || "";
}
function networkDays(start, end){
  var d = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  var endD = new Date(end.getFullYear(), end.getMonth(), end.getDate());
  if (d>endD) return 0;
  var count=0;
  while (d<=endD){ var wd=d.getDay(); if (wd!==0 && wd!==6) count++; d.setDate(d.getDate()+1); }
  return count;
}
function monthWorkdaysElapsed(ano, mes, today){
  var monthStart = new Date(ano, mes, 1);
  var monthEnd = new Date(ano, mes+1, 0);
  var isCurrent = today.getFullYear()===ano && today.getMonth()===mes;
  if (isCurrent){
    var lim = today<monthStart? monthStart : (today>monthEnd? monthEnd : today);
    return networkDays(monthStart, lim);
  }
  return networkDays(monthStart, monthEnd);
}
function monthTotalWorkdays(ano, mes){
  return networkDays(new Date(ano,mes,1), new Date(ano,mes+1,0));
}

/* dias úteis do escopo atual: intervalo livre ou mês */
function scopeWorkdays(f, elapsedOnly){
  var rg = scopeRange(f);
  if (!rg.from || !rg.to) return null;
  var today = new Date();
  var end = rg.to;
  if (elapsedOnly && today >= rg.from && today < rg.to) end = today;
  return networkDays(rg.from, end);
}

/* Agregação por funcionário em UMA passada pelos registros do escopo.

function employeeAgg(f){
  var g = Object.assign({}, f, { employee: "", incluirInativos: true });
  return memo("ea|"+fkey(g), function(){
    var map = new Map();
    function get(eq){
      var e = map.get(eq);
      if (!e){ e = { os:0, prod:0, sp:0, np:0, su:0, nu:0, ss:0, dias:0, aProd:0, aOS:0 }; map.set(eq, e); }
      return e;
    }
    filterRecords(g).forEach(function(r){ var e = get(r.equipe); e.os++; if (r._cls==="P") e.prod++; });
    filterDaily(g).forEach(function(d){
      var e = get(d.equipe); e.dias++;
      if (d.prim>0){ e.sp+=d.prim; e.np++; }
      if (d.ult>0){ e.su+=d.ult; e.nu++; }
      if (d.ult>=0.999) e.ss++;
    });
    filterAdjust(g).forEach(function(a){ var e = get(a.equipe); e.aProd += adjProd(a); e.aOS += adjOS(a); });
    return map;
  });
}
function employeeSummary(name, f){
  var e = employeeAgg(f).get(upc(name)) || { os:0, prod:0, sp:0, np:0, su:0, nu:0, ss:0, dias:0, aProd:0, aOS:0 };
  var os = e.os + e.aOS, prod = e.prod + e.aProd;
  return {
    equipe: name,
    area: employeeArea(name),
    manual: { prod: e.aProd, os: e.aOS },
    totalOS: os,
    totalProdutivo: prod,
    pct: os? prod/os : 0,
    mediaPrim: e.np? e.sp/e.np : null,
    mediaUlt: e.nu? e.su/e.nu : null,
    semSync: e.ss,

}

/* Quem entra numa lista de colaboradores. Com base filtrada, entra quem É da base
   (cadastro em Colaboradores ou, sem cadastro, a base mais frequente dele) —
   não quem apenas passou por ela. Os números da pessoa são sempre o total do
   período em QUALQUER região (ver rankingList). */
function employeesForScope(f){
  f = f || {};

    var list = distinctEmployees(Object.assign({}, f, { base:"GERAL" }));
    var base = (f.base && f.base!=="GERAL") ? upc(f.base) : "";
    if (!base) return list;
    return list.filter(function(n){ return upc(employeeArea(n))===base; });

}
/* todas as OS de um colaborador no período, em qualquer região (inclui as ignoradas,
   que aparecem marcadas no painel mas não entram nos totais) */
function employeeOSList(name, f){
  var g = Object.assign({}, f||{}, { base:"GERAL", employee:name, incluirIgnorados:true });
  return filterRecords(g).slice().sort(function(a,b){ return (b._t||0) - (a._t||0); });
}

function scopeSummary(f){
  return memo("ss|"+fkey(f), function(){
    var os = totalOS(f), prod = totalProdutivo(f);
    var hc = headcount(f);
    var wd = scopeWorkdays(f, true);
    var ds = dailyStats(filterDaily(f));
    return {
      totalOS: os,
      totalProdutivo: prod,
      pct: os? prod/os : 0,
      headcount: hc,
      mediaPrim: ds.prim,
      mediaUlt: ds.ult,
      semSync: ds.semSync,
      manual: adjustTotals(f),
      workdaysElapsed: wd,
