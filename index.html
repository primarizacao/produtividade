      mediaExecDiaria: (hc && wd) ? os/hc/wd : 0
    };
  });
}
/* ------------------------------------------------------------------------
   5. IMPORTAÇÃO DE PLANILHAS (estilo Power Query)
   ------------------------------------------------------------------------ */
var HEADER_ALIASES_EXEC = {
  unidade: ["UNIDADE EXECUTANTE","UNIDADE"],
  numOS: ["NUMERO OS","NUMERO DA OS","NUM OS","N OS","OS NUMERO"],
  resultado: ["RESULTADO"],
  equipe: ["EQUIPE"],
  dataInicio: ["DATA INICIO EXECUCAO","DATA DE INICIO EXECUCAO","INICIO EXECUCAO","DATA INICIO"],
  dataFim: ["DATA FIM EXECUCAO","DATA DE FIM EXECUCAO","FIM EXECUCAO","DATA FIM"]
};
var HEADER_ALIASES_BANCO = {
  nome: ["NOME"],
  base: ["EQUIPE","BASE","UNIDADE"],
  data: ["DATA"],
  prim: ["PRIM EXEC","1A EXEC BRUT","1 EXEC BRUT","PRIMEIRA EXECUCAO","1A EXECUCAO"],
  ult: ["ULT EXEC","ULT EXE BRUT","ULTIMA EXECUCAO"]
};

function findHeaderMap(headerRow, aliasSet){
  var normed = headerRow.map(normHeader);
  var map = {};
  Object.keys(aliasSet).forEach(function(field){
    var aliases = aliasSet[field];
    var foundIdx = -1;
    // 1) exact match
    for (var i=0;i<normed.length;i++){
      if (aliases.indexOf(normed[i])!==-1){ foundIdx = i; break; }
    }
    // 2) "resultado" precisa não casar com "codigo resultado"
    if (foundIdx===-1 && field==="resultado"){
      for (var j=0;j<normed.length;j++){
        if (normed[j]==="RESULTADO"){ foundIdx=j; break; }
      }
    }
    // 3) contains fallback
    if (foundIdx===-1){
      for (var k=0;k<normed.length;k++){
        for (var a=0;a<aliases.length;a++){
          if (normed[k].indexOf(aliases[a])!==-1){ foundIdx=k; break; }
        }
        if (foundIdx!==-1) break;
      }
    }
    map[field] = foundIdx;
  });
  return map;
}

/* coluna com o TIPO da OS (ex.: Restabelecimento, Religação, Corte...).
   Ordem: nome definido em Configurações > nomes conhecidos > qualquer coluna de
   "tipo"/"serviço" que não seja unidade, código ou resultado. */
var TIPO_ALIASES = ["DESCRICAO TSS","DESCRICAO DO TSS","DESCRICAO DA TSS","DESC TSS","TSS DESCRICAO","TIPO OS","TIPO DE OS","TIPO DA OS","TIPO SERVICO","TIPO DE SERVICO","TIPO DO SERVICO",
  "DESCRICAO SERVICO","DESCRICAO DO SERVICO","DESCRICAO TIPO SERVICO","DESCRICAO TIPO OS","DESCRICAO OS","DESCRICAO DA OS",
  "SERVICO","SERVICO EXECUTADO","SERVICO SOLICITADO","NATUREZA SERVICO","NATUREZA DO SERVICO","NATUREZA",
  "ESPECIFICACAO SERVICO","ESPECIFICACAO","TIPO"];
function findTipoCol(headerRow, map){
  var normed = headerRow.map(function(h){ return normHeader(h).replace(/[^A-Z0-9 ]+/g," ").replace(/\s+/g," ").trim(); });
  var usados = {}; Object.keys(map).forEach(function(k){ if (map[k]>=0) usados[map[k]] = 1; });
  var livre = function(i){ return !usados[i]; };
  var custom = (STATE.settings && STATE.settings.colunaTipo) ? normHeader(STATE.settings.colunaTipo) : "";
  if (custom){
    // aceita a letra da coluna (ex.: "E") ou o nome do cabeçalho
    if (/^[A-Z]{1,2}$/.test(custom)){ var ix = 0; for (var L=0;L<custom.length;L++) ix = ix*26 + (custom.charCodeAt(L)-64); return ix-1; }
    for (var c=0;c<normed.length;c++) if (normed[c]===custom) return c;
  }
  for (var a=0;a<TIPO_ALIASES.length;a++){ for (var i=0;i<normed.length;i++) if (livre(i) && normed[i]===TIPO_ALIASES[a]) return i; }
  var ruim = /UNIDADE|RESULTADO|CODIGO|COD |NUMERO|DATA|EQUIPE/;
  for (var j=0;j<normed.length;j++){
    var h = normed[j];
    if (!livre(j) || ruim.test(h)) continue;
    if (/\bTIPO\b/.test(h) || /SERVICO/.test(h) || /\bTSS\b/.test(h)) return j;
  }
  for (var k=0;k<normed.length;k++){ if (livre(k) && /COD(IGO)? (DO )?SERVICO|COD(IGO)? TIPO/.test(normed[k])) return k; }
  return -1;
}

/* ---------- colunas de localização (itinerário) ---------- */
function colPorNomeOuLetra(normed, custom){
  if (!custom) return -1;
  custom = normHeader(custom).replace(/[^A-Z0-9 ]+/g," ").replace(/\s+/g," ").trim();
  if (/^[A-Z]{1,2}$/.test(custom)){ var ix = 0; for (var L=0;L<custom.length;L++) ix = ix*26 + (custom.charCodeAt(L)-64); return (ix-1) < normed.length ? ix-1 : -1; }
  for (var c=0;c<normed.length;c++) if (normed[c]===custom) return c;
  return -1;
}
function findGeoCols(headerRow, map){
  var normed = headerRow.map(function(h){ return normHeader(h).replace(/[^A-Z0-9 ]+/g," ").replace(/\s+/g," ").trim(); });
  var S0 = STATE.settings || {};
  var padrao = function(k, L){ return S0[k]!=null ? S0[k] : L; };
  var usados = {}; Object.keys(map).forEach(function(k){ if (map[k]>=0) usados[map[k]] = 1; });
  var acha = function(custom, exatos, regex, evita){
    var c = colPorNomeOuLetra(normed, custom); if (c>=0) return c;
    for (var a=0;a<exatos.length;a++) for (var i=0;i<normed.length;i++) if (!usados[i] && normed[i]===exatos[a]) return i;
    for (var j=0;j<normed.length;j++) if (!usados[j] && regex.test(normed[j]) && !(evita && evita.test(normed[j]))) return j;
    return -1;
  };
  var g = {};
  g.lat = acha(S0.colunaLat, ["LATITUDE","LAT","LATITUDE EXECUCAO","LATITUDE DA EXECUCAO","LAT EXECUCAO","LATITUDE GPS","LATITUDE IMOVEL","LATITUDE DO IMOVEL"], /\bLAT(ITUDE)?\b/);
  if (g.lat>=0) usados[g.lat] = 1;
  g.lng = acha(S0.colunaLng, ["LONGITUDE","LONG","LNG","LON","LONGITUDE EXECUCAO","LONGITUDE DA EXECUCAO","LONG EXECUCAO","LONGITUDE GPS","LONGITUDE IMOVEL","LONGITUDE DO IMOVEL"], /\bLONG?(ITUDE)?\b|\bLNG\b/);
  if (g.lng>=0) usados[g.lng] = 1;
  g.coord = (g.lat<0 || g.lng<0) ? acha("", ["COORDENADA","COORDENADAS","COORDENADAS GPS","GEOLOCALIZACAO","LAT LONG","LATLONG","GPS"], /COORDENADA|GEOLOC|LAT ?LONG/) : -1;
  if (g.coord>=0) usados[g.coord] = 1;
  g.tlog = acha("", ["TIPO LOGRADOURO","TIPO DO LOGRADOURO","TP LOGRADOURO","TIPO LOGR"], /^T(IPO|P) (DO )?LOGR/);
  if (g.tlog>=0) usados[g.tlog] = 1;
  g.end = acha(padrao("colunaEnd","L"), ["ENDERECO","ENDERECO COMPLETO","ENDERECO DO IMOVEL","ENDERECO IMOVEL","ENDERECO DA OS","ENDERECO OS","ENDERECO DO CLIENTE","ENDERECO CLIENTE",
      "ENDERECO DA LIGACAO","ENDERECO LIGACAO","ENDERECO EXECUCAO","ENDERECO DE EXECUCAO","ENDERECO INSTALACAO","ENDERECO DE INSTALACAO","ENDERECO SERVICO",
      "LOGRADOURO","NOME LOGRADOURO","NOME DO LOGRADOURO","DESCRICAO LOGRADOURO","DESC LOGRADOURO","RUA","LOCALIZACAO","LOCAL","LOCAL DA OS","LOCAL EXECUCAO"], /ENDERE|LOGRAD/, /CEP|COMPLEMENTO|NUMERO|^TIPO/);
  if (g.end>=0) usados[g.end] = 1;
  g.num = g.end>=0 ? acha(padrao("colunaNum","M"), ["NUMERO IMOVEL","NUMERO DO IMOVEL","NUM IMOVEL","NR IMOVEL","N IMOVEL","NRO IMOVEL","NUMERO LOGRADOURO","NUMERO DO LOGRADOURO","NUMERO ENDERECO","NRO","NR","NUM","NUMERO"], /NUMERO (DO )?(IMOVEL|LOGRADOURO|ENDERECO)|^NRO|^NR/) : -1;
  if (g.num>=0) usados[g.num] = 1;
  g.bairro = acha(padrao("colunaBairro","O"), ["BAIRRO","NOME BAIRRO","BAIRRO IMOVEL","DESCRICAO BAIRRO"], /BAIRRO/);
  if (g.bairro>=0) usados[g.bairro] = 1;
  g.cidade = acha(padrao("colunaCidade","K"), ["MUNICIPIO","CIDADE","MUNICIPIO IMOVEL","NOME MUNICIPIO","DESCRICAO MUNICIPIO"], /MUNICIPIO|^CIDADE/);
  if (g.cidade>=0) usados[g.cidade] = 1;
  g.cep = acha("", ["CEP","CEP IMOVEL","CEP DO IMOVEL"], /\bCEP\b/);
  var nm = function(i){ return i>=0 ? String(headerRow[i]||"").trim() || ("coluna "+String.fromCharCode(65+i%26)) : ""; };
  g.nomes = { lat: nm(g.lat), lng: nm(g.lng), coord: nm(g.coord), end: nm(g.end), num: nm(g.num), bairro: nm(g.bairro), cidade: nm(g.cidade) };
  return g;
}
/* aceita -23.55, "-23,55", -235500000 (escala) e "−23,55; −46,63" */
function numGeo(v){
  if (v==null || v==="") return null;
  var n = typeof v==="number" ? v : parseFloat(String(v).replace(/\s/g,"").replace(/[−–]/g,"-").replace(",","."));
  if (!isFinite(n) || n===0) return null;
  return n;
}
function ajustaGeo(lat, lng){
  if (lat==null || lng==null) return null;
  var escala = function(v, lim){ var k = 0; while (Math.abs(v) > lim && k < 9){ v /= 10; k++; } return v; };
  lat = escala(lat, 90); lng = escala(lng, 180);
  // Brasil: latitude entre -35 e 6, longitude entre -75 e -30 — se vier invertido, troca
  var ok = function(a, b){ return a>=-35 && a<=6 && b>=-75 && b<=-30; };
  if (!ok(lat, lng) && ok(lng, lat)){ var t = lat; lat = lng; lng = t; }
  if (Math.abs(lat)>90 || Math.abs(lng)>180) return null;
  return [Math.round(lat*1e6)/1e6, Math.round(lng*1e6)/1e6];
}
function geoDaLinha(row, g){
  var p = null;
  if (g.lat>=0 && g.lng>=0) p = ajustaGeo(numGeo(row[g.lat]), numGeo(row[g.lng]));
  if (!p && g.coord>=0 && row[g.coord]!=null){
    var m = String(row[g.coord]).replace(/[−–]/g,"-").match(/(-?\d+(?:[.,]\d+)?)\s*[;,| ]\s*(-?\d+(?:[.,]\d+)?)/);
    if (m) p = ajustaGeo(numGeo(m[1]), numGeo(m[2]));
  }
  var end = "", tx = function(i){ return (i>=0 && row[i]!=null) ? String(row[i]).replace(/\s+/g," ").trim() : ""; };
  // coluna "coordenadas" que na verdade traz o endereço
  if (!p && g.coord>=0 && g.end<0 && /[A-Za-zÀ-ú]{3}/.test(tx(g.coord))) end = tx(g.coord);
  if (g.end>=0 && tx(g.end)){
    end = tx(g.end);
    if (tx(g.tlog) && up(end).indexOf(up(tx(g.tlog)))!==0) end = tx(g.tlog) + " " + end;
    var nn = tx(g.num).replace(/\.0+$/,"").replace(/^0+(?=\d)/,"");
    if (nn && nn!=="0" && end.indexOf(nn)===-1) end += ", " + nn;
    if (tx(g.bairro)) end += " - " + tx(g.bairro);
    if (tx(g.cidade)) end += " - " + tx(g.cidade);
  }
  if (end && tx(g.cep) && end.indexOf(tx(g.cep))===-1) end += " - CEP " + tx(g.cep);
  return { lat: p ? p[0] : null, lng: p ? p[1] : null, endereco: end };
}

function findHeaderRow(rows, aliasSet, maxScan){
  maxScan = maxScan || 10;
  var best = 0, bestScore = -1;
  for (var i=0;i<Math.min(maxScan, rows.length);i++){
    var normed = (rows[i]||[]).map(normHeader);
    var score = 0;
    Object.keys(aliasSet).forEach(function(field){
      var aliases = aliasSet[field];
      for (var k=0;k<normed.length;k++){
        if (aliases.indexOf(normed[k])!==-1){ score++; break; }
      }
    });
    if (score > bestScore){ bestScore = score; best = i; }
  }
  return { rowIndex: best, score: bestScore };
}

function pickBestSheet(workbook, preferKeyword){
  var names = workbook.SheetNames;
  if (preferKeyword){
    var kw = normHeader(preferKeyword);
    for (var i=0;i<names.length;i++){ if (normHeader(names[i]).indexOf(kw)!==-1) return names[i]; }
  }
  // senão, escolhe a aba com mais linhas
  var bestName = names[0], bestRows = -1;
  names.forEach(function(n){
    var ws = workbook.Sheets[n];
    var ref = ws["!ref"];
    if (!ref) return;
    var range = XLSX.utils.decode_range(ref);
    var rows = range.e.r - range.s.r;
    if (rows > bestRows){ bestRows = rows; bestName = n; }
  });
  return bestName;
}

function parseWorkbookExecucao(workbook, fileName){
  var sheetName = pickBestSheet(workbook, "execu");
  var ws = workbook.Sheets[sheetName];
  var rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:"" });
  var hr = findHeaderRow(rows, HEADER_ALIASES_EXEC);
  if (hr.score < 3){
    return { error: "Não encontramos as colunas esperadas (Unidade Executante, Número OS, Resultado, Equipe, Data Início/Fim Execução) na planilha \""+fileName+"\"." };
  }
  var map = findHeaderMap(rows[hr.rowIndex], HEADER_ALIASES_EXEC);
  var missing = [];
  ["unidade","numOS","resultado","equipe","dataInicio"].forEach(function(f){ if (map[f]===-1) missing.push(f); });
  if (missing.length){
    return { error: "Colunas obrigatórias não encontradas em \""+fileName+"\": "+missing.join(", ") };
  }
  var tipoIdx = findTipoCol(rows[hr.rowIndex], map);
  var gmap = Object.assign({}, map); if (tipoIdx>=0) gmap.__tipo = tipoIdx;
  var geo = findGeoCols(rows[hr.rowIndex], gmap);
  var out = [];
  for (var i=hr.rowIndex+1; i<rows.length; i++){
    var row = rows[i];
    if (!row || !row.length) continue;
    var equipeVal = row[map.equipe];
    if (equipeVal==null || String(equipeVal).trim()==="") continue;
    var gl = geoDaLinha(row, geo);
    var rec = buildRecord({
      lat: gl.lat, lng: gl.lng, endereco: gl.endereco,
      unidade: row[map.unidade],
      numOS: row[map.numOS],
      tipo: tipoIdx>=0 ? row[tipoIdx] : "",
      resultado: row[map.resultado],
      equipe: equipeVal,
      dataInicio: parseExcelValueToDate(row[map.dataInicio]),
      dataFim: map.dataFim!==-1 ? parseExcelValueToDate(row[map.dataFim]) : null
    });
    if (!rec.dataInicio) continue;
    out.push(rec);
  }
  return { records: out, sheetName: sheetName, tipoCol: tipoIdx>=0 ? String(rows[hr.rowIndex][tipoIdx]) : "", geo: geo.nomes,
           cabecalho: (rows[hr.rowIndex]||[]).map(function(c){ return c==null ? "" : String(c).trim(); }),
           comGeo: out.filter(function(r){ return r.lat!=null; }).length, comEnd: out.filter(function(r){ return r.endereco; }).length };
}

function parseWorkbookBanco(workbook, fileName){
  var sheetName = pickBestSheet(workbook, "banco");
  var ws = workbook.Sheets[sheetName];
  var rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:"" });
  var hr = findHeaderRow(rows, HEADER_ALIASES_BANCO);
  if (hr.score < 3){
    return { error: "Não encontramos as colunas esperadas (NOME, EQUIPE, DATA, PRIM EXEC, ULT EXEC) na planilha \""+fileName+"\"." };
  }
  var map = findHeaderMap(rows[hr.rowIndex], HEADER_ALIASES_BANCO);
  var missing = [];
  ["nome","data","prim","ult"].forEach(function(f){ if (map[f]===-1) missing.push(f); });
  if (missing.length){
    return { error: "Colunas obrigatórias não encontradas em \""+fileName+"\": "+missing.join(", ") };
  }
  var out = [];
  for (var i=hr.rowIndex+1;i<rows.length;i++){
    var row = rows[i];
    if (!row || !row.length) continue;
    var nome = row[map.nome];
    if (nome==null || String(nome).trim()==="") continue;
    var dataVal = parseExcelValueToDate(row[map.data]);
    if (!dataVal) continue;
    var primFrac = excelValueToFrac(row[map.prim]);
    var ultFrac = excelValueToFrac(row[map.ult]);
    var baseVal = map.base!==-1 ? row[map.base] : "";
    out.push({
      equipe: up(nome),
      area: titleCase(baseVal||""),
      day: dateKey(dataVal),
      ano: dataVal.getFullYear(),
      mes: dataVal.getMonth(),
      prim: primFrac,
      ult: ultFrac
    });
  }
  return { rows: out, sheetName: sheetName };
}

function excelValueToFrac(v){
  if (v==null || v==="") return 0;
  if (typeof v === "number") return v % 1;
  var d = parseExcelValueToDate(v);
  if (d) return timeFraction(d);
  return 0;
}

function readFileAsArrayBuffer(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){ resolve(e.target.result); };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

/* Carrega o leitor de Excel só quando precisa (antes: ~900 KB baixados toda vez que o painel abria) */
var XLSX_URL = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
var xlsxPromise = null;
var XLSX_STATUS = "idle"; // idle | loading | ok | fail
function loadXLSX(){
  if (typeof XLSX !== "undefined"){ XLSX_STATUS = "ok"; return Promise.resolve(true); }
  if (xlsxPromise) return xlsxPromise;
  XLSX_STATUS = "loading";
  xlsxPromise = new Promise(function(resolve){
    var s = document.createElement("script");
    s.src = XLSX_URL; s.async = true;
    s.onload = function(){ XLSX_STATUS = (typeof XLSX!=="undefined") ? "ok" : "fail"; resolve(XLSX_STATUS==="ok"); };
    s.onerror = function(){ XLSX_STATUS = "fail"; xlsxPromise = null; resolve(false); };
    document.head.appendChild(s);
  });
  return xlsxPromise;
}

var importing = false;
function importFiles(fileList, type){
  var files = Array.from(fileList || []);
  if (!files.length) return;
  if (importing){ toast("Aguarde — ainda estou importando os arquivos anteriores.", "err"); return; }
  importing = true;
  setImportBusy(true, "Preparando leitor de planilhas…");
  var chain = loadXLSX();
  files.forEach(function(file, i){
    chain = chain.then(function(){
      setImportBusy(true, "Lendo "+(i+1)+" de "+files.length+": "+file.name);
      return new Promise(function(res){ setTimeout(res, 30); }).then(function(){ return importOneFile(file, type); });
    });
  });
  chain.catch(function(e){ if (window.console) console.error(e); }).then(function(){
    recomputeDailyAgg();
    saveImportedFilesMeta();
    importing = false;
    setImportBusy(false);
    window.__APP__.rebuildFilterOptions();
    try { if (window.__APP_UI__ && window.__APP_UI__.nomesPosImport) window.__APP_UI__.nomesPosImport(); } catch(e){}
    window.__APP__.renderAll();
  });
}
function setImportBusy(on, msg){
  var el = document.getElementById("importBusy");
  if (!el) return;
  el.style.display = on ? "flex" : "none";
  var t = document.getElementById("importBusyMsg"); if (t && msg) t.textContent = msg;
}

function importOneFile(file, type){
  var sig = fileSignature(file);
  if (STATE.fileSignatures.has(sig) && type!=="execucao"){
    var proceed = window.confirm("O arquivo \""+file.name+"\" (mesmo nome e tamanho) já foi importado antes.\n\nImportar novamente pode duplicar registros. Deseja importar mesmo assim?");
    if (!proceed){ toast("Arquivo \""+file.name+"\" ignorado (já importado).", "ok"); return Promise.resolve(); }
  }
  if (typeof XLSX === "undefined"){
    toast("O leitor de planilhas não carregou (precisa de internet na primeira importação). Os dados já salvos continuam funcionando.", "err");
    return Promise.resolve();
  }
  return readFileAsArrayBuffer(file).then(function(buf){
    var workbook;
    try{
      workbook = XLSX.read(buf, { type:"array", cellDates:true });
    } catch(e){
      toast("Não foi possível ler o arquivo \""+file.name+"\".", "err");
      return;
    }
    if (type==="execucao"){
      var res = parseWorkbookExecucao(workbook, file.name);
      if (res.error){ toast(res.error, "err"); return; }
      // Cada linha da planilha de Execução é uma visita/execução distinta — inclusive
      // quando o mesmo Número OS aparece mais de uma vez (reagendamentos, novas
      // tentativas). Por isso NÃO removemos linhas por número de OS: todas contam,
      // exatamente como as fórmulas da planilha original fazem.
      /* A mesma linha (mesma OS, mesmo colaborador, mesmo início) já importada
         antes não é duplicada — só recebe o que faltava, como o tipo da OS. */
      var ex = new Map();
      STATE.records.forEach(function(r){ ex.set(r.numOS+"|"+r.equipe+"|"+(r.dataInicio?r.dataInicio.getTime():""), r); });
      var novos = [], repetidos = 0, completados = 0;
      res.records.forEach(function(r){
        var k = r.numOS+"|"+r.equipe+"|"+(r.dataInicio?r.dataInicio.getTime():"");
        var old = ex.get(k);
        if (old){
          repetidos++;
          var mudou = false;
          if (!old.tipo && r.tipo){ old.tipo = r.tipo; mudou = true; }
          if (old.lat==null && r.lat!=null){ old.lat = r.lat; old.lng = r.lng; mudou = true; }
          if (r.endereco && r.endereco!==old.endereco){
            old.endereco = r.endereco; mudou = true;
            if (old.geoAprox){ old.lat = null; old.lng = null; old.geoAprox = 0; }
          }
          if (mudou) completados++;
          return;
        }
        ex.set(k, r); novos.push(r);
      });
      STATE.records = STATE.records.concat(novos);
      try { idbSetMeta("lastHeaders", { cols: res.cabecalho, arquivo: file.name, em: Date.now() }); } catch(e){}
      if (novos.length) persistNewRecords(novos);
      if (completados){ compactDB(); if (typeof bumpData==="function") bumpData(); }
      STATE.fileSignatures.add(sig);
      STATE.importedFiles.push({ id: nextFileId++, name:file.name, type:"execucao", rows: res.records.length, added: novos.length, skipped: repetidos, date: new Date(), sig: sig });
      toast("Importado \""+file.name+"\": "+fmtInt(novos.length)+" execuções novas"
        + (repetidos ? ", "+fmtInt(repetidos)+" já existiam" : "")
        + (completados ? " (dados completados em "+fmtInt(completados)+")" : "") + "."
        + (res.comGeo ? " Localização em "+fmtInt(res.comGeo)+" OS." : (res.comEnd ? " Endereço em "+fmtInt(res.comEnd)+" OS ("+[res.geo.end,res.geo.num,res.geo.bairro,res.geo.cidade].filter(Boolean).join(" + ")+")." : " Endereço não encontrado na planilha."))
        + (res.tipoCol ? " Tipo de OS lido da coluna \""+res.tipoCol+"\"." : " Coluna de tipo de OS não encontrada — defina o nome em Configurações."), res.tipoCol ? "ok" : "err");
    } else {
      var res2 = parseWorkbookBanco(workbook, file.name);
      if (res2.error){ toast(res2.error, "err"); return; }
      var added2=0, skipped2=0, newB=[];
      res2.rows.forEach(function(b){
        var key = b.equipe+"|"+b.day;
        if (STATE.bancoSeen.has(key)){ skipped2++; return; }
        STATE.bancoSeen.add(key);
        STATE.bancoRows.push(b);
        newB.push(b);
        added2++;
      });
      persistNewBanco(newB);
      STATE.fileSignatures.add(sig);
      STATE.importedFiles.push({ id: nextFileId++, name:file.name, type:"banco", rows: res2.rows.length, added: added2, skipped: skipped2, date: new Date(), sig: sig });
      toast("Banco de Horários \""+file.name+"\": "+fmtInt(added2)+" novos dias"+(skipped2?", "+fmtInt(skipped2)+" já existentes ignorados":"")+".", "ok");
    }
  });
}

function saveImportedFilesMeta(){
  idbSetMeta("importedFiles", STATE.importedFiles.map(function(f){ return Object.assign({}, f, { date: f.date.getTime() }); }));
}

function removeImportedFile(id){
  STATE.importedFiles = STATE.importedFiles.filter(function(f){ return f.id!==id; });
  saveImportedFilesMeta();
  toast("Removido da lista. Os registros já importados continuam no painel — use \"Limpar todos os dados\" para reiniciar do zero.", "ok");
  if (window.__APP_UI__) window.__APP_UI__.renderCurrentPage();
}

function clearAllData(){
  STATE.records = []; STATE.fileSignatures = new Set();
  STATE.bancoRows = []; STATE.bancoSeen = new Set();
  STATE.dailyAgg = []; STATE.importedFiles = [];
  bumpData();
  idbClearAll().then(function(){
    return saveSettings();   // configurações (bases, resultados, lançamentos) são preservadas
  }).then(function(){
    window.__APP__.rebuildFilterOptions();
    window.__APP__.renderAll();
    toast("Dados apagados. Suas configurações foram mantidas.", "ok");
  });
}

/* ------------------------------------------------------------------------
   6. CARREGAR DADOS PERSISTIDOS AO ABRIR
   ------------------------------------------------------------------------ */
function loadPersisted(){
  return Promise.all([
    idbGetAll("records"),
    idbGetAll("banco"),
    idbGetMeta("importedFiles"),
    loadSettings()
  ]).then(function(results){
    var rr = fromStore(results[0], deserializeRecord);
    var bb = fromStore(results[1], deserializeBanco);
    var recs = rr.rows, banco = bb.rows;
    var files = results[2] || [];
    /* banco gravado no formato antigo (1 item por linha): converte para blocos em segundo plano */
    if (rr.legacy + bb.legacy > 0){
      setTimeout(function(){ compactDB().then(function(){ if (window.console) console.info("Banco interno convertido para blocos compactos."); }); }, 1500);
    }
    STATE.records = recs;
    STATE.bancoRows = banco;
    banco.forEach(function(b){ STATE.bancoSeen.add(b.equipe+"|"+b.day); });
    STATE.importedFiles = files.map(function(f){ return Object.assign({}, f, { date: new Date(f.date) }); });
    STATE.importedFiles.forEach(function(f){ if (f.sig) STATE.fileSignatures.add(f.sig); });
    nextFileId = STATE.importedFiles.reduce(function(m,f){ return Math.max(m, f.id+1); }, 1);
    recomputeDailyAgg();
  });
}

/* resultados distintos encontrados nas planilhas (e os cadastrados à mão), com contagem e estado atual */
function distinctResultados(){
  return memo("distRes", function(){
    ensurePrepared();
    var map = new Map();
    STATE.records.forEach(function(r){
      var k = r._rk;
      var e = map.get(k);
      if (!e){ e = { resultado: r.resultado || "(vazio)", key:k, total:0 }; map.set(k, e); }
      e.total++;
    });
    /* resultados cadastrados manualmente que ainda não apareceram nas planilhas */
    Object.keys(SET().resultRules).forEach(function(k){
      if (!map.has(k)) map.set(k, { resultado: k, key:k, total:0, cadastrado:true });
    });
    var out = Array.from(map.values());
    out.forEach(function(e){
      var rule = SET().resultRules[e.key];
      e.padrao = classificacao(e.resultado)==="PRODUTIVO" ? "P" : "N";
      e.estado = rule || e.padrao;
      e.explicito = !!rule && rule!==e.padrao;
    });
    out.sort(function(a,b){ return b.total - a.total || String(a.resultado).localeCompare(String(b.resultado)); });
    return out;
  });
}
function allEmployees(){
  return memo("allEmp", function(){
    var set = new Set();
    STATE.records.forEach(function(r){ if (r.equipe) set.add(r.equipe); });
    Object.keys(SET().colabBase).forEach(function(k){ set.add(k); });
    return Array.from(set).sort();
  });
}
function employeeBaseFromData(name){ return dataAreas().get(upc(name)) || ""; }
function recordsPerEmployee(){
  return memo("recPerEmp", function(){
    var c = {};
    STATE.records.forEach(function(r){ c[r.equipe] = (c[r.equipe]||0)+1; });
    return c;
  });
}
function dataStats(){
  return memo("dataStats", function(){
    var min = Infinity, max = -Infinity, emp = new Set();
    STATE.records.forEach(function(r){
      if (r.equipe) emp.add(r.equipe);
      if (r.dataInicio){ var t = r.dataInicio.getTime(); if (t<min) min=t; if (t>max) max=t; }
    });
    var dias = new Set(); STATE.bancoRows.forEach(function(b){ dias.add(b.equipe+"|"+b.day); });
    return { minD: isFinite(min)? new Date(min):null, maxD: isFinite(max)? new Date(max):null, employees: emp.size, bancoDias: dias.size };
  });
}
function montarBackup(){
  return {
    tipo: "painel-execucao-backup",
    versao: 1,
    gerado: new Date().toISOString(),
    settings: JSON.parse(JSON.stringify(STATE.settings)),
    records: STATE.records.map(serializeRecord),
    banco: STATE.bancoRows.map(serializeBanco),
    importedFiles: STATE.importedFiles.map(function(f){ return Object.assign({}, f, { date: f.date.getTime() }); })
  };
}
function exportBackup(){
  var payload = {
    tipo: "painel-execucao-backup",
    versao: 1,
    gerado: new Date().toISOString(),
    settings: STATE.settings,
    records: STATE.records.map(serializeRecord),
    banco: STATE.bancoRows.map(serializeBanco),
    importedFiles: STATE.importedFiles.map(function(f){ return Object.assign({}, f, { date: f.date.getTime() }); })
  };
  var blob = new Blob([JSON.stringify(payload)], { type:"application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "painel-execucao-backup-" + dateToISO(new Date()) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
}
function importBackup(file){
  return file.text().then(function(txt){ return aplicarBackup(JSON.parse(txt)); });
}
function aplicarBackup(data){
  return Promise.resolve().then(function(){
    if (!data || data.tipo!=="painel-execucao-backup") throw new Error("Arquivo de backup inválido.");
    STATE.records = (data.records||[]).map(deserializeRecord);
    STATE.bancoRows = (data.banco||[]).map(deserializeBanco);
    STATE.bancoSeen = new Set(); STATE.bancoRows.forEach(function(b){ STATE.bancoSeen.add(b.equipe+"|"+b.day); });
    STATE.importedFiles = (data.importedFiles||[]).map(function(f){ return Object.assign({}, f, { date:new Date(f.date) }); });
    STATE.fileSignatures = new Set(); STATE.importedFiles.forEach(function(f){ if (f.sig) STATE.fileSignatures.add(f.sig); });
    if (data.settings) STATE.settings = Object.assign(STATE.settings, data.settings);
    STATE.filters.metaPct = STATE.settings.metaPct;
    recomputeDailyAgg();
    return Promise.all([
      compactDB(),
      saveSettings(),
      idbSetMeta("importedFiles", STATE.importedFiles.map(function(f){ return Object.assign({}, f, { date:f.date.getTime() }); }))
    ]);
  });
}

window.__APP__ = {

  BASE_COLORS: BASE_COLORS, BASE_COLORS_HEX: BASE_COLORS_HEX,
  up: up, titleCase: titleCase, esc: esc, initials: initials, fmtInt: fmtInt, fmtPct: fmtPct, fracToHHMM: fracToHHMM,
  fmtDateBR: fmtDateBR, fmtDateTimeBR: fmtDateTimeBR, debounce: debounce,
  totalOS: totalOS, totalProdutivo: totalProdutivo, pctProdutiva: pctProdutiva,
  avgPrim: avgPrim, avgUlt: avgUlt, countSemSincronizar: countSemSincronizar,
  countWorkdaysRegistrados: countWorkdaysRegistrados, headcount: headcount,
  distinctEmployees: distinctEmployees, employeeArea: employeeArea,
  networkDays: networkDays, monthWorkdaysElapsed: monthWorkdaysElapsed, monthTotalWorkdays: monthTotalWorkdays,
  employeeSummary: employeeSummary, scopeSummary: scopeSummary,
  employeesForScope: employeesForScope, employeeOSList: employeeOSList,
  importFiles: importFiles, removeImportedFile: removeImportedFile, clearAllData: clearAllData,
  loadPersisted: loadPersisted, toast: toast, montarBackup: montarBackup, aplicarBackup: aplicarBackup, setNuvemHook: function(fn){ NUVEM_HOOK = fn; }, recomputeDailyAgg: recomputeDailyAgg, normKey: normKey, nomeScore: nomeScore, osKey: osKey, painelCfg: painelCfg, painelAtivo: painelAtivo, painelIdx: painelIdx, painelInfo: painelInfo, painelBaseNome: painelBaseNome, nomeMap: nomeMap, pdaNomes: pdaNomes, pdaAtrib: pdaAtrib, nomesPlanilha: nomesPlanilha, resolveNome: resolveNome, filterRecords: filterRecords, filterDaily: filterDaily,
  effClass: effClass, recArea: recArea, colabBaseOf: colabBaseOf, isInactive: isInactive,
  scopeRange: scopeRange, scopeWorkdays: scopeWorkdays, isoToDate: isoToDate, dateToISO: dateToISO,
  dayKeyToDate: dayKeyToDate, saveSettings: saveSettings, distinctResultados: distinctResultados,
  allEmployees: allEmployees, employeeBaseFromData: employeeBaseFromData,
  filterAdjust: filterAdjust, adjustTotals: adjustTotals, adjOS: adjOS, adjProd: adjProd,
  exportBackup: exportBackup, importBackup: importBackup, classificacao: classificacao,
  recomputeDailyAgg: recomputeDailyAgg,
  memo: memo, fkey: fkey, bumpData: bumpData, ensurePrepared: ensurePrepared, resKey: resKey,
  recordsPerEmployee: recordsPerEmployee, dataStats: dataStats, loadXLSX: loadXLSX,
  xlsxStatus: function(){ return XLSX_STATUS; }, isImporting: function(){ return importing; },
  compactDB: compactDB, storageInfo: storageInfo, requestPersist: requestPersist, idbGetMeta: idbGetMeta, idbSetMeta: idbSetMeta
};

})();

  resClasse: "todos",
  resBusca: "",
  resSelecionado: "",
  periodsList: []
};

/* ========================================================================
   GRÁFICOS EM SVG (sem dependência externa)
   ======================================================================== */
var CHART_REG = {};
var PAL = { grid:"rgba(var(--ink),0.08)", axis:"rgba(var(--ink),0.42)", text:"rgba(var(--ink),0.6)",
            good:"#ff5a1f", bad:"var(--np)", brand:"#ff5a1f", warn:"#ff9a1f", info:"#94a3b8" };

function drawChart(id, drawFn){
  CHART_REG[id] = drawFn;
  redrawChart(id, true);
}
function redrawChart(id, animar){
  var el = document.getElementById(id);
  if (!el || !CHART_REG[id]) return;
  var w = Math.max(220, Math.round(el.clientWidth || el.parentNode.clientWidth || 520));
  try { el.innerHTML = CHART_REG[id](w); if (typeof FX!=="undefined") FX.chart(el, !!animar); }
  catch(e){ el.innerHTML = '<div class="empty-state" style="padding:18px;">Não foi possível desenhar este gráfico.</div>'; }
}
function redrawAllCharts(){ Object.keys(CHART_REG).forEach(function(id){ redrawChart(id, false); }); }
function resetCharts(){ CHART_REG = {}; }

function niceMax(v){
  if (!isFinite(v) || v<=0) return 4;
  var mag = Math.pow(10, Math.floor(Math.log10(v)));
  var n = v/mag;
  var step = n<=1?1:(n<=2?2:(n<=2.5?2.5:(n<=5?5:10)));
  return step*mag;
}
function svgOpen(w,h){ return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="display:block;overflow:visible;">'; }
function txt(x,y,s,opt){
  opt = opt||{};
  return '<text x="'+x+'" y="'+y+'" fill="'+(opt.fill||PAL.axis)+'" font-size="'+(opt.size||11)+'"'
    + ' font-weight="'+(opt.weight||500)+'" text-anchor="'+(opt.anchor||"start")+'"'
    + ' font-family="inherit"'+(opt.extra||"")+'>'+esc(s)+'</text>';
}
function roundRectTop(x,y,w,h,r){
  if (h<=0) return "";
  r = Math.min(r, w/2, h);
  return '<path d="M'+x+' '+(y+h)+' L'+x+' '+(y+r)+' Q'+x+' '+y+' '+(x+r)+' '+y
       + ' L'+(x+w-r)+' '+y+' Q'+(x+w)+' '+y+' '+(x+w)+' '+(y+r)+' L'+(x+w)+' '+(y+h)+' Z"';
}

/* linha suave (Catmull-Rom → Bézier) */
function smoothPath(pts){
  if (!pts.length) return "";
  if (pts.length===1) return "M"+pts[0][0]+" "+pts[0][1];
  var d = "M"+pts[0][0].toFixed(1)+" "+pts[0][1].toFixed(1);
  for (var i=0;i<pts.length-1;i++){
    var p0 = pts[i-1]||pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2]||p2, t = 0.18;
    var c1 = [p1[0]+(p2[0]-p0[0])*t, p1[1]+(p2[1]-p0[1])*t], c2 = [p2[0]-(p3[0]-p1[0])*t, p2[1]-(p3[1]-p1[1])*t];
    d += " C"+c1[0].toFixed(1)+" "+c1[1].toFixed(1)+" "+c2[0].toFixed(1)+" "+c2[1].toFixed(1)+" "+p2[0].toFixed(1)+" "+p2[1].toFixed(1);
  }
  return d;
}
function gridLine(x1, y, x2){ return '<line class="cg" x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="rgba(var(--ink),0.16)" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="0.5 6"/>'; }
function pill(x, y, s, cor, anchor){
  var w = String(s).length*6.3 + 12, x0 = anchor==="end" ? x-w : (anchor==="start" ? x : x-w/2);
  return '<g class="cv"><rect x="'+x0.toFixed(1)+'" y="'+(y-14)+'" width="'+w.toFixed(1)+'" height="18" rx="6" fill="'+(cor||"var(--pill-bg)")+'"/>'
    + '<text x="'+(x0+w/2).toFixed(1)+'" y="'+(y-1.5)+'" fill="'+((cor==="var(--np)")?"var(--surface-1)":"#fff")+'" font-size="10.5" font-weight="700" text-anchor="middle" font-family="inherit">'+esc(s)+'</text></g>';
}
function pill(x, y, s, cor, anchor){
  var w = String(s).length*6.6 + 12, x0 = anchor==="end" ? x-w : (anchor==="start" ? x : x-w/2);
  return '<g class="cv"><rect x="'+x0.toFixed(1)+'" y="'+(y-14)+'" width="'+w.toFixed(1)+'" height="19" rx="9.5" fill="'+(cor||"var(--pill-bg)")+'" opacity=".94"/>'
    + '<text x="'+(x0+w/2).toFixed(1)+'" y="'+(y-1)+'" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" font-family="inherit">'+esc(s)+'</text></g>';
}

/* Barras empilhadas (produtivo x não produtivo por dia) + linha opcional de % */
var CHART_UID = 0;
function gradDef(id, cor, o1, o2, horiz){
  return '<linearGradient id="'+id+'" x1="0" y1="0" x2="'+(horiz?1:0)+'" y2="'+(horiz?0:1)+'"><stop offset="0" stop-color="'+cor+'" stop-opacity="'+o1+'"/><stop offset="1" stop-color="'+cor+'" stop-opacity="'+o2+'"/></linearGradient>';
}
function chartStacked(w, o){
  var h = o.height||260, temL = !!o.line, padL=34, padR=temL?38:6, padT=temL?24:18, padB=26;
  var n = o.labels.length;
  if (!n) return '<div class="empty-state" style="padding:20px;">Sem dados no período.</div>';
  var iw = Math.max(40, w-padL-padR), ih = h-padT-padB;
  var totals = o.labels.map(function(_,i){ return o.series.reduce(function(a,s){ return a+(s.data[i]||0); },0); });
  var max = niceMax(Math.max.apply(null, totals.concat([1]))*(n<=14?1.14:1.04));
  var step = iw/n, bw = Math.max(3, Math.min(n<=8 ? 30 : 14, step*0.42)), uid = "cs"+(++CHART_UID);
  var out = svgOpen(w,h);
  if (temL) out += '<defs>'+gradDef(uid+"a", o.line.color, .26, 0)+'</defs>';
  for (var g=0; g<=4; g++){
    var yy = padT + ih - (ih*g/4);
    out += gridLine(padL, yy, padL+iw) + txt(padL-8, yy+3.5, fmtInt(Math.round(max*g/4)), {anchor:"end", size:10, extra:' class="ct"'});
    if (temL) out += txt(padL+iw+8, yy+3.5, (25*g)+"%", {size:10, fill:o.line.color, extra:' class="ct"'});
  }
  o.labels.forEach(function(lb, i){
    var x = padL + step*i + (step-bw)/2, acc = 0;
    var partes = o.series.map(function(s){ return s.name+": "+fmtInt(s.data[i]||0); });
    var tip = lb+" — "+fmtInt(totals[i])+" OS · "+partes.join(" · ")+(temL && o.line.data[i]!=null ? " · "+o.line.name+": "+o.line.fmt(o.line.data[i]) : "");
    out += '<rect class="col-hit" x="'+(padL+step*i)+'" y="'+padT+'" width="'+step+'" height="'+ih+'" rx="6" fill="transparent"><title>'+esc(tip)+'</title></rect>';
    out += '<rect class="trk" x="'+x+'" y="'+padT+'" width="'+bw+'" height="'+ih+'" rx="'+(bw/2)+'" fill="rgba(var(--ink),0.035)" style="pointer-events:none"/>';
    var segs = o.series.filter(function(s){ return (s.data[i]||0) > 0; });
    o.series.forEach(function(s, si){
      var v = s.data[i]||0; if (v<=0) return;
      var bh = ih*v/max, y = padT + ih - acc - bh, topo = s===segs[segs.length-1], base = s===segs[0];
      var gap = (!base && bh > 5) ? 2 : 0;
      var r = Math.min(bw/2, Math.max(0,(bh-gap)/2));
      var yy = y, hh = Math.max(0.5, bh-gap);
      out += '<rect x="'+x+'" y="'+yy.toFixed(1)+'" width="'+bw+'" height="'+hh.toFixed(1)+'" rx="'+r.toFixed(1)+'" fill="'+s.color+'" style="pointer-events:none"/>';
      acc += bh;
    });
    if (n<=14 && totals[i]) out += txt(x+bw/2, padT+ih-acc-7, fmtInt(totals[i]), {anchor:"middle", size:10.5, weight:700, fill:"var(--text-primary)", extra:' class="cv"'});
    var showLabel = n<=16 || (i%Math.ceil(n/16)===0);
    if (showLabel) out += txt(padL+step*i+step/2, h-8, lb, {anchor:"middle", size:10, extra:' class="ct"'});
  });
  if (temL){
    var pts = [];
    o.line.data.forEach(function(v, i){ if (v!=null && totals[i]) pts.push([padL+step*i+step/2, padT + ih - ih*Math.max(0, Math.min(1, v))]); });
    if (pts.length > 1){
      var d = smoothPath(pts);
      out += '<path class="fx-area" d="'+d+' L'+pts[pts.length-1][0].toFixed(1)+' '+(padT+ih)+' L'+pts[0][0].toFixed(1)+' '+(padT+ih)+' Z" fill="url(#'+uid+'a)" style="pointer-events:none"/>';
      out += '<path class="cline" d="'+d+'" fill="none" stroke="'+o.line.color+'" stroke-width="2.2" stroke-linecap="round" style="pointer-events:none"/>';
    }
    if (pts.length){ var lp = pts[pts.length-1];
      out += '<circle class="cdot" cx="'+lp[0].toFixed(1)+'" cy="'+lp[1].toFixed(1)+'" r="4" fill="'+o.line.color+'" stroke="var(--surface-1)" stroke-width="2.5" style="pointer-events:none"/>'; }
  }
  return out + '</svg>';
}

/* Rosca com segmentos arredondados */
function chartDonut(w, o){
  var h = o.height||200;
  var total = o.items.reduce(function(a,b){ return a+b.value; },0);
  var size = Math.min(w, h), cx = w/2, cy = h/2, R = size/2-8, N = size>=190 ? 64 : 52;
  var esp = Math.max(11, size*0.1), r1 = R-esp, tw = Math.max(2.4, 2*Math.PI*r1/N*0.46);
  var out = svgOpen(w,h);
  out += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(R+5)+'" fill="none" stroke="rgba(var(--ink),0.08)" stroke-width="1" stroke-dasharray="1 4" stroke-linecap="round"/>';
  out += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r1-9)+'" fill="none" stroke="rgba(var(--ink),0.06)" stroke-width="1"/>';
  var vis = o.items.filter(function(i){ return i.value>0; }), cum = [], c = 0;
  vis.forEach(function(it){ c += total ? it.value/total : 0; cum.push(c); });
  var atual = -1, aberto = false;
  for (var k=0; k<N; k++){
    var fr = (k+0.5)/N, idx = -1;
    for (var j=0;j<cum.length;j++){ if (fr <= cum[j] + 1e-9){ idx = j; break; } }
    if (idx!==atual){
      if (aberto) out += '</g>';
      atual = idx; aberto = true;
      var it = vis[idx];
      out += '<g class="cseg">' + (it ? '<title>'+esc(it.label+": "+fmtInt(it.value)+" ("+((it.value/total)*100).toFixed(1).replace(".",",")+"%)")+'</title>' : '');
    }
    var a = -Math.PI/2 + (k+0.5)*2*Math.PI/N, ca = Math.cos(a), sa = Math.sin(a);
    var cor = vis[idx] ? vis[idx].color : "rgba(var(--ink),0.08)";
    out += '<line class="dtk" x1="'+(cx+ca*r1).toFixed(1)+'" y1="'+(cy+sa*r1).toFixed(1)+'" x2="'+(cx+ca*R).toFixed(1)+'" y2="'+(cy+sa*R).toFixed(1)+'" stroke="'+cor+'" stroke-width="'+tw.toFixed(1)+'" stroke-linecap="round" style="animation-delay:'+(k*9)+'ms"/>';
  }
  if (aberto) out += '</g>';
  out += txt(cx, cy+5, o.centerBig||"", {anchor:"middle", size:Math.round(Math.max(20, size*0.15)), weight:700, fill:"var(--text-primary)", extra:' class="cv" letter-spacing="-1"'});
  out += txt(cx, cy+23, o.centerSub||"", {anchor:"middle", size:10.5, weight:600, extra:' class="ct" letter-spacing=".5"'});
  return out + '</svg>';
}

/* Barras verticais com linha de meta */
function chartBarsTarget(w, o){
  var h = o.height||240, padL=36, padR=8, padT=24, padB=30;
  var n = o.items.length;
  if (!n) return '<div class="empty-state" style="padding:20px;">Sem dados no período.</div>';
  var iw = Math.max(40, w-padL-padR), ih = h-padT-padB;
  var max = o.max!=null ? o.max : niceMax(Math.max.apply(null, o.items.map(function(i){return i.value;}).concat([1]))*1.12);
  var step = iw/n, bw = Math.max(8, Math.min(26, step*0.3));
  var out = svgOpen(w,h);
  for (var g=0; g<=4; g++){
    var yy = padT + ih - (ih*g/4);
    out += gridLine(padL, yy, padL+iw) + txt(padL-8, yy+3.5, Math.round(max*g/4)+(o.suffix||""), {anchor:"end", size:10, extra:' class="ct"'});
  }
  o.items.forEach(function(it, i){
    var x = padL + step*i + (step-bw)/2;
    var bh = Math.max(bw, ih*Math.min(it.value,max)/max);
    var y = padT + ih - bh;
    out += '<rect class="trk" x="'+x+'" y="'+padT+'" width="'+bw+'" height="'+ih+'" rx="'+(bw/2)+'" fill="rgba(var(--ink),0.04)"/>';
    out += '<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="'+(bw/2)+'" fill="'+it.color+'"><title>'+esc(it.label+": "+(o.fmt?o.fmt(it.value):it.value))+'</title></rect>';
    out += txt(x+bw/2, y-8, (o.fmt?o.fmt(it.value):it.value), {anchor:"middle", size:11, weight:700, fill:"var(--text-primary)", extra:' class="cv"'});
    out += txt(padL+step*i+step/2, h-10, it.label, {anchor:"middle", size:10.5, weight:600, fill:"var(--text-secondary)", extra:' class="ct"'});
  });
  if (o.target!=null && o.target<=max){
    var ty = padT + ih - ih*o.target/max;
    out += '<line class="cg" x1="'+padL+'" y1="'+ty+'" x2="'+(padL+iw)+'" y2="'+ty+'" stroke="#ff5a1f" stroke-opacity=".8" stroke-width="1.4" stroke-dasharray="4 4"/>';
    out += pill(padL+iw, ty-4, "meta "+o.target+(o.suffix||""), "#ff5a1f", "end");
  }
  return out + '</svg>';
}

/* Barras horizontais */
function chartHBars(w, o){
  var n = o.items.length;
  if (!n) return '<div class="empty-state" style="padding:20px;">Sem dados no período.</div>';
  var rowH = o.rowH||32, padT=6, padB=6, labelW = Math.min(160, Math.max(90, Math.round(w*0.28)));
  var h = padT+padB + rowH*n;
  var iw = Math.max(40, w-labelW-70);
  var vals = o.items.map(function(i){ return i.value; });
  var dMin = o.min!=null ? o.min : 0;
  var dMax = o.max!=null ? o.max : niceMax(Math.max.apply(null, vals.concat([1])));
  if (o.auto && vals.length){
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var pad = Math.max((hi-lo)*0.35, 0.012);
    dMin = Math.max(0, lo-pad); dMax = hi+pad*0.4;
  }
  var span = (dMax-dMin) || 1;
  var out = svgOpen(w,h);
  var maxChars = Math.max(8, Math.floor((labelW-14)/6.3));
  o.items.forEach(function(it,i){
    var y = padT + rowH*i;
    var bh = Math.max(6, Math.min(9, rowH-20));
    var bw = iw*Math.max(0, Math.min(it.value,dMax)-dMin)/span;
    var lb = String(it.label);
    var lbCurto = lb.length>maxChars ? lb.slice(0, maxChars-1)+"…" : lb;
    var yb = y+(rowH-bh)/2, cor = it.color||PAL.brand, wb = Math.max(bh,bw);
    out += '<g><title>'+esc(lb+": "+(it.text!=null?it.text:it.value))+'</title>'
         + txt(labelW-12, y+rowH/2+4, lbCurto, {anchor:"end", size:12, fill:"var(--text-secondary)", weight:500, extra:' class="ct"'})+'</g>';
    out += '<rect class="trk" x="'+labelW+'" y="'+yb+'" width="'+iw+'" height="'+bh+'" rx="'+(bh/2)+'" fill="rgba(var(--ink),0.06)"/>';
    out += '<rect x="'+labelW+'" y="'+yb+'" width="'+wb+'" height="'+bh+'" rx="'+(bh/2)+'" fill="'+cor+'">'
         + '<title>'+esc(it.label+": "+(it.text||it.value))+'</title></rect>';
    out += '<circle class="cdot" cx="'+(labelW+wb-bh/2).toFixed(1)+'" cy="'+(yb+bh/2)+'" r="'+(bh/2+2.5)+'" fill="'+cor+'" stroke="var(--surface-1)" stroke-width="2.5" style="pointer-events:none"/>';
    out += txt(labelW+wb+10, y+rowH/2+4, it.text!=null?it.text:it.value, {size:11.5, weight:700, fill:"var(--text-primary)", extra:' class="cv"'});
  });
  return out + '</svg>';
}

/* Comparação lado a lado (um par de barras por indicador) */
function chartPairs(w, o){
  var rowH = 54, padT = 6;
  var h = padT + rowH*o.metrics.length + 6;
  var labelW = Math.min(170, Math.max(100, Math.round(w*0.3)));
  var iw = Math.max(40, w-labelW-64);
  var out = svgOpen(w,h);
  o.metrics.forEach(function(m,i){
    var y = padT + rowH*i;
    var max = Math.max(m.a, m.b, 0.0001);
    out += txt(labelW-12, y+rowH/2+3, m.label, {anchor:"end", size:12, weight:600, fill:"var(--text-primary)", extra:' class="ct"'});
    [[m.a, o.colors[0], o.names[0], 0], [m.b, o.colors[1], o.names[1], 1]].forEach(function(pair, k){
      var bh = 9, yy = y + 13 + k*17;
      var bw = Math.max(bh, iw*pair[0]/max);
      out += '<rect class="trk" x="'+labelW+'" y="'+yy+'" width="'+iw+'" height="'+bh+'" rx="4.5" fill="rgba(var(--ink),0.06)"/>';
      out += '<rect x="'+labelW+'" y="'+yy+'" width="'+bw+'" height="'+bh+'" rx="4.5" fill="'+pair[1]+'">'
           + '<title>'+esc(pair[2]+" — "+m.label+": "+m.fmt(pair[0]))+'</title></rect>';
      out += txt(labelW+bw+8, yy+bh-0.5, m.fmt(pair[0]), {size:11, weight:700, fill:"var(--text-secondary)", extra:' class="cv"'});
    });
  });
  return out + '</svg>';
}
function chartLegend(items){
  return '<div class="legend-row" style="justify-content:center;">'
    + items.map(function(i){ return '<div class="legend-item"><span class="legend-swatch" style="background:'+i.color+';"></span>'+esc(i.label)+'</div>'; }).join("")
    + '</div>';
}

/* ========================================================================
   FILTROS GLOBAIS (topbar)
   ======================================================================== */
function rebuildFilterOptions(){
  var set = new Map();
  STATE.records.forEach(function(r){
    if (r.ano==null || r.mes==null) return;
    set.set(r.ano+"-"+r.mes, { ano:r.ano, mes:r.mes });
  });
  var list = Array.from(set.values()).sort(function(a,b){ return (a.ano-b.ano) || (a.mes-b.mes); });
  UI.periodsList = list;

  var sel = document.getElementById("filterPeriodo");
  var prev = STATE.filters.ano!=null ? STATE.filters.ano+"-"+STATE.filters.mes : null;
  if (!list.length){
    sel.innerHTML = '<option value="">Sem dados</option>';
    sel.disabled = true;
    STATE.filters.ano = null; STATE.filters.mes = null;
  } else {
    sel.disabled = false;
    sel.innerHTML = (list.length>1 ? '<option value="ALL">TODOS OS MESES ('+list.length+')</option>' : '') + list.map(function(p){
      return '<option value="'+p.ano+'-'+p.mes+'">'+MESES[p.mes]+"/"+p.ano+"</option>";
    }).join("");
    var stillValid = prev && list.some(function(p){ return (p.ano+"-"+p.mes)===prev; });
    var chosen = stillValid ? prev : (list[list.length-1].ano+"-"+list[list.length-1].mes);
    sel.value = chosen;
    var parts = chosen.split("-");
    STATE.filters.ano = +parts[0]; STATE.filters.mes = +parts[1];
    if (STATE.filters.todos && list.length>1) sel.value = "ALL"; else STATE.filters.todos = false;
  }

  var basesPresent = basesComDados();
  var selB = document.getElementById("filterBase");
  var prevB = STATE.filters.base;
  selB.innerHTML = ['<option value="GERAL">GERAL (todas as bases)</option>']
    .concat(basesPresent.map(function(b){ return '<option value="'+esc(b)+'">'+esc(b)+"</option>"; }))
    .join("");
  selB.value = basesPresent.indexOf(prevB)!==-1 || prevB==="GERAL" ? prevB : "GERAL";
  STATE.filters.base = selB.value;

  syncRangeInputs();
}
function basesComDados(){
  return A.memo("basesComDados", function(){
    A.ensurePrepared();
    var set = new Set();
    STATE.records.forEach(function(r){ set.add(r._area); });
    return BASE_ORDER.filter(function(b){ return set.has(b); });
  });
}
function syncRangeInputs(){
  var fi = document.getElementById("filterFrom"), ti = document.getElementById("filterTo");
  if (fi) fi.value = STATE.filters.from || "";
  if (ti) ti.value = STATE.filters.to || "";
  var chip = document.getElementById("rangeChip");
  if (chip) chip.style.display = (STATE.filters.from || STATE.filters.to) ? "inline-flex" : "none";
  var per = document.getElementById("filterPeriodo");
  if (per) per.style.opacity = (STATE.filters.from || STATE.filters.to) ? ".55" : "1";
}
function currentFilter(extra){
  var fr = STATE.filters.from, to = STATE.filters.to;
  if (!fr && !to && STATE.filters.todos && UI.periodsList && UI.periodsList.length){
    var p0 = UI.periodsList[0], p1 = UI.periodsList[UI.periodsList.length-1];
    fr = dateToISO(new Date(p0.ano, p0.mes, 1)); to = dateToISO(new Date(p1.ano, p1.mes+1, 0));
  }
  return Object.assign({
    ano: STATE.filters.ano, mes: STATE.filters.mes, base: STATE.filters.base,
    from: fr, to: to
  }, extra||{});
}
function rangeAtivo(){ return !!(STATE.filters.from || STATE.filters.to); }
function periodLabel(){
  if (rangeAtivo()){
    var f = STATE.filters.from ? fmtDateBR(isoToDate(STATE.filters.from)) : "início";
    var t = STATE.filters.to ? fmtDateBR(isoToDate(STATE.filters.to)) : "hoje";
    return f + " – " + t;
  }
  if (STATE.filters.ano==null) return "—";

var SEM_DADOS_OK = { importar:1, config:1, colaboradores:1 };
function renderCurrentPage(){
  resetCharts();
  var page = STATE.currentPage;
  /* esvazia as páginas escondidas: menos elementos na tela = painel mais leve,
     e evita que duas páginas tenham elementos com o mesmo id */
  document.querySelectorAll(".page").forEach(function(p){ if (p.id!=="page-"+page && p.firstChild) p.innerHTML = ""; });

      + '<div class="ic">'+IC('alert','i-xl')+'</div>'

      + '<div style="font-size:12.5px;">'+esc(e && e.message ? e.message : String(e))+'</div></div></div>';

   ======================================================================== */
function diasDoEscopo(f){
  var rg = scopeRange(f);
  if (!rg.from) return [];
  var end = rg.to || new Date();
  var out = [], d = new Date(rg.from.getFullYear(), rg.from.getMonth(), rg.from.getDate());
  var guard = 0;
  while (d <= end && guard++ < 400){ out.push(new Date(d)); d.setDate(d.getDate()+1); }
  return out;
}
function serieDiaria(f){
  var dias = diasDoEscopo(f);
  var idx = {}, prod = [], nao = [], labels = [];
  var mesmoMes = dias.length>0 && dias[0].getMonth()===dias[dias.length-1].getMonth();
  dias.forEach(function(d,i){
    idx[dateToISO(d)] = i;
    labels.push(mesmoMes ? String(d.getDate()) : (d.getDate()+"/"+(d.getMonth()+1)));
    prod.push(0); nao.push(0);
  });
  A.filterRecords(f).forEach(function(r){
    if (!r.dataInicio) return;
    var i = idx[dateToISO(r.dataInicio)];
    if (i==null) return;
    if (effClass(r)==="PRODUTIVO") prod[i]++; else nao[i]++;
  });
  /* lançamentos manuais somam no gráfico por dia junto com as OS importadas */
  A.filterAdjust(f).forEach(function(a){
    var i = idx[a.date];
    if (i==null) return;
    var p = A.adjProd(a), o = A.adjOS(a);
    prod[i] += p; nao[i] += Math.max(0, o - p);
  });
  return { labels:labels, prod:prod, nao:nao };
}

/* Radar com anéis circulares: o.axes [rótulos], o.series [{name,color,values(0..1),raw[]}] */
function chartRadar(w, o){
  var h = o.height||300, n = o.axes.length, uid = "rd"+(++CHART_UID);
  var cx = w/2, cy = h/2 + 2, R = Math.min(w*0.5 - 74, h/2 - 30);
  if (R < 40) R = 40;
  var ang = function(i){ return -Math.PI/2 + i*2*Math.PI/n; };
  var P = function(i, v){ return [cx + Math.cos(ang(i))*R*v, cy + Math.sin(ang(i))*R*v]; };
  var out = svgOpen(w, h) + '<defs>';
  o.series.forEach(function(s, si){ out += '<radialGradient id="'+uid+si+'" cx="'+cx+'" cy="'+cy+'" r="'+R+'" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="'+s.color+'" stop-opacity=".04"/><stop offset="1" stop-color="'+s.color+'" stop-opacity="'+(o.series.length>2?.22:.38)+'"/></radialGradient>'; });
  out += '</defs>';
  out += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(R+10)+'" fill="none" stroke="rgba(var(--ink),.07)" stroke-dasharray="0.5 5" stroke-linecap="round" stroke-width="1.4"/>';
  for (var k=1; k<=4; k++){
    out += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(R*k/4).toFixed(1)+'" fill="none" stroke="rgba(var(--ink),'+(k===4?.13:.07)+')" stroke-width="1"'+(k<4?' stroke-dasharray="2 4"':'')+'/>';
  }
  for (var i=0;i<n;i++){
    var e = P(i, 1), lp = P(i, 1.16), a = Math.cos(ang(i));
    out += '<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'" stroke="rgba(var(--ink),.07)"/>';
    out += '<circle cx="'+e[0].toFixed(1)+'" cy="'+e[1].toFixed(1)+'" r="2" fill="rgba(var(--ink),.25)"/>';
    out += txt(lp[0], lp[1]+4, o.axes[i], { anchor: Math.abs(a)<0.2 ? "middle" : (a>0 ? "start" : "end"), size:10.5, weight:600, extra:' class="ct"' });
  }
  o.series.forEach(function(s, si){
    var pts = s.values.map(function(v, i){ return P(i, Math.max(0.04, Math.min(1, v||0))); });
    var d = pts.map(function(p){ return p[0].toFixed(1)+","+p[1].toFixed(1); }).join(" ");
    out += '<g class="fx-pop" style="transform-origin:'+cx+'px '+cy+'px;animation-delay:'+(si*0.12)+'s">'
      + '<polygon class="cline" points="'+d+'" fill="url(#'+uid+si+')" stroke="'+s.color+'" stroke-width="1.8" stroke-linejoin="round"/>';
    pts.forEach(function(p, i){
      out += '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.2" fill="'+s.color+'" stroke="var(--surface-1)" stroke-width="2" data-tip="'+esc(s.name+" · "+o.axes[i]+": "+(s.raw?s.raw[i]:Math.round(s.values[i]*100)+"%"))+'"/>';
    });
    out += '</g>';
  });
  return out + '</svg>';
}
/* Área polar: cada fatia com raio pela quantidade, anéis e marcações */
function chartPolar(w, o){
  var h = o.height||260, size = Math.min(w, h), cx = size/2, cy = h/2, R = size/2 - 18, uid = "pl"+(++CHART_UID);
  var it = o.items.filter(function(x){ return x.value>0; }), n = it.length;
  var out = svgOpen(size, h);
  if (!n) return out + '</svg>';
  var max = Math.max.apply(null, it.map(function(x){ return x.value; }));
  out += '<defs>' + it.map(function(x, i){ return '<radialGradient id="'+uid+i+'" cx="'+cx+'" cy="'+cy+'" r="'+R+'" gradientUnits="userSpaceOnUse"><stop offset=".15" stop-color="'+x.color+'" stop-opacity=".25"/><stop offset="1" stop-color="'+x.color+'" stop-opacity=".95"/></radialGradient>'; }).join("") + '</defs>';
  for (var t=0;t<72;t++){
    var a = t*Math.PI/36, r0 = R+7, r1 = R+(t%6===0?13:10);
    out += '<line x1="'+(cx+Math.cos(a)*r0).toFixed(1)+'" y1="'+(cy+Math.sin(a)*r0).toFixed(1)+'" x2="'+(cx+Math.cos(a)*r1).toFixed(1)+'" y2="'+(cy+Math.sin(a)*r1).toFixed(1)+'" stroke="rgba(var(--ink),'+(t%6===0?.28:.12)+')" stroke-width="1.2" stroke-linecap="round"/>';
  }
  for (var k=1;k<=4;k++) out += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(R*k/4).toFixed(1)+'" fill="none" stroke="rgba(var(--ink),'+(k===4?.12:.06)+')"'+(k<4?' stroke-dasharray="2 4"':'')+'/>';
  var step = 2*Math.PI/n, gap = n>1 ? 0.03 : 0;
  it.forEach(function(x, i){
    var r = R*(0.25 + 0.75*Math.sqrt(x.value/max)), a0 = -Math.PI/2 + i*step + gap, a1 = -Math.PI/2 + (i+1)*step - gap;
    var p0 = [cx+Math.cos(a0)*r, cy+Math.sin(a0)*r], p1 = [cx+Math.cos(a1)*r, cy+Math.sin(a1)*r];
    var d = "M"+cx+","+cy+" L"+p0[0].toFixed(1)+","+p0[1].toFixed(1)+" A"+r.toFixed(1)+","+r.toFixed(1)+" 0 "+((a1-a0)>Math.PI?1:0)+" 1 "+p1[0].toFixed(1)+","+p1[1].toFixed(1)+" Z";
    out += '<path class="fx-pop" style="transform-origin:'+cx+'px '+cy+'px;animation-delay:'+(i*0.05)+'s" d="'+d+'" fill="url(#'+uid+i+')" stroke="var(--surface-1)" stroke-width="2" data-tip="'+esc(x.label+": "+fmtInt(x.value)+(o.total?" ("+fmtPct(x.value/o.total)+")":""))+'"/>';
    out += '<path d="M'+p0[0].toFixed(1)+','+p0[1].toFixed(1)+' A'+r.toFixed(1)+','+r.toFixed(1)+' 0 '+((a1-a0)>Math.PI?1:0)+' 1 '+p1[0].toFixed(1)+','+p1[1].toFixed(1)+'" fill="none" stroke="'+x.color+'" stroke-width="2.5" stroke-linecap="round" style="pointer-events:none"/>';
  });
  out += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(R*0.22).toFixed(1)+'" fill="var(--surface-1)" stroke="rgba(var(--ink),.1)"/>';
  out += txt(cx, cy+4, o.center||"", { anchor:"middle", size:13, weight:800, fill:"var(--text-primary)", extra:' class="cv"' });
  return out + '</svg>';
}
function renderDashRadar(f){
  var bases = basesComDados();
  var gs = bases.map(function(b){ return grupoStats(f, b); });
  var ax = [
    ["% Produtiva", function(g){ return g.pct; }, true, function(v){ return fmtPct(v); }],
    ["OS / colab.", function(g){ return g.osPessoa; }, true, function(v){ return fmtInt(Math.round(v)); }],
    ["Prod. / dia", function(g){ return g.prodDia; }, true, function(v){ return v==null?"—":v.toFixed(1).replace(".",","); }],
    ["OS / dia", function(g){ return g.execDia; }, true, function(v){ return v==null?"—":v.toFixed(1).replace(".",","); }],
    ["Bateram meta", function(g){ return g.pctBateram; }, true, function(v){ return fmtPct(v); }],
    ["Início cedo", function(g){ return g.mediaPrim; }, false, function(v){ return fracToHHMM(v); }],
    ["Sincronismo", function(g){ return g.semSyncPessoa; }, false, function(v){ return v==null?"—":v.toFixed(1).replace(".",",")+" sem sinc."; }]
  ];
  var series = gs.map(function(g){
    var vals = ax.map(function(a){
      var v = a[1](g); if (v==null) return 0;
      var todos = gs.map(function(x){ return a[1](x); }).filter(function(x){ return x!=null; });
      if (a[2]){ var mx = Math.max.apply(null, todos); return mx>0 ? v/mx : 0; }
      var mn = Math.min.apply(null, todos), mxx = Math.max.apply(null, todos);
      if (a[0]==="Sincronismo") return mxx>0 ? 1 - 0.75*(v/mxx) : 1;
      return v>0 ? (mn/v) : 1;
    });
    return { name:g.nome, color:BASE_COLORS_HEX[g.nome] || "#94a3b8", values:vals, raw: ax.map(function(a){ return a[3](a[1](g)); }) };
  });
  drawChart("chartRadar", function(w){ return chartRadar(w, { height:300, axes: ax.map(function(a){ return a[0]; }), series: series }); });
  document.getElementById("radarLeg").innerHTML = series.map(function(s){ return '<span><i style="background:'+s.color+'"></i>'+esc(s.name)+'</span>'; }).join("");

  var cont = {}, cls = {}, tot = 0;
  A.filterRecords(f).forEach(function(r){ var k = titleCase(r.resultado || "Sem resultado"); cont[k] = (cont[k]||0)+1; cls[k] = r._cls; tot++; });
  var ks = Object.keys(cont).sort(function(a,b){ return cont[b]-cont[a]; });
  var CP = ["#ff5a1f","#ff7a2f","#ff9a4a","#ffb224","#ffc866"], CN = ["var(--np)","rgba(var(--ink),.62)","rgba(var(--ink),.42)"], CX = ["rgba(var(--ink),.24)","rgba(var(--ink),.18)","rgba(var(--ink),.14)"];
  var ip = 0, inn = 0, ix = 0;
  var itens = ks.slice(0, 8).map(function(k){
    var c = cls[k]==="P" ? CP[ip++ % CP.length] : cls[k]==="N" ? CN[inn++ % CN.length] : CX[ix++ % CX.length];
    return { label:k, value:cont[k], color:c };
  });
  if (ks.length > 8) itens.push({ label:"Outros", value: ks.slice(8).reduce(function(a,k){ return a+cont[k]; },0), color:"rgba(var(--ink),.12)" });
  drawChart("chartPolar", function(w){ return chartPolar(Math.min(w, 250), { height:250, items:itens, total:tot, center:fmtInt(tot) }); });
  document.getElementById("polarLeg").innerHTML = itens.map(function(it){
    return '<div><i style="background:'+it.color+'"></i><span>'+esc(it.label)+'</span><b>'+fmtInt(it.value)+'</b><em>'+fmtPct(tot?it.value/tot:0)+'</em></div>';
  }).join("") || '<div class="empty-state">Sem dados.</div>';
}

function kpiTicks(vals, destaque){

  var mx = Math.max.apply(null, vals.concat([1e-9]));
  return '<div class="kticks">'+vals.map(function(v, i){
    var h = v>0 ? Math.max(10, Math.round(v/mx*100)) : 6;
    return '<span class="'+(v>0 ? (i===destaque ? "hi" : "on") : "")+'" style="--h:'+h+'%;animation-delay:'+(i*14)+'ms"></span>';
  }).join("")+'</div>';
}
function kpiSeg(frac, n){
  n = n||20; var k = Math.round(Math.max(0, Math.min(1, frac||0))*n), out = "";
  for (var i=0;i<n;i++) out += '<span class="'+(i<k?"on":"")+'"></span>';
  return '<div class="kseg">'+out+'</div>';
}
function decorarKpisDashboard(f, serie, s){
  var ks = document.querySelectorAll("#page-dashboard .grid-kpi .kpi");
  if (ks.length < 4 || !serie) return;
  var tot = serie.prod.map(function(p, i){ return p + serie.nao[i]; });
  var ultimo = -1; tot.forEach(function(v, i){ if (v>0) ultimo = i; });
  ks[0].insertAdjacentHTML("beforeend", kpiTicks(tot, ultimo));
  ks[1].insertAdjacentHTML("beforeend", kpiTicks(serie.prod, ultimo));
  ks[2].insertAdjacentHTML("beforeend", kpiSeg(s.pct / Math.max(0.01, metaPct()/100), 20));

/* Lista por colaborador: a base do filtro escolhe QUEM aparece; o total de cada
   pessoa soma todas as OS dela no período, independente da região onde atuou. */
/* ===================== COMPARAÇÃO DE PERÍODOS ===================== */
var CMP_OPCOES = [
  ["mesmoDia",   "Mês anterior · mesmo período", "Mesmos dias do mês anterior (ex.: 1 a 9 contra 1 a 9)"],
  ["mesInteiro", "Mês anterior completo",        "Período atual contra o mês anterior inteiro"],
  ["anoAnterior","Ano anterior · mesmo período", "Mesmos dias, um ano antes"],
  ["media3",     "Média de 3 meses",             "Média dos mesmos dias nos 3 meses anteriores"],
  ["nenhum",     "Sem comparação",               ""]
];
function cmpModo(){
  try { var m = localStorage.getItem("cmpModo"); if (CMP_OPCOES.some(function(o){ return o[0]===m; })) return m; } catch(e){}
  return "mesmoDia";
}
function cmpSetModo(m){ try { localStorage.setItem("cmpModo", m); } catch(e){} renderDashboard(); }
function addMeses(d, k){ var y = d.getFullYear(), m = d.getMonth()+k, ult = new Date(y, m+1, 0).getDate(); return new Date(y, m, Math.min(d.getDate(), ult)); }
function ultimoDiaMes(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0); }
function ehUltimoDia(d){ return d.getDate()===ultimoDiaMes(d).getDate(); }
function ddmm(d){ return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0"); }
function faixaTxt(a, b){ return ddmm(a)+(a.getTime()===b.getTime() ? "" : " – "+ddmm(b))+(a.getFullYear()!==new Date().getFullYear() || b.getFullYear()!==a.getFullYear() ? "/"+String(b.getFullYear()).slice(2) : ""); }
/* período atual efetivo: mês em andamento vai só até hoje */
function cmpCorte(f){
  var rg = scopeRange(f); if (!rg.from) return null;
  var ini = rg.from, fim = rg.to || new Date();
  var hoje = new Date(); hoje = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  if (hoje >= ini && hoje < fim) fim = hoje;
  return { ini: ini, fim: fim, cheio: !rg.isRange && ehUltimoDia(fim) && ini.getDate()===1 };
}
function cmpSpec(f){
  if (typeof todosAtivo==="function" && todosAtivo()) return null;
  var modo = cmpModo(); if (modo==="nenhum") return null;
  var c = cmpCorte(f); if (!c) return null;
  var mk = function(a, b){ return { base:f.base, from:dateToISO(a), to:dateToISO(b), _a:a, _b:b }; };
  var desloca = function(k){ var a = addMeses(c.ini, k), b = c.cheio ? ultimoDiaMes(addMeses(new Date(c.fim.getFullYear(), c.fim.getMonth(), 1), k)) : addMeses(c.fim, k); return mk(a, b); };
  var refs = [];
  if (modo==="mesmoDia") refs = [desloca(-1)];
  else if (modo==="mesInteiro"){ var p = addMeses(new Date(c.ini.getFullYear(), c.ini.getMonth(), 1), -1); refs = [mk(p, ultimoDiaMes(p))]; }
  else if (modo==="anoAnterior") refs = [desloca(-12)];
  else if (modo==="media3") refs = [desloca(-1), desloca(-2), desloca(-3)];
  var cur = mk(c.ini, c.fim);
  var MC = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  var refTxt = modo==="media3" ? "média "+refs.slice().reverse().map(function(r){ return MC[r._a.getMonth()]; }).join(" · ")+" (dias "+c.ini.getDate()+"–"+c.fim.getDate()+")" : faixaTxt(refs[0]._a, refs[0]._b);
  var curto = modo==="media3" ? "média 3 meses" : faixaTxt(refs[0]._a, refs[0]._b);
  return { modo:modo, cur:cur, refs:refs, curTxt: faixaTxt(c.ini, c.fim), refTxt: refTxt, curto: curto };
}
function cmpResumo(fs){
  var ss = fs.map(function(x){ return scopeSummary(x); }), n = ss.length || 1;
  var soma = function(k){ return ss.reduce(function(a, s){ return a + (s[k]||0); }, 0); };
  var os = soma("totalOS"), pr = soma("totalProdutivo");
  var dias = fs.reduce(function(a, x){ var sd = serieDiaria(x); return a + sd.prod.filter(function(p, i){ return p + sd.nao[i] > 0; }).length; }, 0);
  return { totalOS: os/n, totalProdutivo: pr/n, pct: os ? pr/os : 0, headcount: soma("headcount")/n, osDia: dias ? os/dias : 0, temDados: os>0 };
}
function deltaChip(curr, prev, digitsPct, rotulo){
  rotulo = rotulo || "período anterior";
  if (prev==null || isNaN(prev)) return '<span class="delta flat">— sem comparação</span>';
  var diff = curr - prev;
  var cls = diff>0.0001 ? "up" : (diff<-0.0001 ? "down" : "flat");
  var arrow = diff>0.0001 ? "▲" : (diff<-0.0001 ? "▼" : "•");
  var t;
  if (digitsPct) t = Math.abs(diff*100).toFixed(1).replace(".",",")+" p.p.";
  else { t = fmtInt(Math.abs(Math.round(diff))); if (prev>0) t += " ("+(Math.abs(diff/prev)*100).toFixed(0)+"%)"; }
  return '<span class="delta '+cls+'" title="Comparado com '+esc(rotulo)+'">'+arrow+' '+t+' <em>vs '+esc(rotulo)+'</em></span>';
}
/* acumulado dia a dia: atual (área laranja) × comparação (linha tracejada) */
function chartCompara(w, o){
  var h = o.height||250, padL = 40, padR = 14, padT = 18, padB = 26, uid = "cp"+(++CHART_UID);
  var n = Math.max(o.a.data.length, o.b ? o.b.data.length : 0);
  if (!n) return '<div class="empty-state" style="padding:20px;">Sem dados no período.</div>';
  var iw = Math.max(60, w-padL-padR), ih = h-padT-padB;
  var todos = o.a.data.concat(o.b ? o.b.data : []).filter(function(v){ return v!=null; });
  var max = niceMax(Math.max.apply(null, todos.concat([1]))*1.1);
  var X = function(i){ return padL + (n>1 ? iw*i/(n-1) : iw/2); }, Y = function(v){ return padT + ih - ih*v/max; };
  var out = svgOpen(w, h) + '<defs>'+gradDef(uid, o.a.color, .32, 0)+'</defs>';
  for (var g=0; g<=4; g++){ var yy = padT + ih - ih*g/4; out += gridLine(padL, yy, padL+iw) + txt(padL-8, yy+3.5, o.fmt(max*g/4), {anchor:"end", size:10, extra:' class="ct"'}); }
  var cada = Math.ceil(n/Math.max(1, Math.floor(iw/34)));
  for (var i=0;i<n;i++){
    if (i%cada===0 || i===n-1) out += txt(X(i), h-8, String(i+1), {anchor:"middle", size:10, extra:' class="ct"'});
    var tip = "Dia "+(i+1)+" — "+o.a.name+": "+(o.a.data[i]!=null ? o.fmt(o.a.data[i]) : "—")+(o.b ? " · "+o.b.name+": "+(o.b.data[i]!=null ? o.fmt(o.b.data[i]) : "—") : "");
    var x0 = n>1 ? X(i) - iw/(n-1)/2 : padL;
    out += '<rect class="col-hit" x="'+x0.toFixed(1)+'" y="'+padT+'" width="'+(n>1 ? iw/(n-1) : iw).toFixed(1)+'" height="'+ih+'" fill="transparent"><title>'+esc(tip)+'</title></rect>';
  }
  var linha = function(arr){ var p = []; arr.forEach(function(v, i){ if (v!=null) p.push([X(i), Y(v)]); }); return p; };
  if (o.b){
    var pb = linha(o.b.data);
    if (pb.length>1) out += '<path d="'+smoothPath(pb)+'" fill="none" stroke="'+o.b.color+'" stroke-width="1.8" stroke-dasharray="5 5" stroke-linecap="round" opacity=".75" style="pointer-events:none"/>';
    if (pb.length){ var lb = pb[pb.length-1]; out += '<circle cx="'+lb[0].toFixed(1)+'" cy="'+lb[1].toFixed(1)+'" r="3.5" fill="var(--surface-1)" stroke="'+o.b.color+'" stroke-width="2" style="pointer-events:none"/>'; }
  }
  var pa = linha(o.a.data);
  if (pa.length>1){
    var d = smoothPath(pa);
    out += '<path class="fx-area" d="'+d+' L'+pa[pa.length-1][0].toFixed(1)+' '+(padT+ih)+' L'+pa[0][0].toFixed(1)+' '+(padT+ih)+' Z" fill="url(#'+uid+')" style="pointer-events:none"/>';
    out += '<path class="cline" d="'+d+'" fill="none" stroke="'+o.a.color+'" stroke-width="2.4" stroke-linecap="round" style="pointer-events:none"/>';
  }
  if (pa.length){ var la = pa[pa.length-1];
    out += '<circle class="cdot" cx="'+la[0].toFixed(1)+'" cy="'+la[1].toFixed(1)+'" r="4.5" fill="'+o.a.color+'" stroke="var(--surface-1)" stroke-width="2.5" style="pointer-events:none"/>';
    out += pill(Math.min(la[0], padL+iw), la[1]-10, o.fmt(o.a.data[pa.length-1] != null ? o.a.data.filter(function(v){ return v!=null; }).slice(-1)[0] : 0), o.a.color, la[0] > padL+iw-40 ? "end" : "middle");
  }
  return out + '</svg>';
}
function acumulado(sd, metrica){
  var a = 0, b = 0, out = [], ultimo = -1;
  sd.prod.forEach(function(p, i){ if (p + sd.nao[i] > 0) ultimo = i; });
  sd.prod.forEach(function(p, i){
    a += p + sd.nao[i]; b += p;
    out.push(i>ultimo ? null : (metrica==="pct" ? (a ? b/a : null) : metrica==="prod" ? b : a));
  });
  return out;
}
function renderDashComparativo(f, cmp){

  box.innerHTML =

          return '<div class="cmp-r"><span>'+l[0]+'</span><b>'+l[4](l[1])+'</b><em>'+(ref.temDados ? l[4](l[2]) : "—")+'</em><i class="'+cls+'">'+dv+'</i></div>';
        }).join("")
    + '</div>';
  drawChart("chartCmp", function(w){ return chartCompara(w, { height:240, fmt:fmt, a:{ name:"Atual", color:"#ff5a1f", data:arrA }, b: ref.temDados ? { name:"Comparação", color:"var(--np)", data:arrB } : null }); });

/* ===================== TODOS OS MESES (análise) ===================== */
function todosAtivo(){ return !!(STATE.filters.todos && !rangeAtivo() && UI.periodsList && UI.periodsList.length); }
function mesCurto(p){ return MESES[p.mes].slice(0,3).toLowerCase()+"/"+String(p.ano).slice(2); }
function serieMensal(f){
  var lista = UI.periodsList || [];
  var labels = [], prod = [], nao = [], pct = [], ss = [];
  lista.forEach(function(p){
    var s = scopeSummary({ base:f.base, ano:p.ano, mes:p.mes });
    labels.push(mesCurto(p)); prod.push(s.totalProdutivo); nao.push(Math.max(0, s.totalOS - s.totalProdutivo));
    pct.push(s.totalOS ? s.totalProdutivo/s.totalOS : null); ss.push(s);

/* linhas (uma por série) */
function chartLinhas(w, o){
  var h = o.height||240, padL = 40, padR = 16, padT = 18, padB = 26, n = o.labels.length;
  if (!n) return '<div class="empty-state" style="padding:20px;">Sem dados.</div>';
  var iw = Math.max(60, w-padL-padR), ih = h-padT-padB;
  var max = o.max || niceMax(Math.max.apply(null, o.series.reduce(function(a,s){ return a.concat(s.data.filter(function(v){ return v!=null; })); }, [1e-9]))*1.1);
  var X = function(i){ return padL + (n>1 ? iw*i/(n-1) : iw/2); }, Y = function(v){ return padT + ih - ih*v/max; };
  var out = svgOpen(w, h);
  for (var g=0; g<=4; g++){ var yy = padT+ih-ih*g/4; out += gridLine(padL, yy, padL+iw) + txt(padL-8, yy+3.5, o.fmtEixo ? o.fmtEixo(max*g/4) : fmtInt(max*g/4), {anchor:"end", size:10, extra:' class="ct"'}); }
  o.labels.forEach(function(l, i){ out += txt(X(i), h-8, l, {anchor:"middle", size:10.5, weight:600, extra:' class="ct"'}); });
  if (o.meta!=null){ var my = Y(o.meta); out += '<line class="cg" x1="'+padL+'" y1="'+my+'" x2="'+(padL+iw)+'" y2="'+my+'" stroke="#ff5a1f" stroke-opacity=".7" stroke-width="1.3" stroke-dasharray="4 4"/>' + pill(padL+iw, my-4, o.metaTxt||"meta", "#ff5a1f", "end"); }
  o.series.forEach(function(s){
    var pts = []; s.data.forEach(function(v, i){ if (v!=null) pts.push([X(i), Y(v), v, i]); });
    if (pts.length>1) out += '<path class="cline" d="'+smoothPath(pts)+'" fill="none" stroke="'+s.color+'" stroke-width="2.2" stroke-linecap="round" style="pointer-events:none"/>';
    pts.forEach(function(p){ out += '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4" fill="'+s.color+'" stroke="var(--surface-1)" stroke-width="2"><title>'+esc(s.name+" · "+o.labels[p[3]]+": "+o.fmt(p[2]))+'</title></circle>'; });
  });
  return out + '</svg>';
}

function frotaPessoas(){

function frotaGrupo(f, tipo){
  var g = Object.assign({}, f, { base:"GERAL" });

/* barras lado a lado por dia (carro e moto) */
function chartFrotaDia(w, labels, a, b){
  var h = 330, padL = 34, padR = 6, padT = 18, padB = 26, n = labels.length;
  var iw = Math.max(40, w-padL-padR), ih = h-padT-padB;
  var max = niceMax(Math.max.apply(null, a.concat(b).concat([1]))*1.1);
  var step = iw/n, bw = Math.max(2, Math.min(9, step*0.28));
  var out = svgOpen(w, h);
  for (var g=0; g<=4; g++){ var yy = padT+ih-ih*g/4; out += gridLine(padL, yy, padL+iw) + txt(padL-8, yy+3.5, fmtInt(Math.round(max*g/4)), {anchor:"end", size:10, extra:' class="ct"'}); }
  var cada = n<=16 ? 1 : Math.ceil(n/16);
  for (var i=0;i<n;i++){
    var cx = padL + step*i + step/2;
    out += '<rect class="col-hit" x="'+(padL+step*i)+'" y="'+padT+'" width="'+step+'" height="'+ih+'" rx="6" fill="transparent"><title>'+esc("Dia "+labels[i]+" — Carro: "+a[i]+" OS · Moto: "+b[i]+" OS")+'</title></rect>';
    [[a[i], VEIC.carro.cor, -1],[b[i], VEIC.moto.cor, 1]].forEach(function(p){
      var x = cx + (p[2]<0 ? -bw-1 : 1), bh = ih*p[0]/max;
      out += '<rect class="trk" x="'+x.toFixed(1)+'" y="'+padT+'" width="'+bw+'" height="'+ih+'" rx="'+(bw/2)+'" fill="rgba(var(--ink),0.03)" style="pointer-events:none"/>';
      if (p[0]) out += '<rect x="'+x.toFixed(1)+'" y="'+(padT+ih-bh).toFixed(1)+'" width="'+bw+'" height="'+Math.max(bw, bh).toFixed(1)+'" rx="'+(bw/2)+'" fill="'+p[1]+'" style="pointer-events:none"/>';
    });
    if (i%cada===0) out += txt(cx, h-8, labels[i], {anchor:"middle", size:10, extra:' class="ct"'});
  }
  return out + '</svg>';
}

function frotaDados(f, tipo){
  var g = Object.assign({}, f, { base:"GERAL" });
  var nomes = A.employeesForScope(f).filter(function(n){ return veicDe(n)===tipo; }), set = {};
  nomes.forEach(function(n){ set[up(n)] = 1; });
  var dias = diasDoEscopo(f), idx = {}, labels = [], prod = [], nao = [];
  var mesmoMes = dias.length && dias[0].getMonth()===dias[dias.length-1].getMonth();
  dias.forEach(function(d, i){ idx[dateToISO(d)] = i; labels.push(mesmoMes ? String(d.getDate()) : d.getDate()+"/"+(d.getMonth()+1)); prod.push(0); nao.push(0); });
  var os = 0, pr = 0, res = {}, resCls = {}, tipos = {}, ativos = {};
  A.filterRecords(g).forEach(function(r){
    if (!set[up(r.equipe)]) return;
    var p = effClass(r)==="PRODUTIVO"; os++; if (p) pr++; ativos[up(r.equipe)] = 1;
    if (r.dataInicio){ var i = idx[dateToISO(r.dataInicio)]; if (i!=null){ if (p) prod[i]++; else nao[i]++; } }
    var k = titleCase(r.resultado || "Sem resultado"); res[k] = (res[k]||0)+1; resCls[k] = r._cls;
    var t = titleCase(r.tipo || "Sem tipo"), e = tipos[t] || (tipos[t] = { os:0, pr:0 }); e.os++; if (p) e.pr++;
  });
  A.filterAdjust(g).forEach(function(a){
    if (!set[up(a.equipe)]) return;
    var o = A.adjOS(a), pp2 = A.adjProd(a); os += o; pr += pp2; ativos[up(a.equipe)] = 1;
    var i = idx[a.date]; if (i!=null){ prod[i] += pp2; nao[i] += Math.max(0, o-pp2); }
  });
  var rows = nomes.map(function(n){ return employeeSummary(n, g); }).filter(function(r){ return r.totalOS>0; });
  var porBase = {};
  rows.forEach(function(r){ var b = r.area || "Sem base", e = porBase[b] || (porBase[b] = { os:0, pr:0, n:0 }); e.os += r.totalOS; e.pr += r.totalProdutivo; e.n++; });
  var hr = horarioRows(f).filter(function(r){ return set[up(r.equipe)]; });
  var tot = prod.map(function(v, i){ return v + nao[i]; }), trab = tot.filter(function(v){ return v>0; }).length;
  return { tipo:tipo, nomes:nomes, set:set, labels:labels, prod:prod, nao:nao, tot:tot, os:os, pr:pr, pct: os ? pr/os : 0,
    pessoas: Object.keys(ativos).length, res:res, resCls:resCls, tipos:tipos, rows:rows, porBase:porBase, hr:hr, ag:horAgrega(hr),
    diasTrab:trab, osDia: trab ? os/trab : 0, osPessoa: rows.length ? os/rows.length : 0 };
}
function frotaTotais(fs, tipo){
  var t = { os:0, pr:0, pessoas:0, n:0 };
  fs.forEach(function(fx){ var d = frotaGrupo(fx, tipo); t.os += d.os; t.pr += d.prod; t.pessoas += d.pessoas; t.n++; });
  var n = t.n || 1;

}

  out.push("Foram <b>"+fmtInt(s.totalOS)+" OS</b> executadas em "+fmtInt(D.diasTrab)+" dia(s) trabalhado(s), média de <b>"+dec1(D.mediaDia)+" OS por dia</b>.");

function presMontar(){
  var c = presCfg(), f = currentFilter(), lista = [];
  var ctx = { f:f, cfg:c };
  PRES_DEF.forEach(function(d){ if (c.slides.indexOf(d.id)!==-1 && (!d.ok || d.ok(ctx))) lista.push({ id:d.id, f:f }); });
  if (c.porEquipe && f.base==="GERAL"){
    basesComDados().forEach(function(b){
      var fb = Object.assign({}, f, { base:b });

  /* lista */

      var S2 = NOME_ST[x.st];

        + '<div class="nm-o"><b>'+esc(x.orig)+'</b><span>'+fmtInt(x.os)+' OS'+(x.banco ? ' · '+fmtInt(x.banco)+' dia(s) no banco de horas' : '')+'</span></div>'
        + '<span class="nm-st '+S2.c+'">'+S2.t+'</span>'
        + '<div class="nm-a">'
          + (x.st==="sug" ? '<div class="nm-sug"><span>→</span><b>'+esc(titleCase(x.sug))+'</b><em>'+(info ? esc(A.painelBaseNome(info.base)) : '')+' · '+Math.round(x.score*100)+'% parecido</em></div>'
              + '<button type="button" class="btn btn-sm btn-primary" data-act="confirmar" data-alvo="'+esc(x.sug)+'">'+IC('check','i-sm')+' É essa pessoa</button>' : '')
          + ((x.st==="ok" || x.st==="map") ? '<div class="nm-sug"><span>→</span><b>'+esc(titleCase(x.alvo))+'</b><em>'+(info ? esc(A.painelBaseNome(info.base)) : '')+'</em></div>' : '')
          + (x.st!=="ok" && x.st!=="pda" ? '<div class="nm-pick"><input type="text" list="nmOficiais" placeholder="Ligar a um colaborador…" data-pick="1"><button type="button" class="btn btn-sm" data-act="ligar">Ligar</button></div>' : '')
          + (x.st==="map" ? '<button type="button" class="btn btn-sm btn-ghost" data-act="desfazer">Desfazer</button>' : '')
          + (x.st==="sug" || x.st==="fora" || x.st==="livre" ? '<button type="button" class="btn btn-sm btn-ghost" data-act="ignorar" title="Não é colaborador — não entra nos números">Ignorar</button>' : '')

        + '</div></div>';
    }).join("")+'</div>'+(it.length>400 ? '<div class="empty-state">Mostrando 400 de '+fmtInt(it.length)+'. Use a busca.</div>' : '')
    : '<div class="empty-state">'+(STATE.records.length ? 'Nada nesta aba.' : 'Importe planilhas para conferir os nomes.')+'</div>';
  };
  desenhaLista();

  /* eventos */
  var aplicar = function(fn, msg){ fn(); nomesAplicar(msg); };
  document.getElementById("nmLista").addEventListener("click", function(e){
    var b = e.target.closest("[data-act]"); if (!b) return;
    var row = b.closest(".nm-r"), k = row.dataset.k, orig = row.dataset.o, act = b.dataset.act, mapa = A.nomeMap(), pdas = A.pdaNomes();

    else if (act==="ligar"){
      var v = up(row.querySelector("[data-pick]").value.trim()); if (!v) return;

      aplicar(function(){ mapa[k] = off || v; }, titleCase(orig)+" ligado a "+titleCase(off || v));
    }
    else if (act==="ignorar") aplicar(function(){ mapa[k] = "__IGNORAR"; }, titleCase(orig)+" ignorado");
    else if (act==="desfazer") aplicar(function(){ delete mapa[k]; }, "Desfeito");
    else if (act==="pda") aplicar(function(){ delete mapa[k]; if (pdas.indexOf(k)===-1) pdas.push(k); UI.pdaNome = k; UI.nmSecao = "pda"; }, orig+" agora é PDA — ligue as OS na aba PDA");

  var en = document.getElementById("nmEntrar"); if (en) en.onclick = function(){ var em = document.getElementById("nmEmail").value.trim(), se = document.getElementById("nmSenha").value; if (!em || !se){ A.toast("Informe e-mail e senha do Painel.", "err"); return; } go(em, se); };

  el.querySelectorAll(".nm-sec [data-sec]").forEach(function(b){ b.onclick = function(){ UI.nmSecao = b.dataset.sec; renderNomes(); }; });
