function osDados(){
  var f = currentFilter();
  var key = A.fkey(f)+"|"+OSP.name;
  if (OSP._key!==key){
    OSP._key = key;
    OSP._f = f;
    OSP._lista = A.employeeOSList(OSP.name, f);
    OSP._sum = employeeSummary(OSP.name, Object.assign({}, f, { base:"GERAL" }));
    OSP._adj = A.filterAdjust(Object.assign({}, f, { base:"GERAL", employee:OSP.name }));
  }
  return OSP;
}
function osFiltra(lista, ignora){
  ignora = ignora || "";
  var q = up(OSP.busca);
  var t0 = OSP.de ? isoToDate(OSP.de).getTime() : -Infinity;
  var t1 = OSP.ate ? isoToDate(OSP.ate).getTime()+86399999 : Infinity;
  return lista.filter(function(r){
    if (ignora!=="classe" && OSP.classe!=="todas" && r._cls!==OSP.classe) return false;
    if (ignora!=="regiao" && OSP.regiao && (r._areaExec||"Sem região")!==OSP.regiao) return false;
    if (ignora!=="resultado" && OSP.resultado && r._rk!==OSP.resultado) return false;
    if (ignora!=="tipo" && OSP.tipo && tipoKey(r)!==OSP.tipo) return false;
    if ((OSP.de || OSP.ate) && !(r._t>=t0 && r._t<=t1)) return false;
    if (q && (up(r.numOS)+" "+up(r.resultado)+" "+up(r.unidade)+" "+up(r.tipo)).indexOf(q)===-1) return false;
    return true;
  });
}
function osOrdena(rows){
  var d = OSP.dir, k = OSP.sort;
  var get = {
    t:   function(r){ return r._t||0; },
    dur: function(r){ var m = durMin(r); return m==null ? -1 : m; },
    os:  function(r){ return r.numOS||""; },
    reg: function(r){ return r._areaExec||""; },
    res: function(r){ return up(r.resultado); },
    tipo: function(r){ return up(r.tipo||"~"); },
    cls: function(r){ return r._cls; }
  }[k] || function(r){ return r._t||0; };
  return rows.slice().sort(function(a,b){
    var x = get(a), y = get(b);
    if (typeof x==="string") return d*x.localeCompare(y, "pt-BR", { numeric:true });
    return d*(x-y);
  });
}
function osTemFiltro(){ return OSP.classe!=="todas" || OSP.busca || OSP.regiao || OSP.tipo || OSP.resultado || OSP.de || OSP.ate; }

function osMontar(){
  var box = document.getElementById("osModalBox"); if (!box) return;
  var D = osDados(), sum = D._sum, name = OSP.name;
  var rg = scopeRange(D._f);
  var minD = rg.from ? dateToISO(rg.from) : "", maxD = rg.to ? dateToISO(rg.to) : "";
  box.innerHTML =
    '<div class="os-head" data-employee="'+esc(name)+'">'
      + '<div class="avatar" style="width:46px;height:46px;font-size:16px;flex:none;">'+esc(initials(name))+'</div>'
      + '<div class="who"><div class="n">'+esc(titleCase(name))+'</div>'
        + '<div class="s">Base: '+esc(sum.area||"—")+' · '+esc(periodLabel())+' · '+fmtInt(sum.totalOS)+' OS no período ('+fmtPct(sum.pct)+' produtiva)</div></div>'
      + '<button class="btn btn-sm" id="osPerfil" title="Perfil completo">'+IC('users','i-sm')+' <span class="hide-sm">Perfil</span></button>'
      + '<button class="btn btn-sm" id="osHor" title="Ver horários">'+IC('clock','i-sm')+' <span class="hide-sm">Horários</span></button>'
      + '<button class="btn btn-sm" id="osCsv">'+IC('download','i-sm')+' <span class="hide-sm">CSV</span></button>'
      + '<button class="btn btn-sm btn-ghost" id="osClose" title="Fechar (Esc)">'+IC('x','i-sm')+'</button>'
    + '</div>'
    + '<div class="os-kpis" id="osKpis"></div>'
    + '<div class="os-filters">'
      + '<div class="os-frow">'
        + '<div class="tabs" id="osAbas"></div>'
        + '<div class="seg" id="osClasse"></div>'
      + '</div>'
      + '<div class="os-frow">'
        + '<div class="search-input-wrap" style="flex:1;min-width:180px;"><span class="sic">'+IC('search')+'</span><input type="search" id="osBusca" placeholder="Nº da OS, tipo, resultado ou unidade..."></div>'
        + '<select id="osTipo" title="Tipo de OS" style="max-width:220px;"></select>'
        + '<select id="osRegiao" title="Região onde a OS foi feita"></select>'
        + '<select id="osResultado" title="Resultado" style="max-width:230px;"></select>'
        + '<label class="os-date">De <input type="date" id="osDe" min="'+minD+'" max="'+maxD+'"></label>'
        + '<label class="os-date">Até <input type="date" id="osAte" min="'+minD+'" max="'+maxD+'"></label>'
        + '<button class="btn btn-sm btn-ghost" id="osLimpar">Limpar filtros</button>'
      + '</div>'
    + '</div>'
    + '<div class="os-scroll" id="osScroll"></div>'
    + '<div class="os-foot" id="osFoot"></div>';

  document.getElementById("osClose").addEventListener("click", function(){ closeEmployeeOS(); });
  document.getElementById("osCsv").addEventListener("click", function(){ exportarOSColaborador(name, osOrdena(osFiltra(osDados()._lista))); });
  document.getElementById("osHor").addEventListener("click", function(){ closeEmployeeOS(true); selectHorarioEmployee(name); });
  document.getElementById("osPerfil").addEventListener("click", function(){ abrirPerfil(name); });
  document.getElementById("osBusca").addEventListener("input", debounce(function(e){ OSP.busca = e.target.value; osAtualiza(true); }, 140));
  document.getElementById("osRegiao").addEventListener("change", function(e){ OSP.regiao = e.target.value; osAtualiza(true); });
  document.getElementById("osTipo").addEventListener("change", function(e){ OSP.tipo = e.target.value; osAtualiza(true); });
  document.getElementById("osResultado").addEventListener("change", function(e){ OSP.resultado = e.target.value; osAtualiza(true); });
  document.getElementById("osDe").addEventListener("change", function(e){ OSP.de = e.target.value; if (OSP.ate && OSP.de>OSP.ate) OSP.ate = OSP.de; osAtualiza(true); });
  document.getElementById("osAte").addEventListener("change", function(e){ OSP.ate = e.target.value; if (OSP.de && OSP.ate<OSP.de) OSP.de = OSP.ate; osAtualiza(true); });
  document.getElementById("osLimpar").addEventListener("click", function(){
    OSP.classe="todas"; OSP.busca=""; OSP.regiao=""; OSP.tipo=""; OSP.resultado=""; OSP.de=""; OSP.ate="";
    document.getElementById("osBusca").value = ""; osAtualiza(true);
  });
  document.getElementById("osAbas").addEventListener("click", function(e){ var b = e.target.closest("[data-aba]"); if (!b) return; OSP.aba = b.dataset.aba; osAtualiza(true); });
  document.getElementById("osClasse").addEventListener("click", function(e){ var b = e.target.closest("[data-c]"); if (!b) return; OSP.classe = b.dataset.c; osAtualiza(true); });
  document.getElementById("osScroll").addEventListener("click", function(e){
    var th = e.target.closest("th[data-sort]");
    if (th){ var k = th.dataset.sort; if (OSP.sort===k) OSP.dir = -OSP.dir; else { OSP.sort = k; OSP.dir = (k==="t"||k==="dur") ? -1 : 1; } osAtualiza(false); return; }
    var tr = e.target.closest("tr[data-dia]");
    if (tr){ OSP.de = OSP.ate = tr.dataset.dia; OSP.aba = "lista"; osAtualiza(true); }
  });
  document.getElementById("osFoot").addEventListener("click", function(e){
    if (e.target.closest("#osMais")){ OSP.limite += OSP_PASSO; osAtualiza(false, true); }
  });
  setTimeout(function(){ var b = document.getElementById("osBusca"); if (b && window.innerWidth>700) b.focus(); }, 60);
  osAtualiza(true);
}

function osAtualiza(voltarAoTopo, manterScroll){
  var D = osDados(), lista = D._lista;
  if (voltarAoTopo) OSP.limite = OSP_PASSO;
  var rows = osOrdena(osFiltra(lista));
  var valid = rows.filter(function(r){ return r._cls!=="X"; });
  var P = valid.filter(function(r){ return r._cls==="P"; }).length, N = valid.length-P;
  var diasSet = {}; valid.forEach(function(r){ if (r.dataInicio) diasSet[dateToISO(r.dataInicio)] = 1; });
  var nd = Object.keys(diasSet).length;
  var durs = valid.map(durMin).filter(function(m){ return m!=null && m>=0 && m<720; });
  var durMed = durs.length ? Math.round(durs.reduce(function(a,b){return a+b;},0)/durs.length) : null;

  document.getElementById("osKpis").innerHTML =
      '<div class="k"><span>OS'+(osTemFiltro()?" (filtro)":"")+'</span><b>'+fmtInt(valid.length)+'</b></div>'
    + '<div class="k good"><span>Produtivas</span><b>'+fmtInt(P)+'</b></div>'
    + '<div class="k bad"><span>Não produtivas</span><b>'+fmtInt(N)+'</b></div>'
    + '<div class="k"><span>% Produtiva</span><b>'+fmtPct(valid.length?P/valid.length:0)+'</b></div>'
    + '<div class="k"><span>Dias com OS</span><b>'+fmtInt(nd)+'</b></div>'
    + '<div class="k"><span>OS / dia</span><b>'+(nd?(valid.length/nd).toFixed(1).replace(".",","):"0")+'</b></div>'
    + '<div class="k"><span>Duração média</span><b>'+durTxt(durMed)+'</b></div>';

  // abas
  var nAdj = D._adj.length;
  document.getElementById("osAbas").innerHTML = [["lista","Lista de OS"],["dias","Por dia"],["resultados","Por resultado"]].concat(nAdj?[["manual","Lançamentos manuais"]]:[]).map(function(a){
    return '<button class="tab-btn '+(OSP.aba===a[0]?"active":"")+'" data-aba="'+a[0]+'">'+a[1]+(a[0]==="manual"?'<span class="cnt">'+nAdj+'</span>':'')+'</button>';
  }).join("");

  // classificação (contagens com os outros filtros aplicados)
  var base = osFiltra(lista, "classe"), cc = { todas: base.length, P:0, N:0, X:0 };
  base.forEach(function(r){ cc[r._cls]++; });
  var ops = [["todas","Todas",""],["P","Produtivas","p"],["N","Não produtivas","n"]];
  if (cc.X) ops.push(["X","Ignoradas","x"]);
  document.getElementById("osClasse").innerHTML = ops.map(function(o){
    return '<button type="button" class="'+o[2]+(OSP.classe===o[0]?" on":"")+'" data-c="'+o[0]+'">'+o[1]+' <span style="opacity:.65">'+fmtInt(cc[o[0]])+'</span></button>';
  }).join("");

  // selects de região e resultado
  var rgC = {}; osFiltra(lista, "regiao").forEach(function(r){ var k = r._areaExec||"Sem região"; rgC[k] = (rgC[k]||0)+1; });
  var rgK = Object.keys(rgC).sort(function(a,b){ return rgC[b]-rgC[a]; });
  if (OSP.regiao && !rgC[OSP.regiao]) rgK.push(OSP.regiao);
  document.getElementById("osRegiao").innerHTML = '<option value="">Todas as regiões</option>'
    + rgK.map(function(k){ return '<option value="'+esc(k)+'"'+(OSP.regiao===k?" selected":"")+'>'+esc(k)+' ('+fmtInt(rgC[k]||0)+')</option>'; }).join("");
  var tpC = {}, tpNome = {};
  osFiltra(lista, "tipo").forEach(function(r){ var k = tipoKey(r); tpC[k] = (tpC[k]||0)+1; tpNome[k] = tipoDe(r); });
  var tpK = Object.keys(tpC).sort(function(a,b){ return tpC[b]-tpC[a]; });
  if (OSP.tipo && !tpC[OSP.tipo]){ tpK.unshift(OSP.tipo); tpNome[OSP.tipo] = titleCase(OSP.tipo); }
  document.getElementById("osTipo").innerHTML = '<option value="">Todos os tipos de OS</option>'
    + tpK.map(function(k){ return '<option value="'+esc(k)+'"'+(OSP.tipo===k?" selected":"")+'>'+esc(tpNome[k])+' ('+fmtInt(tpC[k]||0)+')</option>'; }).join("");
  var reC = {}, reNome = {};
  osFiltra(lista, "resultado").forEach(function(r){ reC[r._rk] = (reC[r._rk]||0)+1; reNome[r._rk] = r.resultado||"(vazio)"; });
  var reK = Object.keys(reC).sort(function(a,b){ return reC[b]-reC[a]; });
  if (OSP.resultado && !reC[OSP.resultado]){ reK.unshift(OSP.resultado); reNome[OSP.resultado] = OSP.resultado; }
  document.getElementById("osResultado").innerHTML = '<option value="">Todos os resultados</option>'
    + reK.map(function(k){ return '<option value="'+esc(k)+'"'+(OSP.resultado===k?" selected":"")+'>'+esc(titleCase(reNome[k]))+' ('+fmtInt(reC[k]||0)+')</option>'; }).join("");
  document.getElementById("osDe").value = OSP.de || "";
  document.getElementById("osAte").value = OSP.ate || "";
  document.getElementById("osLimpar").style.visibility = osTemFiltro() ? "visible" : "hidden";

  var sc = document.getElementById("osScroll"), foot = document.getElementById("osFoot");
  var st = sc.scrollTop;
  var BADGE = { P:["badge-good","Produtiva"], N:["badge-critical","Não produtiva"], X:["badge-neutral","Ignorada"] };

  if (OSP.aba==="lista"){
    var shown = rows.slice(0, OSP.limite);
    var th = function(k, label, cls){
      var on = OSP.sort===k;
      return '<th data-sort="'+k+'" class="sortable'+(cls?" "+cls:"")+(on?" on":"")+'">'+label+'<span class="arr">'+(on?(OSP.dir<0?"▼":"▲"):"↕")+'</span></th>';
    };
    sc.innerHTML = '<table class="os-table"><thead><tr>'
        + th("t","Início") + '<th>Fim</th>' + th("dur","Duração","num") + th("os","Nº OS") + th("tipo","Tipo de OS") + th("reg","Região da OS")
        + '<th>Unidade</th>' + th("res","Resultado") + th("cls","Classificação")
      + '</tr></thead><tbody>'
      + (shown.length ? shown.map(function(r){
          var bd = BADGE[r._cls] || BADGE.N;
          return '<tr'+(r._cls==="X"?' style="opacity:.6"':'')+'>'
            + '<td>'+fmtDateTimeBR(r.dataInicio)+' <span class="muted">'+(r.dataInicio?DOW[r.dataInicio.getDay()]:"")+'</span></td>'
            + '<td>'+(r.dataFim ? fmtDateTimeBR(r.dataFim) : "—")+'</td>'
            + '<td class="num">'+durTxt(durMin(r))+'</td>'
            + '<td class="strong">'+esc(r.numOS||"—")+'</td>'
            + '<td class="wrap">'+(r.tipo ? esc(titleCase(r.tipo)) : '<span class="muted">—</span>')+'</td>'
            + '<td>'+(r._areaExec ? '<span class="legend-swatch" style="background:'+(BASE_COLORS_HEX[r._areaExec]||"rgba(var(--ink),.35)")+';display:inline-block;margin-right:6px;"></span>'+esc(r._areaExec) : "—")+'</td>'
            + '<td class="wrap">'+esc(r.unidade||"—")+'</td>'
            + '<td class="wrap">'+esc(titleCase(r.resultado||"(vazio)"))+'</td>'
            + '<td><span class="badge '+bd[0]+'">'+bd[1]+'</span></td>'
          + '</tr>';
        }).join("") : '<tr><td colspan="9"><div class="empty-state">Nenhuma OS encontrada com esses filtros.</div></td></tr>')
      + '</tbody></table>';
    foot.innerHTML = '<span>Mostrando <b>'+fmtInt(shown.length)+'</b> de <b>'+fmtInt(rows.length)+'</b> OS'
      + (cc.X && OSP.classe!=="X" ? ' · ignoradas aparecem apagadas e não entram nos totais' : '')+'</span>'
      + (rows.length>shown.length ? '<button class="btn btn-sm" id="osMais">Mostrar mais '+fmtInt(Math.min(OSP_PASSO, rows.length-shown.length))+'</button>' : '');
  } else if (OSP.aba==="dias"){
    var dm = {};
    rows.forEach(function(r){
      if (!r.dataInicio || r._cls==="X") return;
      var k = dateToISO(r.dataInicio), e = dm[k] || (dm[k] = { os:0, p:0, ini:null, fim:null, reg:{} });
      e.os++; if (r._cls==="P") e.p++;
      if (!e.ini || r.dataInicio<e.ini) e.ini = r.dataInicio;
      var fim = r.dataFim || r.dataInicio; if (!e.fim || fim>e.fim) e.fim = fim;
      if (r._areaExec) e.reg[r._areaExec] = 1;
    });
    var ks = Object.keys(dm).sort().reverse();
    var hm = function(d){ return d ? String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0") : "—"; };
    sc.innerHTML = '<table class="os-table"><thead><tr><th>Data</th><th class="num">OS</th><th class="num">Produtivas</th><th class="num">% Prod.</th><th style="min-width:140px;"></th><th class="num">1ª OS</th><th class="num">Última</th><th>Regiões</th></tr></thead><tbody>'
      + (ks.length ? ks.map(function(k){
          var e = dm[k], dt = isoToDate(k), pc = e.os ? e.p/e.os : 0;
          return '<tr class="clickable" data-dia="'+k+'" title="Ver as OS deste dia">'
            + '<td class="strong">'+fmtDateBR(dt)+' <span class="muted" style="font-weight:500;">'+DOW[dt.getDay()]+'</span></td>'
            + '<td class="num">'+fmtInt(e.os)+'</td><td class="num">'+fmtInt(e.p)+'</td><td class="num">'+fmtPct(pc)+'</td>'
            + '<td><div class="progress"><span style="width:'+(pc*100)+'%;background:'+PAL.good+';"></span></div></td>'
            + '<td class="num">'+hm(e.ini)+'</td><td class="num">'+hm(e.fim)+'</td>'
            + '<td>'+esc(Object.keys(e.reg).join(", ")||"—")+'</td></tr>';
        }).join("") : '<tr><td colspan="8"><div class="empty-state">Sem dias com OS neste filtro.</div></td></tr>')
      + '</tbody></table>';
    foot.innerHTML = '<span>'+fmtInt(ks.length)+' dia(s) · clique num dia para ver as OS dele</span>';
  } else if (OSP.aba==="resultados"){
    var rm = {};
    rows.forEach(function(r){ var e = rm[r._rk] || (rm[r._rk] = { nome:r.resultado||"(vazio)", n:0, cls:r._cls }); e.n++; });
    var rk = Object.keys(rm).sort(function(a,b){ return rm[b].n-rm[a].n; });
    var tot = rows.length || 1;
    sc.innerHTML = '<table class="os-table"><thead><tr><th>Resultado</th><th>Classificação</th><th class="num">OS</th><th class="num">%</th><th style="min-width:160px;"></th></tr></thead><tbody>'
      + (rk.length ? rk.map(function(k){
          var e = rm[k], bd = BADGE[e.cls] || BADGE.N;
          return '<tr class="clickable" data-res="'+esc(k)+'" title="Filtrar a lista por este resultado">'
            + '<td class="strong wrap">'+esc(titleCase(e.nome))+'</td><td><span class="badge '+bd[0]+'">'+bd[1]+'</span></td>'
            + '<td class="num">'+fmtInt(e.n)+'</td><td class="num">'+fmtPct(e.n/tot)+'</td>'
            + '<td><div class="progress"><span style="width:'+(e.n/rm[rk[0]].n*100)+'%;background:'+(RES_CORES[e.cls]||PAL.brand)+';"></span></div></td></tr>';
        }).join("") : '<tr><td colspan="5"><div class="empty-state">Nada neste filtro.</div></td></tr>')
      + '</tbody></table>';
    sc.querySelectorAll("tr[data-res]").forEach(function(tr){
      tr.addEventListener("click", function(){ OSP.resultado = tr.dataset.res; OSP.aba = "lista"; osAtualiza(true); });
    });
    foot.innerHTML = '<span>'+fmtInt(rk.length)+' resultado(s) · clique para filtrar a lista</span>';
  } else {
    sc.innerHTML = '<table class="os-table"><thead><tr><th>Data</th><th>Serviço</th><th class="num">OS</th><th class="num">Produtivas</th></tr></thead><tbody>'
      + D._adj.map(function(a){
          return '<tr><td>'+fmtDateBR(isoToDate(a.date))+'</td><td class="wrap">'+esc(a.servico ? titleCase(a.servico) : "—")+(a.motivo?' <span class="muted">'+esc(a.motivo)+'</span>':'')+'</td>'
            + '<td class="num">+'+fmtInt(A.adjOS(a))+'</td><td class="num">+'+fmtInt(A.adjProd(a))+'</td></tr>';
        }).join("") + '</tbody></table>';
    foot.innerHTML = '<span>Lançamentos manuais somam nos totais do período, mas não são OS individuais.</span>';
  }
  if (voltarAoTopo) sc.scrollTop = 0; else if (manterScroll) sc.scrollTop = st;
}
function exportarOSColaborador(name, rows){
  var q = function(v){ return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'; };
  var NOME = { P:"Produtiva", N:"Nao produtiva", X:"Ignorada" };
  var linhas = [["Colaborador","Base do colaborador","Inicio","Fim","Duracao","Numero OS","Tipo de OS","Regiao da OS","Unidade","Resultado","Classificacao"].join(";")];
  var baseC = employeeArea(name);
  rows.forEach(function(r){
    linhas.push([q(titleCase(name)), q(baseC), fmtDateTimeBR(r.dataInicio), r.dataFim?fmtDateTimeBR(r.dataFim):"", durTxt(durMin(r)),
      q(r.numOS), q(r.tipo?titleCase(r.tipo):""), q(r._areaExec), q(r.unidade), q(r.resultado), NOME[r._cls]||""].join(";"));
  });
  var blob = new Blob(["\ufeff"+linhas.join("\r\n")], { type:"text/csv;charset=utf-8;" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "os-"+titleCase(name).replace(/\s+/g,"-").toLowerCase()+"-"+dateToISO(new Date())+".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1200);
  A.toast("CSV gerado com "+fmtInt(rows.length)+" OS.", "ok");
}

/* ========================================================================
   EFEITOS VISUAIS — gradientes, animação dos gráficos, tooltip,
   contagem dos números e transição entre páginas
   ======================================================================== */
var FX = (function(){
  var NS = "http://www.w3.org/2000/svg", gid = 0;
  var reduz = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function hexToRgb(h){ var n = parseInt(h.slice(1), 16); return [n>>16&255, n>>8&255, n&255]; }
  function mix(h, alvo, t){ var a = hexToRgb(h); return "rgb("+a.map(function(c){ return Math.round(c+(alvo-c)*t); }).join(",")+")"; }
  function grad(defs, cor, horiz){
    var id = "fxg"+(++gid);
    var g = document.createElementNS(NS, "linearGradient");
    g.setAttribute("id", id);
    if (horiz){ g.setAttribute("x1","0"); g.setAttribute("y1","0"); g.setAttribute("x2","1"); g.setAttribute("y2","0"); }
    else { g.setAttribute("x1","0"); g.setAttribute("y1","0"); g.setAttribute("x2","0"); g.setAttribute("y2","1"); }
    var st = horiz ? [[0, .55],[1, 1]] : [[0, 1],[1, .5]];
    st.forEach(function(s){ var e = document.createElementNS(NS,"stop"); e.setAttribute("offset", s[0]); e.setAttribute("stop-color", cor); e.setAttribute("stop-opacity", s[1]); g.appendChild(e); });
    defs.appendChild(g);
    return "url(#"+id+")";
  }

  function chart(host, animar){
    var svg = host.querySelector("svg"); if (!svg) return;
    svg.classList.add("fx-svg");
    var defs = document.createElementNS(NS, "defs"); svg.insertBefore(defs, svg.firstChild);
    var cache = {}, iBar = 0;
    // tooltips próprios no lugar do <title> nativo
    svg.querySelectorAll("title").forEach(function(t){
      var p = t.parentNode; if (p && !p.getAttribute("data-tip")) p.setAttribute("data-tip", t.textContent);
      t.remove();
    });
    if (animar && !reduz){
      svg.querySelectorAll(".ct, .cg").forEach(function(el, i){ el.classList.add("fx-fade"); el.style.animationDelay = Math.min(300, i*8)+"ms"; });
      svg.querySelectorAll(".cv").forEach(function(el, i){ el.classList.add("fx-up"); el.style.animationDelay = (380 + Math.min(700, i*30))+"ms"; });
      svg.querySelectorAll(".cdot").forEach(function(el, i){ el.classList.add("fx-pop"); el.style.animationDelay = (650 + Math.min(700, i*25))+"ms"; });
    }
    svg.querySelectorAll("rect, path, circle").forEach(function(el){
      var f = el.getAttribute("fill"), st = el.getAttribute("stroke");
      if (el.closest(".cv") || el.classList.contains("col-hit") || el.classList.contains("cdot")) return;
      if (f && /^#[0-9a-f]{6}$/i.test(f) && el.getAttribute("data-hatch")){
        var hk = "h"+f;
        if (!cache[hk]){
          var pid = "fxh"+(++gid), pt = document.createElementNS(NS, "pattern");
          pt.setAttribute("id", pid); pt.setAttribute("patternUnits", "userSpaceOnUse"); pt.setAttribute("width", "6"); pt.setAttribute("height", "6"); pt.setAttribute("patternTransform", "rotate(45)");
          pt.innerHTML = '<rect width="6" height="6" fill="'+f+'" fill-opacity=".22"/><rect width="2.6" height="6" fill="'+f+'"/>';
          defs.appendChild(pt); cache[hk] = "url(#"+pid+")";
        }
        el.setAttribute("fill", cache[hk]); el.classList.add("fx-bar");
        if (animar && !reduz){ el.classList.add("fx-y"); el.style.animationDelay = Math.min(700, iBar++*28)+"ms"; }
        return;
      }
      if (f && (/^#[0-9a-f]{6}$/i.test(f) || f==="var(--np)") && !el.classList.contains("trk")){
        var bb = null; try { bb = el.getBBox(); } catch(e){}
        if (el.tagName==="circle"){
          if (animar && !reduz){ el.classList.add("fx-pop"); el.style.animationDelay = Math.min(900, iBar++*12)+"ms"; }
          return;
        }
        var horiz = !!(bb && bb.width > bb.height*1.8);
        var k = f+(horiz?"h":"v");
        el.setAttribute("fill", cache[k] || (cache[k] = grad(defs, f, horiz)));
        el.classList.add("fx-bar");
        if (animar && !reduz){ el.classList.add(horiz ? "fx-x" : "fx-y"); el.style.animationDelay = Math.min(700, iBar++*28)+"ms"; }
        return;
      }
      if (animar && !reduz && el.tagName==="circle" && el.getAttribute("stroke-dasharray") && st && st!=="none" && !/^rgba/.test(st)){
        var da = el.getAttribute("stroke-dasharray").split(/[\s,]+/).map(Number);
        if (el.animate && da.length===2){
          el.animate([{ strokeDasharray: "0 "+(da[0]+da[1]), opacity: .3 }, { strokeDasharray: da[0]+" "+da[1], opacity: 1 }],
            { duration: 1100, delay: Math.min(600, iBar++*160), easing: "cubic-bezier(.22,1,.36,1)", fill: "backwards" });
        }
        return;
      }
      if (animar && !reduz && el.tagName==="path" && (!f || f==="none") && st && st!=="none" && el.getTotalLength && !el.getAttribute("stroke-dasharray")){
        try {
          var L = el.getTotalLength();
          if (L>20 && el.animate) el.animate([{ strokeDasharray: L+" "+L, strokeDashoffset: L }, { strokeDasharray: L+" "+L, strokeDashoffset: 0 }], { duration: 1100, easing: "cubic-bezier(.3,.7,.2,1)" });
        } catch(e){}

  /* tooltip */
  var tip = null;

  /* contagem dos números dos cards */
  function contar(root){
    if (reduz) return;
    root.querySelectorAll(".kpi .value, .bc-big, .pf-kpi b").forEach(function(el){
      var node = el.firstChild;
      if (!node || node.nodeType!==3) return;
      var s = node.nodeValue.trim();
      if (!/^[\d.]+(,\d+)?%?$/.test(s) || s.indexOf(":")!==-1) return;
      var pct = s.slice(-1)==="%", corpo = pct ? s.slice(0,-1) : s;
      var dec = corpo.indexOf(",")!==-1 ? corpo.split(",")[1].length : 0;
      var alvo = parseFloat(corpo.replace(/\./g,"").replace(",","."));

/* ========================================================================
   VÍNCULO COM O "GESTÃO DE EQUIPE"
   Lê o cadastro embutido no arquivo gestao-equipe.html (e as alterações que
   aquele painel guardou neste navegador) e liga cada pessoa pelo nome.
   ======================================================================== */
var GESTAO = { data:null, info:null, _idx:null };
var GESTAO_MODS = ["colaboradores","veiculos","equipamentos","emails","epi","ferramentas","diario","horas","almoco","escala","acaoNoturna","setores"];
function normNome(s){
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z ]/g," ").replace(/\s+/g," ").trim();
}
function gestaoMerge(seed, ov){
  var out = {};
  GESTAO_MODS.forEach(function(m){
    var o = (ov && ov[m]) || {}, seen = {}, lista = [];
    (seed[m]||[]).forEach(function(r){ var x = o[r.id]; seen[r.id]=1; if (x && x.__del) return; lista.push(x ? Object.assign({}, r, x) : r); });
    Object.keys(o).forEach(function(id){ if (!seen[id] && !o[id].__del) lista.push(o[id]); });
    out[m] = lista;
  });
  return out;
}
function gestaoLerArquivo(file){
  return file.text().then(function(txt){
    var seed = null, origem = "arquivo";
    var i = txt.indexOf("const SEED");
    if (i!==-1){
      var a = txt.indexOf("{", i), fim = txt.indexOf("\n", a);
      var bruto = txt.slice(a, fim).trim().replace(/;$/, "");
      seed = JSON.parse(bruto);
    } else {
      var j = JSON.parse(txt);
      seed = j.SEED || j.dados || j;
      origem = "json";
    }
    if (!seed || !Array.isArray(seed.colaboradores)) throw new Error("Não encontrei o cadastro de colaboradores neste arquivo.");
    var ov = null;
    try { ov = JSON.parse(localStorage.getItem("ge_overlay_v2") || "null"); } catch(e){}
    var dados = gestaoMerge(seed, ov);
    var info = { arquivo:file.name, em:new Date().toISOString(), origem:origem, alteracoes: ov ? Object.keys(ov).reduce(function(n,m){ return n+Object.keys(ov[m]||{}).length; },0) : 0,
                 pessoas: dados.colaboradores.length };
    return A.idbSetMeta("gestao", { info:info, data:dados }).then(function(){
      GESTAO.data = dados; GESTAO.info = info; GESTAO._idx = null;
      return info;
    });
  });
}
function gestaoCarregarAntigo(){
  return A.idbGetMeta("gestao").then(function(g){
    if (g && g.data){ GESTAO.data = g.data; GESTAO.info = g.info; GESTAO._idx = null; }
  }).catch(function(){});
}
function gestaoIndex(){
  if (GESTAO._idx || !GESTAO.data) return GESTAO._idx;
  var porNome = {}, porPrimUlt = {};
  GESTAO.data.colaboradores.forEach(function(c){
    var n = normNome(c.nome); porNome[n] = c;
    var p = n.split(" "); if (p.length>1){ var k = p[0]+" "+p[p.length-1]; (porPrimUlt[k] = porPrimUlt[k]||[]).push(c); }
  });
  GESTAO._idx = { porNome:porNome, porPrimUlt:porPrimUlt };
  return GESTAO._idx;
}
/* cadastro do Gestão para um nome do painel (vínculo manual > nome igual > primeiro+último nome) */
function gestaoDeAntigo(nome){
  var idx = gestaoIndex(); if (!idx) return null;
  var k = up(nome), man = (SETTINGS.gestaoLink||{})[k];
  if (man==="__nenhum__") return null;
  if (man){ var achou = GESTAO.data.colaboradores.filter(function(c){ return c.id===man; })[0]; if (achou) return achou; }
  var n = normNome(nome);
  if (idx.porNome[n]) return idx.porNome[n];
  var p = n.split(" ");
  if (p.length>1){ var c = idx.porPrimUlt[p[0]+" "+p[p.length-1]]; if (c && c.length===1) return c[0]; }
  var cand = GESTAO.data.colaboradores.filter(function(c){
    var t = normNome(c.nome).split(" ");
    return p.every(function(x){ return t.indexOf(x)!==-1; }) || t.every(function(x){ return p.indexOf(x)!==-1; });
  });
  return cand.length===1 ? cand[0] : null;
}
function gestaoDoNome(mod, cad){
  if (!GESTAO.data || !cad) return [];
  var n = normNome(cad.nome);
  return (GESTAO.data[mod]||[]).filter(function(r){ return normNome(r.nome)===n || (cad.matricula && r.matricula && String(r.matricula)===String(cad.matricula)); });
}
function gestaoApelido(cad, lista){
  // escala e ação noturna usam só o primeiro nome (às vezes "Luis Carlos", "Thiago J.")
  var t = normNome(cad.nome).split(" ");
  return lista.filter(function(v){
    var a = normNome(v).split(" ").filter(Boolean); if (!a.length) return false;
    if (a[0]!==t[0] && !(a[0]==="LUIZ" && t[0]==="LUIS") && !(a[0]==="LUIS" && t[0]==="LUIZ")) return false;
    if (a.length===1) return true;
    return a.slice(1).every(function(x){ return t.some(function(y){ return y.indexOf(x)===0; }); });
  }).length>0;
}
function fotoOuIniciais(nome, cad, tam){
  tam = tam || 44;
  if (cad && cad.foto) return '<img class="pf-foto" src="'+esc(cad.foto)+'" alt="" style="width:'+tam+'px;height:'+tam+'px;">';
  return '<div class="avatar" style="width:'+tam+'px;height:'+tam+'px;font-size:'+Math.round(tam*0.34)+'px;">'+esc(initials(nome))+'</div>';
}

function chartEvolucao(w, meses, mp){
  var n = meses.length;

  var iw = Math.max(60, w-padL-padR), ih = h-padT-padB;
  var maxOS = niceMax(Math.max.apply(null, meses.map(function(m){ return m.os; }).concat([1])));
  var step = iw/n, bw = Math.min(34, step*0.46);
  var X = function(i){ return padL + step*i + step/2; };
  var Yp = function(p){ return padT + ih - ih*Math.max(0, Math.min(1, p)); };
  var out = svgOpen(w, h);
  for (var g=0; g<=4; g++){
    var yy = padT + ih - ih*g/4;
    out += '<line x1="'+padL+'" y1="'+yy+'" x2="'+(padL+iw)+'" y2="'+yy+'" stroke="'+PAL.grid+'"/>';
    out += txt(padL-8, yy+4, fmtInt(Math.round(maxOS*g/4)), {anchor:"end", size:10.5});
    out += txt(padL+iw+8, yy+4, (g*25)+"%", {size:10.5});
  }
  meses.forEach(function(m, i){
    var bh = ih*m.os/maxOS;
    out += roundRectTop(X(i)-bw/2, padT+ih-bh, bw, bh, 5) + ' fill="#ffc9ad"><title>'+esc(m.label+": "+fmtInt(m.os)+" OS · "+fmtInt(m.p)+" produtivas")+'</title></path>';
    out += txt(X(i), h-10, m.curto, {anchor:"middle", size:10.5});
  });
  var ty = Yp(mp/100);
  out += '<line x1="'+padL+'" y1="'+ty+'" x2="'+(padL+iw)+'" y2="'+ty+'" stroke="rgba(var(--ink),.5)" stroke-dasharray="6 4"><title>Meta '+mp+'%</title></line>';
  if (n>1){
    var pts = meses.map(function(m,i){ return [X(i), Yp(m.pct)]; });
    var d = pts.map(function(p,i){
      if (!i) return "M"+p[0]+" "+p[1];
      var q = pts[i-1], cx = (q[0]+p[0])/2;
      return "C"+cx+" "+q[1]+" "+cx+" "+p[1]+" "+p[0]+" "+p[1];
    }).join(" ");
    out += '<path d="'+d+" L"+pts[n-1][0]+" "+(padT+ih)+" L"+pts[0][0]+" "+(padT+ih)+' Z" fill="rgba(255,90,31,.10)" class="fx-area"/>';
    out += '<path d="'+d+'" fill="none" stroke="#ff5a1f" stroke-width="2.6" stroke-linecap="round"/>';
  }
  meses.forEach(function(m, i){
    var ok = m.pct >= mp/100;
    out += '<circle cx="'+X(i)+'" cy="'+Yp(m.pct)+'" r="5" fill="'+(ok?"#ff6a1a":"#ff5a1f")+'" stroke="var(--surface-1)" stroke-width="2"><title>'+esc(m.label+": "+fmtPct(m.pct)+" produtiva"+(ok?" · bateu a meta":""))+'</title></circle>';
  });
  return out + '</svg>';
}

function pvDur(m){ if (m==null || !isFinite(m)) return "—"; m = Math.round(m); var h = Math.floor(m/60); return h ? h+"h"+String(m%60).padStart(2,"0") : m+" min"; }
function pvRing(pct, meta, cor){

/* linha do dia típico: trabalho → almoço → trabalho, escala 06h–20h */
function pvDiaTipico(prim, almS, almV, ult){
  var ini = 6*60, fim = 20*60;
  var P = function(m){ return Math.max(0, Math.min(100, (m-ini)/(fim-ini)*100)); };
  if (prim==null || ult==null) return '<div class="muted" style="padding:14px 0;">Sem horários no período.</div>';
  var seg = function(a, b, cls, tip){ return (a==null||b==null||b<=a) ? "" : '<span class="pv-seg '+cls+'" style="left:'+P(a)+'%;width:'+(P(b)-P(a))+'%" title="'+tip+'"></span>'; };
  var temAlm = almS!=null && almV!=null && almS>prim && almV<ult;
  var marcas = [[prim,"1ª baixa"],[ult,"Última baixa"]].concat(temAlm ? [[almS,"Saída almoço"],[almV,"Volta"]] : []);
  return '<div class="pv-day">'
    + '<div class="pv-track">'
      + (temAlm ? seg(prim, almS, "trab", "Manhã: "+pvHHMM(prim)+" → "+pvHHMM(almS)) + seg(almS, almV, "alm", "Almoço: "+pvHHMM(almS)+" → "+pvHHMM(almV)) + seg(almV, ult, "trab", "Tarde: "+pvHHMM(almV)+" → "+pvHHMM(ult))
                : seg(prim, ult, "trab", pvHHMM(prim)+" → "+pvHHMM(ult)))
    + '</div>'
    + '<div class="pv-marks">'+marcas.map(function(m, i){ return '<span class="pv-mark'+(i>1?" alt":"")+'" style="left:'+P(m[0])+'%"><b>'+pvHHMM(m[0])+'</b><i>'+m[1]+'</i></span>'; }).join("")+'</div>'
    + '<div class="pv-scale">'+[6,8,10,12,14,16,18,20].map(function(h){ return '<span style="left:'+P(h*60)+'%">'+h+'h</span>'; }).join("")+'</div>'
  + '</div>';
}

/* cor predominante da foto (ignora tons de pele, cinzas, brancos e pretos quando há
   outra cor forte; ajusta a luminosidade para o texto branco continuar legível) */
var PV_COR_CACHE = {};
function pvCorDaFoto(src){
  if (PV_COR_CACHE[src]) return Promise.resolve(PV_COR_CACHE[src]);
  return new Promise(function(ok){
    var img = new Image();
    img.onload = function(){
      try {
        var N = 56, cv = document.createElement("canvas"); cv.width = cv.height = N;
        var cx = cv.getContext("2d"); cx.drawImage(img, 0, 0, N, N);
        var px = cx.getImageData(0, 0, N, N).data;
        var B = 24, bk = [];
        for (var i=0;i<B;i++) bk.push({ w:0, h:0, s:0, l:0, n:0, pele:0 });
        for (var p=0; p<px.length; p+=4){
          if (px[p+3] < 128) continue;
          var r = px[p]/255, g = px[p+1]/255, b = px[p+2]/255;
          var mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx+mn)/2, d = mx-mn;
          if (d < 0.08 || l < 0.1 || l > 0.93) continue;           // cinza, preto, branco
          var sat = d/(1-Math.abs(2*l-1));
          var h = mx===r ? ((g-b)/d)%6 : mx===g ? (b-r)/d+2 : (r-g)/d+4; h = (h*60+360)%360;
          var pele = (h>=8 && h<=45 && sat<0.75 && l>0.25 && l<0.85);   // tons de pele pesam pouco
          var w = sat*sat*(pele?0.25:1);
          var k = Math.floor(h/360*B)%B, e = bk[k];
          e.w += w; e.h += h*w; e.s += sat*w; e.l += l*w; e.n++; if (pele) e.pele++;
        }
        var ord = bk.map(function(e,k){ return { k:k, w:e.w + (bk[(k+1)%B].w + bk[(k+B-1)%B].w)*0.5, e:e }; }).sort(function(a,b){ return b.w-a.w; });
        if (!ord[0] || ord[0].w < 3) return ok(null);
        var pick = function(o){ var e = o.e; return { h:e.h/e.w, s:e.s/e.w, l:e.l/e.w }; };
        var c1 = pick(ord[0]);
        var c2 = null;
        for (var j=1;j<ord.length;j++){ if (ord[j].e.w < 1) break; var dh = Math.abs(ord[j].k-ord[0].k); dh = Math.min(dh, B-dh); if (dh >= 3){ c2 = pick(ord[j]); break; } }
        var hsl = function(c, lAlvo){ return "hsl("+Math.round(c.h)+" "+Math.round(Math.max(48, Math.min(82, c.s*100)))+"% "+lAlvo+"%)"; };
        var res = { a: hsl(c1, 46), b: c2 ? hsl(c2, 36) : "hsl("+Math.round((c1.h+28)%360)+" 55% 30%)" };
        PV_COR_CACHE[src] = res; ok(res);
      } catch(e){ ok(null); }
    };
    img.onerror = function(){ ok(null); };
    img.src = src;
  });
}

function gestaoBindAntigo(){
  var btn = document.getElementById("gestaoBtn"), inp = document.getElementById("gestaoFile");
  if (!btn || !inp) return;
  btn.addEventListener("click", function(){ inp.value = ""; inp.click(); });
  inp.addEventListener("change", function(){
    var fl = inp.files && inp.files[0]; if (!fl) return;
    gestaoLerArquivo(fl).then(function(info){
      A.toast("Cadastro importado: "+fmtInt(info.pessoas)+" pessoas.", "ok");
      renderCurrentPage();
    }).catch(function(e){ A.toast("Não consegui ler o arquivo: "+(e && e.message ? e.message : e), "err"); });
  });
}

/* ---------- conteúdo do relatório ---------- */
function gerarRelatorioExcel(){
  var f = currentFilter(), g = Object.assign({}, f, { base:"GERAL" });
  var S = XR.S, col = XR.col, ref = XR.ref, aref = XR.aref;
  var mp = metaPct()/100;

  var sub = "Período: "+periodLabel()+"  ·  Base: "+baseTxt+"  ·  Gerado em "+fmtDateTimeBR(new Date());
  var CORES = { P:"12C97B", N:"FF4D6D", X:"A8AAAE" };
  var sheets = [];
  var cabec = function(sh, titulo, largura){
    sh.set(1,1,titulo,S.title); sh.heights[1] = 30; sh.set(2,1,sub,S.sub);
    sh.merges.push("A1:"+col(largura)+"1"); sh.merges.push("A2:"+col(largura)+"2");
  };

  var rows = rankingList(f, "pct");                 // colaboradores do escopo, com total em qualquer região
  var ss = scopeSummary(f);
  var bases = STATE.filters.base==="GERAL" ? basesComDados() : [STATE.filters.base];
  var resultados = resultadoStats(f, "");
  var tipos = tiposStats(f);
  var recs = A.filterRecords(Object.assign({}, f, { incluirIgnorados:true })).slice().sort(function(a,b){ return (a._t||0)-(b._t||0); });

  /* ===== 1. Resumo ===== */
  var R1 = new XR.Sheet("Resumo");
  R1.onePage = true;
  cabec(R1, "Relatório de Produtividade", 8);
  [1,2,3,4,5,6,7,8].forEach(function(c){ R1.widths[c] = c===1 ? 24 : 19; });
  var bateu = rows.filter(function(r){ return pctMeta(r, f).pct >= mp; }).length;
  R1.heights[4] = 20; R1.heights[5] = 34;
  R1.row(4, 1, ["TOTAL DE OS","PRODUTIVAS","NÃO PRODUTIVAS","% PRODUTIVA","META","COLABORADORES","BATERAM A META","% QUE BATEU"], S.kLab);
  R1.set(5,1, ss.totalOS, S.kInt).set(5,2, ss.totalProdutivo, S.kInt)
    .set(5,3, ss.totalOS-ss.totalProdutivo, S.kInt, "A5-B5")
    .set(5,4, ss.totalOS? ss.totalProdutivo/ss.totalOS : 0, S.kPct, "IFERROR(B5/A5,0)")
    .set(5,5, mp, S.kPct).set(5,6, rows.length, S.kInt)
    .set(5,7, bateu, S.kInt, "COUNTIF('Colaboradores'!I5:I"+(4+Math.max(1,rows.length))+",\"Bateu\")")
    .set(5,8, rows.length? bateu/rows.length : 0, S.kPct, "IFERROR(G5/F5,0)");
  R1.set(6,1, "A meta (célula E5) alimenta o status de cada colaborador na aba Colaboradores — altere para simular.", S.note);

  R1.set(8,1,"Por base do colaborador", S.sec);
  R1.row(9, 1, ["Base","Colaboradores","OS","Produtivas","Não produtivas","% Produtiva","Diferença p/ meta","Bateram a meta"], [S.headL,S.head,S.head,S.head,S.head,S.head,S.head,S.head]);
  var rb = 10, baseVals = [];
  bases.forEach(function(b, i){
    var s = scopeSummary(Object.assign({}, f, { base:b }));
    var rk = rankingList(Object.assign({}, f, { base:b }), "pct");
    var bt = rk.filter(function(r){ return pctMeta(r, f).pct >= mp; }).length;
    var r = rb+i, p = s.totalOS ? s.totalProdutivo/s.totalOS : 0;
    baseVals.push({ b:b, p:p, os:s.totalOS });
    R1.set(r,1,b,S.bold).set(r,2,rk.length,S.int).set(r,3,s.totalOS,S.int).set(r,4,s.totalProdutivo,S.int)
      .set(r,5,s.totalOS-s.totalProdutivo,S.int,"C"+r+"-D"+r)
      .set(r,6,p,S.pct,"IFERROR(D"+r+"/C"+r+",0)")
      .set(r,7,p-mp,S.pct,"F"+r+"-$E$5")
      .set(r,8,bt,S.int,"COUNTIFS('Colaboradores'!C5:C"+(4+Math.max(1,rows.length))+",A"+r+",'Colaboradores'!I5:I"+(4+Math.max(1,rows.length))+",\"Bateu\")");
  });
  // colaboradores sem base definida entram numa linha própria, para o total bater
  var somaOS = baseVals.reduce(function(a,v){ return a+v.os; },0);
  if (STATE.filters.base==="GERAL" && ss.totalOS > somaOS){
    var semB = rows.filter(function(r){ return !r.area || r.area==="Sem base" || bases.indexOf(r.area)===-1; });
    var sOS = semB.reduce(function(a,r){ return a+r.totalOS; },0), sP = semB.reduce(function(a,r){ return a+r.totalProdutivo; },0);
    var r0 = rb+bases.length, p0 = sOS? sP/sOS : 0;
    R1.set(r0,1,"Sem base definida",S.bold).set(r0,2,semB.length,S.int).set(r0,3,sOS,S.int).set(r0,4,sP,S.int)
      .set(r0,5,sOS-sP,S.int,"C"+r0+"-D"+r0).set(r0,6,p0,S.pct,"IFERROR(D"+r0+"/C"+r0+",0)").set(r0,7,p0-mp,S.pct,"F"+r0+"-$E$5")
      .set(r0,8,semB.filter(function(r){ return pctMeta(r, f).pct>=mp; }).length,S.int);
    baseVals.push({ b:"Sem base definida", p:p0, os:sOS, extra:true });
  }
  var rTot = rb + baseVals.length, rbEnd = rTot-1;
  var sumC = function(c){ return baseVals.length ? "SUM("+col(c)+rb+":"+col(c)+rbEnd+")" : "0"; };
  var tOS = baseVals.reduce(function(a,v){ return a+v.os; },0);
  tOS = ss.totalOS;
  R1.set(rTot,1,"Total",S.tTxt).set(rTot,2,rows.length,S.tInt,sumC(2)).set(rTot,3,tOS,S.tInt,sumC(3))
    .set(rTot,4,ss.totalProdutivo,S.tInt,sumC(4)).set(rTot,5,ss.totalOS-ss.totalProdutivo,S.tInt,sumC(5))
    .set(rTot,6,ss.pct,S.tPct,"IFERROR(D"+rTot+"/C"+rTot+",0)").set(rTot,7,ss.pct-mp,S.tPct,"F"+rTot+"-$E$5").set(rTot,8,bateu,S.tInt,sumC(8));
  if (baseVals.length){
    R1.cf.push({ sqref:"F"+rb+":F"+rbEnd, rule: XR.CF.bar() });
    R1.cf.push({ sqref:"G"+rb+":G"+rbEnd, rule: XR.CF.expr("G"+rb+">=0", 0) });
    R1.cf.push({ sqref:"G"+rb+":G"+rbEnd, rule: XR.CF.expr("G"+rb+"<0", 1) });

  var rc = rTot + 3;
  R1.set(rc-1,1,"Composição das OS", S.sec);

  var ign = recs.filter(function(r){ return r._cls==="X"; }).length;
  R1.set(rc+1,1,"Produtivas",S.bold).set(rc+1,2,ss.totalProdutivo,S.int,"B5").set(rc+1,3,ss.totalOS?ss.totalProdutivo/ss.totalOS:0,S.pct,"IFERROR(B"+(rc+1)+"/SUM(B"+(rc+1)+":B"+(rc+2)+"),0)");
  R1.set(rc+2,1,"Não produtivas",S.bold).set(rc+2,2,ss.totalOS-ss.totalProdutivo,S.int,"C5").set(rc+2,3,ss.totalOS?1-ss.totalProdutivo/ss.totalOS:0,S.pct,"IFERROR(B"+(rc+2)+"/SUM(B"+(rc+1)+":B"+(rc+2)+"),0)");
  if (ign) R1.set(rc+3,1,fmtInt(ign)+" OS com resultado marcado como Ignorar ficaram fora das contas.",S.note);
  var chTop = rc + 5;
  if (baseVals.length) R1.charts.push({ type:"col", title:"% produtiva por base", at:{ c1:0, r1:chTop-1, c2:5, r2:chTop+17 }, fmt:"0.0%", axFmt:"0%", max:1,
    catRef: aref("Resumo", rb,1, rbEnd,1), cats: baseVals.map(function(v){ return v.b; }),
    series:[{ name:"% Produtiva", ref: aref("Resumo", rb,6, rbEnd,6), vals: baseVals.map(function(v){ return v.p; }), colors: baseVals.map(function(v){ return v.extra ? "A8AAAE" : XR.hex(BASE_COLORS_HEX[v.b]); }) }] });
  R1.charts.push({ type:"doughnut", title:"Produtivas × não produtivas", legend:"b", at:{ c1:5, r1:chTop-1, c2:8, r2:chTop+17 },
    catRef: aref("Resumo", rc+1,1, rc+2,1), cats:["Produtivas","Não produtivas"],
    series:[{ name:"OS", ref: aref("Resumo", rc+1,2, rc+2,2), vals:[ss.totalProdutivo, ss.totalOS-ss.totalProdutivo], colors:[CORES.P, CORES.N] }] });
  sheets.push(R1);

  /* ===== 2. Colaboradores ===== */
  var C = new XR.Sheet("Colaboradores", "12C97B");
  cabec(C, "Resultado por colaborador", 13);
  var wC = [6,34,16,11,12,14,13,14,13,12,11,13,34]; wC.forEach(function(w,i){ C.widths[i+1] = w; });
  C.heights[4] = 32;
  C.row(4, 1, ["#","Colaborador","Base","OS","Produtivas","Não produtivas","% Produtiva","% usado na meta","Status","Dias trabalhados","OS por dia","Produtivas por dia","Observação"], [S.head,S.headL,S.headL,S.head,S.head,S.head,S.head,S.head,S.head,S.head,S.head,S.head,S.headL]);
  rows.forEach(function(r, i){
    var n = 5+i, pm = pctMeta(r, f);
    C.set(n,1,i+1,S.int).set(n,2,titleCase(r.equipe),S.bold).set(n,3,r.area||"—",S.txt)

      .set(nTot,4,ss.totalOS,S.tInt,"SUM(D5:D"+nEnd+")").set(nTot,5,ss.totalProdutivo,S.tInt,"SUM(E5:E"+nEnd+")")

function itinRuas(s){

  if (pts.length < 2) return Promise.reject(new Error("pontos insuficientes"));

    var q = l.map(function(it){ return it.r.lng.toFixed(6)+","+it.r.lat.toFixed(6); }).join(";");
    return fetch("https://router.project-osrm.org/route/v1/driving/"+q+"?overview=full&geometries=geojson")
      .then(function(r){ if (!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(function(j){ if (!j.routes || !j.routes[0]) throw new Error("sem rota"); return j.routes[0]; });
  })).then(function(rs){

    return km;
  });
}
/* ======================================================================
   ENDEREÇO → COORDENADA
   Photon (OpenStreetMap) como serviço principal e Nominatim de reserva.
   Endereço é limpo (abreviações, complementos) e completado com a cidade
   da região da OS. Resultado fica guardado no banco interno (não repete).
   ====================================================================== */
var GEOCACHE = null;
var GSP = { la0:-24.25, la1:-23.05, lo0:-47.35, lo1:-45.85 };   // Grande São Paulo
function geoCache(){ return GEOCACHE ? Promise.resolve(GEOCACHE) : A.idbGetMeta("geocache").then(function(c){ GEOCACHE = c || {}; return GEOCACHE; }).catch(function(){ GEOCACHE = {}; return GEOCACHE; }); }
function ajustaGeoUI(lat, lng){ return (isFinite(lat) && isFinite(lng) && lat>GSP.la0 && lat<GSP.la1 && lng>GSP.lo0 && lng<GSP.lo1) ? [Math.round(lat*1e6)/1e6, Math.round(lng*1e6)/1e6] : 0; }
function geoChave(r){ return up(r.endereco).replace(/\s+/g," ").trim() + "|" + up(r._areaExec||""); }
function cidadeDaOS(r){ var a = up(r._areaExec||r.unidade||""); return /SANTO ANDR|TAMANDUAT/.test(a.normalize("NFD").replace(/[\u0300-\u036f]/g,"")) ? "Santo André" : "São Paulo"; }
function limpaEndereco(e){
  var t = " " + String(e||"").replace(/\s+/g," ").trim() + " ";
  var ab = [[/\sR\.?\s/i," Rua "],[/\sAV\.?\s/i," Avenida "],[/\sAL\.?\s/i," Alameda "],[/\sTV\.?\s/i," Travessa "],[/\sTR\.?\s/i," Travessa "],[/\sEST\.?\s/i," Estrada "],
            [/\sPC\.?\s|\sPCA\.?\s|\sPÇA\.?\s/i," Praça "],[/\sVL\.?\s/i," Vila "],[/\sJD\.?\s/i," Jardim "],[/\sPQ\.?\s|\sPQE\.?\s/i," Parque "],[/\sDR\.?\s/i," Doutor "],[/\sPROF\.?\s/i," Professor "],
            [/\sCEL\.?\s/i," Coronel "],[/\sGAL\.?\s|\sGEN\.?\s/i," General "],[/\sSTA\.?\s/i," Santa "],[/\sSTO\.?\s/i," Santo "],[/\sCONJ\.?\s/i," Conjunto "]];
  ab.forEach(function(x){ t = t.replace(x[0], x[1]); });
  t = t.replace(/\b(APTO?|APARTAMENTO|AP|BL(OCO)?|CS|CASA|FDS|FUNDOS|FRENTE|LJ|LOJA|SL|SALA|CJ|CONJUNTO|ANDAR|TORRE|LT|LOTE|QD|QUADRA|BOX)\b\.?\s*[\w\-\/]*/gi, " ");
  t = t.replace(/\bS\/?N\b/gi, " ").replace(/\bCEP\b\s*[\d\-\.]+/gi, " ").replace(/\s*[,;]\s*/g, ", ").replace(/\s*-\s*-\s*/g, " - ").replace(/\s+/g," ").replace(/^[\s,\-]+|[\s,\-]+$/g,"");
  return t;
}
function variantesEndereco(r){
  var base = limpaEndereco(r.endereco), cid = cidadeDaOS(r);
  var temCid = /S[AÃ]O PAULO|SANTO ANDR|GUARULHOS|OSASCO|DIADEMA|MAU[AÁ]|S[AÃ]O CAETANO|S[AÃ]O BERNARDO|TABO[AÃ]O|COTIA|BARUERI/i.test(base);
  var comCid = function(x){ return temCid ? x : x + ", " + cid + ", SP"; };
  var partes = base.split(" - ");
  var rua = partes[0], resto = partes.slice(1).filter(function(x){ return !/CEP/i.test(x); });
  var num = (rua.match(/,\s*(\d{1,5})\b/) || rua.match(/\s(\d{1,5})$/) || [])[1];
  var soRua = rua.replace(/,?\s*\d{1,5}\b.*$/, "").trim();
  var out = [comCid(base)];
  if (num) out.push(comCid(soRua + ", " + num));
  if (resto.length) out.push(comCid(soRua + ", " + resto[0]));
  out.push(comCid(soRua));
  var cep = (String(r.endereco).match(/\b(\d{5})-?(\d{3})\b/) || []);
  if (cep[1]) out.push(cep[1] + "-" + cep[2] + ", Brasil");
  return out.map(function(v){ return v.replace(/\s+-\s+/g, ", ").replace(/,\s*,/g, ","); })
    .filter(function(v, i, a){ return v && a.indexOf(v)===i; });
}
var GEO_SERV = {
  photon: function(q){
    return fetch("https://photon.komoot.io/api/?limit=1&lat=-23.6&lon=-46.6&q="+encodeURIComponent(q))
      .then(function(r){ if (!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(function(j){ var f = j && j.features && j.features[0]; return f ? ajustaGeoUI(+f.geometry.coordinates[1], +f.geometry.coordinates[0]) : 0; });
  },
  nominatim: function(q){
    return fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=br&viewbox=-47.35,-23.05,-45.85,-24.25&bounded=1&q="+encodeURIComponent(q), { headers:{ "Accept-Language":"pt-BR" } })
      .then(function(r){ if (!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(function(j){ return (j && j[0]) ? ajustaGeoUI(+j[0].lat, +j[0].lon) : 0; });
  }
};
var GEOJOB = { rodando:false, feitos:0, total:0, achados:0, cancel:false, servico:"photon", falhas:0, erro:"" };
function aplicaCacheGeo(recs){
  if (!GEOCACHE) return 0;
  var n = 0;
  recs.forEach(function(r){ if (r.lat==null && r.endereco){ var v = GEOCACHE[geoChave(r)]; if (v && v.length===2){ r.lat = v[0]; r.lng = v[1]; r.geoAprox = 1; n++; } } });
  return n;
}
function pendentesGeo(recs){
  var k = {};
  recs.forEach(function(r){ if (r.lat==null && r.endereco){ var c = geoChave(r); if (!GEOCACHE || !(c in GEOCACHE)) k[c] = 1; } });
  return Object.keys(k).length;
}
function itinGeocodifica(recs, onProg){
  if (GEOJOB.rodando) return Promise.reject(new Error("ocupado"));
  return geoCache().then(function(cache){
    var pend = {};
    recs.forEach(function(r){ if (r.lat==null && r.endereco){ var k = geoChave(r); (pend[k] = pend[k] || []).push(r); } });
    var lista = Object.keys(pend);
    Object.assign(GEOJOB, { rodando:true, feitos:0, total:lista.length, achados:0, cancel:false, falhas:0, erro:"" });
    var aplica = function(k, v){ if (v && v.length===2){ pend[k].forEach(function(r){ r.lat = v[0]; r.lng = v[1]; r.geoAprox = 1; }); GEOJOB.achados += pend[k].length; } };
    var espera = function(){ var d = window.__GEO_DELAY!=null ? window.__GEO_DELAY : (GEOJOB.servico==="photon" ? 350 : 1100); return new Promise(function(ok){ setTimeout(ok, d); }); };
    var tenta = function(vars, i){
      if (i >= vars.length) return Promise.resolve(0);
      return GEO_SERV[GEOJOB.servico](vars[i]).then(function(v){ GEOJOB.falhas = 0; return v ? v : espera().then(function(){ return tenta(vars, i+1); }); })
        .catch(function(){
          GEOJOB.falhas++;
          if (GEOJOB.servico==="photon"){ GEOJOB.servico = "nominatim"; GEOJOB.falhas = 0; return espera().then(function(){ return tenta(vars, i); }); }
          if (GEOJOB.falhas >= 3) throw new Error("sem acesso");
          return espera().then(function(){ return tenta(vars, i); });
        });
    };
    var passo = function(){
      if (GEOJOB.cancel || GEOJOB.feitos >= lista.length) return Promise.resolve();
      var k = lista[GEOJOB.feitos];
      if (k in cache){ aplica(k, cache[k]); GEOJOB.feitos++; onProg && onProg(); return passo(); }
      return tenta(variantesEndereco(pend[k][0]), 0).then(function(v){
        cache[k] = v; aplica(k, v); GEOJOB.feitos++;
        if (GEOJOB.feitos % 25 === 0) A.idbSetMeta("geocache", cache).catch(function(){});   // guarda o progresso
        onProg && onProg(); return espera();
      }).then(passo);
    };
    var fim = function(){ GEOJOB.rodando = false; return A.idbSetMeta("geocache", cache).then(function(){ return A.compactDB(); }).then(function(){ A.bumpData(); return GEOJOB; }); };
    return passo().then(fim, function(e){ GEOJOB.erro = e.message || "erro"; return fim(); });
  });
}
function itinGeoProgHtml(){
  var p = GEOJOB.total ? GEOJOB.feitos/GEOJOB.total*100 : 0;
  return '<div class="iv-gp"><div class="iv-gp-t"><b>Localizando endereços no mapa…</b><span>'+fmtInt(GEOJOB.feitos)+' de '+fmtInt(GEOJOB.total)+' · '+fmtInt(GEOJOB.achados)+' OS no mapa</span></div>'

function itinIniciaGeo(recs, escopo){
  if (GEOJOB.rodando) return;
  ITIN.geoTentou = ITIN.geoTentou || {}; ITIN.geoTentou[escopo] = 1;

  setTimeout(atualizaProg, 0);

/* ---------------- modo DIA ---------------- */
function itinRenderDia(f, seqsPer){
  var diasDisp = {}; seqsPer.forEach(function(s){ diasDisp[s.iso] = (diasDisp[s.iso]||0) + s.os; });
  var diasK = Object.keys(diasDisp).sort();
  if (diasK.indexOf(UI.itin.dia)===-1) UI.itin.dia = diasK[diasK.length-1];
  var dia = UI.itin.dia, di = diasK.indexOf(dia);
  var seqs = seqsPer.filter(function(s){ return s.iso===dia; }).sort(function(a,b){ return (a.ini||0)-(b.ini||0) || a.nome.localeCompare(b.nome); });
  seqs.forEach(function(s, i){ s.cor = ITIN_CORES[i % ITIN_CORES.length]; });
  /* seleção: o mapa mostra só quem foi clicado; "foco" é o último clicado (abre a sequência) */
  var nomesDia = seqs.map(function(s){ return s.nome; });
  if (UI.itin.pessoa && nomesDia.indexOf(UI.itin.pessoa)===-1) UI.itin.pessoa = "";
  UI.itin.sel = (UI.itin.sel||[]).filter(function(n){ return nomesDia.indexOf(n)!==-1; });
  if (UI.itin.pessoa && UI.itin.sel.indexOf(UI.itin.pessoa)===-1) UI.itin.sel.push(UI.itin.pessoa);
  var sel = UI.itin.sel;
  var foco = UI.itin.pessoa, sF = seqs.filter(function(s){ return s.nome===foco; })[0];
  var naSel = function(n){ return sel.indexOf(n)!==-1; };
  var comGeo = seqs.filter(function(s){ return s.temGeo>0; }).length;
  var recsDia = []; seqs.forEach(function(s){ s.itens.forEach(function(it){ recsDia.push(it.r); }); });
  var semGeoComEnd = recsDia.filter(function(r){ return r.lat==null && r.endereco; }).length;
  var pendDia = GEOCACHE ? pendentesGeo(recsDia) : 0;
  var localizando = GEOJOB.rodando || (pendDia > 0 && !(ITIN.geoTentou||{})[dia]);
  var mostraMapa = comGeo || localizando;
  var parT = seqs.reduce(function(a,s){ return a+s.parado; },0);
  var pior = seqs.slice().sort(function(a,b){ return (b.maior?b.maior.parado:0)-(a.maior?a.maior.parado:0); })[0];
  var kmT = seqs.reduce(function(a,s){ return a+(s.km||0); },0);
  var emT = seqs.reduce(function(a,s){ return a+s.emOS; },0), jT = seqs.reduce(function(a,s){ return a+s.jornada; },0);

  document.getElementById("itHeroMid").innerHTML =
    '<div class="iv-dia"><button type="button" class="iv-seta" id="itPrev" '+(di>0?"":"disabled")+' title="Dia anterior">‹</button>'
    + '<label class="iv-dia-t" title="Escolher outro dia"><b>'+diaLongo(dia)+'</b><span>'+fmtInt(seqs.length)+' em campo · '+fmtInt(recsDia.length)+' OS · dia '+(di+1)+' de '+diasK.length+'</span>'
      + '<input type="date" id="itData" value="'+dia+'" min="'+diasK[0]+'" max="'+diasK[diasK.length-1]+'"></label>'
    + '<button type="button" class="iv-seta" id="itNext" '+(di<diasK.length-1?"":"disabled")+' title="Próximo dia">›</button></div>';
  document.getElementById("itKpis").innerHTML =
      itinKpi("users","Em campo", fmtInt(seqs.length), fmtInt(recsDia.length)+" OS · "+(seqs.length?(recsDia.length/seqs.length).toFixed(1).replace(".",","):"0")+" por pessoa")
    + itinKpi("checkCircle","Tempo dentro de OS", fmtPct(jT? emT/jT : 0), "da jornada da equipe", "good")
    + itinKpi("clock","Ocioso médio", durM(seqs.length? parT/seqs.length : 0), "por pessoa no dia", "warn")
    + itinKpi("alert","Maior intervalo", pior && pior.maior ? durM(pior.maior.parado) : "—", pior && pior.maior ? esc(titleCase(pior.nome).split(" ")[0])+" · "+hm(pior.maior.ini-pior.maior.gap)+"–"+hm(pior.maior.ini) : "", pior && pior.maior && pior.maior.longo ? "bad" : "")
    + itinKpi("route","Distância", comGeo ? kmTxt(kmT*FATOR_RUA) : "—", comGeo ? "estimada pelas ruas · "+kmTxt(kmT)+" em linha reta" : "sem localização nas OS", "info");

  var esc_ = itinEscala(seqs);
  var corpo = document.getElementById("itCorpo");
  corpo.innerHTML =
    '<div class="iv-mapa-w card">'
      + '<div class="iv-lista">'
        + '<div class="iv-lista-h"><b>Equipe no dia</b><span>'
          + (sel.length ? '<button type="button" class="iv-link" id="itLimpa">limpar ('+sel.length+')</button>' : '')
          + (sel.length < seqs.length ? '<button type="button" class="iv-link" id="itTodos">mostrar todos</button>' : '')+'</span></div>'
        + '<div class="iv-lista-s">' + seqs.map(function(s){
            return '<button type="button" class="iv-p'+(naSel(s.nome)?" on":"")+(foco===s.nome?" foco":"")+'" data-emp="'+esc(s.nome)+'" data-employee="'+esc(s.nome)+'" title="'+(naSel(s.nome)?"Clique para tirar do mapa":"Clique para ver o itinerário no mapa")+'">'
              + '<span class="iv-chk" style="--c:'+s.cor+'"></span>'
              + itinAv(s.nome, s.cor, 34)
              + '<span class="iv-p-t"><b>'+esc(titleCase(s.nome))+'</b><em>'+hm(s.ini)+'–'+hm(s.fim)+' · '+fmtInt(s.os)+' OS'+(s.km!=null?' · '+kmTxt(s.km*FATOR_RUA):'')+'</em>'+itinOcup(s)+'</span>'
              + '<span class="iv-p-v'+(s.longos?" warn":"")+'"><b>'+durM(s.parado)+'</b><em>ocioso</em></span>'
            + '</button>';
          }).join("") + '</div>'
        + '<div class="iv-leg"><span><i class="o"></i>em OS</span><span><i class="d"></i>deslocamento</span><span><i class="a"></i>almoço</span><span><i class="p"></i>ocioso</span></div>'
      + '</div>'
      + '<div class="iv-mapa-c">'
        + (mostraMapa ? '<div id="itinMapa" class="iv-mapa"></div>' + (localizando ? '<div class="iv-gp-slot">'+itinGeoProgHtml()+'</div>' : '')
            + (!sel.length ? '<div class="iv-hint"><div class="iv-hint-c">'+IC('route')+'<b>Escolha quem ver no mapa</b><span>Clique em um ou mais funcionários na lista ao lado para mostrar o itinerário de cada um.</span>'
                + '<button type="button" class="btn btn-sm" id="itTodos2">Mostrar todos</button></div></div>' : '')
            + (sF && sF.temGeo>1 ? '<button type="button" class="iv-ruas" id="itRuas">'+IC('route','i-sm')+' '+(ITIN.ruas[sF.nome+"|"+sF.iso] ? "Rota pelas ruas: "+kmTxt(ITIN.ruas[sF.nome+"|"+sF.iso].km) : "Traçar pelas ruas")+'</button>' : '')
          : '<div class="iv-semgeo" id="itSemGeo"></div>')
      + '</div>'
    + '</div>'

    + (sF ? '<div id="itDetalhe"></div>' : '')

    + '<div class="card iv-tl-card">'
      + '<div class="iv-sec-h"><div><b>Linha do tempo da equipe</b><span>'+diaLongo(dia)+' · clique numa OS para abrir</span></div>'
        + '<div class="iv-sec-a"><span class="iv-leg2"><i class="P"></i>produtiva<i class="N"></i>não produtiva<i class="L"></i>intervalo longo<i class="A"></i>almoço</span>'
        + '<button type="button" class="btn btn-sm" id="itCSVdia">'+IC('download','i-sm')+' CSV do dia</button></div></div>'
      + '<div class="iv-tl"><div class="iv-tl-r h"><div></div>'+itinRegua(esc_)+'</div>'
        + seqs.map(function(s){
            return '<div class="iv-tl-r'+(naSel(s.nome)?" on":"")+(foco===s.nome?" foco":"")+'" data-emp="'+esc(s.nome)+'" data-employee="'+esc(s.nome)+'">'
              + '<button type="button" class="iv-tl-n">'+itinAv(s.nome, s.cor, 26)+'<span>'+esc(titleCase(s.nome))+'</span></button>'
              + '<div class="iv-tr">'+itinTrilho(s, esc_, true)+'</div></div>';
          }).join("") + '</div>'
    + '</div>';

  if (sF) itinDetalhe(sF);

  /* mapa */
  if (mostraMapa){
    ITIN.mapa = new MiniMapa(document.getElementById("itinMapa"), function(){});
    ITIN.mapa.setRotas(seqs.filter(function(s){ return s.temGeo && naSel(s.nome); }).map(function(s){
      var pts = [], n = 0;
      s.itens.forEach(function(it, i){
        n++;
        if (!it.geo) return;
        pts.push({ lat:it.r.lat, lng:it.r.lng, n:n, cls:it.r._cls, longo:it.longo, ini:i===0, fim:i===s.itens.length-1,
          tip: n+". "+hm(it.ini)+" · "+titleCase(s.nome), html: itinPopup(s, it, n) });
      });
      var rua = ITIN.ruas[s.nome+"|"+s.iso];
      return { id:s.nome, cor:s.cor, pts:pts, rua: rua ? rua.coords : null };
    }));
    ITIN.mapa.foco = sel.length > 1 ? foco : "";
    ITIN.mapa.aoMarcador = function(id){ if (UI.itin.pessoa!==id){ UI.itin.pessoa = id; itinAtualizaFoco(seqs); } };
    // enquadra: ao clicar numa pessoa, vai até a rota dela; senão mostra todas as selecionadas
    var alvo = (UI.itin.enquadra && naSel(UI.itin.enquadra)) ? UI.itin.enquadra : "";
    UI.itin.enquadra = "";
    requestAnimationFrame(function(){ if (ITIN.mapa) ITIN.mapa.ajustar(alvo); });
  } else itinSemGeo(semGeoComEnd, recsDia);
  if (localizando && !GEOJOB.rodando) itinIniciaGeo(recsDia, dia);
  else if (GEOJOB.rodando) setTimeout(function(){ document.querySelectorAll(".iv-gp-slot").forEach(function(el){ var c = el.querySelector("#itGeoCancel"); if (c) c.onclick = function(){ GEOJOB.cancel = true; }; }); }, 0);

  /* eventos */
  var irDia = function(iso){ UI.itin.dia = iso; renderItinerario(); };
  document.getElementById("itPrev").addEventListener("click", function(){ if (di>0) irDia(diasK[di-1]); });
  document.getElementById("itNext").addEventListener("click", function(){ if (di<diasK.length-1) irDia(diasK[di+1]); });
  document.getElementById("itData").addEventListener("change", function(e){
    var v = e.target.value; if (!v) return;
    if (diasK.indexOf(v)===-1){ var prox = diasK.filter(function(d){ return d>=v; })[0] || diasK[diasK.length-1]; A.toast("Sem OS em "+fmtDateBR(isoToDate(v))+" — mostrando "+fmtDateBR(isoToDate(prox))+".", "ok"); v = prox; }
    irDia(v);
  });
  var redesenha = function(){ var y = window.scrollY; renderItinerario(); window.scrollTo(0, y); };
  var escolhe = function(nome){
    var i = UI.itin.sel.indexOf(nome);
    if (i===-1){ UI.itin.sel.push(nome); UI.itin.pessoa = nome; UI.itin.enquadra = nome; }
    else if (UI.itin.pessoa!==nome && UI.itin.sel.length > 1){ UI.itin.pessoa = nome; UI.itin.enquadra = nome; }   // já no mapa: só passa a ser o destaque
    else { UI.itin.sel.splice(i, 1); if (UI.itin.pessoa===nome) UI.itin.pessoa = UI.itin.sel[UI.itin.sel.length-1] || ""; }
    redesenha();
  };
  var todos = function(){ UI.itin.sel = nomesDia.slice(); UI.itin.pessoa = ""; redesenha(); };
  var limpa = function(){ UI.itin.sel = []; UI.itin.pessoa = ""; redesenha(); };
  corpo.querySelectorAll(".iv-p").forEach(function(b){ b.addEventListener("click", function(){ escolhe(b.dataset.emp); }); });
  corpo.querySelectorAll(".iv-tl-n").forEach(function(b){ b.addEventListener("click", function(){ escolhe(b.parentNode.dataset.emp); }); });
  corpo.querySelectorAll(".iv-tr [data-os]").forEach(function(b){ b.addEventListener("click", function(e){ e.stopPropagation(); openEmployeeOS(b.closest(".iv-tl-r").dataset.emp, { dia: dia }); }); });
  ["itTodos","itTodos2"].forEach(function(id){ var b = document.getElementById(id); if (b) b.addEventListener("click", todos); });
  var lb = document.getElementById("itLimpa"); if (lb) lb.addEventListener("click", limpa);
  var rb = document.getElementById("itRuas");
  if (rb && !ITIN.ruas[sF.nome+"|"+sF.iso]) rb.addEventListener("click", function(){
    rb.disabled = true; rb.innerHTML = IC('route','i-sm')+" Traçando…";
    itinRuas(sF).then(function(km){ A.toast("Rota pelas ruas: "+kmTxt(km)+".", "ok"); renderItinerario(); })
      .catch(function(){ A.toast("Não consegui traçar pelas ruas agora (precisa de internet).", "err"); rb.disabled = false; rb.innerHTML = IC('route','i-sm')+" Traçar pelas ruas"; });
  });
  document.getElementById("itCSVdia").addEventListener("click", function(){ itinCSVDia(seqs); });
}
function itinAtualizaFoco(seqs){
  var foco = UI.itin.pessoa;
  if (ITIN.mapa) ITIN.mapa.setFoco((UI.itin.sel||[]).length > 1 ? foco : "");
  document.querySelectorAll(".iv-p, .iv-tl-r[data-emp]").forEach(function(r){ r.classList.toggle("foco", r.dataset.emp===foco); });
  var s = seqs.filter(function(x){ return x.nome===foco; })[0];
  var host = document.getElementById("itDetalhe");
  if (!host && s){ host = document.createElement("div"); host.id = "itDetalhe"; var m = document.querySelector(".iv-mapa-w"); m.parentNode.insertBefore(host, m.nextSibling); }
  if (s) itinDetalhe(s);
}
function itinPopup(s, it, n){
  var r = it.r, B = { P:"Produtiva", N:"Não produtiva", X:"Ignorada" };
  return '<div class="ip"><div class="ip-h"><span class="ip-n" style="--c:'+s.cor+'">'+n+'</span><div><b>'+esc(titleCase(s.nome))+'</b><em>'+hm(it.ini)+' – '+hm(it.fim)+' · '+durM(it.dur)+'</em></div></div>'
    + '<div class="ip-r"><span>OS</span><b>'+esc(r.numOS||"—")+'</b></div>'
    + (r.tipo ? '<div class="ip-r"><span>Tipo</span><b>'+esc(titleCase(r.tipo))+'</b></div>' : '')
    + '<div class="ip-r"><span>Resultado</span><b>'+esc(titleCase(r.resultado||""))+'</b></div>'
    + '<div class="ip-r"><span></span><b><i class="ip-c '+r._cls+'">'+B[r._cls]+'</i></b></div>'
    + (r.endereco ? '<div class="ip-e">'+esc(r.endereco)+(r.geoAprox?' <span title="Posição aproximada pelo endereço">≈</span>':'')+'</div>' : '')
    + (it.gap!=null ? '<div class="ip-g'+(it.longo?" longo":"")+'">'+(it.dist!=null ? kmTxt(it.dist*FATOR_RUA)+' desde a anterior · ' : '')+durM(it.gap)+' sem OS'
        + (it.almoco ? ' · almoço '+durM(it.almoco) : '') + ' · ocioso ~'+durM(it.parado)+'</div>' : '<div class="ip-g">Primeira OS do dia</div>')
    + '</div>';
}
/* mapa sem coordenadas: diagnóstico com as colunas da última planilha */
function itinSemGeo(semGeoComEnd, recsDia){
  var host = document.getElementById("itSemGeo"); if (!host) return;
  var cab = null;
  var desenha = function(cab){
    var cols = (cab && cab.cols) || [];
    var opt = function(sel){ return '<option value="">— automático —</option>' + cols.map(function(c, i){ var L = XR.col(i+1); return '<option value="'+L+'"'+(sel && up(sel)===L ? " selected" : "")+'>'+L+' · '+esc(c||"(sem título)")+'</option>'; }).join(""); };
    var tentou = semGeoComEnd > 0;
    host.innerHTML = '<div class="iv-sg-i">'+IC('route')+'</div>'
      + '<b class="iv-sg-t">'+(tentou ? 'Não consegui achar estes endereços no mapa' : 'Não encontrei o endereço das OS na planilha')+'</b>'
      + '<p>'+(tentou ? 'Os endereços deste dia ('+fmtInt(semGeoComEnd)+' OS) não foram encontrados. Confira se a coluna de endereço está certa — exemplo: <b>'+esc((recsDia.filter(function(r){ return r.endereco; })[0]||{}).endereco||"")+'</b>. ' : 'O mapa usa o endereço (ou latitude/longitude) de cada OS. ')
        + (cols.length ? 'Estas são as colunas da última planilha de Execução importada'+(cab.arquivo?' (<b>'+esc(cab.arquivo)+'</b>)':'')+'. Se alguma tiver a localização, escolha abaixo e reimporte a planilha — o painel só completa, não duplica.' : 'Reimporte uma planilha de Execução para o painel listar as colunas dela aqui.')+'</p>'
      + (cols.length ? '<div class="iv-sg-cols">'+cols.map(function(c, i){ return '<span><i>'+XR.col(i+1)+'</i>'+esc(c||"—")+'</span>'; }).join("")+'</div>'
        + '<div class="iv-sg-f">'
          + '<label>Latitude<select id="sgLat">'+opt(SETTINGS.colunaLat)+'</select></label>'
          + '<label>Longitude<select id="sgLng">'+opt(SETTINGS.colunaLng)+'</select></label>'
          + '<label>Logradouro<select id="sgEnd">'+opt(SETTINGS.colunaEnd)+'</select></label>'
          + '<label>Número<select id="sgNum">'+opt(SETTINGS.colunaNum)+'</select></label>'
          + '<label>Bairro<select id="sgBairro">'+opt(SETTINGS.colunaBairro)+'</select></label>'
          + '<label>Município<select id="sgCidade">'+opt(SETTINGS.colunaCidade)+'</select></label>'
          + '<button type="button" class="btn btn-sm btn-primary" id="sgSalvar">Salvar e reimportar</button>'
        + '</div>' : '')
      + (semGeoComEnd ? '<div class="iv-sg-geo"><button type="button" class="btn btn-sm" id="itGeo">'+IC('route','i-sm')+' Tentar de novo</button><span>busca no OpenStreetMap · posição aproximada</span></div>' : '');
    var sv = document.getElementById("sgSalvar");
    if (sv) sv.addEventListener("click", function(){
      SETTINGS.colunaLat = document.getElementById("sgLat").value; SETTINGS.colunaLng = document.getElementById("sgLng").value; SETTINGS.colunaEnd = document.getElementById("sgEnd").value;
      SETTINGS.colunaNum = document.getElementById("sgNum").value; SETTINGS.colunaBairro = document.getElementById("sgBairro").value; SETTINGS.colunaCidade = document.getElementById("sgCidade").value;
      saveSettings().then(function(){ A.toast("Colunas salvas. Agora reimporte a planilha de Execução.", "ok"); switchPage("importar"); });
    });
    var gb = document.getElementById("itGeo");
    if (gb) gb.addEventListener("click", function(){
      // esquece as tentativas que falharam e procura de novo
      recsDia.forEach(function(r){ if (r.lat==null && r.endereco && GEOCACHE) delete GEOCACHE[geoChave(r)]; });
      GEOJOB.servico = "photon"; if (ITIN.geoTentou) delete ITIN.geoTentou[UI.itin.dia];
      renderItinerario();
    });
  };
  if (cab) desenha(cab); else A.idbGetMeta("lastHeaders").then(function(c){ ITIN.cab = c || null; desenha(ITIN.cab); }).catch(function(){ desenha(null); });
}

/* sequência da pessoa como linha do tempo vertical */
function itinDetalhe(s){
  var host = document.getElementById("itDetalhe"); if (!host || !s) return;
  var cfg = itinCfg(), rua = ITIN.ruas[s.nome+"|"+s.iso];
  var B = { P:["good","Produtiva"], N:["bad","Não produtiva"], X:["neu","Ignorada"] };
  var passos = '';
  s.itens.forEach(function(it, i){
    if (it.gap!=null && it.gap > 0.5){
      var alm = it.almoco && it.almoco >= it.gap*0.5;
      passos += '<div class="st-gap'+(it.longo?" longo":"")+(alm?" alm":"")+'"><div class="st-gap-l">'+durM(it.gap)+'</div><div class="st-gap-c">'
        + (it.dist!=null ? '<span class="st-ch">'+IC('route','i-sm')+' '+kmTxt(it.dist*FATOR_RUA)+' · ~'+durM(it.desl)+' de deslocamento</span>' : '')
        + (it.almoco ? '<span class="st-ch alm">almoço '+durM(it.almoco)+(s.almocoTipo==="estimado"?" (estimado)":"")+'</span>' : '')
        + (it.parado > 0.5 ? '<span class="st-ch'+(it.longo?" warn":"")+'">'+IC('clock','i-sm')+' ocioso '+durM(it.parado)+(it.longo?" · intervalo longo":"")+'</span>' : '')
        + (it.suspeito ? '<span class="st-ch" title="O endereço desta OS ou da anterior foi localizado longe demais para o tempo entre elas">localização incerta — deslocamento não descontado</span>' : '')
        + (it.dist==null && !it.suspeito && !it.almoco && it.parado<=0.5 ? '<span class="st-ch">sem intervalo</span>' : '')
      + '</div></div>';
    }
    var r = it.r, bd = B[r._cls] || B.N;
    passos += '<div class="st-os"><div class="st-h"><b>'+hm(it.ini)+'</b><span>'+hm(it.fim)+'</span></div>'
      + '<div class="st-dot" style="--c:'+s.cor+'">'+(i+1)+'</div>'
      + '<div class="st-card '+bd[0]+'"><div class="st-c1"><b>OS '+esc(r.numOS||"—")+'</b>'+(r.tipo ? '<span class="st-tipo">'+esc(titleCase(r.tipo))+'</span>' : '')+'<span class="st-b '+bd[0]+'">'+bd[1]+'</span><span class="st-d">'+durM(it.dur)+'</span></div>'
        + '<div class="st-c2">'+esc(titleCase(r.resultado||""))+'</div>'
        + '<div class="st-c3">'+(r.endereco ? esc(r.endereco)+(r.geoAprox?' ≈':'') : esc(r._areaExec||r.unidade||""))+'</div></div>'
    + '</div>';
  });
  var j = s.jornada || 1;
  host.innerHTML = '<div class="card iv-det" style="--c:'+s.cor+';">'
    + '<div class="iv-det-h" data-employee="'+esc(s.nome)+'">'
      + itinAv(s.nome, s.cor, 52)
      + '<div class="iv-det-n"><b>'+esc(titleCase(s.nome))+'</b><span>'+esc(employeeArea(s.nome)||"Sem base")+' · '+diaLongo(s.iso)+(s.almocoTipo==="registrado"?' · almoço do Gestão de Equipe':'')+'</span></div>'
      + '<div class="iv-det-a"><button type="button" class="btn btn-sm btn-primary" id="itdOS">'+IC('clipboard','i-sm')+' OS do dia</button><button type="button" class="btn btn-sm" id="itdPerfil">'+IC('users','i-sm')+' Perfil</button><button type="button" class="btn btn-sm btn-ghost" id="itdFecha" title="Fechar">✕</button></div>'
    + '</div>'
    + '<div class="iv-det-k">'
      + '<div><span>Jornada</span><b>'+hm(s.ini)+' – '+hm(s.fim)+'</b><em>'+durM(s.jornada)+'</em></div>'
      + '<div class="g"><span>Dentro de OS</span><b>'+durM(s.emOS)+'</b><em>'+fmtPct(s.emOS/j)+' da jornada</em></div>'

function lmConfirmar(continuar){
  var nome = String(LM.servico||"").trim();
  if (!LM.sel.length || !nome || !LM.os || LM.prod > LM.os || !LM.date) return;
  var ano = isoToDate(LM.date).getFullYear();
  if (ano < 2000 || ano > 2100){ A.toast("Data inválida.", "err"); return; }
  if (LM.salvar){
    var k = up(nome), ja = lmServicos().filter(function(s){ return up(s.nome)===k; })[0];
    if (ja){ ja.os = LM.os; ja.prod = LM.prod; }
    else { SETTINGS.nextServId = SETTINGS.nextServId || (lmServicos().reduce(function(m,s){ return Math.max(m, s.id+1); }, 1)); lmServicos().push({ id: SETTINGS.nextServId++, nome: nome, os: LM.os, prod: LM.prod }); }
  }
  if (LM.editId){
    var a = SETTINGS.manualAdj.filter(function(x){ return x.id===LM.editId; })[0];
    if (a){ a.date = LM.date; a.servico = nome; a.os = LM.os; a.prod = LM.prod; a.motivo = LM.motivo.trim(); delete a.qtd; delete a.contaOS; a.editado = Date.now(); }
  } else {
    var agora = Date.now();
    LM.sel.forEach(function(n, i){ SETTINGS.manualAdj.push({ id: SETTINGS.nextAdjId++, equipe: up(n), date: LM.date, servico: nome, os: LM.os, prod: LM.prod, motivo: LM.motivo.trim(), criado: agora + i }); });
  }
  var n = LM.sel.length, edit = !!LM.editId;
  saveSettings().then(function(){
    A.toast(edit ? "Lançamento atualizado." : (n > 1 ? "Lançado para "+n+" pessoas: +"+fmtInt(LM.os*n)+" OS." : "Lançado para "+titleCase(LM.sel[0])+": +"+fmtInt(LM.os)+" OS, +"+fmtInt(LM.prod)+" produtiva(s)."), "ok");
    renderCurrentPage();
    if (continuar){
      // mantém data e serviço; limpa quem fez para o próximo
      LM.sel = []; LM.busca = ""; LM.salvar = false; LM.motivo = "";
      lmMontar();
      var b = document.getElementById("lmBusca"); if (b) b.focus();
    } else fecharLancamento();
  });
}
