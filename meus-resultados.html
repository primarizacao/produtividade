<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Primarização · Produtividade</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>try{var t=localStorage.getItem("mr_tema");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>
:root, :root[data-theme="dark"]{
  --ink:255,255,255; --bg:#09090b; --s1:#111113; --s2:#18181b; --tx:#f4f4f5; --tx2:rgba(255,255,255,.68); --tx3:rgba(255,255,255,.44);
  --bd:rgba(255,255,255,.065); --bd2:rgba(255,255,255,.12); --np:#f2f2f3; color-scheme:dark;
}
:root[data-theme="light"]{
  --ink:24,24,27; --bg:#f2f2f0; --s1:#ffffff; --s2:#f7f7f5; --tx:#18181b; --tx2:rgba(24,24,27,.7); --tx3:rgba(24,24,27,.48);
  --bd:rgba(24,24,27,.08); --bd2:rgba(24,24,27,.15); --np:#1c1c1f; color-scheme:light;
}
:root{ --or:#2f6bff; --or2:#5b8cff; --grad:linear-gradient(180deg,#4f7dff,#1f55e6); --good:#22c55e; --bad:#ef4444; --warn:#f59e0b; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--tx2);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;}
body{min-height:100vh;min-height:100dvh;}
button, input{font-family:inherit;}
.wrap{max-width:560px;margin:0 auto;padding:max(16px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(70% 45% at 100% 0%, rgba(47,107,255,.16), transparent 60%);z-index:0;}
.wrap > *{position:relative;z-index:1;}
/* login */
.login{min-height:calc(100dvh - 60px);display:flex;flex-direction:column;justify-content:center;gap:26px;}
.logo{width:56px;height:56px;border-radius:16px;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px -10px rgba(47,107,255,.8);}
.logo svg{width:30px;height:30px;stroke:#fff;stroke-width:2.4;}
.login h1{font-size:34px;font-weight:800;letter-spacing:-.04em;color:var(--tx);line-height:1.05;}
.login p{font-size:15px;line-height:1.5;color:var(--tx3);margin-top:8px;}
.cod{display:flex;flex-direction:column;gap:12px;}
.cod input{width:100%;height:70px;border-radius:18px;border:1.5px solid var(--bd2);background:var(--s1);color:var(--tx);font-size:32px;font-weight:800;letter-spacing:.22em;text-align:center;text-transform:uppercase;font-variant-numeric:tabular-nums;outline:none;transition:border-color .15s, box-shadow .15s;}
.cod input:focus{border-color:var(--or);box-shadow:0 0 0 4px rgba(47,107,255,.18);}
.cod input::placeholder{color:var(--tx3);letter-spacing:.18em;font-weight:600;}
.lembrar{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--tx3);}
.lembrar input{width:18px;height:18px;accent-color:#2f6bff;}
.btn{height:56px;border:0;border-radius:16px;background:var(--grad);color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 12px 26px -10px rgba(47,107,255,.8);cursor:pointer;}
.btn:active{transform:scale(.98);} .btn[disabled]{opacity:.6;}
.erro{min-height:20px;font-size:14px;color:var(--bad);text-align:center;font-weight:600;}
.priv{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--tx3);line-height:1.5;padding:14px;border-radius:14px;border:1px solid var(--bd);background:var(--s1);}
.priv svg{stroke:var(--or);width:18px;height:18px;margin-top:1px;}
/* app */
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.av{width:46px;height:46px;border-radius:14px;background:rgba(47,107,255,.15);color:var(--or);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;flex:none;}
.top h2{font-size:20px;font-weight:700;color:var(--tx);letter-spacing:-.02em;line-height:1.2;}
.top span{font-size:12.5px;color:var(--tx3);}
.top .sp{flex:1;min-width:0;}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd2);background:var(--s1);color:var(--tx2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
.meses{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 16px;padding-left:16px;padding-right:16px;scrollbar-width:none;}
.meses::-webkit-scrollbar{display:none;}
.meses button{flex:none;height:38px;padding:0 16px;border-radius:12px;border:1px solid var(--bd2);background:var(--s1);color:var(--tx2);font-size:14px;font-weight:600;cursor:pointer;}
.meses button.on{background:var(--tx);color:var(--bg);border-color:var(--tx);}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:22px;padding:18px;margin-bottom:14px;animation:up .5s cubic-bezier(.2,.8,.2,1) both;}
.card h3{font-size:15px;font-weight:700;color:var(--tx);margin-bottom:3px;}
.card .sub{font-size:12.5px;color:var(--tx3);margin-bottom:14px;}
@keyframes up{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.hero{display:flex;align-items:center;gap:18px;padding:20px;background:radial-gradient(80% 120% at 100% 0%, rgba(47,107,255,.18), transparent 60%), var(--s1);border-color:rgba(47,107,255,.25);}
.ring{position:relative;width:132px;height:132px;flex:none;}
.ring svg{width:132px;height:132px;transform:rotate(-90deg);}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring b{font-size:30px;font-weight:800;letter-spacing:-.04em;color:var(--tx);}
.ring em{font-style:normal;font-size:11px;color:var(--tx3);font-weight:600;letter-spacing:.06em;}
.hero .tx{flex:1;min-width:0;}
.hero .st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:9px;margin-bottom:8px;}
.st.ok{background:rgba(34,197,94,.14);color:var(--good);} .st.no{background:rgba(245,158,11,.14);color:var(--warn);}
.hero h4{font-size:19px;font-weight:700;color:var(--tx);letter-spacing:-.02em;line-height:1.25;}
.hero p{font-size:13px;color:var(--tx3);margin-top:6px;line-height:1.45;}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.k{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:14px 16px;animation:up .5s cubic-bezier(.2,.8,.2,1) both;}
.k span{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--tx3);font-weight:500;}
.k span::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--or);}
.k.np span::before{background:var(--np);}
.k b{display:block;font-size:30px;font-weight:700;letter-spacing:-.04em;color:var(--tx);margin:6px 0 2px;font-variant-numeric:tabular-nums;}
.k b small{font-size:15px;color:var(--tx3);font-weight:600;letter-spacing:0;}
.k em{font-style:normal;font-size:11.5px;color:var(--tx3);}
.cmp{display:flex;flex-direction:column;gap:12px;}
.cmp .row{display:grid;grid-template-columns:96px 1fr 52px;gap:10px;align-items:center;font-size:13px;}
.cmp .row span{color:var(--tx2);} .cmp .row b{text-align:right;color:var(--tx);font-variant-numeric:tabular-nums;}
.bar{position:relative;height:10px;border-radius:99px;background:rgba(var(--ink),.08);}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transform-origin:left;animation:grow 1s .1s cubic-bezier(.2,.8,.2,1) both;}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--warn);border-radius:2px;}
@keyframes grow{from{transform:scaleX(0);}to{transform:scaleX(1);}}
.chart svg{width:100%;height:auto;display:block;overflow:visible;}
.chart text{font-size:10px;fill:var(--tx3);font-family:inherit;}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--tx2);}
.leg span{display:inline-flex;align-items:center;gap:6px;} .leg i{width:10px;height:10px;border-radius:3px;}
.hr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.hr div{padding:12px;border-radius:14px;background:rgba(var(--ink),.045);}
.hr span{display:block;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);}
.hr b{font-size:20px;color:var(--tx);font-variant-numeric:tabular-nums;}
.hr b.bad{color:var(--or);}
.al{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
.al span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:9px;background:rgba(var(--ink),.06);color:var(--tx2);}
.al .t{background:rgba(47,107,255,.14);color:var(--or);} .al .c{background:rgba(245,158,11,.15);color:var(--warn);} .al .a{background:rgba(239,68,68,.14);color:var(--bad);} .al .o{background:rgba(34,197,94,.13);color:var(--good);}
.lst{display:flex;flex-direction:column;gap:10px;}
.lst .it{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:13.5px;}
.lst .it span{color:var(--tx2);} .lst .it b{color:var(--tx);font-variant-numeric:tabular-nums;}
.lst .it .bar{grid-column:1/-1;height:7px;}
.osd{border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:8px;}
.osd summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;cursor:pointer;background:rgba(var(--ink),.035);}
.osd summary::-webkit-details-marker{display:none;}
.osd summary b{font-size:14px;color:var(--tx);} .osd summary span{font-size:12.5px;color:var(--tx3);}
.osd summary em{font-style:normal;font-size:12px;font-weight:700;color:var(--or);}
.osr{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--bd);font-size:13px;}
.osr .h{font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums;}
.osr .d b{display:block;color:var(--tx);font-weight:600;font-size:13px;} .osr .d span{font-size:11.5px;color:var(--tx3);}
.osr .r{font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:8px;text-align:right;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.osr .r.p{background:rgba(47,107,255,.14);color:var(--or);} .osr .r.n{background:rgba(var(--ink),.07);color:var(--tx2);}
.busca{width:100%;height:44px;border-radius:12px;border:1px solid var(--bd2);background:var(--s2);color:var(--tx);padding:0 14px;font-size:14px;margin-bottom:12px;outline:none;}
.foot{text-align:center;font-size:12px;color:var(--tx3);margin-top:22px;line-height:1.6;}
.sair{margin:14px auto 0;display:flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--bd2);background:transparent;color:var(--tx2);font-size:14px;font-weight:600;cursor:pointer;}
.load{display:flex;align-items:center;justify-content:center;gap:10px;}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.brand .lg{width:34px;height:34px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px -8px rgba(47,107,255,.8);}
.brand .lg svg{width:19px;height:19px;stroke:#fff;stroke-width:2.4;}
.brand div{flex:1;min-width:0;line-height:1.15;} .brand b{display:block;font-size:14px;color:var(--tx);font-weight:700;} .brand span{font-size:11.5px;color:var(--tx3);}
.perfil{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:radial-gradient(90% 140% at 100% 0%, rgba(47,107,255,.22), transparent 60%), var(--s1);border:1px solid var(--bd);margin-bottom:10px;animation:up .5s both;}
.perfil .ft{width:64px;height:64px;border-radius:50%;flex:none;overflow:hidden;background:rgba(47,107,255,.15);color:var(--or);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;box-shadow:0 0 0 3px var(--s1), 0 0 0 5px rgba(47,107,255,.55);}
.perfil .ft img{width:100%;height:100%;object-fit:cover;}
.perfil h2{font-size:21px;font-weight:700;color:var(--tx);letter-spacing:-.02em;line-height:1.2;}
.perfil p{font-size:12.5px;color:var(--tx3);margin-top:3px;}
.ate{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--s1);margin-bottom:14px;font-size:12.5px;color:var(--tx2);}
.ate svg{width:18px;height:18px;stroke:var(--or);}
.ate b{color:var(--tx);} .ate em{margin-left:auto;font-style:normal;font-size:11px;color:var(--tx3);text-align:right;}
.ate .pul{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px rgba(34,197,94,.18);flex:none;}
.gauge{position:relative;width:150px;height:150px;flex:none;}
.gauge svg{width:150px;height:150px;}
.gauge line.tk{animation:tk .5s both;}
@keyframes tk{from{opacity:0;}to{opacity:1;}}
.gauge .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.gauge b{font-size:28px;font-weight:800;letter-spacing:-.04em;color:var(--tx);} .gauge em{font-style:normal;font-size:10px;color:var(--tx3);font-weight:700;letter-spacing:.08em;}
.hero .st.fim{background:rgba(var(--ink),.08);color:var(--tx2);}
.hero.bateu{border-color:rgba(34,197,94,.35);background:radial-gradient(80% 120% at 100% 0%, rgba(34,197,94,.16), transparent 60%), var(--s1);}
.k{position:relative;overflow:hidden;}
.k .mt{display:flex;align-items:flex-end;gap:2px;height:22px;margin-top:10px;}
.k .mt i{flex:1;border-radius:2px;background:var(--or);opacity:.9;min-height:2px;} .k.np .mt i{background:var(--np);opacity:.55;}
.k .ch{display:inline-flex;align-items:center;font-style:normal;font-size:11px;font-weight:700;padding:3px 7px;border-radius:7px;background:rgba(var(--ink),.07);color:var(--tx2);margin-top:2px;}
.lg2{min-height:calc(100dvh - 40px);display:flex;flex-direction:column;justify-content:center;gap:18px;padding:10px 0;}
.lg2-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(60% 40% at 85% 0%, rgba(47,107,255,.28), transparent 70%),
  radial-gradient(50% 35% at 0% 100%, rgba(47,107,255,.12), transparent 70%);}
.lg2-bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(var(--ink),.035) 1px, transparent 1px),linear-gradient(90deg, rgba(var(--ink),.035) 1px, transparent 1px);background-size:28px 28px;-webkit-mask-image:radial-gradient(80% 60% at 50% 30%, #000, transparent);mask-image:radial-gradient(80% 60% at 50% 30%, #000, transparent);}
.lg2-top{display:flex;align-items:center;gap:12px;animation:up .5s both;}
.lg2-top .lg{width:48px;height:48px;border-radius:14px;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -10px rgba(47,107,255,.9), 0 1px 0 rgba(255,255,255,.3) inset;}
.lg2-top .lg svg{width:26px;height:26px;stroke:#fff;stroke-width:2.4;}
.lg2-top b{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--tx);line-height:1.05;}
.lg2-top span{font-size:12.5px;color:var(--tx3);font-weight:500;}
.lg2-top .ib{margin-left:auto;}
.lg2 h1{font-size:32px;font-weight:800;letter-spacing:-.045em;color:var(--tx);line-height:1.05;margin-top:14px;animation:up .5s .05s both;}
.lg2 h1 em{font-style:normal;background:linear-gradient(90deg,#5b8cff,#2f6bff);-webkit-background-clip:text;background-clip:text;color:transparent;}
.lg2 .sub2{font-size:14.5px;line-height:1.5;color:var(--tx3);animation:up .5s .1s both;}
.lg2-card{position:relative;padding:20px;border-radius:24px;background:color-mix(in srgb, var(--s1) 88%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--bd2);box-shadow:0 30px 60px -30px rgba(0,0,0,.6);animation:up .5s .15s both;}
.lg2-card label.t{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);margin-bottom:10px;}
.cx{position:relative;display:flex;align-items:center;gap:7px;justify-content:center;}
.cx i{flex:1;max-width:52px;height:62px;border-radius:14px;border:1.5px solid var(--bd2);background:var(--s2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:27px;font-weight:800;color:var(--tx);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;transition:border-color .15s, box-shadow .15s, transform .15s;}
.cx i.on{border-color:var(--or);box-shadow:0 0 0 4px rgba(47,107,255,.16);}
.cx i.on:empty::after{content:"";width:2px;height:26px;background:var(--or);border-radius:2px;animation:pisca 1s steps(1) infinite;}
.cx i.ch{border-color:rgba(47,107,255,.45);transform:translateY(-1px);}
.cx u{width:12px;height:3px;border-radius:3px;background:var(--tx3);flex:none;}
.cx input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;cursor:text;}
@keyframes pisca{50%{opacity:0;}}
.cx.erro i{border-color:var(--bad);animation:treme .35s;}
@keyframes treme{25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
.lg2-card .lembrar{margin:14px 0 14px;}
.lg2-card .btn{width:100%;}
.lg2-card .erro{margin-top:10px;min-height:0;}
.aviso{display:flex;gap:12px;align-items:flex-start;padding:15px 16px;border-radius:18px;border:1px solid rgba(245,158,11,.3);background:rgba(245,158,11,.07);animation:up .5s .2s both;}
.aviso .ico{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(245,158,11,.16);}
.aviso .ico svg{width:18px;height:18px;stroke:var(--warn);}
.aviso b{display:block;font-size:13.5px;color:var(--tx);margin-bottom:3px;}
.aviso p{font-size:12.5px;line-height:1.5;color:var(--tx2);}
.lg2-ft{text-align:center;font-size:11.5px;color:var(--tx3);animation:up .5s .25s both;}
.nshare{display:flex;align-items:center;justify-content:center;gap:7px;font-size:11.5px;color:var(--tx3);margin-top:16px;}
.nshare svg{width:14px;height:14px;stroke:var(--warn);}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb, var(--s1) 92%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bd2);}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border:0;background:none;color:var(--tx3);font-size:11px;font-weight:600;border-radius:12px;cursor:pointer;}
.tabs button.on{color:var(--or);background:rgba(47,107,255,.12);}
.tabs svg{width:22px;height:22px;}
.wrap.app{padding-bottom:calc(96px + env(safe-area-inset-bottom));}
@media (min-width:700px){ .tabs{position:sticky;top:0;bottom:auto;max-width:560px;margin:0 auto 16px;border:1px solid var(--bd2);border-radius:16px;} .wrap.app{padding-bottom:40px;} }
.dtab{width:100%;border-collapse:collapse;font-size:13px;}
.dtab th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);padding:0 6px 8px;}
.dtab td{padding:9px 6px;border-top:1px solid var(--bd);color:var(--tx2);font-variant-numeric:tabular-nums;}
.dtab td b{color:var(--tx);} .dtab td.bad{color:var(--or);font-weight:700;}
.vz{text-align:center;padding:30px 10px;color:var(--tx3);font-size:14px;}
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap" id="app"></div>
<script>
(function(){
  /* ==== configuração do Supabase (chave pública: pode ficar no código) ==== */
  var SUPA_URL = "https://hdjcuviqlzcpscgehufp.supabase.co";
  var SUPA_KEY = "sb_publishable_aerEOTzn00D38NOA0KtIuA_2YmZ1zOE";

  var app = document.getElementById("app"), D = null, MI = 0, TAB = "resumo";
  var EMP = (function(){ try { var m = location.search.match(/[?&]empresa=([a-z0-9]+)/i); return m ? m[1].toLowerCase() : ""; } catch(e){ return ""; } })();
  var EMPN = function(){ return EMP==="etypa" ? "ETYPA" : (EMP ? EMP.toUpperCase() : "Primarização"); };
  try { document.title = EMPN()+" · Produtividade"; } catch(e){}
  var IC = {
    logo:'<path d="M3.6 12h3.6l2-5.4 3.4 10.8 2.2-5.4h5.6"/>',
    lock:'<rect x="5" y="10.5" width="14" height="10" rx="2.2"/><path d="M8.5 10.5V7.8a3.5 3.5 0 0 1 7 0v2.7"/>',
    sol:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>',
    lua:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/>',
    sair:'<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4M6 12h10"/>',
    cal:'<rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    festa:'<path d="M4 20 9 7l8 8-13 5Z"/><path d="M14 4v2M19 9h2M17.5 5.5 19 4"/>',
    home:'<rect x="3.5" y="3.5" width="7" height="8" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.6"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.6"/><rect x="3.5" y="14.5" width="7" height="6" rx="1.6"/>',
    dia:'<rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    rel:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    lista:'<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
    ok:'<path d="m5 12.5 4.5 4.5L19 7.5"/>', alvo:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/>'
  };
  function ic(n, extra){ return '<svg class="i" viewBox="0 0 24 24" '+(extra||"")+'>'+IC[n]+'</svg>'; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function pct(v){ return v==null ? "—" : (v*100).toFixed(1).replace(".",",")+"%"; }
  function num(v){ return (v||0).toLocaleString("pt-BR"); }
  function dec(v){ return (v||0).toFixed(1).replace(".",","); }
  function hh(f){ if (f==null) return "—"; var m = Math.round(f*1440); return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
  function dBR(iso){ var p = String(iso).split("-"); return p[2]+"/"+p[1]; }
  var DOW = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  function dow(iso){ var p = String(iso).split("-"); return DOW[new Date(+p[0], +p[1]-1, +p[2]).getDay()]; }
  function tema(){ return document.documentElement.getAttribute("data-theme")==="light" ? "light" : "dark"; }
  function trocaTema(){ var t = tema()==="light" ? "dark" : "light"; document.documentElement.setAttribute("data-theme", t); try { localStorage.setItem("mr_tema", t); } catch(e){} render(); }

  function consulta(codigo){
    return fetch(SUPA_URL+"/rest/v1/rpc/colab_ver", { method:"POST", headers:{ "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY, "Content-Type":"application/json" }, body:JSON.stringify({ codigo:codigo }) })
      .then(function(r){ return r.text().then(function(t){ var j = null; try { j = t ? JSON.parse(t) : null; } catch(e){} if (!r.ok) throw new Error((j && j.message) || "Não foi possível consultar agora."); return j; }); });
  }

  /* ---------- tela do código ---------- */
  function telaCodigo(msg){
    app.className = "wrap";
    app.innerHTML = '<div class="lg2-bg"></div><div class="lg2">'
      + '<div class="lg2-top"><span class="lg">'+ic("logo")+'</span><div><b>'+esc(EMPN())+'</b><span>Produtividade</span></div><button class="ib" id="tm" type="button" aria-label="Trocar tema">'+ic(tema()==="light"?"lua":"sol")+'</button></div>'
      + '<form class="lg2-card" id="f" autocomplete="off">'
        + '<label class="t" for="c">Chave de acesso</label>'
        + '<div class="cx" id="cx"><i></i><i></i><i></i><u></u><i></i><i></i><i></i><input id="c" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="7" aria-label="Chave"></div>'
        + '<label class="lembrar"><input type="checkbox" id="lb" checked> Lembrar neste celular</label>'
        + '<button class="btn" id="b" type="submit">Ver meus resultados</button><div class="erro" id="er">'+esc(msg||"")+'</div>'
      + '</form>'
      + '<div class="aviso"><span class="ico">'+ic("lock")+'</span><div><b>Não compartilhe</b><p>A chave e os resultados são pessoais. Não envie a chave nem prints desta página para outras pessoas.</p></div></div>'
      + ''
    + '</div>';
    var c = document.getElementById("c"), cx = document.getElementById("cx"), bx = cx.querySelectorAll("i");
    var pinta = function(){ var v = c.value.replace(/[^A-Z0-9]/g,""); bx.forEach(function(b, k){ b.textContent = v[k] || ""; b.className = (v[k] ? "ch" : "") + (k===Math.min(v.length,5) && document.activeElement===c ? " on" : ""); }); cx.classList.remove("erro"); };
    c.addEventListener("input", function(){ var v = c.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6); c.value = v.length>3 ? v.slice(0,3)+"-"+v.slice(3) : v; pinta(); if (v.length===6) document.getElementById("b").focus(); });
    c.addEventListener("focus", pinta); c.addEventListener("blur", pinta);
    document.getElementById("tm").onclick = function(){ var t = tema()==="light" ? "dark" : "light"; document.documentElement.setAttribute("data-theme", t); try { localStorage.setItem("mr_tema", t); } catch(e){} var v = c.value; telaCodigo(document.getElementById("er").textContent); document.getElementById("c").value = v; };
    document.getElementById("f").onsubmit = function(e){
      e.preventDefault(); var v = c.value.replace(/[^A-Z0-9]/gi,""); if (v.length<6){ document.getElementById("er").textContent = "A chave tem 6 caracteres."; cx.classList.add("erro"); return; }
      entrar(v, document.getElementById("lb").checked);
    };
    if (msg) cx.classList.add("erro");
    setTimeout(function(){ c.focus(); pinta(); }, 200);
  }
  function entrar(cod, lembrar){
    var b = document.getElementById("b"); if (b){ b.disabled = true; b.innerHTML = '<span class="load"><span class="spin"></span>Buscando…</span>'; }
    consulta(cod).then(function(r){
      if (!r){ try { localStorage.removeItem("mr_cod"); } catch(e){} telaCodigo("Chave não encontrada. Confira e tente de novo."); return; }
      try { if (lembrar) localStorage.setItem("mr_cod", cod); } catch(e){}
      D = r; MI = Math.max(0, (D.dados.meses||[]).length-1); render();
    }).catch(function(err){ telaCodigo(err.message); });
  }

  /* ---------- gráficos ---------- */
  function ring(v, meta){
    var N = 60, cx = 75, cy = 75, r1 = 52, r2 = 66, f = Math.max(0, Math.min(1, v||0)), ok = v >= meta, on = Math.round(f*N), mi = Math.round(Math.max(0, Math.min(1, meta))*N);
    var o = '<div class="gauge"><svg viewBox="0 0 150 150">';
    for (var i=0;i<N;i++){
      var a = -Math.PI/2 + i/N*2*Math.PI, ca = Math.cos(a), sa = Math.sin(a), isM = i===mi, ra = isM ? r1-5 : r1, rb = isM ? r2+5 : r2;
      var cor = isM ? "#f59e0b" : (i < on ? (ok ? "#22c55e" : "#2f6bff") : "rgba(var(--ink),.13)");
      o += '<line class="tk" x1="'+(cx+ca*ra).toFixed(1)+'" y1="'+(cy+sa*ra).toFixed(1)+'" x2="'+(cx+ca*rb).toFixed(1)+'" y2="'+(cy+sa*rb).toFixed(1)+'" stroke="'+cor+'" stroke-width="'+(isM?3.2:2.6)+'" stroke-linecap="round" style="animation-delay:'+(i*12)+'ms"/>';
    }
    return o + '</svg><div class="v"><b>'+pct(v)+'</b><em>PRODUTIVA</em></div></div>';
  }
  function barrasDia(serie){
    if (!serie || !serie.length) return '<div class="vz">Sem execuções no mês.</div>';
    var W = 520, H = 190, pl = 26, pb = 22, pt = 10, n = serie.length, iw = W-pl-6, ih = H-pt-pb;
    var mx = Math.max.apply(null, serie.map(function(s){ return s[1]; }).concat([1]));
    var top = Math.ceil(mx/5)*5 || 5, step = iw/n, bw = Math.max(4, Math.min(16, step*0.55));
    var o = '<svg viewBox="0 0 '+W+' '+H+'">';
    for (var g=0; g<=2; g++){ var y = pt+ih-ih*g/2; o += '<line x1="'+pl+'" x2="'+(W-6)+'" y1="'+y+'" y2="'+y+'" stroke="rgba(var(--ink),.12)" stroke-dasharray="1 5" stroke-linecap="round"/><text x="'+(pl-6)+'" y="'+(y+3)+'" text-anchor="end">'+Math.round(top*g/2)+'</text>'; }
    serie.forEach(function(s, i){
      var x = pl + step*i + (step-bw)/2, hT = ih*s[1]/top, hP = ih*s[2]/top, y0 = pt+ih;
      o += '<g style="animation:up .5s '+(i*25)+'ms both"><rect x="'+x.toFixed(1)+'" y="'+pt+'" width="'+bw+'" height="'+ih+'" rx="'+(bw/2)+'" fill="rgba(var(--ink),.035)"/>';
      if (s[1]-s[2] > 0) o += '<rect x="'+x.toFixed(1)+'" y="'+(y0-hT).toFixed(1)+'" width="'+bw+'" height="'+Math.max(bw/2, hT-hP).toFixed(1)+'" rx="'+(bw/2)+'" fill="var(--np)" opacity=".9"/>';
      if (s[2] > 0) o += '<rect x="'+x.toFixed(1)+'" y="'+(y0-hP).toFixed(1)+'" width="'+bw+'" height="'+Math.max(bw/2, hP).toFixed(1)+'" rx="'+(bw/2)+'" fill="#2f6bff"/>';
      o += '<title>'+dBR(s[0])+' · '+s[1]+' OS · '+s[2]+' produtivas</title></g>';
      if (n<=16 || i%Math.ceil(n/12)===0) o += '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+String(s[0]).slice(8)+'</text>';
    });
    return o + '</svg>';
  }
  function evolucao(meses, meta){
    if (meses.length < 2) return '';
    var W = 520, H = 170, pl = 30, pb = 24, pt = 14, n = meses.length, iw = W-pl-10, ih = H-pt-pb, step = iw/n, bw = Math.min(42, step*0.5);
    var o = '<svg viewBox="0 0 '+W+' '+H+'">';
    [0,.5,1].forEach(function(g){ var y = pt+ih-ih*g; o += '<line x1="'+pl+'" x2="'+(W-10)+'" y1="'+y+'" y2="'+y+'" stroke="rgba(var(--ink),.12)" stroke-dasharray="1 5" stroke-linecap="round"/><text x="'+(pl-6)+'" y="'+(y+3)+'" text-anchor="end">'+(g*100)+'%</text>'; });
    var my = pt+ih-ih*meta; o += '<line x1="'+pl+'" x2="'+(W-10)+'" y1="'+my+'" y2="'+my+'" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4"/>';
    meses.forEach(function(m, i){
      var x = pl+step*i+(step-bw)/2, h = Math.max(bw/2, ih*Math.min(1, m.pct)), on = i===MI;
      o += '<rect x="'+x.toFixed(1)+'" y="'+pt+'" width="'+bw+'" height="'+ih+'" rx="'+(bw/2)+'" fill="rgba(var(--ink),.035)"/>'
        + '<rect x="'+x.toFixed(1)+'" y="'+(pt+ih-h).toFixed(1)+'" width="'+bw+'" height="'+h.toFixed(1)+'" rx="'+(bw/2)+'" fill="'+(on?"#2f6bff":"rgba(var(--ink),.3)")+'"/>'
        + '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(pt+ih-h-6).toFixed(1)+'" text-anchor="middle" style="font-weight:700;fill:var(--tx);font-size:10.5px">'+Math.round(m.pct*100)+'%</text>'
        + '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle">'+m.rotulo.slice(0,3).toLowerCase()+'</text>';
    });
    return o + '</svg>';
  }

  /* ---------- tela principal ---------- */
  function render(){
    if (!D) return;
    var dd = D.dados || {}, meses = dd.meses || [], meta = (dd.meta||60)/100;
    var nome = String(D.nome||""), pri = nome.split(" ")[0], ini = nome.split(" ").filter(Boolean).map(function(w){ return w[0]; }).slice(0,2).join("");
    var at = D.atualizado ? new Date(D.atualizado) : null;
    var m = meses[MI];
    var ate = dd.ate || (function(){ var u = meses[meses.length-1]; return u && u.serie && u.serie.length ? u.serie[u.serie.length-1][0] : ""; })();
    var ateP = ate ? ate.split("-").map(Number) : null;
    if (D && D.empresa) EMP = D.empresa;
    var h = '<div class="brand"><span class="lg">'+ic("logo")+'</span><div><b>'+esc(EMPN())+'</b><span>Produtividade</span></div><button class="ib" id="tm" aria-label="Trocar tema">'+ic(tema()==="light"?"lua":"sol")+'</button></div>'
      + '<div class="perfil"><div class="ft">'+(dd.foto ? '<img src="'+esc(dd.foto)+'" alt="">' : esc(ini))+'</div><div><h2>'+esc(nome)+'</h2><p>'+esc([dd.cargo, D.base].filter(Boolean).join(" · ") || nome)+'</p></div></div>'
      + (ate ? '<div class="ate"><span class="pul"></span><span>Dados até <b>'+dBR(ate)+'/'+ateP[0]+'</b> ('+dow(ate).toLowerCase()+')</span>'+(at ? '<em>publicado em<br>'+at.toLocaleDateString("pt-BR")+' '+at.toTimeString().slice(0,5)+'</em>' : '')+'</div>' : '');
    if (!m){ app.innerHTML = h + '<div class="card vz">Ainda não há resultados publicados para você.</div>' + rodape(); liga(); return; }
    var tabs = [["resumo","Resumo","home"],["dias","Dia a dia","dia"],["horarios","Horários","rel"],["os","Minhas OS","lista"]];
    var barra = '<nav class="tabs">'+tabs.map(function(t){ return '<button data-t="'+t[0]+'" class="'+(TAB===t[0]?"on":"")+'">'+ic(t[2])+t[1]+'</button>'; }).join("")+'</nav>';
    h += '<div class="meses">'+meses.map(function(x, i){ return '<button data-m="'+i+'" class="'+(i===MI?"on":"")+'">'+esc(x.rotulo)+'</button>'; }).join("")+'</div>';
    var pre = h; h = "";
    var ok = m.pct >= meta, falta = meta - m.pct, nomeMes = m.rotulo.split("/")[0].toLowerCase();
    var precisa = (!ok && m.os) ? Math.ceil((meta*m.os - m.prod)/(1-meta)) : 0;
    var ultDia = new Date(m.ano, m.mes+1, 0).getDate();
    var fechado = !ateP || (m.ano*12+m.mes) < (ateP[0]*12+ateP[1]-1) || ((m.ano*12+m.mes)===(ateP[0]*12+ateP[1]-1) && ateP[2]>=ultDia);
    var pp = function(x){ return (Math.abs(x)*100).toFixed(1).replace(".",","); };
    var badge, tit, txt;
    if (fechado){
      badge = '<span class="st '+(ok?"ok":"fim")+'">'+ic(ok?"festa":"cal",'style="width:14px;height:14px"')+'Mês encerrado</span>';
      tit = ok ? 'Você bateu a meta em '+esc(nomeMes) : esc(m.rotulo.split("/")[0])+' fechou em '+pct(m.pct);
      txt = ok ? 'Fechou com <b style="color:var(--tx)">'+pct(m.pct)+'</b>'+(m.pct-meta>0.0005 ? ', '+pp(falta)+' p.p. acima' : ', exatamente na meta')+' da meta de '+Math.round(meta*100)+'%.'
               : 'Faltaram '+pp(falta)+' p.p. para a meta de '+Math.round(meta*100)+'%.';
    } else {
      badge = '<span class="st '+(ok?"ok":"no")+'">'+ic(ok?"ok":"alvo",'style="width:14px;height:14px"')+(ok?"Na meta":"Meta: "+Math.round(meta*100)+"%")+' · parcial até '+dBR(ate)+'</span>';
      tit = ok ? 'Você está '+(m.pct-meta>0.0005 ? pp(falta)+' p.p. acima da meta' : 'na meta') : 'Faltam '+pp(falta)+' p.p. para a meta';
      txt = ok ? 'Resultado parcial do mês.' : 'Cerca de <b style="color:var(--tx)">'+num(precisa)+' OS produtivas</b> a mais, no ritmo atual, levariam você à meta.';
    }
    h += '<div class="card hero'+(fechado && ok ? ' bateu' : '')+'">'+ring(m.pct, meta)+'<div class="tx">'+badge+'<h4>'+tit+'</h4><p>'+txt+'</p></div></div>';
    var ult = (m.serie||[]).slice(-14), mxs = Math.max.apply(null, ult.map(function(x){ return x[1]; }).concat([1]));
    var mini = function(ix){ return '<div class="mt">'+ult.map(function(x){ return '<i style="height:'+Math.max(8, x[ix]/mxs*100).toFixed(0)+'%"></i>'; }).join("")+'</div>'; };
    h += '<div class="kg">'
      + '<div class="k"><span>Total de OS</span><b>'+num(m.os)+'</b><em>'+num(m.dias)+' dia(s) trabalhado(s)</em>'+mini(1)+'</div>'
      + '<div class="k"><span>Produtivas</span><b>'+num(m.prod)+'</b><em>'+num(m.os-m.prod)+' não produtivas</em>'+mini(2)+'</div>'
      + '<div class="k"><span>Posição na base</span><b>'+(m.posBase ? m.posBase+'º<small> de '+m.deBase+'</small>' : '—')+'</b><em>'+(m.pos ? m.pos+'º de '+m.de+' no geral' : '')+'</em></div>'
      + '<div class="k np"><span>OS por dia</span><b>'+dec(m.osDia)+'</b><em>'+dec(m.prodDia)+' produtivas por dia</em></div>'
    + '</div>';
    h += '<div class="card"><h3>Você × equipe</h3><div class="sub">% produtiva no mês · linha amarela = meta</div><div class="cmp">'
      + [["Você", m.pct, "#2f6bff"],["Sua base", m.basePct, "var(--np)"],["Todas as bases", m.equipePct, "rgba(var(--ink),.35)"]].map(function(r){
          return '<div class="row"><span>'+r[0]+'</span><div class="bar"><i style="width:'+Math.min(100,(r[1]||0)*100).toFixed(1)+'%;background:'+r[2]+'"></i><u style="left:'+(meta*100)+'%"></u></div><b>'+pct(r[1])+'</b></div>';
        }).join("")+'</div></div>';
    var sResumo = h; h = "";
    h += '<div class="card"><h3>Execuções por dia</h3><div class="sub">'+esc(m.rotulo)+'</div><div class="chart">'+barrasDia(m.serie)+'</div><div class="leg"><span><i style="background:#2f6bff"></i>Produtivas</span><span><i style="background:var(--np)"></i>Não produtivas</span></div></div>';
    var sDias = h; h = "";
    var jan = dd.janela || { ini:"09:00", fim:"15:00" }, iniF = toF(jan.ini), fimF = toF(jan.fim);
    h += '<div class="card"><h3>Meus horários</h3><div class="sub">média do mês · janela esperada '+esc(jan.ini)+' – '+esc(jan.fim)+'</div><div class="hr">'
      + '<div><span>1ª execução</span><b class="'+(m.prim!=null && m.prim>iniF?"bad":"")+'">'+hh(m.prim)+'</b></div>'
      + '<div><span>Última</span><b class="'+(m.ult!=null && m.ult<fimF?"bad":"")+'">'+hh(m.ult)+'</b></div>'
      + '<div><span>Jornada</span><b>'+(m.prim!=null && m.ult!=null ? hh(m.ult-m.prim) : "—")+'</b></div></div>'
      + (m.alertas ? '<div class="al">'+(m.alertas.tarde+m.alertas.cedo+m.alertas.ambos ? (m.alertas.tarde ? '<span class="t">'+m.alertas.tarde+'× começou depois de '+esc(jan.ini)+'</span>' : '')+(m.alertas.cedo ? '<span class="c">'+m.alertas.cedo+'× terminou antes de '+esc(jan.fim)+'</span>' : '')+(m.alertas.ambos ? '<span class="a">'+m.alertas.ambos+'× os dois no mesmo dia</span>' : '') : '<span class="o">Todos os dias dentro da janela</span>')+'</div>' : '')
    + '</div>';
    if (m.os_lista && m.os_lista.length){
      var pd = {}; m.os_lista.forEach(function(o){ var x = pd[o[0]] || (pd[o[0]] = { p:o[1], u:o[1], n:0, pr:0 }); if (o[1] < x.p) x.p = o[1]; if (o[1] > x.u) x.u = o[1]; x.n++; if (o[5]) x.pr++; });
      var dk = Object.keys(pd).sort().reverse();
      h += '<div class="card"><h3>Dia a dia</h3><div class="sub">1ª e última execução de cada dia</div><table class="dtab"><thead><tr><th>Dia</th><th>1ª</th><th>Última</th><th>OS</th></tr></thead><tbody>'
        + dk.map(function(d){ var x = pd[d]; return '<tr><td><b>'+dBR(d)+'</b> '+dow(d)+'</td><td class="'+(toF(x.p)>iniF?"bad":"")+'">'+esc(x.p)+'</td><td class="'+(toF(x.u)<fimF?"bad":"")+'">'+esc(x.u)+'</td><td>'+x.n+' <span style="color:var(--tx3)">('+x.pr+' prod.)</span></td></tr>'; }).join("")
        + '</tbody></table></div>';
    }
    var sHor = h; h = "";
    if (m.resultados && m.resultados.length){
      var mxr = m.resultados[0][1];
      h += '<div class="card"><h3>Resultados das minhas OS</h3><div class="sub">laranja = produtivo</div><div class="lst">'+m.resultados.slice(0,8).map(function(r){
        return '<div class="it"><span>'+esc(r[0])+'</span><b>'+num(r[1])+' <small style="color:var(--tx3);font-weight:500">'+pct(m.os ? r[1]/m.os : 0)+'</small></b><div class="bar"><i style="width:'+(r[1]/mxr*100).toFixed(1)+'%;background:'+(r[2]?"#2f6bff":"var(--np)")+'"></i></div></div>';
      }).join("")+'</div></div>';
    }
    sDias += h; h = "";
    var ev = evolucao(meses, meta);
    if (ev) sResumo += '<div class="card"><h3>Evolução</h3><div class="sub">% produtiva mês a mês</div><div class="chart">'+ev+'</div></div>';
    if (m.os_lista && m.os_lista.length){
      h += '<div class="card"><h3>Minhas OS</h3><div class="sub">'+num(m.os_lista.length)+' OS em '+esc(m.rotulo)+'</div><input class="busca" id="bs" placeholder="Buscar nº da OS, tipo ou resultado"><div id="osl"></div></div>';
    }
    var sOS = h || '<div class="card vz">A lista de OS vem só dos 2 meses mais recentes.</div>';
    var corpo = { resumo:sResumo, dias:sDias, horarios:sHor, os:sOS }[TAB];
    app.className = "wrap app";
    app.innerHTML = pre + corpo + (TAB==="resumo" ? rodape() : '') + barra;
    if (TAB==="os" && m.os_lista && m.os_lista.length) listaOS(m.os_lista, "");
    liga();
  }
  function toF(s){ var p = String(s||"").split(":"); return ((+p[0]||0)*60 + (+p[1]||0))/1440; }
  function listaOS(l, q){
    q = (q||"").toUpperCase();
    var dias = {};
    l.forEach(function(o){ if (q && (o[2]+" "+o[3]+" "+o[4]).toUpperCase().indexOf(q)===-1) return; (dias[o[0]] = dias[o[0]] || []).push(o); });
    var ks = Object.keys(dias).sort().reverse();
    document.getElementById("osl").innerHTML = ks.length ? ks.map(function(d, i){
      var os = dias[d], pr = os.filter(function(o){ return o[5]; }).length;
      return '<details class="osd"'+(i===0 && !q ? ' open' : (q ? ' open' : ''))+'><summary><div><b>'+dBR(d)+' · '+dow(d)+'</b><br><span>'+os.length+' OS · '+os[0][1]+' → '+os[os.length-1][1]+'</span></div><em>'+pr+' produtiva(s)</em></summary>'
        + os.map(function(o){ return '<div class="osr"><span class="h">'+esc(o[1])+'</span><div class="d"><b>OS '+esc(o[2])+'</b><span>'+esc(o[3])+'</span></div><span class="r '+(o[5]?"p":"n")+'">'+esc(o[4])+'</span></div>'; }).join("")+'</details>';
    }).join("") : '<div class="vz">Nenhuma OS encontrada.</div>';
  }
  function rodape(){ return '<div class="nshare">'+ic("lock")+'Resultados pessoais. Não compartilhe a chave nem prints.</div><button class="sair" id="sa">'+ic("sair")+' Sair deste celular</button><div class="foot">'+esc(EMPN())+' · Produtividade</div>'; }
  function liga(){
    var t = document.getElementById("tm"); if (t) t.onclick = trocaTema;
    var s = document.getElementById("sa"); if (s) s.onclick = function(){ try { localStorage.removeItem("mr_cod"); } catch(e){} D = null; telaCodigo(); };
    var on = document.querySelector(".meses .on"); if (on && on.scrollIntoView) on.scrollIntoView({ inline:"center", block:"nearest" });
    document.querySelectorAll(".meses [data-m]").forEach(function(b){ b.onclick = function(){ MI = +b.dataset.m; render(); window.scrollTo({ top:0, behavior:"smooth" }); }; });
    document.querySelectorAll(".tabs [data-t]").forEach(function(b){ b.onclick = function(){ TAB = b.dataset.t; render(); window.scrollTo(0,0); }; });
    var bs = document.getElementById("bs"); if (bs){ var m = D.dados.meses[MI]; bs.oninput = function(){ listaOS(m.os_lista, bs.value.trim()); }; }
  }

  var salvo = null; try { salvo = localStorage.getItem("mr_cod"); } catch(e){}
  var q = (location.hash.match(/c=([A-Za-z0-9-]+)/) || [])[1];
  if (q){ telaCodigo(); var c = document.getElementById("c"); c.value = q.toUpperCase(); c.dispatchEvent(new Event("input")); entrar(q.replace(/-/g,""), true); history.replaceState(null, "", location.pathname); }
  else if (salvo){ telaCodigo(); entrar(salvo, true); }
  else telaCodigo();
})();
</script>
